강의 솔버들을 직접 비교 실험해 근거 있는 선택을 하는 시간입니다.\n\n- 필수 ① 합성 벤치마크로 P3P·EPnP·ITERATIVE의 정확도와 속도를 표로 비교한다.\n- 필수 ② 노이즈·점 개수·배치 조건을 바꿔 가며 정확도가 어떻게 변하는지 관찰한다.\n- 필수 ③ 이상치를 섞은 실험에서 RANSAC의 효과를 수치로 보인다.\n\n여유가 되면(심화): 실물 상자 포즈 추정, 솔버별 실패 모드 분석. 어떤 솔버가 \"최고\"인지가 아니라 어떤 조건에서 무엇을 고를지가 결과물입니다.","headings":["들어가며","1. 합성 벤치마크 러너","2. 실험 1 — 솔버 비교 (정확도·속도)","3. 실험 2 — 노이즈 민감도와 기하 조건","4. 실험 3 — RANSAC 오염 실험","5. 실물 — 상자 포즈 추정기","6. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 20강 캘리브레이션 완료된 웹캠, 치수를 아는 직육면체(티슈 상자 등 — 세 변 실측), 23강 `geometry.py`."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | `src/pnp_bench.py`  • 실험 노트북 + 상자 추정기 스크립트 |\n| 실험 리포트 | 실험 1~3 각각 (가설/그래프/한 줄 결론), 조건 명시 |\n| 실물 검증 | 와이어프레임 캡처, 줄자·자세 시험표, 월드 연결 결과 |\n| 테스트 | pose_error·make_scene의 pytest (이상치 0%·노이즈 0에서 오차 ≈ 0 확인) |\n\n체크리스트\n\n- [ ]  합성 실험이 시드 고정으로 재현 가능\n- [ ]  RANSAC 인라이어 게이트 구현·발동 사례 기록\n- [ ]  실물 거리 오차 \u003c 3%, 자세 오차 \u003c 3°\n- [ ]  $T^{desk}_{box}$ 검증 (모눈 실측 대비 \u003c 2cm)\n\n---","hasPractice":true},{"number":29,"title":"29강. [실습] YOLO 추론 ROS2 통합","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/29강 [실습] YOLO 추론 ROS2 통합 4847bcf74d9383df99ae81b7d890585c.md","goals":["YOLO 추론을 ROS2 노드로 감싸 검출 결과를 표준 메시지(vision_msgs)로 발행할 수 있습니다.","추론 지연과 프레임 주기의 관계를 측정하고, 프레임 드롭 정책·해상도·모델 크기로 실시간성을 관리할 수 있습니다.","검출 박스를 깊이 정보(크기 가정/바닥 평면)와 결합해 3D 위치로 승격하고 TF·RViz로 확인할 수 있습니다."],"essential":"25강의 검출기를 로봇이 쓸 수 있는 ROS2 노드로 만듭니다.\n\n- 필수 ① YOLO 추론 노드를 만들어 표준 메시지(`Detection2DArray` 등) 로 결과를 발행한다.\n- 필수 ② 추론 지연과 처리율(FPS) 을 측정하고, 모델 크기·해상도로 동작점을 고른다.\n- 필수 ③ 검출 결과를 깊이와 결합해 3D 위치로 승격하고 좌표계를 명시해 발행한다.\n\n여유가 되면(심화): 디버그 오버레이 최적화, GPU/CPU 배치 전략, 파라미터 동적 변경. 속도가 안 나오면 모델 크기 → 입력 해상도 → 처리 주기 순으로 손대는 것이 정석입니다.","headings":["들어가며","1. 노드 설계 — 표준 메시지로 말하기","2. 실시간성 측정과 동작점 선택","3. 시각화 — 디버그 오버레이","4. 3D 승격 — \"어디에\"까지","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 21강 환경 + `pip install ultralytics vision-msgs`(apt: `ros-humble-vision-msgs`). GPU 없어도 진행 가능(정책이 오히려 더 중요해집니다)."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 패키지 | `yolo_ros` — 노드·launch·파라미터 yaml |\n| 측정 기록 | 동작점 지도(3모델×2해상도 이상), 드롭률, hz/delay 표 |\n| 결과 이미지 | 오버레이 캡처(3클래스 이상), RViz 3D 마커 화면 |\n| 검증 | 바닥 평면 승격의 줄자 비교표, 스탬프 계승 확인(topic delay 동작) |\n\n체크리스트\n\n- [ ]  표준 메시지(Detection2DArray) 사용, conf/iou가 런타임 파라미터\n- [ ]  콜백-타이머 분리 + 최신 슬롯 (추론 중 프레임 적체 없음)\n- [ ]  frame_id가 optical frame 규약에 맞고 RViz에서 방향이 올바름\n- [ ]  동작점 선택의 근거가 측정 데이터로 제시됨\n\n---","hasPractice":true},{"number":30,"title":"30강. [실습] Point Cloud 필터링(Voxel/SOR) + RANSAC 평면·클러스터링","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/30강 [실습] Point Cloud 필터링(Voxel SOR) + RANSAC 평면·클러 1c17bcf74d9383448e0f0143fe7cfd53.md","goals":["26강의 표준 파이프라인(Voxel→SOR→평면→클러스터)을 Open3D로 구현하고 파라미터를 근거 있게 정할 수 있습니다.","각 단계의 효과를 점 수·처리 시간·품질 지표로 계량하고, 파라미터 민감도를 실험으로 보일 수 있습니다.","클러스터별 중심·바운딩박스·크기를 산출해 \"물체 후보 목록\"을 만들고, 정답 있는 합성 장면으로 검증할 수 있습니다."],"essential":"26강 파이프라인을 코드로 조립하고, 파라미터를 근거 있게 정하는 훈련입니다.\n\n- 필수 ① Voxel → SOR → 평면 분리 → 클러스터링 파이프라인을 구현하고 단계마다 점 수를 기록한다.\n- 필수 ② 정답을 아는 합성 장면으로 검출된 물체 수·중심 오차를 평가한다.\n- 필수 ③ 주요 파라미터 두 개(예: `voxel_size`, `eps`)를 훑으며 민감도 그래프를 만든다.\n\n여유가 되면(심화): 실데이터 적용, 법선 기반 필터링, 클러스터 형상 분류. 파라미터 값 자체보다 \"왜 그 값인가\"의 근거가 채점 대상입니다.","headings":["들어가며","1. 합성 장면 발생기 — 정답 있는 실험대","2. 파이프라인 조립 — 단계마다 계량","3. 파라미터 민감도 — 두 손잡이 실험","4. 실데이터 적용과 시각화","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: `pip install open3d`. 실습 저장소의 실측 PCD 샘플(테이블 장면). GPU 불필요."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | `src/synth_scene.py`, `src/segment.py`(+ 단계 로그), 실험 노트북 |\n| 테스트 | 합성 장면 검증 pytest (시드 10개) |\n| 실험 리포트 | 평면 문턱 스윕, eps 지도 (각 그래프+한 줄 결론) |\n| 결과 이미지 | 단계별 5칸, 실데이터 분리 화면, 후보 목록 출력(중심·크기·점 수) |\n\n체크리스트\n\n- [ ]  단계별 (점 수, 시간) 로그가 출력됨\n- [ ]  정답 대비 4지표 전부 합격 (시드 10개)\n- [ ]  파라미터 선택의 근거가 실험 그래프로 제시됨\n- [ ]  실데이터에서 관측면 한계(AABB 얇음)를 인지·기록\n\n---","hasPractice":true},{"number":31,"title":"31강. [실습] RGBD 깊이 취득·포인트클라우드 변환","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/31강 [실습] RGBD 깊이 취득·포인트클라우드 변환 63e7bcf74d93821e89ac81b3ae556558.md","goals":["RGBD 카메라(또는 대체 데이터셋)에서 정렬된 컴러·깊이 프레임을 취득할 수 있습니다.","깊이 이미지를 내부파라미터로 역투영해 컴러 포인트클라우드를 직접 생성(벡터화)할 수 있습니다.","깊이 데이터의 품질(구멍·경계·반사)을 평가하고, 30강 파이프라인·29강 검출과 결합해 모듈 ④를 완성할 수 있습니다."],"essential":"모듈 ④의 결승선 — 사진을 공간으로 바꿉니다.\n\n- 필수 ① RGBD에서 정렬된 컬러·깊이를 얻고, 정렬이 왜 필요한지 설명한다.\n- 필수 ② 깊이 이미지를 벡터화 역투영해 컬러 포인트클라우드를 만든다.\n- 필수 ③ 내 센서의 거리별 노이즈·경계·표면 특성을 실측해 스펙 시트로 정리한다.\n\n여유가 되면(심화): 검출×깊이×클라우드 합류 노드, 성능 최적화. 실측 결과가 데이터시트와 달라도 괜찮습니다 — 내 환경의 숫자가 이후 파라미터의 근거가 됩니다.","headings":["들어가며","1. 취득 — 정렬된 두 이미지","2. 역투영 — 30만 픽셀을 한 번에","3. 품질 평가 — 내 센서의 스펙 실측","4. 합류 — 검출×깊이×클라우드","5. 제출물 — 모듈 ④ 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: RealSense(D4xx) 권장 — `pip install pyrealsense2`. 없다면 TUM RGBD 데이터셋(제공 스크립트로 다운로드)으로 전 과정 진행 가능합니다(취득 절만 재생으로 대체)."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | `rgbd_source.py`(RealSense/데이터셋 겸용), `depth_to_cloud.py`(+시간 비교), 최종 데모 스크립트 |\n| 품질 리포트 | 3종 실측(노이즈 곡선·경계 프로파일·표면 무효율) |\n| 결과 이미지 | 취득 3분할, 컴러 클라우드, 최종 데모 3단 화면 |\n| 비교표 | 바닥 평면 승격(29강) vs 깊이 직접(오늘)의 위치 오차 |\n\n체크리스트\n\n- [ ]  깊이 0(무효)이 모든 단계에서 마스킹됨\n- [ ]  역투영이 벡터화됨 (루프 버전 대비 시간 기록)\n- [ ]  장치 K를 체커보드 1장으로 교차 확인\n- [ ]  최종 데모가 물체 위치·크기를 미터 단위로 출력\n\n---","hasPractice":true},{"number":37,"title":"37강. SLAM 원리와 도구 비교 (Cartographer·slam_toolbox·cuVSLAM)","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/37강 SLAM 원리와 도구 비교 (Cartographer·slam_toolbox·cuVS 8e97bcf74d938267ab6f81bce9a21d1b.md","goals":["SLAM 문제의 정의 — 지도와 위치를 동시에 추정하는 닭-달걀 문제 — 를 설명할 수 있습니다.","LiDAR 스캔·오도메트리의 성질과 점유 격자 지도(occupancy grid)의 표현을 설명할 수 있습니다.","스캔 매칭·시각 특징 추적과 그래프 SLAM의 구조를 비교하고, 카메라 기반 3D 실습 도구의 역할을 설명할 수 있습니다."],"essential":"로봇이 스스로 지도를 그리는 원리를 봅니다. 알고리즘 구현이 아니라 구조의 이해가 목표입니다.\n\n- 필수 ① SLAM이 왜 \"닭-달걀 문제\"인지, 오도메트리와 스캔이 서로의 어떤 약점을 메우는지 설명한다.\n- 필수 ② 점유 격자 지도의 세 값(비어 있음·점유·미지)과 해상도의 의미를 안다.\n- 필수 ③ 스캔 매칭이 \"스캔을 지도에 가장 잘 겹치는 위치 찾기\"임을 설명한다.\n\n심화: 2D/3D 지도 표현과 그래프 최적화. 2D LiDAR 원리는 비교 이론으로 배우고, 41강은 카메라 기반 cuVSLAM·nvblox로 실행합니다.","headings":["들어가며","1. 재료 — LiDAR와 오도메트리, 그리고 둘의 약점","2. 지도의 표현 — 점유 격자","3. 스캔 매칭 — 지도에 스캔을 끼워 맞추기","4. 그래프 SLAM — 전체를 한 번에 최적화","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":38,"title":"38강. Localization·상태 추정 (AMCL·Particle Filter·Kalman/EKF)","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/38강 Localization·상태 추정 (AMCL·Particle Filter·Kalma 88f7bcf74d9383b886898174be26aa58.md","goals":["상태 추정의 공통 뼈대 — 예측(모델)과 보정(측정)의 반복 — 를 설명할 수 있습니다.","칼만 필터(KF)와 EKF의 동작 원리, 칼만 이득의 의미를 설명할 수 있습니다.","파티클 필터와 AMCL의 동작(샘플·가중치·리샘플링), KF 계열과의 선택 기준을 설명할 수 있습니다."],"essential":"\"확률로 위치를 안다\"는 사고방식을 배웁니다. 공식 암기가 아니라 의미의 이해가 기준입니다.\n\n- 필수 ① 모든 필터가 예측(넓어짐) → 보정(좁아짐) 사이클이라는 공통 구조를 설명한다.\n- 필수 ② 칼만 이득 $K$ 를 \"측정을 얼마나 믿을지의 자동 손잡이\" 로 해석한다.\n- 필수 ③ 파티클 필터가 EKF와 달리 여러 후보(다봉 분포) 를 표현할 수 있어 전역 추정·납치에 강함을 설명한다.\n\n여유가 되면(심화): 칼만 공식의 유도, 베이즈 정리와의 관계, KLD 샘플링. 행렬 공식을 외울 필요는 없습니다 — 각 기호가 무엇을 담당하는지만 읽을 수 있으면 됩니다.","headings":["들어가며","1. 공통 뼈대 — 믿음(belief)의 예측과 보정","2. 칼만 필터 — 가우시안으로 믿음 관리","3. 파티클 필터 — 점 구름으로 믿음 관리","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":39,"title":"39강. Mapping·Localization 데이터 흐름과 Loop Closure","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/39강 Mapping·Localization 데이터 흐름과 Loop Closure 2ee7bcf74d938385a3b1815ff71c786b.md","goals":["ROS2 내비게이션의 좌표 프레임 규약(map→odom→base_link)과 각 변환의 담당자를 설명할 수 있습니다.","매핑 모드와 위치추정 모드의 데이터 흐름 차이를 그리고, 각 토픽·노드의 역할을 설명할 수 있습니다.","Loop Closure의 감지·검증·교정 과정과 실패(오탐)의 위험을 설명할 수 있습니다."],"essential":"오늘 배우는 프레임 규약은 이후 모든 주행 실습의 배선도입니다.\n\n- 필수 ① `map → odom → base_link` 세 프레임의 역할과 누가 무엇을 발행하는지 말한다.\n- 필수 ② 왜 map→base_link를 직접 발행하지 않고 불연속을 map→odom에 격리하는지 설명한다.\n- 필수 ③ Loop Closure가 무엇이며, 잘못된 루프가 왜 위험한지 설명한다.\n\n여유가 되면(심화): 그래프 최적화의 오차 배분, 루프 검증 파라미터. 실습에서 지도가 어긋날 때 이 강의로 돌아오면 원인 대부분이 여기에 있습니다.","headings":["들어가며","1. 세 프레임의 규약 — 로보틱스에서 가장 중요한 TF 트리","2. 두 모드의 데이터 흐름","3. Loop Closure — 감지, 검증, 교정","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":40,"title":"40강. Nav2 스택과 Planner·Costmap (Behavior Tree·Lifecycle)","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/40강 Nav2 스택과 Planner·Costmap (Behavior Tree·Lifecy ace7bcf74d9382638aa8014db6c9274a.md","goals":["Nav2 스택의 전체 구조 — BT Navigator·Planner·Controller·리커버리 — 와 주행 파이프라인을 설명할 수 있습니다.","Global/Local Planner의 역할 분담과 대표 알고리즘(A*·DWB)의 아이디어를 설명할 수 있습니다.","Costmap의 층 구조(정적·장애물·인플레이션)와 비용의 의미를 설명하고, Behavior Tree·Lifecycle이 왜 쓰였는지 설명할 수 있습니다."],"essential":"Nav2는 부품이 많습니다. 오늘은 누가 무엇을 담당하는지의 지도를 갖는 것이 목표입니다.\n\n- 필수 ① 목표(goal)에서 바퀴 명령(`cmd_vel`)까지의 전체 흐름을 그린다.\n- 필수 ② 전역 planner와 지역 controller의 분업을 설명한다(무엇을 보고 무엇을 정하는가).\n- 필수 ③ Costmap의 층 구조와 인플레이션의 의미를 설명한다.\n\n여유가 되면(심화): Behavior Tree의 구조, Lifecycle 노드 관리, planner 알고리즘 비교. 파라미터 세부는 44강에서 실험으로 익힙니다 — 오늘은 구조만 잡으세요.","headings":["들어가며","1. 전체 구조 — 목표에서 바퀴까지","2. Planner — 전역과 지역의 분업","3. Costmap — \"어디가 얼마나 위험한가\"의 지도","4. 지휘 계통 — Behavior Tree와 Lifecycle","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":41,"title":"41강. [실습] cuVSLAM·nvblox 3D 지도 생성·저장/로드","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/41강 [실습] cuVSLAM·nvblox 3D 지도 생성·저장 로드 fb67bcf74d9382b8bc3d01c055c0f227.md","goals":["Isaac Sim 6.1의 스테레오/RGB-D 카메라로 cuVSLAM의 6DoF 위치 추정과 nvblox의 3D 재구성을 실행할 수 있습니다.","좋은 지도를 만드는 주행 요령과 핵심 파라미터의 효과를 실험으로 확인할 수 있습니다.","시각 SLAM 지도, nvblox 직렬화 지도·메시를 구분해 저장하고 다시 로드할 수 있습니다."],"essential":"처음으로 내 손으로 지도를 만드는 날입니다.\n\n- 필수 ① Isaac ROS 5.0의 isaac_ros_cuvslam을 기동해 3D 궤적·랜드마크와 TF를 확인한다.\n- 필수 ② 영상·깊이와 추정 포즈로 nvblox 3D 메시와 Nav2용 2D ESDF 슬라이스를 만든다.\n- 필수 ③ 시각 지도와 3D 재구성 상태를 각각 저장하고 42강 재위치 추정에 사용할 보정값·설정을 보존한다.\n\n심화: 스테레오와 RGB-D 비교, voxel 크기·ESDF 높이 범위 튜닝. 추적 실패 시 카메라 보정·동기화·TF·영상 겹침을 먼저 확인합니다.","headings":["들어가며","1. 배선 — 39강 회로도의 실물화","2. 주행 요령 — 지도는 운전이 절반","3. 파라미터 — 39강 심화의 회수","4. 시각 지도·3D 재구성 저장과 재로드","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["노트북 환경: Ubuntu 24.04 + Isaac Sim 6.1 + Isaac ROS 5.0 + ROS 2 Lyrical. 기본은 동기화된 스테레오 영상과 깊이이며 RGB-D는 확장 실습입니다. 실내 USD 장면·차동구동 로봇·카메라, ROS 2 Bridge, /clock, CameraInfo와 카메라 외부 보정 TF를 준비합니다. nvblox에는 cuVSLAM 추정 포즈를 연결하고 참값 포즈는 평가용으로만 분리합니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 지도 | cuVSLAM 지도 폴더 + .nvblx + .ply + 설정·보정값·품질 점검표 |\n| 실험 기록 | A(회전 속도)·B(VO/SLAM) 비교, 추적 손실·복귀 오차·GPU 부하 |\n| 화면 | 3D 궤적·랜드마크·메시·ESDF 화면, TF 트리, 저장·재로드 로그 |\n| (심화) | 참값 대비 표면·궤적 오차 표 |\n\n체크리스트\n\n- [ ]  use_sim_time 일관 적용, TF 트리가 39강 손그림과 일치\n- [ ]  필요 공간 관측 완료, 이중 표면·깊이 단위 오류 없음\n- [ ]  VO/SLAM 폐곡선 비교를 궤적·수치로 증빙\n- [ ]  시각 지도·3D 상태·메시가 구분되어 저장되고 재로드됨\n\n---","hasPractice":true},{"number":42,"title":"42강. [실습] cuVSLAM 지도 재위치 추정·추적 복구","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/42강 [실습] cuVSLAM 지도 재위치 추정·추적 복구 4627bcf74d938278adc581f447b762e6.md","goals":["41강의 시각 지도를 로드하고 pose_hint를 이용한 재위치 추정을 실행할 수 있습니다.","추적 손실·납치·잘못된 위치 힌트에서 복구 성공 여부와 재위치 추정 시간을 비교할 수 있습니다.","Isaac Sim 참값 대비 3D 위치·자세 오차를 계측해 품질을 보고할 수 있습니다."],"essential":"38강의 추정·불확실성 개념을 카메라 기반 재위치 추정으로 연결합니다.\n\n- 필수 ① 저장한 cuVSLAM 지도에서 위치 힌트를 주고 재위치 추정 성공을 확인한다.\n- 필수 ② RViz의 3D 궤적·랜드마크와 /visual_slam/status로 추적 상태를 관찰한다.\n- 필수 ③ 납치·가림·잘못된 힌트 상황에서 안전 정지와 재위치 추정 절차를 기록한다.\n\n심화: RGB-D 모드와 스테레오 비교, cuVGL을 통한 전역 위치 힌트 제공. cuVSLAM 단독으로 힌트 없는 전역 위치 추정이 자동 해결된다고 가정하지 않습니다.","headings":["들어가며","1. 배선 — 시각 지도 로드와 TF 공급","2. 위치 힌트와 재위치 추정","3. 세 가지 실험 — 이론의 실측","4. 오차 계측 — 참값 대비 리포트","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: Ubuntu 24.04·Isaac Sim 6.1·Isaac ROS 5.0·ROS 2 Lyrical, 41강 cuVSLAM 지도 폴더·house.nvblx·같은 USD 장면과 카메라 보정. 컨테이너에서는 지도 경로를 동일하게 마운트합니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 실행 증빙 | 재위치 추정 전후 궤적·랜드마크·진단·TF 캡처 |\n| 실험 기록 | A(힌트 오차), B(납치·복구), C(탐색 설정)의 성공률·시간 비교 |\n| 계측 리포트 | 3회 주행의 3D 오차 표·히스토그램·오차 지도와 진단 로그 |\n\n체크리스트\n\n- [ ]  cuVSLAM이 TF를 공급하고 중복 발행자가 없음을 확인\n- [ ]  저장 지도 로드와 위치 힌트 기반 재위치 추정 성공 증빙\n- [ ]  납치·가림 후 정지·복구·재개 정책과 실패 기록 존재\n- [ ]  오차·성공률·복구 시간 보고; 미달 시 입력·지도·설정 원인 분석\n\n---","hasPractice":true},{"number":43,"title":"43강. [실습] Nav2 다중 Waypoint 주행","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/43강 [실습] Nav2 다중 Waypoint 주행 fdd7bcf74d938302be80815b865b0729.md","goals":["Nav2 전체 스택을 기동해 단일 목표 주행과 그 내부 동작(경로·costmap·리커버리)을 관찰할 수 있습니다.","Waypoint Follower와 액션 API로 다중 경유지 주행을 코드로 명령할 수 있습니다.","주행 이벤트(재계획·리커버리)를 로그로 수집하는 주행 파이프라인의 1차 완성본을 만들 수 있습니다."],"essential":"로봇이 스스로 목적지까지 가는 첫날입니다.\n\n- 필수 ① Nav2 풀스택을 기동해 RViz에서 목표를 주고 자율 주행에 성공한다.\n- 필수 ② `NavigateToPose` 액션을 코드로 호출해 프로그램이 목표를 보내게 한다.\n- 필수 ③ 여러 waypoint를 순차 주행시키고, 실패·재계획 이벤트를 로그로 남긴다.\n\n여유가 되면(심화): 액션 피드백 활용, 취소·재시도 로직, 순찰 루프. 로그 형식은 45강 벤치마크에서 그대로 쓰이니 오늘부터 남기는 것이 중요합니다.","headings":["들어가며","1. 풀스택 기동과 첫 주행","2. 코드로 명령 — NavigateToPose 액션","3. 다중 Waypoint — 순찰 경로","4. 이벤트 로거 — 45강의 데이터를 오늘부터","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 41강의 cuVSLAM 지도·nvblox 상태, 42강 재위치 추정 성공과 같은 Isaac Sim USD 장면. Ubuntu 24.04·Isaac Sim 6.1·Isaac ROS 5.0·ROS 2 Lyrical 기준입니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | patrol_node(정책 포함)·nav_logger·waypoints.yaml·launch |\n| 주행 증빙 | 첫 주행 RViz 해부 캡처, 리커버리 발화 로그, 순찰 궤적 지도 |\n| 기록 | 순찰 3회의 이벤트 csv + 구간별 소요 표 |\n| 영상 | 4-waypoint 순찰 1바퀴 (RViz 화면, 배속 가능) |\n\n체크리스트\n\n- [ ]  목표가 map 프레임으로 전송됨 (odom에 찍는 실험으로 차이 확인)\n- [ ]  실패 정책 3줄이 코드와 문서에 일치\n- [ ]  재계획·리커버리가 로그에 이벤트로 남음\n- [ ]  순찰 3회가 사람 개입 없이 완주 (개입했다면 사유 기록)\n\n---","hasPractice":true},{"number":44,"title":"44강. [실습] Planner/Costmap 튜닝·동적 장애물 회피","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/44강 [실습] Planner Costmap 튜닝·동적 장애물 회피 2657bcf74d9383b99449810a3b30490b.md","goals":["Costmap(인플레이션·장애물 층)과 Controller(DWB critics·속도 한계) 파라미터를 실험 기반으로 튜닝할 수 있습니다.","동적 장애물(움직이는 사람·물체) 시나리오에서 회피 품질을 평가하고 개선할 수 있습니다.","튜닝 변경을 회귀 시험(고정 시나리오 반복)으로 검증하는 절차를 확립할 수 있습니다."],"essential":"튜닝은 손끝의 감이 아니라 실험 설계입니다.\n\n- 필수 ① 시나리오·지표를 먼저 정하고, 한 번에 하나씩만 바꾸는 튜닝 절차를 지킨다.\n- 필수 ② 인플레이션 두 파라미터가 좁은 문 통과에 미치는 영향을 측정으로 보인다.\n- 필수 ③ 동적 장애물(사람) 시나리오에서 반응의 한계를 관찰하고 대비책을 기술한다.\n\n여유가 되면(심화): DWB critic 가중치 조정, 잔상(유령 벽) 제거, 회귀 게이트 자동화. 값을 바꿨으면 반드시 같은 시나리오로 재측정 — 그것이 튜닝과 손장난의 차이입니다.","headings":["들어가며","1. 튜닝 방법론 — 시나리오·지표·단일 변경","2. Costmap 튜닝 — 대담함과 안전 사이","3. Controller(DWB) 튜닝 — 운전 스타일 만들기","4. 동적 장애물 — 반응의 한계와 대비책","5. 회귀 게이트 — 채택의 조건","6. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 43강 cuVSLAM·nvblox·Nav2 파이프라인과 Isaac Sim의 이동 장애물 USD 장면. 걷는 사람 또는 이동 박스 2개의 경로·속도·충돌 형상을 설정하고 같은 조건으로 반복합니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 설정 | 튜닝된 nav2_params.yaml (변경 항목마다 주석: 근거 실험) |\n| 실험 기록 | 인플레이션 S1 표, DWB 3프리셋 비교, 동적 속도별 곡선 |\n| 회귀 | nav_[regression.sh](http://regression.sh)  • 게이트 리포트 2건 이상 (PASS·FAIL 각 1) |\n| 영상 | S3 동적 회피 (균형형, 성공 장면) |\n\n체크리스트\n\n- [ ]  모든 채택 변경에 전후 비교표 존재 (단일 변경 원칙)\n- [ ]  좁은 문 성공률 100% (하한 안전 여유 명시)\n- [ ]  액터 0.6m/s에서 S3 성공률 ≥ 90%, 최소 이격 ≥ 0.3m\n- [ ]  FAIL 사례가 반려된 기록이 남아 있음 (게이트가 실제로 작동)\n\n---","hasPractice":true},{"number":45,"title":"45강. [실습] 주행 성공률·소요시간·재계획 측정","module":"모듈 ⑥ SLAM 및 Nav2 자율주행","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행/45강 [실습] 주행 성공률·소요시간·재계획 측정 f157bcf74d938331bae3814f3cfa9c6e.md","goals":["주행 성능 지표(성공률·소요시간·재계획·리커버리·경로 효율)를 정의하고 자동 수집할 수 있습니다.","통계적으로 의미 있는 반복 시험을 설계·실행하고 분포로 보고할 수 있습니다.","모듈 ⑥ 최종 벤치마크 리포트를 작성하고, 모듈 ⑩에서 재사용할 계측 자산을 정리합니다."],"essential":"모듈 ⑥의 결승선 — 주행 성능을 숫자로 말하는 체계를 만듭니다.\n\n- 필수 ① 성공·소요시간·재계획 수 등 지표를 애매함 없이 정의한다.\n- 필수 ② 벤치마크 러너로 대량 반복 실행하고 결과를 자동 수집한다.\n- 필수 ③ 결과를 분포와 실패 분석으로 읽고, 개선 우선순위를 제시한다.\n\n여유가 되면(심화): 지표 간 상관 분석, 통계적 유의성. 성능이 낮아도 됩니다 — 정의가 엄밀하고 측정이 재현 가능하면 통과입니다.","headings":["들어가며","1. 지표의 정의 — 애매함을 남기지 않기","2. 벤치마크 러너 — 대량 반복의 자동화","3. 결과 읽기 — 분포·상관·실패 분석","4. 모듈 마감 — 자산 이관 목록","5. 제출물 — 모듈 ⑥ 최종","미니 퀴즈","정리","용어 사전"],"environment":[],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 계측 체계 | 지표 카드(정의 문서), bench_runner + aggregate |\n| 벤치마크 리포트 | 고정 20회 + 무작위 10회 대시보드, 실패 부검 전건, 튜닝 전후 비교 |\n| 자산 이관 | 이관 목록 표 + 저장소 정리 (모듈 ⑩ 팀이 받아 쓸 상태) |\n| (심화) | 성공률 신뢰구간 병기 |\n\n체크리스트\n\n- [ ]  성공 판정 4조건이 코드(판정기)와 문서에서 일치\n- [ ]  러너가 무인으로 20회 완주 (리셋·수렴 확인 포함)\n- [ ]  모든 실패에 부검 서식·분류 존재\n- [ ]  \"유의하지 않은 차이\"를 개선으로 주장한 곳이 없음\n\n---","hasPractice":true},{"number":46,"title":"46강. 전문가 시연 데이터 수집 (Teleoperation·Kinesthetic Teaching)","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/46강 전문가 시연 데이터 수집 (Teleoperation·Kinesthetic Teach 9677bcf74d93825dbacb01e152f23c1e.md","goals":["모방학습의 문제 설정 — 시연에서 정책(관측→행동)을 배우는 것 — 과 규칙 기반 대비 장단점을 설명할 수 있습니다.","시연 수집의 두 방식(Teleoperation·Kinesthetic Teaching)과 각각의 장단점·적용 조건을 설명할 수 있습니다.","좋은 시연 데이터의 조건(관측-행동 정합·다양성·일관성)과 데이터셋 형식을 설명할 수 있습니다."],"essential":"모방학습의 출발점은 알고리즘이 아니라 데이터입니다.\n\n- 필수 ① \"정책을 배운다\"가 관측 → 행동의 함수를 학습하는 일임을 설명한다.\n- 필수 ② 원격 조종과 직접 교시의 차이와 각각의 장단점을 말한다.\n- 필수 ③ 좋은 시연 데이터의 조건(일관성·다양성·복구 포함·동기화)을 설명한다.\n\n여유가 되면(심화): 데이터 규모와 성능의 관계, 수집 장비 구성. 오늘 배운 \"복구 장면을 포함하라\"는 원칙은 47강 공변량 이동에서 그 이유가 밝혀집니다.","headings":["들어가며","1. 문제 설정 — 정책을 배운다","2. 수집 방식 ① — Teleoperation (원격 조종)","3. 수집 방식 ② — Kinesthetic Teaching (직접 교시)","4. 좋은 시연 데이터의 조건","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":47,"title":"47강. Behavior Cloning 정책 학습","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/47강 Behavior Cloning 정책 학습 5007bcf74d9383a197c2819abc55c6c8.md","goals":["Behavior Cloning(BC)을 지도학습으로 정식화하고, 신경망 정책의 구조(MLP·CNN 인코더)를 설명할 수 있습니다.","학습 파이프라인(정규화·손실·검증)과 과적합·과소적합의 진단을 설명할 수 있습니다.","BC의 근본 한계 — 공변량 이동(covariate shift)과 복합 오차 — 를 설명하고 완화책을 나열할 수 있습니다."],"essential":"모방학습의 가장 단순한 형태와, 그 형태가 무너지는 지점을 함께 배웁니다.\n\n- 필수 ① BC가 지도학습 회귀와 같은 문제임을 설명한다(입력=관측, 정답=전문가 행동).\n- 필수 ② 학습 곡선을 읽고 과적합·과소적합을 판단한다.\n- 필수 ③ 공변량 이동이 무엇이며 왜 BC의 근본 약점인지 설명한다.\n\n여유가 되면(심화): 오차가 $O(\\epsilon T^2)$ 로 커지는 이론, 네트워크 구조 선택. 수식 증명은 필요 없습니다 — \"작은 실수가 미지의 상황을 만들고, 거기서 더 큰 실수가 난다\" 는 연쇄를 설명할 수 있으면 됩니다.","headings":["들어가며","1. BC = 지도 회귀","2. 학습 진단 — 곡선을 읽는 법","3. BC의 아킬레스건 — 공변량 이동","4. 우리의 실습 무대 — 2링크 도달 과제 (51강 예열)","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":48,"title":"48강. Diffusion Policy 행동 분포 모델링","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/48강 Diffusion Policy 행동 분포 모델링 5ec7bcf74d93829498b4016a4bc631cc.md","goals":["다중 모드 행동 분포에서 MSE 회귀(BC)가 실패하는 이유를 설명할 수 있습니다.","확산 모델(diffusion)의 원리 — 노이즈 추가의 역과정을 학습 — 를 직관 수준에서 설명할 수 있습니다.","Diffusion Policy의 구조(관측 조건부·행동 시퀀스 생성·리시딩 호라이즌)와 BC 대비 장단점을 설명할 수 있습니다."],"essential":"최신 정책 학습 기법을 다루지만, 오늘의 필수는 문제의식입니다.\n\n- 필수 ① 정답이 여러 개인 상황(갈림길)에서 MSE 평균이 왜 실패하는지 설명한다.\n- 필수 ② 확산 모델의 아이디어 — 노이즈를 걷어 내며 샘플을 만든다 — 를 말로 설명한다.\n- 필수 ③ Diffusion Policy가 다중 모드를 표현할 수 있는 이유를 설명한다.\n\n여유가 되면(심화): 노이즈 스케줄, 샘플링 스텝 수와 추론 비용, 구현 세부. 수식 유도는 심화입니다 — 52강에서 코드로 확인하며 감각을 잡으면 됩니다.","headings":["들어가며","1. 문제의 뿌리 — 평균은 정답이 아니다","2. 확산 모델 — 노이즈를 걷어 내는 법을 배운다","3. Diffusion Policy — 확산을 로봇에 이식하기","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":49,"title":"49강. Cross-Embodiment(Open X-Embodiment/RT-X)·정책 지표·DAgger","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/49강 Cross-Embodiment(Open X-Embodiment RT-X)·정책 지표 0b97bcf74d93829a849f01b5520acf98.md","goals":["Cross-Embodiment 전이학습의 개념과 Open X-Embodiment/RT-X가 보여 준 결과·전제 조건을 설명할 수 있습니다.","정책 성능 지표(Success Rate·Trajectory Smoothness 등)의 정의와 통계적 보고 방법을 설명할 수 있습니다.","DAgger와 HG-DAgger의 알고리즘 — 공변량 이동의 정면 처방 — 을 설명할 수 있습니다."],"essential":"세 주제를 한 강의에 담지만, 필수는 각각 한 문장씩입니다.\n\n- 필수 ① Cross-Embodiment의 핵심 주장 — 여러 로봇의 데이터를 합치면 각자보다 잘한다 — 과 그 전제(행동 공간 표준화)를 설명한다.\n- 필수 ② 정책 평가에 성공률만으로 부족한 이유를 말하고 매끔러움 지표를 함께 본다.\n- 필수 ③ DAgger가 공변량 이동을 어떻게 해결하는지(정책이 방문한 상태에 전문가 라벨을 붙인다) 설명한다.\n\n여유가 되면(심화): OXE·RT-X의 세부, 신뢰구간 계산, HG-DAgger 변형. 오늘 이해한 지표 정의는 53강 평가기 구현으로 바로 이어집니다.","headings":["들어가며","1. Cross-Embodiment — 몸이 달라도 배움은 통하는가","2. 정책 지표 — 성능을 말하는 언어","3. DAgger — 필요한 라벨만 콕 집어 받기","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":50,"title":"50강. [실습] 시연 데이터 시계열 정합·노이즈 제거","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/50강 [실습] 시연 데이터 시계열 정합·노이즈 제거 9637bcf74d938254b8b0016a71bcafea.md","goals":["마우스 teleop으로 2링크 도달 과제의 시연 데이터셋을 수집할 수 있습니다.","주기가 다른 스트림들을 타임스탬프 기반으로 정합(리샘플·보간)해 (o, a) 짝을 만들 수 있습니다.","노이즈·이상 구간을 진단·정제하고, 데이터셋 품질 리포트와 HDF5 산출물을 만들 수 있습니다."],"essential":"학습의 성패는 오늘 만드는 데이터셋에서 이미 절반이 정해집니다.\n\n- 필수 ① 관측과 행동을 수집하고, 주기가 다른 스트림을 시각 기준으로 정합해 (o, a) 짝을 만든다.\n- 필수 ② 노이즈·이상 구간을 찾아 정제 기준을 정하고 적용한다.\n- 필수 ③ 결과를 표준 형식(HDF5)으로 저장하고 품질 리포트를 만든다.\n\n여유가 되면(심화): 보간 방식 비교, 자동 이상 탐지. 데이터가 적어도 괜찮습니다 — 정합이 맞고 품질이 문서화되어 있는 것이 훨씬 중요합니다.","headings":["들어가며","1. 수집기 — 마우스가 전문가다","2. 정합 — 다주기 스트림을 (o, a) 짝으로","3. 정제 — 노이즈와 이상 구간","4. 산출물 — HDF5와 품질 리포트","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 모듈 ② 자산(`PlanarArm`·IK), matplotlib 인터랙션(마우스). `pip install h5py torch`."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | collector / align(+지연 스캔) / clean / report 스크립트 |\n| 데이터 | `demos_raw/`(원본 스트림)·`demos_clean.hdf5`(동결본, 분할 목록 포함) |\n| 리포트 | 품질 리포트 1페이지 + 정제 로그(버린 것과 이유) |\n\n체크리스트\n\n- [ ]  원시 스트림이 보존되고 정합은 재실행 가능\n- [ ]  지연 스캔 봉우리가 0ms(±1샘플) — 아니면 보정 근거 기록\n- [ ]  명령에 보간을 쓰지 않음, 미래 누출 없음(hold_last 검증 테스트)\n- [ ]  jerk RMS 전/후 기록, 과도 스무딩 아님을 형태 보존으로 확인\n- [ ]  norm_stats·분할 목록이 파일에 포함(동결 서명)\n\n---","hasPractice":true},{"number":51,"title":"51강. [실습] MLP/CNN/Transformer BC 정책 학습","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/51강 [실습] MLP CNN Transformer BC 정책 학습 a147bcf74d9382869a37815baac5719b.md","goals":["PyTorch 학습 루프(데이터로더·최적화·검증·체크포인트)를 갖춘 BC 학습기를 구현할 수 있습니다.","MLP(상태)·CNN(이미지)·Transformer(이력) 세 아키텍처를 같은 프로토콜로 학습·비교할 수 있습니다.","롤아웃 평가로 공변량 이동을 재현하고, 완화책(복구 시연·노이즈 주입)의 효과를 실험으로 확인할 수 있습니다."],"essential":"47강 BC를 세 가지 구조로 실제 학습시켜 봅니다.\n\n- 필수 ① 학습기 골격(데이터 로더·학습 루프·검증)을 만들고 한 정책을 끝까지 학습시킨다.\n- 필수 ② 세 아키텍처를 같은 조건에서 비교하고 롤아웃 성능으로 평가한다(손실만으로 판단하지 않기).\n- 필수 ③ 공변량 이동을 의도적으로 재현하고 완화 방법의 효과를 측정한다.\n\n여유가 되면(심화): 하이퍼파라미터 탐색, 구조별 특성 분석. 어떤 구조가 이겼는지보다 왜 그런 결과가 나왔는지의 해석이 채점 대상입니다.","headings":["들어가며","1. 학습기 골격 — 재사용 가능한 한 벌","2. 세 아키텍처","3. 심사 — 롤아웃 평가 프로토콜","4. 공변량 이동의 재현과 완화 — 오늘의 하이라이트","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 50강 동결 데이터. GPU 권장(없으면 MLP·소형 CNN으로 진행 가능 — 시간만 더 걸립니다)."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | 공용 학습기 + 3 아키텍처 + rollout_eval (시드·설정 파일 포함) |\n| 성적표 | 3 아키텍처 × 3 시드 성공률(±σ)·성공 지도·학습 곡선 |\n| 실험 리포트 | 이탈 곡선(기본 vs 완화 2종), 인과 혼동 비교, 행동 공간 비교 — 각 한 줄 결론 |\n| 체크포인트 | 최고 정책(`bc_best.pt`) — 52·53·54강의 비교 기준 |\n\n체크리스트\n\n- [ ]  동결 분할·norm_stats 사용 (재계산 없음)\n- [ ]  모든 성공률에 시드 3 오차 막대, 겹침은 \"차이 없음\"으로 표기\n- [ ]  공변량 이동 붕괴 곡선과 완화 효과가 같은 그래프에 제시\n- [ ]  val 개선 ↔ 롤아웃 악화 사례(인과 혼동) 확보\n\n---","hasPractice":true},{"number":52,"title":"52강. [실습] Diffusion Policy 비정형 조작 학습","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/52강 [실습] Diffusion Policy 비정형 조작 학습 b6d7bcf74d93839891958196e236a7da.md","goals":["다중 모드 시연 데이터셋(갈림길 과제)을 만들고 BC 기준선의 실패를 재현할 수 있습니다.","조건부 노이즈 예측 네트워크와 학습·샘플링 루프를 구현해 Diffusion Policy를 학습할 수 있습니다.","행동 시퀀스 생성·리시딩 호라이즌 실행을 구현하고, BC 대비 성능·추론 비용을 계측할 수 있습니다."],"essential":"48강 이론을 코드로 확인하는 날입니다.\n\n- 필수 ① 다중 모드가 들어 있는 갈림길 데이터셋을 만들고, MSE 정책이 실패하는 것을 재현한다.\n- 필수 ② Diffusion Policy를 구현해 같은 관측에서 여러 경로가 샘플링되는 것을 확인한다.\n- 필수 ③ 추론 비용(스텝 수 × 시간)을 측정해 실시간 제약과 비교한다.\n\n여유가 되면(심화): 샘플링 스텝 축소, 액션 청킹, 구조 개선. 구현이 어렵다면 제공 골격 코드를 채우는 방식으로 진행하고, 결과 해석에 집중하세요.","headings":["들어가며","1. 갈림길 데이터셋 — 저주를 설계하다","2. Diffusion Policy 구현 — 세 조각","3. 결과 — 저주가 풀리는 순간","4. 청구서 — 추론 비용 계측 (모듈 ⑨로 보내는)","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 50강 수집기(장애물 옵션 켜기), 51강 학습기 골격. GPU 권장."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 데이터 | `demos_fork.hdf5`  • 이봉성 확인 리포트 |\n| 코드 | NoisePredictor·학습/샘플링 루프·리시딩 실행기 |\n| 전후 비교 | BC 실패 스냅숏(궤적·출력 히스토그램) vs DP 성공(갈라진 롤아웃·샘플 다발) — 성공률 표 |\n| 비용 계측 | K 절충 곡선 + 동작점 선언 (모듈 ⑨ 청구서) |\n| 체크포인트 | `dp_best.pt` (53·54강에서 사용) |\n\n체크리스트\n\n- [ ]  BC 실패가 \"평균 출력\" 증거(히스토그램 가운데 점)와 함께 문서화됨\n- [ ]  DP 롤아웃에서 좌/우 비율이 데이터 비율에 근사\n- [ ]  H=1 대조 실험으로 청크의 가치 확인\n- [ ]  K 절충 곡선과 20Hz 동작점 명시\n\n---","hasPractice":true},{"number":53,"title":"53강. [실습] 정책 성능(Success Rate·Smoothness) 검증","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/53강 [실습] 정책 성능(Success Rate·Smoothness) 검증 4eb7bcf74d9383209aa281f68c0c5a5d.md","goals":["정책 평가기(성공 판정·지표 계산·통계 처리)를 공용 도구로 완성할 수 있습니다.","Success Rate(+신뢰구간·성공 지도)와 Smoothness(jerk RMS 등)를 함께 보고하는 리포트를 만들 수 있습니다.","강건성 축(관측 노이즈·물리 변화·분포 이탈)의 스트레스 시험으로 정책의 한계 지도를 그릴 수 있습니다."],"essential":"49강의 지표를 자동 평가기로 만듭니다.\n\n- 필수 ① 정책을 인자로 받아 롤아웃하고 성공률·매끔러움 리포트를 내는 평가기를 만든다.\n- 필수 ② 세 정책(MLP·CNN/Transformer·Diffusion)을 같은 조건에서 공식 비교한다.\n- 필수 ③ 스트레스 시험(초기 위치 변화·외란 등)으로 한계 지도를 그린다.\n\n여유가 되면(심화): 신뢰구간 계산, 조건별 성공 지도. 어떤 정책이 최고인지보다 어떤 조건에서 무엇이 무너지는지가 가치 있는 결과입니다.","headings":["들어가며","1. 평가기 — 정책을 꽂으면 리포트가 나온다","2. 본 평가 — 세 정책의 공식 성적","3. 스트레스 시험 — 한계의 지도","4. 제출물","미니 퀴즈","정리","용어 사전"],"environment":[],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 도구 | `policy_eval` 패키지 (인터페이스·러너·판정·지표·리포트) + 다중 모드 판별기 |\n| 공식 성적 | 3정책 × 2과제 대시보드 (CI·성공 지도·smoothness·시간) |\n| 한계 지도 | 3축 감쇠 곡선 + 2D 히트맵, \"알려진 한계\" 문장 3개 이상 도출 |\n| 양식 준수 | 체크포인트 선택 기준·전 시드 표 포함 |\n\n체크리스트\n\n- [ ]  BC·DP가 같은 인터페이스로 평가됨 (러너 코드에 정책 분기 없음)\n- [ ]  jerk가 성공 에피소드 조건부로 집계됨\n- [ ]  유의성 판단이 CI 겹침으로 명시됨\n- [ ]  한계 지도에서 도출된 문장이 README에 반영됨\n\n---","hasPractice":true},{"number":54,"title":"54강. [실습] DAgger/HG-DAgger 데이터 효율화","module":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화/54강 [실습] DAgger HG-DAgger 데이터 효율화 ca57bcf74d9382a1b5fa01d3f7ed8b2f.md","goals":["자동 전문가(IK 컨트롤러)를 라벨러로 쓰는 DAgger 루프를 구현하고 라운드별 성능 상승을 계측할 수 있습니다.","마우스 개입 방식의 HG-DAgger를 구현하고, 개입률을 정책 성숙도 지표로 활용할 수 있습니다.","같은 데이터 예산에서 BC vs DAgger의 효율을 비교하고 모듈 ⑦을 총정리합니다."],"essential":"모듈 ⑦의 결승선 — 47강에서 진단한 공변량 이동을 실제로 치료합니다.\n\n- 필수 ① DAgger 루프(정책 실행 → 방문 상태 수집 → 전문가 라벨 → 재학습)를 라운드로 반복한다.\n- 필수 ② 라운드별 성능 곡선으로 BC 대비 개선을 보인다.\n- 필수 ③ HG-DAgger처럼 필요할 때만 라벨을 받는 방식의 효율을 비교한다.\n\n여유가 되면(심화): 라벨 예산 최적화, 개입 기준 설계. 성능이 크게 오르지 않아도 됩니다 — 라벨당 개선량으로 해석하면 실험은 성립합니다.","headings":["들어가며","1. 자동 전문가 — 라벨러의 자격","2. DAgger 루프 — 라운드가 곡선을 만든다","3. HG-DAgger — 사람이 게이트가 되다","4. 모듈 ⑦ 총정리 — 한 장의 지도","5. 제출물 — 모듈 ⑦ 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 50강 수집기·데이터, 51강 학습기, 53강 평가기 — 오늘은 조립의 날입니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | expert(검증 포함)·dagger·hg_dagger (평가기·학습기 재사용 구조) |\n| 곡선 | DAgger 라운드 곡선(일반/이탈 조건 분리), 동일 예산 BC 비교, 라벨 위치 시각화 |\n| HG 리포트 | 개입률·개입 길이 곡선, 게이트 기준 문서, 자동 전문가와의 비교 결론 |\n| 총정리 | 의사결정 지도 1장 (실측 수치 근거 포함) |\n\n체크리스트\n\n- [ ]  전문가 성공률 ≥99% 검증 후 라벨링 시작\n- [ ]  모든 평가가 53강 평가기 경유 (별도 채점 코드 없음)\n- [ ]  동일 데이터 예산 비교가 공정함 (총 (o, a) 수 일치)\n- [ ]  개입 기준이 문서화되고 팀원 간 일관됨\n\n---","hasPractice":true},{"number":55,"title":"55강. Isaac Sim/Isaac Lab 태스크 구성 (USD Asset·Sensor)","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/55강 Isaac Sim Isaac Lab 태스크 구성 (USD Asset·Sensor) 5227bcf74d93838a9e058164f3e41236.md","goals":["로봇 학습에서 시뮬레이션이 \"데이터 공장\"이 되는 이유와 Isaac Sim/Isaac Lab의 역할 분담을 설명할 수 있습니다.","USD 씬 구조(스테이지·프림·에셋 참조)와 로봇·센서를 씬에 올리는 방식을 설명할 수 있습니다.","Isaac Lab 태스크의 구성 요소(씬·관측·행동·보상/성공·리셋)와 병렬 환경의 의미를 설명할 수 있습니다."],"essential":"시뮬레이션은 강력한 만큼 함정도 큽니다. 오늘은 도구의 구조와 한계를 함께 잡습니다.\n\n- 필수 ① 시뮬레이션을 쓰는 이유와, 시뮬에서 잘된 것이 실물에서 안 되는 이유를 설명한다.\n- 필수 ② USD가 씬을 기술하는 방식(계층·참조)의 개념을 이해한다.\n- 필수 ③ Isaac Lab의 태스크 구성 요소(관측·행동·보상·종료·리셋)를 말한다.\n\n여유가 되면(심화): 병렬 환경, GPU 물리, 렌더 파이프라인. 설치·실행이 무겁다면 개념 이해와 제공 환경 실행까지가 오늘의 필수입니다.","headings":["들어가며","1. 왜 시뮬레이션인가 — 그리고 왜 조심해야 하는가","2. USD — 씬을 기술하는 언어","3. Isaac Lab — 태스크라는 구조","미니 퀴즈","실습","정리","용어 사전"],"environment":["환경 안내: Isaac Sim은 RTX GPU가 필요합니다. GPU가 없는 팀은 실습(59~62강)을 제공되는 경량 병렬 시뮬레이터(모듈 ⑦ 2링크 환경의 벡터화 버전)로 동일 개념을 수행합니다 — 도구는 달라도 태스크 구조·랜덤화·gap 분석의 배움은 같습니다."],"deliverables":"","hasPractice":true},{"number":56,"title":"56강. 도메인 랜덤화 (Texture·Lighting·Mass·Friction)","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/56강 도메인 랜덤화 (Texture·Lighting·Mass·Friction) d4a7bcf74d9383b08e268103cdc9622a.md","goals":["도메인 랜덤화의 핵심 논리 — \"현실을 랜덤화의 한 표본으로 만들기\" — 를 설명할 수 있습니다.","시각 랜덤화(텍스처·조명·카메라)와 물리 랜덤화(질량·마찰·지연)의 항목과 설계 방법을 설명할 수 있습니다.","랜덤화 범위의 트레이드오프(너무 좁음/넓음)와 커리큘럼·자동 조정 전략을 설명할 수 있습니다."],"essential":"Sim2Real의 핵심 처방을 배웁니다. 아이디어는 한 문장이지만 설계가 어렵습니다.\n\n- 필수 ① 도메인 랜덤화의 핵심 논리 — 현실을 훈련 분포 안에 넣는다 — 를 그림으로 설명한다.\n- 필수 ② 무엇을 흔들 수 있는지(물리 파라미터·시각 요소) 예를 든다.\n- 필수 ③ 범위가 좁으면 못 덮고 넓으면 못 배운다는 트레이드오프를 설명한다.\n\n여유가 되면(심화): 자동 커리큘럼(ADR), 랜덤화 축의 절제 실험. 60강에서 직접 범위를 바꿔 가며 성능을 측정하면 감각이 잡힙니다.","headings":["들어가며","1. 핵심 논리 — 현실을 분포 안에 가두기","2. 무엇을 흔드는가 — 두 계열의 카탈로그","3. 범위 설계 — 좁으면 못 덮고, 넓으면 못 배운다","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":57,"title":"57강. Sim-to-Real Gap 원인 분석","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/57강 Sim-to-Real Gap 원인 분석 bc97bcf74d9382218a4c0165d3361388.md","goals":["Sim-to-Real Gap을 계열별(시각·물리·시스템)로 분해하고 각 원인의 전형적 증상을 설명할 수 있습니다.","관측 gap과 동역학 gap을 분리해 진단하는 실험 설계를 설명할 수 있습니다.","gap의 크기를 정량화하는 방법(쌍대 시험·궤적 재생 비교)을 설명할 수 있습니다."],"essential":"\"실물에서 안 된다\"를 원인별로 분해하는 진단 기술을 배웁니다.\n\n- 필수 ① Sim2Real 갭을 인지·동역학·환경 계열로 나눴 설명한다.\n- 필수 ② 원인을 분리하는 진단 실험(참값 관측 우회·개루프 재생)의 설계 의도를 설명한다.\n- 필수 ③ 갭을 숫자로 정량화해 리포트로 남긴다.\n\n여유가 되면(심화): 오차 파형에서 원인 추정(마찰·백래시·지연의 서명). \"안 되네요\"가 아니라 \"어느 계열의 갭이 얼마\" 라고 말할 수 있으면 오늘의 목표는 달성입니다.","headings":["들어가며","1. Gap의 해부학 — 세 계열","2. 진단 실험 — 원인을 분리해서 재라","3. 정량화 리포트 — gap의 회계장부","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":58,"title":"58강. 보정 전략(System ID·Fine-tuning)과 평가 지표","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/58강 보정 전략(System ID·Fine-tuning)과 평가 지표 98c7bcf74d938228836e816d343f154c.md","goals":["System Identification의 절차 — 실측으로 시뮬 파라미터를 역추정 — 를 설명하고 설계할 수 있습니다.","실데이터 Fine-tuning의 방법과 주의점(망각·소데이터)을 설명할 수 있습니다.","시뮬 학습의 평가 지표(Success Rate·Reward Curve)와 실패 케이스 분석 방법을 설명하고, sim-to-real 전체 워크플로우를 조립할 수 있습니다."],"essential":"진단(57강) 다음은 처방입니다. 두 방향의 처방을 구분하는 것이 오늘의 핵심입니다.\n\n- 필수 ① System ID = 시뮬을 현실에 맞추기, Fine-tuning = 정책을 현실에 맞추기 라는 두 방향을 구분한다.\n- 필수 ② System ID가 57강 진단 실험의 오차를 목적함수로 승격한 것임을 설명한다.\n- 필수 ③ 보정 전후를 비교할 평가 지표와 절차를 말한다.\n\n여유가 되면(심화): 파라미터 식별 가능성, 소량 실물 데이터로의 미세조정 전략. 62강에서 실제로 수행하니 오늘은 선택 기준을 잡으세요.","headings":["들어가며","1. System ID — 시뮬을 현실에 맞추기","2. Fine-tuning — 정책을 현실에 맞추기","3. 평가 지표 — 학습을 읽는 곡선들","4. 전체 워크플로우 — 나흘의 지도","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":59,"title":"59강. [실습] Isaac 로봇 태스크·센서 환경 구성","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/59강 [실습] Isaac 로봇 태스크·센서 환경 구성 a747bcf74d9382f1805a01331c43e107.md","goals":["Isaac Sim(또는 경량 병렬 시뮬레이터)에서 로봇·물체·센서가 있는 씬을 구성하고 물리를 검증할 수 있습니다.","55강 명세서대로 태스크(관측·행동·판정·리셋)를 구현하고 병렬 환경으로 실행할 수 있습니다.","시뮬 안에서 기준 정책을 학습시켜 \"시뮬 학습 성립\"을 확인하고, 모의 실물 평가 배선까지 갖춥니다."],"essential":"시뮬 환경을 직접 구성합니다.\n\n- 필수 ① 로봇·물체·바닥으로 씬을 구성하고 물리 상식 검사(떨어뜨려 보기 등)를 통과시킨다.\n- 필수 ② 태스크(관측·행동·보상·종료·리셋)를 코드로 구현한다.\n- 필수 ③ 기준 학습을 돌려 환경이 성립함(학습이 되긴 한다)을 증명한다.\n\n여유가 되면(심화): 렌더 관측 추가, 병렬 환경 수 조정. 성능이 낮아도 됩니다 — 환경이 물리적으로 말이 되는지가 오늘의 관문입니다.","headings":["들어가며","1. 씬 구성 — 그리고 물리 상식 검사","2. 태스크 구현 — 명세서의 코드화","3. 센서 — 렌더 관측의 준비 (A트랙 중심)","4. 기준 학습 — \"성립\"의 증명","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["두 트랙으로 진행합니다 — A트랙(Isaac): RTX GPU 팀, Isaac Lab 템플릿 기반. B트랙(경량): 제공되는 NumPy 병렬 2링크 시뮬레이터. 트랙이 달라도 오늘의 체크리스트는 같습니다 — 개념이 도구를 넘는다는 것을 스스로 증명하는 구성이기도 합니다.","해석: A트랙(Isaac: USD 씬·PhysX·렌더 센서·GPU 텐서)과 B트랙(NumPy 벡터화 2링크·저차원 관측)의 구성 대응표입니다. 다른 것은 도구 칸뿐 — 태스크 5조각·스모크 테스트·이중 평가·병렬 인터페이스 행은 완전히 같습니다. 트랙 간 이동이 쉬운 이유(인터페이스 동일)도 표시되어 있습니다.","준비물: A트랙 — Isaac Sim/Lab 설치(사전 안내), 제공 태스크 템플릿. B트랙 — `pip install` 로 끝. 공통 — 55강 태스크 명세서, 53강 평가기.","### A트랙: USD 씬 조립"],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 씬·태스크 | 씬 파일(또는 B트랙 설정)·태스크 코드·태스크 pytest |\n| 검증 기록 | 스모크 테스트 5종 결과, 리셋 분포 그림, 전문가 성공률 |\n| 기준 학습 | 학습 곡선(훈련+모의 실물 상주 평가), 기준 정책 체크포인트 |\n| 처리량 | 환경 수별 스텝/초 측정 (심화 수행 시 병목 분석 포함) |\n\n체크리스트\n\n- [ ]  관측 전 항목이 \"실물에서 구할 수 있음\" 판정을 통과 (55강 규율)\n- [ ]  스모크 5종 통과 — 실패 항목은 수정 기록과 함께\n- [ ]  부분 리셋 동작 (done 환경만 초기화됨을 테스트로)\n- [ ]  훈련/모의 실물의 두 곡선이 함께 기록됨 (격차 수치 명시)\n\n---","hasPractice":true},{"number":60,"title":"60강. [실습] 도메인 랜덤화 학습 환경 구축","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/60강 [실습] 도메인 랜덤화 학습 환경 구축 f297bcf74d9382eb8e83011a48763f0c.md","goals":["랜덤화 설정표(56강)를 태스크 리셋에 구현하고, 분포·재현성(시드)을 검증할 수 있습니다.","DR 유/무·범위별 학습을 수행하고, 모의 실물 평가로 강건화 효과를 계측할 수 있습니다.","커리큘럼(ADR)을 구현하고, 랜덤화 축별 기여도를 절제 실험(ablation)으로 분석할 수 있습니다."],"essential":"56강의 아이디어를 코드와 실험으로 확인합니다.\n\n- 필수 ① 리셋 시점에 파라미터를 뽑아 적용하는 랜덤화 코드를 구현한다.\n- 필수 ② DR 유무를 비교해 강건성이 실제로 올라가는지 측정한다.\n- 필수 ③ 절제 실험으로 어느 랜덤화 축이 기여했는지 분리한다.\n\n여유가 되면(심화): ADR 커리큘럼 구현, 범위 최적화. 범위 설정에 정답은 없습니다 — 측정으로 고른 근거가 결과물입니다.","headings":["들어가며","1. 구현 — 리셋에 끼어드는 랜덤화","2. 주 실험 — DR은 격차를 좁히는가","3. 절제 실험 — 어느 축이 일했나","4. 커리큘럼 — ADR의 구현","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 59강 태스크·기준 정책·이중 평가 배선, 56강 랜덤화 설정표.","- 심화 — 시각 랜덤화의 실전 (A트랙): 재질·조명·카메라의 코드화","A트랙(Isaac)에서 렌더 관측으로 학습하는 팀은 시각 랜덤화까지 확장합니다 — Replicator API로 재질(무작위 텍스처/색)·조명(방향·세기·색온도)·카메라 지터를 에피소드마다 샘플. 이때 계측도 확장됩니다: 모의 실물의 시각 버전은 \"다른 렌더 설정 + 실사 배경 합성\"으로 만들고, 25강 증강·오늘의 시각 DR·61강 실사 평가의 3단 사다리로 격차를 봅니다. 흥미로운 관찰 포인트 — 시각 DR을 극단까지 밀면(만화 텍스처) 정책의 saliency가 색에서 윤곽으로 이동하는 것을 Grad-CAM류로 볼 수 있습니다(56강 \"형태 의존\" 명제의 시각화). 시간이 없으면 이 확장은 관찰 과제로만."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | DomainRandomizer(+지연 버퍼)·ADR·설정 yaml |\n| 검증 | ξ 분포 히스토그램 vs 설정표 대조 (버그 발견 기록 포함 시 가점) |\n| 주 실험 | 3조건×시드3 곡선·최종 비교(CI), \"강건함의 가격표\" 한 줄 |\n| 절제·ADR | 축별 하락 막대(+gap 장부와의 대조), ADR 3단 그래프 |\n| 체크포인트 | `dr_policy.pt` — 61강 배포 대상 |\n\n체크리스트\n\n- [ ]  ξ가 에피소드에 기록되고 시드로 재현됨\n- [ ]  지연이 행동 버퍼로 구현됨 (0/1 버그류 검증 통과)\n- [ ]  모든 비교가 동일 평가(59강 배선)·동일 예산\n- [ ]  절제 결과와 모의 실물의 실제 교란이 대조됨\n\n---","hasPractice":true},{"number":61,"title":"61강. [실습] 학습 정책 실물 배포·성능 검증","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/61강 [실습] 학습 정책 실물 배포·성능 검증 d6a7bcf74d93830cbd9181196641c220.md","goals":["학습 정책을 실행 시스템(실물 서보 팔 또는 실물 대리)에 배포하는 절차 — 내보내기·인터페이스 정합·안전장치 — 를 수행할 수 있습니다.","쌍대 평가(시뮬 vs 실물 동일 프로토콜)로 sim-to-real 성적표를 작성할 수 있습니다.","배포 체크리스트(정규화·단위·좌표계·주기·지연)를 검증하고, 실패의 1차 분류를 수행할 수 있습니다."],"essential":"시뮬에서 배운 정책을 실물에 올리는 날입니다. 안전이 최우선입니다.\n\n- 필수 ① 정책을 실행 시스템에 잇는 배포 배관(관측 수집 → 추론 → 명령 전송)을 구성한다.\n- 필수 ② 시뮬과 실물을 같은 잣대로 평가해 성능 차이를 표로 만든다.\n- 필수 ③ 실패를 관찰해 1차 분류(인지·동역학·환경)한다.\n\n여유가 되면(심화): 안전 장치 설계, 실패 클러스터링. 성능이 나쁬도 됩니다 — 안전하게 실험하고 실패를 기록하는 것이 오늘의 성과입니다.","headings":["들어가며","1. 배포 배관 — 정책을 실행 시스템에 잇기","2. 쌍대 평가 — 같은 잣대로 두 세계를","3. 실패의 1차 분류 — 부검 전 트리아지","4. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 60강 `dr_policy`, 53강 평가기. 하드웨어 트랙 — 조립 팔 + 모듈 ① 8강 micro-ROS 펌웨어(관절 목표 구독으로 확장)."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 배포물 | onnx + 실행 노드 + 안전장치(클램프·failsafe) 코드 |\n| 검증 기록 | 체크리스트 6항목 통과 증빙(비트 정합 시험 포함), 점진 투입 로그 |\n| 쌍대 성적표 | 시뮬/실물 성공 지도·전체 성공률(CI)·궤적 오버레이 3쌍 |\n| 트리아지 | 실패 분류 보드 + 62강 작업 목록 |\n| (하드웨어) | 실측 지연·데드존, 0점 보정 기록 |\n\n체크리스트\n\n- [ ]  비트 정합 시험 통과 (같은 obs → 같은 출력)\n- [ ]  점진 투입 3단계를 거침 (그림자→저출력→전권)\n- [ ]  쌍대 평가가 동일 프로토콜(조건·반복·판정)로 수행됨\n- [ ]  모든 실패가 기록·1차 분류됨\n\n---","hasPractice":true},{"number":62,"title":"62강. [실습] 실패 케이스 분석·보정 전략 적용","module":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션/62강 [실습] 실패 케이스 분석·보정 전략 적용 96d7bcf74d938353bf5781381e707194.md","goals":["실패 클러스터링과 재생 부검으로 61강 트리아지를 정밀 진단으로 발전시킬 수 있습니다.","System ID(여기 실험→역추정→검증)와 시뮬 갱신→재학습→재배포의 보정 사이클을 수행할 수 있습니다.","실물 Fine-tuning(HG-DAgger)을 적용하고, 보정 전후의 최종 성적표로 모듈 ⑧을 마감할 수 있습니다."],"essential":"모듈 ⑧의 결승선 — 진단을 처방으로 바꿉니다.\n\n- 필수 ① 실패 클러스터에서 원인 가설을 세우고 진단 실험으로 확인한다.\n- 필수 ② System ID로 시뮬 파라미터를 보정하고 갭이 줄었음을 수치로 보인다.\n- 필수 ③ 남은 실패에 Fine-tuning을 적용하고 보정 전후를 비교한다.\n\n여유가 되면(심화): 실물 HG-DAgger, 보정 반복. 완전한 해결이 아니어도 됩니다 — 원인–처방–결과의 연결이 문서화되면 통과입니다.","headings":["들어가며","1. 정밀 진단 — 클러스터에서 원인으로","2. System ID — 실물이 시뮬을 가르친다","3. Fine-tuning — 남은 실패에 실물 HG-DAgger","4. 모듈 마감 — 최종 리포트와 자산","5. 제출물 — 모듈 ⑧ 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 61강 전체 산출물(성적표·트리아지·실패 기록·실측 데이터), 58강 여기 실험 설계서."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 진단 | 실패 클러스터 지도 + 대표 부검 카드 3장 |\n| ID | 여기 실험 로그·추정 표(교차 검증 포함)·재생 전후·갱신된 DR 범위 |\n| 사이클 | 재학습·재배포 쌍대 평가, HG-FT 기록(개입률 곡선) |\n| 최종 리포트 | 성적 전개 표(비용 병기)·알려진 한계·멈춤 판단 |\n| 자산 | 이관 목록 정리 (모듈 ⑨·⑩용) |\n\n체크리스트\n\n- [ ]  각 클러스터에 부검 카드와 처방 경로가 있음\n- [ ]  ID가 검증 궤적(추정 미사용)으로 확인됨, 하드웨어 실측과 교차 대조\n- [ ]  성적 전개에 비용이 병기됨\n- [ ]  멈춤 기준이 명시되고 잔여 실패가 \"알려진 한계\"로 문서화됨\n\n---","hasPractice":true},{"number":63,"title":"63강. ONNXRuntime 추론 최적화 (Graph Optimization·Operator Fusion)","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/63강 ONNXRuntime 추론 최적화 (Graph Optimization·Operato 1157bcf74d9383c892e8011c7b16b5ec.md","goals":["학습 프레임워크와 추론 런타임을 분리하는 이유와 ONNX의 역할(교환 형식·연산 그래프)을 설명할 수 있습니다.","그래프 최적화의 대표 기법 — 상수 접기·연산자 융합·레이아웃 최적화 — 의 원리를 설명할 수 있습니다.","ONNXRuntime의 실행 공급자(EP) 구조와 추론 성능의 기본 측정 규율을 설명할 수 있습니다."],"essential":"학습한 모델을 로봇 위에서 돌리는 여정의 첫 단계입니다.\n\n- 필수 ① ONNX가 프레임워크 독립 표준 도면이며 왜 필요한지 설명한다.\n- 필수 ② 그래프 최적화(연산 융합·상수 접기 등)가 정확도를 바꾸지 않고 속도를 올리는 이유를 안다.\n- 필수 ③ 변환 후 원본과 출력이 일치하는지 검증하는 절차를 수행한다.\n\n여유가 되면(심화): 실행 공급자(EP) 선택, 동적 축 처리, 연산자 지원 문제 해결. 변환이 실패하면 대부분 지원되지 않는 연산자가 원인입니다.","headings":["들어가며","1. ONNX — 모델의 \"표준 도면\"","2. 그래프 최적화 — 공짜 점심 3형제","3. ONNXRuntime — 실행 공급자(EP)라는 설계","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":64,"title":"64강. TensorRT 변환과 FP16/INT8 양자화","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/64강 TensorRT 변환과 FP16 INT8 양자화 bc77bcf74d9382d6af86813a93406e6b.md","goals":["TensorRT의 동작 방식 — 대상 GPU 맞춤 엔진 빌드(커널 자동 튜닝) — 과 워크플로우를 설명할 수 있습니다.","수치 정밀도(FP32/FP16/INT8)와 양자화의 원리, 캘리브레이션의 역할을 설명할 수 있습니다.","정밀도별 속도·정확도 트레이드오프를 평가하는 방법과 로봇 과제에서의 판단 기준을 설명할 수 있습니다."],"essential":"속도를 위해 정밀도를 거래하는 기술입니다. 거래의 조건을 아는 것이 핵심입니다.\n\n- 필수 ① TensorRT가 하드웨어에 맞춰 엔진을 굽는다는 개념과, 엔진이 기기·버전에 종속됨을 안다.\n- 필수 ② FP32/FP16/INT8의 속도–정확도 트레이드오프를 설명한다.\n- 필수 ③ INT8에 캘리브레이션 데이터가 필요한 이유를 설명한다.\n\n여유가 되면(심화): 혼합 정밀도 지정, QAT, 캘리브레이션 방식 비교. 정확도 검증 없이 양자화를 적용하지 않는다는 원칙은 심화가 아니라 필수입니다.","headings":["들어가며","1. TensorRT — 엔진을 \"굽는다\"","2. 수치 정밀도 — 비트의 경제학","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":65,"title":"65강. 로봇 탑재용 모델 배포 구조 (Jetson Orin/Thor)","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/65강 로봇 탑재용 모델 배포 구조 (Jetson Orin Thor) b5f7bcf74d938323b0ee012832bd1d0c.md","goals":["에지 AI 컴퓨터(Jetson 계열)의 구조와 전력·열이라는 새 제약을 설명할 수 있습니다.","로봇 소프트웨어 스택에서 추론 노드의 자리와 배포 구조(컨테이너·모델 관리·감시)를 설계할 수 있습니다.","전력 모드·열 스로틀링이 성능에 미치는 영향과 지속 성능 검증의 필요성을 설명할 수 있습니다."],"essential":"에지 하드웨어에는 전력과 열이라는 새로운 물리 제약이 있습니다.\n\n- 필수 ① Jetson 같은 에지 모듈의 구성과, 성능이 전력 모드에 따라 달라짐을 안다.\n- 필수 ② 열 스로틀링 때문에 피크 성능과 지속 성능이 다르다는 것을 설명한다.\n- 필수 ③ 모델 배포에 가중치 외에 전처리·후처리·버전 정보가 함께 가야 함을 설명한다.\n\n여유가 되면(심화): 방열 설계, 전력 예산 배분, 컨테이너 배포. 벤치마크는 열 평형 후에 재라는 원칙을 기억하세요.","headings":["들어가며","1. Jetson의 해부 — 한 모듈에 담긴 로봇의 뇌","2. 전력과 열 — 에지의 새 물리학","3. 배포 구조 — 모델은 혼자 가지 않는다","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":66,"title":"66강. 실시간 배포 이슈(Jitter·Deadline Miss)와 지연 지표(P50/P99)","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/66강 실시간 배포 이슈(Jitter·Deadline Miss)와 지연 지표(P50 P99 bde7bcf74d93821fa73d815e4c1b6e27.md","goals":["추론이 낀 제어 루프에서 실시간성(마감·지터·미스)의 의미를 재정의하고 지연 예산을 세울 수 있습니다.","지연 분포의 꼬리(P99)가 왜 생기고 왜 중요한지, 그 원인들(GC·스케줄링·전력·경쟁)을 나열할 수 있습니다.","대응 수단 — RT Linux·우선순위 스케줄링·CPU 격리·미스 정책 — 의 원리와 한계를 설명할 수 있습니다."],"essential":"로봇의 실시간성은 평균이 아니라 꼬리로 결정됩니다.\n\n- 필수 ① 추론이 포함된 루프의 지연 예산표를 구간별로 세운다.\n- 필수 ② P99(꼬리) 기준으로 마감을 설계해야 하는 이유를 설명한다.\n- 필수 ③ 마감을 놓쳤을 때의 정책(늦은 결과를 버릴지 쓸지)을 정한다.\n\n여유가 되면(심화): 꼬리의 원인(GC·스케줄링·메모리·열) 추적, 커널 수준 처방. Lv.1 2강의 실시간 등급(Hard/Firm/Soft)을 여기서 실제 스펙으로 쥋니다.","headings":["들어가며","1. 추론이 낀 루프의 지연 예산","2. 꼬리의 병인학 — P99는 어디서 오는가","3. 처방 — 커널에서 정책까지","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":67,"title":"67강. [실습] ONNX→TensorRT 변환·FP16/INT8 양자화","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/67강 [실습] ONNX→TensorRT 변환·FP16 INT8 양자화 68b7bcf74d9382ea900281049944fd94.md","goals":["세 모델(검출·BC 정책·Diffusion)을 ONNX로 내보내고 정합 검증을 통과시킬 수 있습니다.","TensorRT 엔진을 FP32/FP16/INT8로 빌드하고(INT8은 캘리브레이션 포함), 각각의 정확도를 과제 지표로 판정할 수 있습니다.","정밀도 선택 결과를 \"동작점 결정서\"로 문서화할 수 있습니다."],"essential":"63·64강을 하나의 컨베이어로 잇습니다.\n\n- 필수 ① 모델을 ONNX로 내보내고 원본과 출력이 일치함을 확인한다.\n- 필수 ② FP16·INT8 엔진을 빌드하고 정확도와 속도를 함께 측정한다.\n- 필수 ③ 측정 결과로 동작점 결정서(어느 정밀도를 왜 채택했는지)를 작성한다.\n\n여유가 되면(심화): 혼합 정밀도, 캘리브레이션 데이터 구성 실험. 정확도가 크게 떨어지면 캘리브레이션 데이터의 대표성을 먼저 의심하세요.","headings":["들어가며","1. 컨베이어 1구간 — 내보내기와 정합","2. 컨베이어 2구간 — 엔진 빌드","3. 컨베이어 3구간 — 과제 지표 판정","4. 산출물 — 동작점 결정서","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 세 모델의 체크포인트, 53강 평가기·25강 mAP 도구, 64강 허용선 문서. 캘리브레이션용 대표 데이터(각 모델의 실사용 분포에서 300~500 샘플)."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 엔진 | 3모델 × 채택 정밀도 (+롤백 엔진), 빌드 스크립트·캘리브레이션 캐시 |\n| 검증 | 정합 검증 로그(모델별), 과제 지표 판정표(허용선 대비) |\n| 결정서 | 모델별 동작점 결정서 3장 |\n| 부검 | INT8 실패 모델의 조건별 분석 + 부분 양자화 시도 결과 |\n\n체크리스트\n\n- [ ]  정합 검증이 후처리(NMS·디노이징 루프)까지 포함\n- [ ]  캘리브레이션 데이터가 배포 분포 대표임을 문서로 근거\n- [ ]  모든 지연 수치에 조건(전력 모드·shape·워밍업 제외) 명시\n- [ ]  결정서에 롤백 계획 존재\n\n---","hasPractice":true},{"number":68,"title":"68강. [실습] 추론 지연(P50/P99)·메모리/전력 프로파일링","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/68강 [실습] 추론 지연(P50 P99)·메모리 전력 프로파일링 2367bcf74d93830aad6501fe5e36838c.md","goals":["지연을 구간별로 분해 계측하고 P50/P95/P99 분포로 보고하는 프로파일링 도구를 만들 수 있습니다.","꼬리 스파이크의 원인을 서명 기반으로 추적하고(66강 병인학의 실습), 처방의 효과를 전후 비교할 수 있습니다.","메모리·전력을 계측해 \"성능 시트\"를 작성하고, 열 소크 테스트로 지속 성능을 검증할 수 있습니다."],"essential":"66강의 예산표를 실측으로 채웁니다.\n\n- 필수 ① 구간별 타임스탬프로 지연을 분해하고 P50/P99 분포를 그린다.\n- 필수 ② 메모리·전력을 함께 측정해 자원 한계를 확인한다.\n- 필수 ③ 30분 소크 테스트로 열 스로틀링 후의 지속 성능을 기록한다.\n\n여유가 되면(심화): 꼬리의 원인 추적(서명 분석), 커널 수준 처방. 측정 조건(전력 모드·온도·동시 부하)을 반드시 함께 기록하세요.","headings":["들어가며","1. 지연 프로파일러 — 구간 분해와 분포","2. 꼬리 사냥 — 서명으로 잡는다","3. 메모리와 전력 — 나머지 두 활력징후","4. 열 소크 테스트 — 지속 성능의 증명","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 67강 엔진들, (가능하면) Jetson + `tegrastats`. 미보유 시 자기 PC GPU + 제공 Jetson 로그로 동일 분석."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 도구 | [profiler.py](http://profiler.py)(구간·분포·시계열), 소크 러너 |\n| 수사 기록 | 꼬리 패턴 3종 식별 + 처방 전후 P99 계단 (원인-처방 대응 명시) |\n| 계측 | 메모리(상주·피크·누수 검사)·전력(J/추론) 표, 30분 소크 그래프 |\n| 성능 시트 | 3모델 × 채택 정밀도 (조건 완비) |\n\n체크리스트\n\n- [ ]  측정이 지연을 만들지 않음 (고정 배열, GPU는 이벤트/동기화)\n- [ ]  꼬리 분석이 히스토그램이 아니라 시계열 패턴에서 출발\n- [ ]  성능 시트 수치가 열 평형 후 기준\n- [ ]  동시 실행(3모델) 시나리오의 간섭이 계측됨 (69강 입력)\n\n---","hasPractice":true},{"number":69,"title":"69강. [실습] ROS2 제어 루프 통합·안정성 검증","module":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포/69강 [실습] ROS2 제어 루프 통합·안정성 검증 d2a7bcf74d9382c58151018da67a117e.md","goals":["최적화된 엔진들을 ROS2 추론 노드로 통합하고, 미스 정책(66강)을 구현할 수 있습니다.","다중 추론의 자원 경쟁을 관리하고, 시스템 수준 지연·안정성을 검증(소크·장애 주입)할 수 있습니다.","배포 패키지(컨테이너·감시·성능 시트)를 완성해 모듈 ⑨를 마감합니다."],"essential":"모듈 ⑨의 결승선 — 최적화한 모델을 실제 제어 루프에 안전하게 통합합니다.\n\n- 필수 ① 추론 노드를 완성해 마감 관리·미스 정책을 코드에 넣는다.\n- 필수 ② 다중 추론이 자원을 다훈 때의 조정 전략을 적용한다.\n- 필수 ③ 소크 테스트와 장애 주입으로 안정성을 검증하고 리포트를 만든다.\n\n여유가 되면(심화): 우선순위·코어 고정, 자동 회복 전략. 성능보다 예측 가능성이 우선입니다 — 가끔 빠른 것보다 항상 일정한 것이 낫습니다.","headings":["들어가며","1. 추론 노드의 완성형 — 그동안의 모든 규율을 한 몸에","2. 다중 추론의 자원 경쟁 — 조정의 기술","3. 안정성 검증 — 소크와 장애 주입","4. 모듈 마감 — 배포 패키지","5. 제출물 — 모듈 ⑨ 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 67강 엔진·결정서, 68강 성능 시트·프로파일러, 21·29강 노드 코드, 66강 미스 정책 명세."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 노드 | trt_inference_node(미스 정책·diag 포함) ×3, 조정된 launch |\n| 검증 | 1시간 시스템 소크 리포트, 장애 주입 4종 보드(각본 포함) |\n| 조정 | 자원 배정표(주기 역산 근거), 조정 전후 P99 |\n| 패키지 | deploy/ 컨테이너 + RUNBOOK |\n\n체크리스트\n\n- [ ]  미스 정책이 명세(66강)대로 3단 동작 (시험으로 증빙)\n- [ ]  동시 실행에서 정책 P99가 예산 내 (조정 근거 문서화)\n- [ ]  소크에서 메모리 증가 0, 과제 성능 유지\n- [ ]  타 팀원이 RUNBOOK만으로 기동·대응 가능 (교차 시험)\n\n---","hasPractice":true}],"counts":{"modules":8,"lessons":64,"images":297,"hours":268},"missingLectures":[32,33,34,35,36],"notes":["교안 원문은 수정하지 않았습니다.","목표와 필수 기준은 교안에서 추출한 내용입니다. 추가 학습 안내는 보조 설명으로 구분합니다.","이 폴더에 없는 실행 코드·HTML·데이터셋은 제공된 것으로 간주하지 않습니다."]},"flashcards":{"version":1,"title":"매일 로봇공학 플래시카드","created":"2026-10-16","scope":"기존 8개 모듈 기초 + Cartographer·Nav2·AMCL 핵심","cards":[{"id":"amcl-state","topic":"AMCL","type":"choice","q":"저장된 2D 지도에서 AMCL이 추정하는 것은?","options":["지도 전체의 구조","로봇 위치와 방향","목표 경로의 속도","바퀴 구동의 전류"],"correct":1,"answer":"로봇 위치와 방향","explanation":"상태는 (x,y,θ)입니다. 지도 작성과 위치 추정을 구분합니다.","sources":[{"kind":"nav2","pages":[13,14]}]},{"id":"base-frames-basics","topic":"3D 인지","type":"recall","q":"같은 물체의 좌표라도 좌표계 이름이 필요한 이유는?","answer":"좌표값은 특정 원점·축 기준의 표현이므로 사용할 좌표계로 올바르게 변환해야 합니다.","rubric":["원점·축이라는 기준을 설명했다","서로 다른 좌표계는 변환이 필요하다고 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[23]}]},{"id":"calc-map-odom","topic":"TF·단위","type":"number","q":"회전 없는 1D 예: odom 기준 몸체 2.3 m, map 기준 몸체 2.0 m. map→odom 보정은?","value":-0.3,"unit":"m","tolerance":0.001,"answer":"-0.3 m","explanation":"2.0−2.3=−0.3 m. 실제 TF는 회전도 합성합니다.","sources":[{"kind":"nav2","pages":[10]}]},{"id":"base-slam-coupling","topic":"SLAM 기초","type":"recall","q":"SLAM의 지도·위치 상호 의존성을 설명하세요.","answer":"위치를 알아야 관측을 지도에 놓고, 지도를 알아야 관측으로 위치를 추정할 수 있어 둘을 함께 추정합니다.","rubric":["지도 작성에 위치가 필요함을 설명했다","위치 추정에 지도가 필요함을 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[37]}]},{"id":"amcl-predict","topic":"AMCL","type":"choice","q":"입자 필터의 예측 단계에 직접 대응하는 것은?","options":["이동량과 잡음 반영","관측 일치도로 평가","새 입자 집합 추출","목표 도달 여부 판정"],"correct":0,"answer":"이동량과 잡음 반영","explanation":"예측은 odom 이동과 운동 잡음을 반영해 가설을 움직이는 단계입니다.","sources":[{"kind":"nav2","pages":[15,20,21]}]},{"id":"calc-control-period","topic":"TF·단위","type":"number","q":"Controller 20 Hz의 한 주기는 몇 ms인가요?","value":50,"unit":"ms","tolerance":0.01,"answer":"50 ms","explanation":"1000/20=50 ms입니다.","sources":[{"kind":"nav2","pages":[52,77]}]},{"id":"base-feedback","topic":"임베디드 제어","type":"recall","q":"피드백 제어가 외란에 대응하는 방법을 설명하세요.","answer":"출력을 측정해 목표와의 오차를 구하고, 그 오차로 입력을 조절해 외란과 모델 오차를 보완합니다.","rubric":["측정·목표 오차를 언급했다","오차로 제어 입력을 조절한다고 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[1]}]},{"id":"amcl-update","topic":"AMCL","type":"choice","q":"AMCL 관측 갱신 단계가 하는 일은?","options":["지도 자체를 새로 생성","관측 일치도로 가중 갱신","속도 제한으로 목표 추종","입자 이름을 무작위 생성"],"correct":1,"answer":"관측 일치도로 가중 갱신","explanation":"각 가설에서 지도와 실제 레이저 관측이 얼마나 맞는지 비교합니다.","sources":[{"kind":"nav2","pages":[15,22]}]},{"id":"amcl-resample","topic":"AMCL","type":"choice","q":"재표본화의 의미에 가장 가까운 것은?","options":["새 지도를 직접 측정","참 위치를 정답 확정","가중치 따라 다시 추출","바퀴 잡음을 완전 제거"],"correct":2,"answer":"가중치 따라 다시 추출","explanation":"적합한 가설이 다음 집합에 더 많이 남도록 합니다. 정답 보장은 아닙니다.","sources":[{"kind":"nav2","pages":[15,16]}]},{"id":"amcl-adaptive","topic":"AMCL","type":"choice","q":"AMCL의 Adaptive가 주로 조절하는 것은?","options":["레이저 장착의 높이","로봇 바퀴의 개수","저장 지도의 벽 위치","분포 표현의 입자 수"],"correct":3,"answer":"분포 표현의 입자 수","explanation":"적응 입자 수는 불확실한 분포를 표현하는 계산량과 연결됩니다.","sources":[{"kind":"nav2","pages":[13,19]}]},{"id":"amcl-map","topic":"AMCL","type":"choice","q":"AMCL의 기본 전제에 맞는 지도는?","options":["미리 준비된 지도","매번 생성할 지도","목표 속도의 지도","관절 토크의 지도"],"correct":0,"answer":"미리 준비된 지도","explanation":"AMCL은 알려진 지도에서 위치를 찾습니다. SLAM과 역할이 다릅니다.","sources":[{"kind":"nav2","pages":[6,14]}]},{"id":"amcl-odom-tf","topic":"AMCL","type":"choice","q":"AMCL이 odometry 이동량을 TF로 해석할 때 확인해야 하는 핵심 변환은?","options":["odom 메시지 이름","base 관절의 개수","odom→base의 TF","목표 지점의 개수"],"correct":2,"answer":"odom→base의 TF","explanation":"Nav2 AMCL은 TF로 odometry 이동을 얻습니다. 토픽 이름만 있다고 충분하지 않습니다.","sources":[{"kind":"nav2","pages":[8,10,17,18]},{"kind":"url","url":"https://github.com/ros-navigation/navigation2/blob/main/nav2_amcl/src/amcl_node.cpp","label":"Nav2 AMCL 구현 · 설치 버전과 대조"}]},{"id":"amcl-converged","topic":"AMCL","type":"choice","q":"입자 구름이 한곳에 모였을 때 옳은 해석은?","options":["실제 위치가 확정됨","모든 센서가 보정됨","지도 오류가 제거됨","가설 분포가 집중됨"],"correct":3,"answer":"가설 분포가 집중됨","explanation":"틀린 지도·TF·반복 구조로 오수렴할 수도 있습니다.","sources":[{"kind":"nav2","pages":[16,25]}]},{"id":"tf-owner","topic":"TF·단위","type":"choice","q":"저장 지도 AMCL 주행에서 map→odom 발행 책임은?","options":["AMCL 한 곳에 배정","SLAM과 항상 중복","모든 센서에 배정","모든 제어기에 중복"],"correct":0,"answer":"AMCL 한 곳에 배정","explanation":"교안 구성에서는 SLAM의 같은 TF 발행을 중지하고 AMCL이 담당합니다.","sources":[{"kind":"nav2","pages":[10,11]}]},{"id":"carto-layers","topic":"Cartographer","type":"choice","q":"Cartographer의 재방문 제약·전역 최적화 설정 그룹은?","options":["ROS launch 설정","POSE_GRAPH 설정","센서 드라이버 설정","모터 드라이버 설정"],"correct":1,"answer":"POSE_GRAPH 설정","explanation":"로컬 정합과 submap은 TRAJECTORY_BUILDER, 전역 제약은 POSE_GRAPH로 구분합니다.","sources":[{"kind":"cartographer","pages":[3,23,25]}]},{"id":"carto-voxel","topic":"Cartographer","type":"choice","q":"voxel_filter_size를 키울 때 함께 확인할 것은?","options":["점 수와 작은 구조 보존","구동 전압과 바퀴 방향","목표 좌표와 계정 이름","관절 토크와 전원 주파수"],"correct":0,"answer":"점 수와 작은 구조 보존","explanation":"점 수와 계산량이 줄 수 있지만 유효한 세부 구조도 사라질 수 있습니다.","sources":[{"kind":"cartographer","pages":[13,14]}]},{"id":"carto-score","topic":"Cartographer","type":"choice","q":"min_score=0.65의 올바른 의미는?","options":["정답 확률이 65퍼센트","센서 오차가 0.65미터","정합 점수의 채택 하한","로봇 속도가 0.65미터"],"correct":2,"answer":"정합 점수의 채택 하한","explanation":"정합 점수와 실제 정답 확률은 다릅니다. 채택 후 제약 가중치와도 구분합니다.","sources":[{"kind":"cartographer","pages":[24]}]},{"id":"carto-resolution","topic":"Cartographer","type":"choice","q":"출력 지도만 더 촘촘하게 바꿨을 때 맞는 설명은?","options":["내부 정보가 모두 복구됨","센서 TF가 자동 보정됨","로컬 왜곡이 자동 제거됨","잃은 내부 정보는 미복구"],"correct":3,"answer":"잃은 내부 정보는 미복구","explanation":"출력 해상도와 내부 submap 해상도를 구분합니다.","sources":[{"kind":"cartographer","pages":[21]}]},{"id":"carto-pbstream","topic":"Cartographer","type":"choice","q":"Cartographer pbstream 파일이 담는 것은?","options":["SLAM 상태의 정보","모터 전류의 정보","화면 픽셀의 정보","명령 속도의 정보"],"correct":0,"answer":"SLAM 상태의 정보","explanation":"PGM/YAML 점유 지도와 pbstream SLAM 상태는 서로 다른 산출물입니다.","sources":[{"kind":"cartographer","pages":[29,30,120]}]},{"id":"costmap-role","topic":"Nav2","type":"choice","q":"Costmap의 역할에 가까운 것은?","options":["카메라 화소를 압축","주행 위험을 비용화","학습 가중치를 압축","구동 전류를 수치화"],"correct":1,"answer":"주행 위험을 비용화","explanation":"점유 상태와 주행 비용을 구분합니다.","sources":[{"kind":"nav2","pages":[27,67]}]},{"id":"planner-output","topic":"Nav2","type":"choice","q":"Planner의 대표 출력은?","options":["로봇 모터의 전류","로봇 속도의 명령","지나갈 공간의 경로","센서 관측의 잡음"],"correct":2,"answer":"지나갈 공간의 경로","explanation":"Path에는 속도와 시간이 반드시 들어가지는 않습니다.","sources":[{"kind":"nav2","pages":[7,8,9]}]},{"id":"controller-output","topic":"Nav2","type":"choice","q":"Controller가 현재 상태·경로·주변 비용으로 만드는 것은?","options":["새 지도 점유 상태","센서 장착 보정값","로봇 위치의 가설","다음 이동 속도 명령"],"correct":3,"answer":"다음 이동 속도 명령","explanation":"실제 구동 전달과 목표 도달 확인까지 완료됐다는 뜻은 아닙니다.","sources":[{"kind":"nav2","pages":[42,76,79]}]},{"id":"waffle-motion","topic":"Nav2","type":"choice","q":"교안의 Waffle 차동 구동에서 불가능한 동작은?","options":["몸체 방향 유지 횡이동","좌우 바퀴 차이로 회전","양쪽 바퀴 구동 전진","전진 후 제자리 회전"],"correct":0,"answer":"몸체 방향 유지 횡이동","explanation":"Waffle은 vy=0이며 전진·회전을 사용합니다. 다른 로봇 모델에는 그대로 일반화하지 않습니다.","sources":[{"kind":"nav2","pages":[5,42,46]}]},{"id":"dijkstra-priority","topic":"Nav2","type":"choice","q":"Dijkstra가 우선하는 비용은?","options":["목표 예상 비용 h","출발 누적 비용 g","두 비용의 곱 g×h","두 비용의 차 g−h"],"correct":1,"answer":"출발 누적 비용 g","explanation":"음수가 아닌 간선 비용 조건에서 최소 비용 경로를 찾습니다.","sources":[{"kind":"nav2","pages":[28,30]}]},{"id":"astar-priority","topic":"Nav2","type":"choice","q":"A*의 기본 우선순위 표현은?","options":["f = g − h","f = g × h","f = g + h","f = g ÷ h"],"correct":2,"answer":"f = g + h","explanation":"g는 누적 비용, h는 목표까지의 예상 비용입니다. 최적성은 휴리스틱과 구현 조건에 달립니다.","sources":[{"kind":"nav2","pages":[29,30]}]},{"id":"footprint","topic":"Nav2","type":"choice","q":"실제 로봇 외곽과 부착물을 반영해야 하는 설정은?","options":["목표 위치의 오차","지도 표시의 주기","센서 샘플의 개수","Footprint·몸체 반경"],"correct":3,"answer":"Footprint·몸체 반경","explanation":"통로를 통과시키려고 실제 몸체를 작게 설정하지 않습니다. Inflation 범위와 구분합니다.","sources":[{"kind":"nav2","pages":[68,69]}]},{"id":"inflation-decay","topic":"Nav2","type":"choice","q":"같은 Inflation 반경에서 cost_scaling_factor를 키우면?","options":["주변 비용이 빨리 감소","주변 비용이 항상 증가","실제 몸체가 바로 축소","센서 노이즈가 모두 제거"],"correct":0,"answer":"주변 비용이 빨리 감소","explanation":"감쇠가 빨라지는 것과 비용 범위가 넓어지는 것은 다릅니다.","sources":[{"kind":"nav2","pages":[69]}]},{"id":"goal-tolerances","topic":"Nav2","type":"choice","q":"NavFn tolerance와 xy_goal_tolerance의 관계는?","options":["같은 도착 판정 설정","계획 범위·도착 판정 구분","하나를 바꾸면 자동 동일","둘 다 회전 속도의 한계"],"correct":1,"answer":"계획 범위·도착 판정 구분","explanation":"경로 끝점을 찾는 범위와 실제 주행 도착 허용 오차는 다릅니다.","sources":[{"kind":"nav2","pages":[32,75]}]},{"id":"mppi-gpu","topic":"Nav2","type":"choice","q":"MPPI와 계산 환경에 대해 맞는 설명은?","options":["NVIDIA GPU가 반드시 필요","샘플 수는 처리 시간과 무관","제어 주기 내 계산 여부 확인","최신이면 언제나 가장 빠름"],"correct":2,"answer":"제어 주기 내 계산 여부 확인","explanation":"MPPI는 GPU 필수 알고리즘이 아닙니다. 후보·단계·Critic에 따른 시간 예산을 측정합니다.","sources":[{"kind":"nav2","pages":[51,52,53,77]}]},{"id":"calc-kalman-gain","topic":"TF·단위","type":"number","q":"H=1인 1D 보정 예에서 P=1, R=4일 때 K=P/(P+R)는?","value":0.2,"unit":"무차원","tolerance":0.001,"answer":"0.2 무차원","explanation":"1/(1+4)=0.2. 독립 오차·동일 1D 위치 관측 예입니다.","sources":[{"kind":"lesson","pages":[38]}]},{"id":"calc-kalman-pose","topic":"TF·단위","type":"number","q":"1D 예측 10 m, 측정 11 m, K=0.2일 때 보정 위치는?","value":10.2,"unit":"m","tolerance":0.001,"answer":"10.2 m","explanation":"10+0.2×(11−10)=10.2 m입니다.","sources":[{"kind":"lesson","pages":[38]}]},{"id":"calc-deg-rad","topic":"TF·단위","type":"number","q":"0.1°를 rad로 바꾸세요. 소수점 여섯 자리 정도로 입력하세요.","value":0.001745329,"unit":"rad","tolerance":0.000001,"answer":"0.00174533 rad","explanation":"0.1×π/180≈0.001745 rad. 0.1 rad와 다릅니다.","sources":[{"kind":"cartographer","pages":[18]}]},{"id":"calc-rad-deg","topic":"TF·단위","type":"number","q":"0.2 rad는 약 몇 도인가요? 소수점 둘째 자리까지 입력하세요.","value":11.459156,"unit":"°","tolerance":0.005,"answer":"11.46 °","explanation":"0.2×180/π≈11.46°입니다.","sources":[{"kind":"nav2","pages":[23]}]},{"id":"calc-publish-hz","topic":"TF·단위","type":"number","q":"발행 간격 설정이 0.005 s일 때 그 역수는?","value":200,"unit":"Hz","tolerance":0.01,"answer":"200 Hz","explanation":"1/0.005=200 Hz. 실제 센서·정합 처리율을 측정한 값은 아닙니다.","sources":[{"kind":"cartographer","pages":[10]}]},{"id":"calc-mppi-horizon","topic":"Nav2","type":"number","q":"MPPI time_steps=56, model_dt=0.05 s의 시간 지평은?","value":2.8,"unit":"s","tolerance":0.001,"answer":"2.8 s","explanation":"56×0.05=2.8 s. 실제 계산 시간과 다릅니다.","sources":[{"kind":"nav2","pages":[52]}]},{"id":"calc-straight-distance","topic":"Nav2","type":"number","q":"0.1 m/s로 2.8 s 동안 일정하게 직진한 거리만 계산하세요.","value":0.28,"unit":"m","tolerance":0.001,"answer":"0.28 m","explanation":"0.1×2.8=0.28 m. 실제 MPPI 회전·가감속 궤적 예측은 아닙니다.","sources":[{"kind":"nav2","pages":[52,55]}]},{"id":"calc-grid-cells","topic":"Cartographer","type":"number","q":"같은 면적에서 셀 한 변을 0.05 m→0.025 m로 줄이면 셀 수는 몇 배인가요?","value":4,"unit":"배","tolerance":0.001,"answer":"4 배","explanation":"한 변이 절반이면 셀 면적이 1/4이므로 셀 수는 약 4배. 정확도가 4배라는 뜻은 아닙니다.","sources":[{"kind":"cartographer","pages":[21]}]},{"id":"base-pid","topic":"임베디드 제어","type":"recall","q":"PID의 P·I·D가 각각 사용하는 오차 정보를 말하세요.","answer":"P는 현재 오차, I는 오차 누적, D는 오차 변화율을 사용합니다.","rubric":["현재·누적·변화율을 구분했다","세 항을 P·I·D에 올바르게 연결했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[3]}]},{"id":"base-fk","topic":"기구학","type":"recall","q":"순기구학에서 관절 값으로 무엇을 구하나요?","answer":"관절 값과 링크 변환을 연결해 베이스 기준 엔드이펙터 위치·자세를 구합니다.","rubric":["관절 값이 입력이라고 설명했다","베이스 기준 끝단 위치·자세가 출력이라고 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[9]}]},{"id":"base-ik","topic":"기구학","type":"recall","q":"같은 끝단 목표에 여러 역기구학 해가 있을 수 있다는 뜻은?","answer":"같은 끝단 위치·자세를 서로 다른 관절 구성으로 만들 수 있다는 뜻입니다.","rubric":["끝단 목표와 관절 구성을 구분했다","elbow-up/down처럼 서로 다른 구성을 예로 들었다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[10]}]},{"id":"base-pixel","topic":"비전","type":"recall","q":"이미지의 픽셀 (x,y)를 NumPy 배열에서 어떤 순서로 읽나요?","answer":"행이 y, 열이 x이므로 img[y,x]로 읽습니다.","rubric":["행=y, 열=x를 구분했다","img[y,x] 순서를 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[16]}]},{"id":"base-projection","topic":"비전","type":"recall","q":"카메라 투영에서 외부·내부 파라미터의 역할을 구분하세요.","answer":"외부 변환은 월드 점을 카메라 좌표로 옮기고, 내부 파라미터 K는 카메라의 정규화된 투영을 픽셀로 연결합니다.","rubric":["월드→카메라 변환을 설명했다","초점거리·주점과 픽셀 투영을 연결했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[17]}]},{"id":"base-depth","topic":"3D 인지","type":"recall","q":"깊이값을 로봇이 쓸 3D 위치로 바꾸려면 무엇이 더 필요한가요?","answer":"픽셀 위치·카메라 모델·깊이의 단위와 필요한 좌표 변환을 함께 확인합니다.","rubric":["깊이값과 3D 위치를 구분했다","카메라 모델 또는 좌표 변환을 연결했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[27]}]},{"id":"base-ekf-pf","topic":"SLAM 기초","type":"recall","q":"AMCL의 입자 표현과 EKF의 평균·공분산 표현을 구분하세요.","answer":"AMCL은 여러 위치 가설을 입자로 표현하고 EKF는 현재 추정점 주변의 단봉 가우시안으로 표현합니다.","rubric":["여러 가설과 입자를 연결했다","EKF의 평균·공분산 표현을 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[38]}]},{"id":"base-imitation","topic":"모방학습","type":"recall","q":"모방학습의 관측과 전문가 행동은 어떤 관계인가요?","answer":"시연의 관측을 입력으로 전문가 행동을 학습하며 평가 데이터는 학습과 구분합니다.","rubric":["관측→행동 관계를 말했다","학습과 평가를 구분했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[46]}]},{"id":"base-bc-shift","topic":"모방학습","type":"recall","q":"Behavior Cloning의 분포 이동과 오류 누적을 설명하세요.","answer":"실행 정책이 만든 상태가 전문가 시연 분포에서 벗어나면 익숙하지 않은 관측에서 오류가 이어질 수 있습니다.","rubric":["시연과 실행의 상태 분포 차이를 말했다","오류 누적을 연결했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[47]}]},{"id":"base-sim-task","topic":"Sim2Real","type":"recall","q":"시뮬레이션 태스크를 정의할 때 필요한 핵심 요소는?","answer":"씬, 관측, 행동, 보상·성공 판정, 종료·리셋을 정의합니다.","rubric":["관측·행동을 구분했다","성공 판정·종료·리셋 중 하나 이상 설명했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[55]}]},{"id":"base-domain-random","topic":"Sim2Real","type":"recall","q":"도메인 랜덤화에서 시각·물리 조건을 바꾸는 목적은?","answer":"훈련 조건을 다양하게 해 현실과의 차이에 대응하도록 합니다. 범위와 실제 검증이 필요합니다.","rubric":["조명·질량 등 바꿀 조건을 예로 들었다","현실 검증이나 랜덤화 범위의 한계를 말했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[56]}]},{"id":"base-onnx","topic":"배포","type":"recall","q":"ONNX로 내보내는 목적과 변환 후 확인할 것은?","answer":"모델을 교환 형식으로 옮겨 추론 런타임에서 사용하고 원래 모델과 출력 정합성을 검증합니다.","rubric":["모델 교환·런타임 분리를 말했다","변환 전후 출력 비교를 말했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[63]}]},{"id":"base-latency-p99","topic":"배포","type":"recall","q":"P99 지연을 평균 지연과 함께 봐야 하는 이유는?","answer":"측정 지연의 99%가 그 값 이하라는 꼬리 지표이며 드문 지연과 마감 초과를 평균만으로 놓칠 수 있습니다.","rubric":["P99의 백분위 의미를 설명했다","꼬리 지연과 마감을 연결했다"],"explanation":"관련 강의의 학습 목표·필수 이해를 기준으로 자기 설명을 확인합니다.","sources":[{"kind":"lesson","pages":[66]}]},{"id":"amcl-cycle","topic":"AMCL","type":"recall","q":"AMCL 예측·관측 갱신·재표본화를 각각 한 문장으로 설명하세요.","answer":"odom 이동으로 가설을 움직이고, 지도·scan 적합도로 가중치를 바꾸고, 비중에 따라 다음 입자를 뽑습니다.","rubric":["예측과 관측 갱신을 구분했다","재표본화를 가중치에 따른 추출로 설명했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[15]}]},{"id":"amcl-failure","topic":"AMCL","type":"recall","q":"입자 구름이 좁아도 위치가 틀릴 수 있는 이유를 말하세요.","answer":"반복 구조·틀린 지도·센서 TF·초기화 때문에 틀린 가설에 집중될 수 있습니다.","rubric":["집중과 정답 보장을 구분했다","오수렴 원인 하나를 구체적으로 말했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[16,25]}]},{"id":"amcl-sigma","topic":"AMCL","type":"recall","q":"sigma_hit를 아주 작게 하면 항상 더 정확해질까요?","answer":"거리 오차 모델 폭이 좁아져 작은 불일치에 민감해질 수 있으며 지도·관측·TF 품질을 먼저 확인합니다.","rubric":["거리 오차 모델 폭을 설명했다","작게 하면 무조건 정확하다는 해석을 피했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[22,25]}]},{"id":"amcl-motion-noise","topic":"AMCL","type":"recall","q":"차동 모델 alpha 계수를 크게 하는 것을 어떻게 해석하나요?","answer":"odom 이동에서 생기는 불확실성을 더 크게 모델링하는 것이며 센서나 바퀴 오차를 직접 제거하는 것은 아닙니다.","rubric":["이동 잡음 모델 계수라고 말했다","정확도가 자동 개선되는 값과 구분했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[20,21]}]},{"id":"tf-switch","topic":"TF·단위","type":"recall","q":"Cartographer에서 AMCL 저장 지도 주행으로 바꿀 때 TF는 어떻게 정리하나요?","answer":"같은 map→odom의 SLAM 발행을 중지하고 AMCL이 담당하게 하며 odom→몸체의 연속 이동은 유지합니다.","rubric":["map→odom 중복을 피한다고 말했다","odom→몸체 역할은 유지한다고 말했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[10,11]}]},{"id":"motion-filter","topic":"Cartographer","type":"recall","q":"Motion filter가 삽입을 생략하는 조건을 말하세요.","answer":"마지막 채택 이후 시간·거리·각도 변화가 모두 기준 이하이면 생략합니다. SLAM 계산 전체를 끄는 설정은 아닙니다.","rubric":["세 조건이 모두 작아야 한다고 말했다","삽입 생략과 전체 계산 중지를 구분했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"cartographer","pages":[18,19]}]},{"id":"submap-count","topic":"Cartographer","type":"recall","q":"num_range_data의 N은 시간인가요, 거리인가요?","answer":"채택된 삽입 수입니다. 교안의 2D 설명에서는 N회 간격으로 새 submap을 만들고 약 2N회 후 완성합니다.","rubric":["단위가 삽입 수라고 말했다","N 간격과 약 2N 완성을 구분했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"cartographer","pages":[20]}]},{"id":"tuning-order","topic":"Nav2","type":"recall","q":"위치가 틀린데 Planner를 먼저 교체하면 왜 진단이 어려울까요?","answer":"잘못된 위치·TF·시간 입력을 그대로 쓰게 됩니다. 입력과 AMCL을 먼저 확인하고 몸체·Costmap 뒤에 Planner·Controller를 비교합니다.","rubric":["입력·위치 추정을 먼저 확인한다고 말했다","이후 계획·제어 비교 순서를 설명했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[25,78,79]}]},{"id":"mppi-recede","topic":"Nav2","type":"recall","q":"MPPI에서 미래 제어 시퀀스를 계산한 다음 실제로 적용하는 것은?","answer":"첫 제어를 적용하고 다음 주기에 새 상태·관측으로 다시 예측·계산합니다.","rubric":["전체 미래 시퀀스를 한 번에 고정 실행하지 않는다고 말했다","다음 주기의 새 상태 반영을 설명했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[49,50]}]},{"id":"timing-types","topic":"Nav2","type":"recall","q":"cmd_vel 명령은 보이는데 로봇이 정지했다면 무엇부터 보나요?","answer":"메시지 타입·토픽 연결·subscriber·lifecycle 활성 상태·정지 감시 조건과 구동계 연결을 확인합니다.","rubric":["타입·연결 중 하나를 확인했다","활성 상태·정지 조건·구동계 중 하나를 확인했다"],"explanation":"핵심 두 요소를 비교해 자기 평가합니다. 문장 의미를 자동 채점하지 않습니다.","sources":[{"kind":"nav2","pages":[8,79,84,85]}]}]},"cartographer":{"date":"2026-10-14","title":"Cartographer 파라미터 수업 정리","source":"/Users/june/Downloads/Cartographer_파라미터_전체해설_KANT.pptx","slideCount":124,"coreRevision":"1489fc9","rosRevision":"7433452","slides":[{"slide":1,"text":"Lv.2 06 Cartographer\nKANT\n001\nCartographer 파라미터\nWaffle 실습과 전체 설정 해설\nROS 2 Lyrical / 2D·3D / 222개 항목","title":"Cartographer 파라미터","scope":"공통"},{"slide":2,"text":"Lv.2 06 Cartographer\nKANT\n002\n학습 범위\n본문: Waffle 2D 실습의 입력·TF·정합·지도·루프 조정\n부록: 고정 소스의 기본 Lua, ROS 옵션, 온라인 실행 인자 222개\n3D·TSDF·IMU 외삽기·trimmer는 활성 조건을 구분한다\nCartographer core 1489fc9 / ROS 통합 7433452 기준","title":"학습 범위","scope":"공통"},{"slide":3,"text":"Lv.2 06 Cartographer\nKANT\n003\n설정 계층\nROS launch: 파일 경로, 토픽 remap, use_sim_time\noptions: 센서 입력, 프레임, 발행 주기\nTRAJECTORY_BUILDER: 로컬 정합과 submap 구성\nPOSE_GRAPH: 재방문 제약과 전역 최적화","title":"설정 계층","scope":"공통"},{"slide":4,"text":"Lv.2 06 Cartographer\nKANT\n004\nLua include와 적용값\ninclude \"map_builder.lua\"\ninclude \"trajectory_builder.lua\"\nTRAJECTORY_BUILDER_2D.max_range = 3.5\nPOSE_GRAPH.constraint_builder.min_score = 0.65\ninclude로 기본값을 읽은 다음 실습 파일의 대입으로 덮어쓴다\n부록 표에는 소스 기본값과 현재 실습값을 따로 표시한다","title":"Lua include와 적용값","scope":"공통"},{"slide":5,"text":"Lv.2 06 Cartographer\nKANT\n005\nWaffle 미로 실습\n4.464 × 6.364m 미로에서 LiDAR와 바퀴 odometry를 사용한다\n2D 로컬 SLAM, IMU 입력 없음, map 보정은 Cartographer가 담당한다\n사진은 Linux Gazebo에서 실제 확인한 미로 화면이다\nTwin Closed Maze B / Linux Gazebo 실행 화면","title":"Waffle 미로 실습","scope":"공통"},{"slide":6,"text":"Lv.2 06 Cartographer\nKANT\n006\n실습 핵심값\n항목\n실습값\n역할\nuse_odometry / use_imu_data\ntrue / false\n바퀴 odom 사용, 2D IMU 입력 미사용\nmin_range / max_range\n0.12 / 3.5m\n유효 거리 구간\nmotion_filter.max_angle_radians\n0.1°\n회전 중 삽입 기준\nmin_score / global_localization_min_score\n0.65 / 0.70\n일반·전역 정합 채택 하한","title":"실습 핵심값","scope":"공통"},{"slide":7,"text":"Lv.2 06 Cartographer\nKANT\n007\nTF 구성\nGazebo: odom 기준 base_footprint의 연속 이동을 발행한다\nCartographer: map 기준 odom의 보정을 발행한다\ntracking_frame=base_footprint, published_frame=odom\nprovide_odom_frame=false로 Gazebo의 odom TF와 역할을 나눈다","title":"TF 구성","scope":"공통"},{"slide":8,"text":"Lv.2 06 Cartographer\nKANT\n008\n센서 입력 설정\n입력\n현재 설정\n확인 사항\nLaserScan\nnum_laser_scans=1\nscan을 /scan으로 remap\nOdometry\nuse_odometry=true\n/odom 입력과 시간·frame 확인\nIMU / GPS / landmark\n사용 안 함\n스위치만 켜고 데이터를 빠뜨리지 않는다","title":"센서 입력 설정","scope":"공통"},{"slide":9,"text":"Lv.2 06 Cartographer\nKANT\n009\n입력 점검\nros2 topic hz /scan\nros2 topic hz /odom\nros2 topic echo /clock --once\nros2 run tf2_ros tf2_echo odom base_footprint\n환경·시간·TF 오류를 먼저 해결한다\n알고리즘 파라미터로 끊긴 센서나 잘못된 축을 보정하지 않는다","title":"입력 점검","scope":"공통"},{"slide":10,"text":"Lv.2 06 Cartographer\nKANT\n010\n발행 간격과 처리율\n설정\n실습값\n해석\npose_publish_period_sec\n0.005s\n타이머 설정상 200Hz\ntrajectory_publish_period_sec\n0.03s\n시각화 마커 약 33.3Hz\nsubmap_publish_period_sec\n0.3s\nsubmap 목록 약 3.33Hz\ngrid publish_period_sec\n1.0s\n/map 출력 약 1Hz\n실제 처리율은 센서·CPU·ROS 타이머 상태에 따라 달라진다.","title":"발행 간격과 처리율","scope":"공통"},{"slide":11,"text":"Lv.2 06 Cartographer\nKANT\n011\n거리 필터\nmin_range=0.12m보다 가까운 측정은 제거한다\nmax_range=3.5m를 넘긴 측정은 실제 hit로 삽입하지 않는다\nmissing_data_ray_length=3m로 먼 측정의 자유 공간 갱신을 다룬다\n상한을 줄이면 먼 노이즈와 유효 구조가 함께 줄 수 있다","title":"거리 필터","scope":"공통"},{"slide":12,"text":"Lv.2 06 Cartographer\nKANT\n012\n스캔 분할과 누적\n설정\n변화\n예상 영향\nnum_subdivisions_per_laser_scan\n1에서 더 크게\n한 스캔의 시간순 조각 수 증가\nnum_accumulated_range_data\n1에서 더 크게\n한 번 정합하기 전에 모으는 입력 증가\n함께 조정\n입력 간격·점 수 확인\n중간 갱신율과 이동 왜곡 보정의 균형","title":"스캔 분할과 누적","scope":"공통"},{"slide":13,"text":"Lv.2 06 Cartographer\nKANT\n013\nVoxel 필터\n고정 voxel_filter_size는 일정한 크기로 점을 줄인다\nadaptive_voxel_filter는 점 수 기준을 보며 voxel 크기를 조절한다\nloop_closure_adaptive_voxel_filter는 루프 탐색용 점군에 적용한다\n서로 다른 단계의 필터를 같은 설정으로 취급하지 않는다","title":"Voxel 필터","scope":"공통"},{"slide":14,"text":"Lv.2 06 Cartographer\nKANT\n014\nVoxel 조정 예제\n시작값\n비교값\n관찰할 내용\nvoxel_filter_size=0.025m\n0.05m\n점 수·처리 지연·작은 기둥의 보존\nadaptive min_num_points=200\n100\n정합 안정성과 처리 시간\nadaptive max_length=0.5m\n0.8m\n과도한 희소화 여부\n비교값은 실험 예시이며 미로에서 검증한 권장값은 아니다.","title":"Voxel 조정 예제","scope":"공통"},{"slide":15,"text":"Lv.2 06 Cartographer\nKANT\n015\n로컬 스캔 정합\n운동 예측으로 이번 스캔의 초기 자세를 만든다\n선택한 correlative 탐색으로 주변 후보를 비교한다\nCeres가 점유 구조와 초기 자세의 균형을 최적화한다\n로컬 submap 내부의 변형을 전역 루프만으로 해결할 수는 없다\nROBOTIS 공식 예시 화면 / 현재 미로의 측정 결과가 아님","title":"로컬 스캔 정합","scope":"공통"},{"slide":16,"text":"Lv.2 06 Cartographer\nKANT\n016\nCorrelative 탐색\n파라미터\n2D 기본 / 실습\n의미\nuse_online_correlative_scan_matching\nfalse / true\nCeres 전 초기 후보 탐색\nlinear_search_window\n0.1m\n기준 위치 주변 병진 범위\nangular_search_window\n20°\n기준 방향 주변 회전 범위\nlocal 탐색 0.1m와 루프 탐색 7m는 서로 다른 설정이다.","title":"Correlative 탐색","scope":"공통"},{"slide":17,"text":"Lv.2 06 Cartographer\nKANT\n017\nCeres 상대 가중치\n항목\n2D 기본값\n높였을 때의 경향\noccupied_space_weight\n1\n지도 점유 구조와 점의 정합을 강조\ntranslation_weight\n10\n초기 병진 자세를 더 유지\nrotation_weight\n40\n초기 회전 자세를 더 유지\n센서 노이즈를 나타내는 분산 값으로 직접 해석하지 않는다.","title":"Ceres 상대 가중치","scope":"공통"},{"slide":18,"text":"Lv.2 06 Cartographer\nKANT\n018\nMotion filter 판정\n마지막 채택 이후 시간·거리·각도 변화가 모두 기준 이하면 삽입을 생략한다\n하나라도 기준을 초과하면 새 삽입을 허용할 수 있다\n실습 각도 기준은 0.1° = 약 0.001745rad다\n필터는 SLAM 계산 전체나 ROS 자세 발행을 끄는 설정이 아니다","title":"Motion filter 판정","scope":"공통"},{"slide":19,"text":"Lv.2 06 Cartographer\nKANT\n019\nMotion filter 조정 예제\n각도 기준\n기대할 경향\n같이 확인할 내용\n0.1°\n회전 구간에서 촘촘한 삽입\nnode 수·CPU·지도 세부 구조\n0.5°\n회전 중 삽입량 감소 가능\n모서리·기둥 구분 유지 여부\n1.0°\n더 큰 회전 차에서 삽입\n거리·시간 기준도 함께 적용\n같은 rosbag에서 한 항목만 바꿔 비교하는 실험안이다.","title":"Motion filter 조정 예제","scope":"공통"},{"slide":20,"text":"Lv.2 06 Cartographer\nKANT\n020\nSubmap 크기\n2D num_range_data 기본값은 90이다\n새 submap은 N회 삽입 간격으로 만들고 약 2N회 후 완성한다\n큰 submap은 구조를 넓게 담지만 로컬 오차도 더 오래 누적할 수 있다\nN은 거리 m나 시간 s가 아니라 채택된 삽입 수다","title":"Submap 크기","scope":"공통"},{"slide":21,"text":"Lv.2 06 Cartographer\nKANT\n021\n해상도 두 종류\n설정 위치\n현재값\n영향\nsubmaps.grid_options_2d.resolution\n0.05m\nSLAM 내부 submap의 공간 표현\noccupancy grid -resolution\n0.05m\nsubmap을 /map으로 합성하는 출력 셀\n출력만 0.025m로 변경\n비교 예제\n내부 0.05m에서 잃은 구조를 복원하지 못함","title":"해상도 두 종류","scope":"공통"},{"slide":22,"text":"Lv.2 06 Cartographer\nKANT\n022\n점유 확률 갱신\nhit_probability=0.55는 관측 끝점의 점유 증거다\nmiss_probability=0.49는 ray가 지나간 자유 공간의 증거다\n0.5는 중립 기준이며 hit와 miss의 누적 강도를 구분한다\ninsert_free_space=false이면 자유 공간 갱신을 제한한다\nROBOTIS 지도 예시 / hit·miss 설명용","title":"점유 확률 갱신","scope":"공통"},{"slide":23,"text":"Lv.2 06 Cartographer\nKANT\n023\n루프 폐합\n과거 submap과 현재 node의 재방문 후보를 탐색한다\n점수 기준을 통과한 정합으로 제약을 추가한다\npose graph 최적화가 여러 제약의 모순을 줄인다\n반복된 복도에서는 비슷한 구조의 잘못된 연결을 점검한다","title":"루프 폐합","scope":"공통"},{"slide":24,"text":"Lv.2 06 Cartographer\nKANT\n024\n루프 점수와 제약 가중치\n역할\n파라미터\n구분\n채택 여부\nmin_score=0.65\n일반 정합 점수의 하한\n전역 재위치\nglobal_localization_min_score=0.70\n다른 탐색 경로의 하한\n채택 후 영향\nloop_closure_*_weight\n이미 채택한 제약을 얼마나 강하게 반영할지\n0.65는 65%의 정답 확률을 의미하지 않는다.","title":"루프 점수와 제약 가중치","scope":"공통"},{"slide":25,"text":"Lv.2 06 Cartographer\nKANT\n025\n전역 최적화 주기\noptimize_every_n_nodes=90이 기본 주기다\n더 자주 실행하면 보정 결과를 자주 받지만 풀이 호출도 증가한다\n0은 주기적 최적화를 중지한다\n종료 시 최종 최적화와 제약 후보 탐색은 별도로 구분한다","title":"전역 최적화 주기","scope":"공통"},{"slide":26,"text":"Lv.2 06 Cartographer\nKANT\n026\nOdometry와 전역 가중치\n그룹\n기본값\n영향\nlocal_slam_pose_translation/rotation_weight\n각 1e5\n연속 로컬 자세의 상대 운동 유지\nodometry_translation/rotation_weight\n각 1e5\n외부 odom의 상대 운동 유지\nmatcher_translation/rotation_weight\n5e2 / 1.6e3\n삽입한 node-submap 제약의 강도","title":"Odometry와 전역 가중치","scope":"공통"},{"slide":27,"text":"Lv.2 06 Cartographer\nKANT\n027\nCPU 지연 점검\nrosbag 입력률, 스캔 수, 점 수와 처리 지연을 먼저 기록한다\nlocal 지연은 voxel·누적·온라인 탐색·Ceres 반복 수를 비교한다\nglobal 지연은 sampling·검색 범위·최적화 주기·백그라운드 수를 비교한다\n스레드만 늘리면 CPU 경쟁으로 지연이 커질 수 있다","title":"CPU 지연 점검","scope":"공통"},{"slide":28,"text":"Lv.2 06 Cartographer\nKANT\n028\n설정 수정과 반영\ncd ~/waffle-lyrical-slam\n# src/waffle_slam_course/config/waffle_2d.lua 수정\nsource /opt/ros/lyrical/setup.bash\ncolcon build --packages-select waffle_slam_course --symlink-install\nsource install/setup.bash\nros2 launch waffle_slam_course cartographer.launch.py\n기존 Cartographer를 종료한 뒤 다시 실행해 Lua를 읽는다\n새 터미널도 ROS_DOMAIN_ID=174로 맞춘다","title":"설정 수정과 반영","scope":"공통"},{"slide":29,"text":"Lv.2 06 Cartographer\nKANT\n029\n지도와 SLAM 상태 저장\nPREFIX=\"$HOME/slam_maps/maze_$(date +%Y%m%d_%H%M%S)\"\nmkdir -p \"$HOME/slam_maps\"\nros2 run nav2_map_server map_saver_cli -f \"$PREFIX\"\nros2 service call /write_state cartographer_ros_msgs/srv/WriteState \\\n  \"{filename: '${PREFIX}.pbstream', include_unfinished_submaps: true}\"\nPGM/YAML은 2D 점유 격자이며 pbstream은 SLAM 상태다\nROS 환경과 domain을 맞추고 /map 발행 중에 저장한다","title":"지도와 SLAM 상태 저장","scope":"공통"},{"slide":30,"text":"Lv.2 06 Cartographer\nKANT\n030\n고정 지도 위치 추정\npbstream은 load_state_filename으로 읽는다\nload_frozen_state=true로 기존 trajectory를 고정한다\npure_localization_trimmer는 새 submap의 보관 수를 제한한다\n예전 문서의 pure_localization=true를 현재 소스에 그대로 추가하지 않는다","title":"고정 지도 위치 추정","scope":"공통"},{"slide":31,"text":"Lv.2 06 Cartographer\nKANT\n031\n3D 설정의 조건\n3D 거리 관측과 IMU를 준비하고 프레임·중력축·시각을 맞춘다\n고해상도·저해상도 격자와 두 정합 가중치를 함께 사용한다\nintensity는 데이터가 있고 비용 설정도 맞을 때 켠다\nWaffle의 2D LaserScan 설정만 바꿔 3D SLAM을 얻을 수는 없다","title":"3D 설정의 조건","scope":"공통"},{"slide":32,"text":"Lv.2 06 Cartographer\nKANT\n032\n증상별 확인 순서\n증상\n먼저 확인\n그다음 비교할 설정\n지도·위치가 없음\n센서, TF, 시각, use_*\n입력 수·sampling·range\n벽이 두 겹·모서리 왜곡\nTF 외부 보정과 로컬 submap\nCeres 가중치·search window\n재방문 보정이 부족함\n실제 중첩·반복 구조·후보 로그\n점수·sampling·전역 탐색\n계속 처리 지연\n입력률·CPU·backlog\nvoxel·검색 폭·풀이 반복 수","title":"증상별 확인 순서","scope":"공통"},{"slide":33,"text":"Lv.2 06 Cartographer\nKANT\n033\n파라미터 비교 기록\n기록\n내용\n판단 기준\n고정 조건\n같은 bag·초기 상태·소스 commit\n실험마다 입력을 유지\n변경 항목\n한 번에 한 값과 변경 이유\n원인과 결과를 구분\n측정\n벽 두께·루프 오차·CPU·지연\n지도 그림만으로 판정하지 않음\n다른 구간 재검사\n직선·회전·반복 복도\n한 구간에만 맞춘 과적합 확인","title":"파라미터 비교 기록","scope":"공통"},{"slide":34,"text":"Lv.2 06 Cartographer\nKANT\n034\n부록 읽는 방법\n전체 경로는 상단, 개별 항목은 표 첫 열에서 찾는다\n값 열의 기본은 고정 소스, 실습은 Waffle override다\n조건부 설정은 부모 기능을 켰을 때만 실행에 영향을 준다\n단위가 rad인 항목에 도 숫자를 그대로 넣지 않는다","title":"부록 읽는 방법","scope":"공통"},{"slide":35,"text":"Lv.2 06 Cartographer\nKANT\n035\nROS 입력과 발행 1/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nmap_frame\n실습 map\nframe / SLAM 결과의 전역 좌표계. 보통 map이며 TF와 지도 메시지의 기준이다.\ntracking_frame\n실습 base_footprint\nframe / 알고리즘이 추적하는 몸체 좌표계. IMU 사용 시 센서 위치·외부 보정을 확인한다.\npublished_frame\n실습 odom\nframe / 전역 위치를 발행할 대상 좌표계. Waffle은 외부 odom을 보정하도록 odom을 선택한다.","title":"ROS 입력과 발행 1/9","scope":"공통"},{"slide":36,"text":"Lv.2 06 Cartographer\nKANT\n036\nROS 입력과 발행 2/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nodom_frame\n실습 odom\nframe / provide_odom_frame=true일 때 중간에 둘 연속적인 로컬 좌표계 이름이다.\nprovide_odom_frame\n실습 false\nbool / Cartographer가 로컬 odom 프레임까지 제공할지 선택한다. 기존 odom TF와 중복하면 안 된다.\npublish_frame_projected_to_2d\n실습 true\nbool / 발행 자세에서 z·roll·pitch 성분을 제거한다. 2D 이동체의 평면 TF에 사용한다.","title":"ROS 입력과 발행 2/9","scope":"공통"},{"slide":37,"text":"Lv.2 06 Cartographer\nKANT\n037\nROS 입력과 발행 3/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nuse_odometry\n실습 true\nbool / odom 센서 입력을 사용한다. true이면 해당 데이터와 TF가 실제로 들어와야 한다.\nuse_nav_sat\n실습 false\nbool / fix의 위성 위치 입력을 전역 SLAM에 사용한다. 실내 Waffle 예제는 끈다.\nuse_landmarks\n실습 false\nbool / ID가 있는 랜드마크 관측을 사용한다. 별도 landmarks 메시지 입력이 필요하다.","title":"ROS 입력과 발행 3/9","scope":"공통"},{"slide":38,"text":"Lv.2 06 Cartographer\nKANT\n038\nROS 입력과 발행 4/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nnum_laser_scans\n실습 1\n개 / LaserScan 입력 개수. 1개는 scan, 여러 개는 scan_1 등이며 remap으로 연결한다.\nnum_multi_echo_laser_scans\n실습 0\n개 / MultiEchoLaserScan 입력 개수. 일반 단일 에코 LiDAR와 구분한다.\nnum_subdivisions_per_laser_scan\n실습 1\n분할 수 / 한 스캔을 시간순 조각으로 나눈다. 스캔 중 이동 왜곡 보정과 누적 수를 함께 고려한다.","title":"ROS 입력과 발행 4/9","scope":"공통"},{"slide":39,"text":"Lv.2 06 Cartographer\nKANT\n039\nROS 입력과 발행 5/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nnum_point_clouds\n실습 0\n개 / PointCloud2 입력 개수. 단일 points2 또는 복수 points2_1 등의 토픽을 연결한다.\nlookup_transform_timeout_sec\n실습 0.2\ns / 센서 시각의 TF를 기다리는 시간. 늘려도 누락되거나 잘못된 TF 자체가 고쳐지지는 않는다.\nsubmap_publish_period_sec\n실습 0.3\ns / submap 목록과 자세의 발행 간격. 작게 하면 표시 갱신과 통신량이 증가한다.","title":"ROS 입력과 발행 5/9","scope":"공통"},{"slide":40,"text":"Lv.2 06 Cartographer\nKANT\n040\nROS 입력과 발행 6/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\npose_publish_period_sec\n실습 5e-3\ns / 추적 자세 발행 타이머의 간격. 센서 처리율이나 지도 정합 주기를 뜻하지 않는다.\ntrajectory_publish_period_sec\n실습 30e-3\ns / trajectory 시각화 마커의 발행 간격. 짧게 하면 RViz 갱신과 메시지 부하가 증가한다.\nrangefinder_sampling_ratio\n실습 1.\n0~1 / 거리 센서 메시지를 채택할 비율. 낮추면 부하는 줄지만 관측을 잃을 수 있다.","title":"ROS 입력과 발행 6/9","scope":"공통"},{"slide":41,"text":"Lv.2 06 Cartographer\nKANT\n041\nROS 입력과 발행 7/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nodometry_sampling_ratio\n실습 1.\n0~1 / odometry 메시지를 채택할 비율. 낮출수록 시간 해상도와 운동 예측 정보가 감소한다.\nfixed_frame_pose_sampling_ratio\n실습 1.\n0~1 / 위성 위치 등 고정 기준 좌표계 입력의 채택 비율. use_nav_sat와 함께 본다.\nimu_sampling_ratio\n실습 1.\n0~1 / IMU 메시지 채택 비율. 빠른 회전 추적과 계산량 사이의 영향을 확인한다.","title":"ROS 입력과 발행 7/9","scope":"공통"},{"slide":42,"text":"Lv.2 06 Cartographer\nKANT\n042\nROS 입력과 발행 8/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nlandmarks_sampling_ratio\n실습 1.\n0~1 / 랜드마크 메시지 채택 비율. ID 관측의 빈도와 시간 정렬 조건을 함께 확인한다.\npublish_to_tf\ntrue\nbool / TF 발행 스위치. false이면 다른 노드가 필요한 map 변환을 제공해야 한다.\npublish_tracked_pose\nfalse\nbool / 추적 자세를 tracked_pose의 PoseStamped로 추가 발행한다. 진단·시각화에 쓴다.","title":"ROS 입력과 발행 8/9","scope":"공통"},{"slide":43,"text":"Lv.2 06 Cartographer\nKANT\n043\nROS 입력과 발행 9/9\noptions\n파라미터\n기본 / 실습\n단위와 의미\nuse_pose_extrapolator\ntrue\nbool / 발행 시각의 자세를 외삽한다. 끄면 마지막 SLAM 결과 기반 발행으로 바뀐다.","title":"ROS 입력과 발행 9/9","scope":"공통"},{"slide":44,"text":"Lv.2 06 Cartographer\nKANT\n044\nROS launch 연결\nROS\n파라미터\n기본 / 실습\n단위와 의미\nuse_sim_time\n기본 false 실습 true\nbool / ROS 시간을 clock 토픽으로 맞춘다. Gazebo 실습의 관련 노드에서 true를 일관되게 사용한다.\nscan_remapping\n기본 scan 실습 /scan\n토픽 / Lua가 기대하는 scan 입력을 실제 /scan에 연결한다. ROS launch의 remapping 설정이다.\nodom_remapping\n기본 odom 실습 /odom\n토픽 / Lua가 기대하는 odom 입력을 실제 /odom에 연결한다. TF 소유권 설정과 별개다.","title":"ROS launch 연결","scope":"공통"},{"slide":45,"text":"Lv.2 06 Cartographer\nKANT\n045\nMap Builder 1/2\nMAP_BUILDER\n파라미터\n기본 / 실습\n단위와 의미\nuse_trajectory_builder_2d\n기본 false 실습 true\nbool / 2D 로컬 SLAM 선택. 3D 스위치와 동시에 켜지 않고 입력 센서 조합을 맞춘다.\nuse_trajectory_builder_3d\nfalse\nbool / 3D 로컬 SLAM 선택. 3D 거리 관측과 IMU·외부 보정이 필요하다.\nnum_background_threads\n4\nthread / 제약 탐색 등 백그라운드 작업의 스레드 수. 코어 수와 전경 작업의 부하를 함께 본다.","title":"Map Builder 1/2","scope":"공통"},{"slide":46,"text":"Lv.2 06 Cartographer\nKANT\n046\nMap Builder 2/2\nMAP_BUILDER\n파라미터\n기본 / 실습\n단위와 의미\ncollate_by_trajectory\nfalse\nbool /
