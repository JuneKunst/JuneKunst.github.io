의 균형을 최적화한다. 전역 루프는 이미 완성된 submap 내부의 왜곡을 자동으로 다시 그려 주지 않는다. 먼저 로컬 품질을 확보한다. [15–17쪽]\n\n| 설정 | 교안 값의 구분 | 의미와 주의점 |\n| --- | --- | --- |\n| min_range / max_range | 실습 0.12 / 3.5 m | 가까운 자기 반사와 먼 잡음을 걸러내되 유효 구조도 줄 수 있다. |\n| missing_data_ray_length | 본문 3 m | 범위 밖 측정의 자유 공간 갱신 길이. 실제 장애물 hit와 구분한다. |\n| voxel_filter_size | 시작 예시 0.025 m → 비교 0.05 m | 점 수·CPU·작은 구조 보존을 함께 본다. 권장값으로 검증된 비교가 아니다. |\n| use_online_correlative_scan_matching | 2D 기본 false / 실습 true | Ceres 앞의 후보 탐색을 켠다. 계산 비용이 추가된다. |\n| linear_search_window | 2D 로컬 0.1 m | 초기 위치 주변 탐색 폭. 루프 탐색 범위와 다르다. |\n| angular_search_window | 2D 로컬 20° | Lua에서 rad 변환 여부를 확인한다. |\n| occupied_space_weight | 2D 기본 1 | 점과 지도 점유 구조의 정합을 강조한다. |\n| translation_weight / rotation_weight | 2D 기본 10 / 40 | 초기 병진·회전 자세를 유지하는 상대 가중치다. 센서 분산과 동일하지 않다. |\n\n스캔 분할은 한 스캔의 시간순 조각을 늘리는 것이고, 누적은 정합 전에 모으는 입력 수를 늘리는 것이다. 누적과 분할을 함께 바꾸면 중간 갱신율·관측 왜곡·점 수를 함께 확인한다. 로컬용 적응형 voxel과 loop closure용 voxel도 별도 경로다. [11–14쪽]\n\n## 5. Motion filter, submap, 해상도\n\nMotion filter는 마지막 채택 이후 시간·거리·각도 변화가 모두 기준 이하면 삽입을 생략한다. 하나라도 기준을 초과하면 새 삽입을 허용할 수 있다. SLAM 전체 계산이나 ROS 자세 발행을 끄는 필터가 아니다. 실습 각도 0.1°는 약 0.001745 rad이며 0.1 rad와 다르다. [18–19쪽]\n\n예: 시간·거리 조건도 모두 기준 이하인 회전에서 변화량이 0.3°라면, 각도 기준 0.1°에서는 각도 조건이 삽입을 허용하고 0.5°에서는 생략 조건에 들어간다. 시간이나 거리가 이미 기준을 초과하면 각도만 높여도 생략되지 않는다. 이 설명은 판정 규칙의 예이며 실제 CPU 감소율을 계산한 결과가 아니다.\n\nnum_range_data의 2D 기본값 N=90은 채택된 삽입 수다. 새 submap은 N회 간격으로 만들고 약 2N회 후 완성한다. N을 초나 미터로 읽지 않는다. [20쪽]\n\n내부 submap 해상도와 출력 /map 해상도는 각각 다른 설정이다. 교안은 둘 다 0.05 m를 사용한다. 출력만 0.025 m로 바꿔도 내부 0.05 m에서 잃은 구조를 복원하지 못한다. 출력 셀 면적은 0.05²=0.0025 m²에서 0.025²=0.000625 m²로 줄지만, 이는 지도 정확도가 4배 좋아진다는 뜻이 아니다. [21쪽]\n\nhit_probability=0.55는 관측 끝점의 점유 증거, miss_probability=0.49는 ray가 지난 자유 공간의 증거다. 0.5가 중립 기준이다. insert_free_space=false는 자유 공간 갱신을 제한한다. [22쪽]\n\n## 6. 루프 폐합과 전역 최적화\n\n과거 submap과 현재 node의 재방문 후보를 비교하고, 정합 점수 기준을 통과하면 제약을 추가한다. Pose graph는 여러 제약의 모순을 줄인다. 반복된 복도처럼 비슷한 구조에서는 잘못된 재방문 연결을 확인한다. [23–26쪽]\n\n- min_score=0.65: 실습의 일반 정합 채택 하한이다. 65% 정답 확률이 아니다.\n- global_localization_min_score=0.70: 실습의 다른 전역 탐색 경로 하한이다.\n- loop_closure_*_weight: 채택한 제약의 영향이다. 채택 여부의 문턱과 구분한다.\n- optimize_every_n_nodes=90: 기본 주기다. 작게 하면 호출이 잦아질 수 있으며 0은 주기적 최적화를 중지한다. 후보 탐색과 종료 시 최종 최적화까지 모두 중지하는 스위치로 해석하지 않는다.\n\n점수 기준을 높이면 후보 채택에 더 엄격해질 수 있지만 올바른 루프도 놓칠 수 있다. 센서 중첩·TF·시간·실제 재방문 증거를 먼저 확인하고 점수 하나로 모든 문제를 해결하려 하지 않는다.\n\n## 7. 발행 주기는 실제 처리율이 아니다\n\n| 항목 | 실습 간격 | 간격의 역수 |\n| --- | --- | --- |\n| pose_publish_period_sec | 0.005 s | 타이머 설정상 200 Hz |\n| trajectory_publish_period_sec | 0.03 s | 약 33.3 Hz |\n| submap_publish_period_sec | 0.3 s | 약 3.33 Hz |\n| grid publish_period_sec | 1.0 s | 약 1 Hz |\n\n이는 센서 입력률이나 SLAM 정합 처리율의 측정값이 아니다. 센서·CPU·타이머 상태가 실제 발행률을 좌우한다. CPU 지연은 입력률과 backlog를 먼저 기록하고 local과 global 경로를 나눠 진단한다. 스레드만 늘려도 CPU 경쟁으로 지연이 커질 수 있다. [10, 27쪽]\n\n## 8. 실습 확인과 설정 반영 순서\n\n실행 위치와 설치본을 먼저 선택한다. HTML의 “환경·명령어”에서 Linux/WSL, Docker, SSH, Windows PowerShell 안내를 구분하고 배포판·경로·토픽·frame을 지정한다. 아래는 Bash 변수형 예제이며 관련 패키지·토픽·TF의 실제 실행이 필요하다. 특정 OS·배포판에서의 실행 성공을 의미하지 않는다.\n\n```bash\nros2 topic list -t\nros2 topic hz \"$SCAN_TOPIC\"\nros2 topic hz \"$ODOM_TOPIC\"\n# 시뮬레이션을 사용할 때만 실제 clock 토픽 확인\nros2 topic echo \"$CLOCK_TOPIC\" --once\nros2 run tf2_ros tf2_echo \"$ODOM_FRAME\" \"$BASE_FRAME\"\n```\n\n위 변수에는 실제 토픽·frame 이름을 먼저 지정한다. use_sim_time을 켠 환경에서는 clock도 확인한다. hz와 tf2_echo는 관찰 명령으로 계속 실행될 수 있으므로 관측 후 Ctrl+C로 종료한다. 입력이 없거나 TF가 끊기면 파라미터 비교를 시작하지 않는다. [9쪽]\n\n설치본에 맞춘 설정 반영 예. 변수값은 실제 환경에서 먼저 지정하고 패키지·launch 파일과 지원 인자를 확인한다:\n\n```bash\n# 먼저 ROS_DISTRO, ROS_WORKSPACE, SLAM_PACKAGE, SLAM_LAUNCH를 실제 값으로 지정\nsource \"/opt/ros/${ROS_DISTRO:?배포판을 지정하세요}/setup.bash\"\ncd \"${ROS_WORKSPACE:?실제 workspace 경로를 지정하세요}\"\nros2 pkg prefix \"${SLAM_PACKAGE:?실행 패키지를 지정하세요}\"\ncolcon build --packages-select \"$SLAM_PACKAGE\" --symlink-install\nsource install/setup.bash\nros2 launch \"$SLAM_PACKAGE\" \"${SLAM_LAUNCH:?launch 파일명을 지정하세요}\" --show-args\n# 지원 인자와 Lua 경로·토픽 remap·시간 설정을 확인한 다음 실행\nros2 launch \"$SLAM_PACKAGE\" \"$SLAM_LAUNCH\"\n```\n\n기존 Cartographer를 종료하고 다시 실행해 Lua를 읽는다. 새 터미널도 통신 상대와 같은 ROS_DOMAIN_ID를 사용한다. /opt/ros 경로가 아닌 설치본은 실제 setup 파일을 사용한다. 교안의 Lyrical·waffle-lyrical-slam·domain 174는 참고 조건이며 환경별 고정값이 아니다. [28쪽]\n\n## 9. 증상별 점검과 비교 기록\n\n| 증상 | 먼저 확인 | 그다음 한 항목씩 비교 |\n| --- | --- | --- |\n| 지도·위치가 없음 | 센서, TF, 시각, use_* 입력 | 입력 수, sampling, range |\n| 벽 두 겹·모서리 왜곡 | 센서 외부 보정, 로컬 submap | Ceres 가중치, local search window |\n| 재방문 보정 부족 | 중첩, 반복 구조, 후보 로그 | 점수, sampling, global search |\n| 처리 지연 | 입력률, CPU, backlog | voxel, 탐색 폭, 풀이 반복 수 |\n\n같은 rosbag·초기 상태·소스 commit을 유지한다. 원본 설정을 보관하고 한 값과 변경 이유를 적는다. 벽 두께·루프 오차·CPU·지연을 함께 측정하고 직선·회전·반복 복도에서도 다시 확인한다. 지도 그림만으로 성공을 판정하지 않는다. [32–33, 124쪽]\n\n기록 양식: 입력 bag / commit / 기존 값 / 변경 값 / 예상 / 관측 / 지연·CPU / 지도 품질 / 다른 구간 결과 / 유지 또는 되돌림 이유.\n\n## 10. 저장 형식과 위치 추정 모드\n\nPGM/YAML은 Nav2 등에 사용하는 2D 점유 격자이고 pbstream은 Cartographer SLAM 상태다. load_state_filename에 PGM/YAML을 넣지 않는다. [29–30, 120쪽]\n\n실행 위치: 같은 ROS 환경·domain의 터미널, /map 발행 중. 출력 폴더에 쓰기 권한이 있어야 한다.\n\n```bash\nMAP_OUTPUT_DIR=\"${MAP_OUTPUT_DIR:?지도를 저장할 폴더를 먼저 지정하세요}\"\nmkdir -p \"$MAP_OUTPUT_DIR\"\nPREFIX=\"$MAP_OUTPUT_DIR/map_$(date +%Y%m%d_%H%M%S)\"\nros2 run nav2_map_server map_saver_cli -f \"$PREFIX\"\nros2 service list -t\n# WRITE_STATE_SERVICE에는 설치본의 상태 저장 서비스를 지정\nros2 service call \"${WRITE_STATE_SERVICE:?상태 저장 서비스명을 지정하세요}\" cartographer_ros_msgs/srv/WriteState \\\n  \"{filename: '${PREFIX}.pbstream', include_unfinished_submaps: true}\"\n```\n\n생성 파일과 서비스 응답을 확인한다. 읽을 때 load_frozen_state=true는 기존 trajectory를 고정한다. pure_localization_trimmer는 새 submap 보관 수를 제한한다. 예전 문서의 pure_localization=true를 이 고정 소스에 무조건 추가하지 않는다. 정상 종료 저장 인자는 비정상 강제 종료까지 저장을 보장하지 않는다. [30, 48, 120–121쪽]\n\n## 11. 부록의 활성 조건\n\n- 3D: 3D 거리 관측, IMU, 중력축·외부 보정·시각이 필요하다. 2D LaserScan 설정을 켜는 것만으로 3D SLAM을 얻지 못한다. [31, 97–118쪽]\n- TSDF: 해당 2D 격자·삽입 기능을 선택한 경우에 읽는다. Waffle의 점유 확률 격자와 같은 활성 경로라고 가정하지 않는다. [68–74쪽]\n- IMU 외삽기: use_imu_based 및 해당 입력 조건을 함께 확인한다. 레거시 중력 시간상수와 중첩 pose_extrapolator 설정을 구분한다. [61–66, 99, 109–114쪽]\n- 겹친 submap trimmer: 기본 Lua에서 주석인 선택 기능이다. [96쪽]\n- occupancy_grid_topic: 이 ROS 2 포크의 실제 발행자는 map 상수를 사용하므로 변경은 remap을 사용한다. 일반적인 모든 포크의 동작으로 확대하지 않는다. [123쪽]\n\n## 12. 복습 질문\n\n1. use_odometry=true와 provide_odom_frame=false가 함께 가능한 이유는? 입력 사용과 TF 발행 책임이 다르다.\n2. 0.1°를 0.1 rad로 넣으면 같은 기준인가? 아니다. 0.1°는 약 0.001745 rad다.\n3. min_score=0.65는 성공 확률 65%인가? 아니다. 정합 점수의 채택 하한이다.\n4. 출력 해상도만 높이면 내부 지도 왜곡이 사라지는가? 아니다. 내부 정보와 로컬 정합 품질을 먼저 확보한다.\n5. optimize_every_n_nodes=0이면 모든 루프 관련 작업이 멈추는가? 아니다. 주기적 최적화, 후보 생성, 최종 최적화를 구분한다.\n6. pbstream과 PGM/YAML은 서로 대체 가능한가? 아니다. SLAM 상태와 출력 점유 격자는 목적과 정보가 다르다.\n\n오늘 복습 순서: 입력·TF → 로컬 정합 → Motion filter·submap → 루프·전역 최적화 → 저장·위치 추정. 관련 기존 학습은 37강, 38강 상태 추정, 39강 데이터 흐름 순서로 연결한다.\n"]],"markdown":"# Cartographer 파라미터 수업 정리\n\n2026-10-14 · KANT 교안 124쪽 기반 · 37강 SLAM / 39강 Mapping·Localization 보충\n\n교안의 본문은 Waffle 2D 미로 실습, 부록은 222개 설정 항목이다. 기준 소스는 Cartographer core `1489fc9`, ROS 통합 `7433452`다. 아래 값은 해당 교안의 기본값·실습값·비교 예시를 구분한 기록이다. 현재 Mac이나 로봇에서 실행·측정한 결과가 아니다. 실제 수업 발언이나 개인 실습 결과는 별도로 기록한다.\n\n## 1. SLAM, odometry, Cartographer의 관계\n\nSLAM은 센서로 지도를 만들면서 지도 안의 로봇 위치도 추정하는 문제다. Odometry는 바퀴 등으로 연속적인 상대 이동을 추정하지만 오차가 누적될 수 있다. Cartographer는 거리 관측과 운동 예측을 이용해 로컬 지도를 만들고, 과거 장소의 재관측을 전역 제약으로 연결하는 SLAM 구현이다.\n\nWaffle 실습은 LiDAR와 바퀴 odometry를 사용하고 IMU는 사용하지 않는다. odom은 스캔의 초기 운동 예측에 정보를 제공하며, LiDAR의 구조 정합은 그 예측을 보완한다. odom 입력을 쓴다는 것과 Cartographer가 odom TF를 직접 발행한다는 것은 별개의 설정이다. [교안 5–8, 15, 26쪽]\n\n입력 → 로컬 정합 → submap → 루프 제약 → pose graph → 지도 출력의 순서로 이해한다. Nav2는 그 지도와 위치를 활용하는 주행 계층이며, Cartographer의 파라미터가 Nav2의 경로 계획 설정을 대신하지 않는다.\n\n## 2. 설정이 적용되는 네 계층\n\n| 위치 | 담당하는 것 | 먼저 할 질문 |\n| --- | --- | --- |\n| ROS launch | Lua 경로, topic remap, use_sim_time | 실제 파일과 토픽을 읽고 있는가? |\n| options | 입력 센서 수, TF frame, 발행 간격 | 켠 입력이 실제로 도착하는가? |\n| TRAJECTORY_BUILDER | 로컬 정합, 필터, submap | 개별 submap 안에서 벽이 잘 맞는가? |\n| POSE_GRAPH | 재방문 제약, 전역 최적화 | 과거 장소와 올바르게 연결되는가? |\n\nLua는 include로 기본값을 불러온 다음 실습 파일의 대입으로 덮어쓴다. 부록의 기본값이 실제 적용값이라고 가정하지 않는다. 조건부 기능은 부모 기능이 활성화돼야 효과가 있다. [3–4, 34쪽]\n\n## 3. 오늘 실습의 TF 책임\n\n실습 경로: map → odom → base_footprint → 센서 frame\n\n- Gazebo: odom → base_footprint의 연속 이동을 발행한다.\n- Cartographer: map → odom의 전역 보정을 발행한다.\n- tracking_frame=base_footprint, published_frame=odom, provide_odom_frame=false다.\n- 센서 장착 TF와 축·관측 시각은 실제 모델에서 확인한다. 동일 TF 변에 publisher를 중복 배치하지 않는다.\n\n여기서 provide_odom_frame=false는 odometry를 사용하지 않는다는 뜻이 아니다. use_odometry=true와 함께 사용한다. 다른 로봇이나 외부 odom이 없는 구성에는 이 조합을 그대로 복사하지 않는다. [7–9쪽]\n\n## 4. 로컬 정합을 먼저 이해하기\n\n운동 예측으로 초기 자세를 만들고, 선택된 correlative 탐색으로 주변 후보를 비교한 뒤 Ceres가 점유 구조와 초기 자세의 균형을 최적화한다. 전역 루프는 이미 완성된 submap 내부의 왜곡을 자동으로 다시 그려 주지 않는다. 먼저 로컬 품질을 확보한다. [15–17쪽]\n\n| 설정 | 교안 값의 구분 | 의미와 주의점 |\n| --- | --- | --- |\n| min_range / max_range | 실습 0.12 / 3.5 m | 가까운 자기 반사와 먼 잡음을 걸러내되 유효 구조도 줄 수 있다. |\n| missing_data_ray_length | 본문 3 m | 범위 밖 측정의 자유 공간 갱신 길이. 실제 장애물 hit와 구분한다. |\n| voxel_filter_size | 시작 예시 0.025 m → 비교 0.05 m | 점 수·CPU·작은 구조 보존을 함께 본다. 권장값으로 검증된 비교가 아니다. |\n| use_online_correlative_scan_matching | 2D 기본 false / 실습 true | Ceres 앞의 후보 탐색을 켠다. 계산 비용이 추가된다. |\n| linear_search_window | 2D 로컬 0.1 m | 초기 위치 주변 탐색 폭. 루프 탐색 범위와 다르다. |\n| angular_search_window | 2D 로컬 20° | Lua에서 rad 변환 여부를 확인한다. |\n| occupied_space_weight | 2D 기본 1 | 점과 지도 점유 구조의 정합을 강조한다. |\n| translation_weight / rotation_weight | 2D 기본 10 / 40 | 초기 병진·회전 자세를 유지하는 상대 가중치다. 센서 분산과 동일하지 않다. |\n\n스캔 분할은 한 스캔의 시간순 조각을 늘리는 것이고, 누적은 정합 전에 모으는 입력 수를 늘리는 것이다. 누적과 분할을 함께 바꾸면 중간 갱신율·관측 왜곡·점 수를 함께 확인한다. 로컬용 적응형 voxel과 loop closure용 voxel도 별도 경로다. [11–14쪽]\n\n## 5. Motion filter, submap, 해상도\n\nMotion filter는 마지막 채택 이후 시간·거리·각도 변화가 모두 기준 이하면 삽입을 생략한다. 하나라도 기준을 초과하면 새 삽입을 허용할 수 있다. SLAM 전체 계산이나 ROS 자세 발행을 끄는 필터가 아니다. 실습 각도 0.1°는 약 0.001745 rad이며 0.1 rad와 다르다. [18–19쪽]\n\n예: 시간·거리 조건도 모두 기준 이하인 회전에서 변화량이 0.3°라면, 각도 기준 0.1°에서는 각도 조건이 삽입을 허용하고 0.5°에서는 생략 조건에 들어간다. 시간이나 거리가 이미 기준을 초과하면 각도만 높여도 생략되지 않는다. 이 설명은 판정 규칙의 예이며 실제 CPU 감소율을 계산한 결과가 아니다.\n\nnum_range_data의 2D 기본값 N=90은 채택된 삽입 수다. 새 submap은 N회 간격으로 만들고 약 2N회 후 완성한다. N을 초나 미터로 읽지 않는다. [20쪽]\n\n내부 submap 해상도와 출력 /map 해상도는 각각 다른 설정이다. 교안은 둘 다 0.05 m를 사용한다. 출력만 0.025 m로 바꿔도 내부 0.05 m에서 잃은 구조를 복원하지 못한다. 출력 셀 면적은 0.05²=0.0025 m²에서 0.025²=0.000625 m²로 줄지만, 이는 지도 정확도가 4배 좋아진다는 뜻이 아니다. [21쪽]\n\nhit_probability=0.55는 관측 끝점의 점유 증거, miss_probability=0.49는 ray가 지난 자유 공간의 증거다. 0.5가 중립 기준이다. insert_free_space=false는 자유 공간 갱신을 제한한다. [22쪽]\n\n## 6. 루프 폐합과 전역 최적화\n\n과거 submap과 현재 node의 재방문 후보를 비교하고, 정합 점수 기준을 통과하면 제약을 추가한다. Pose graph는 여러 제약의 모순을 줄인다. 반복된 복도처럼 비슷한 구조에서는 잘못된 재방문 연결을 확인한다. [23–26쪽]\n\n- min_score=0.65: 실습의 일반 정합 채택 하한이다. 65% 정답 확률이 아니다.\n- global_localization_min_score=0.70: 실습의 다른 전역 탐색 경로 하한이다.\n- loop_closure_*_weight: 채택한 제약의 영향이다. 채택 여부의 문턱과 구분한다.\n- optimize_every_n_nodes=90: 기본 주기다. 작게 하면 호출이 잦아질 수 있으며 0은 주기적 최적화를 중지한다. 후보 탐색과 종료 시 최종 최적화까지 모두 중지하는 스위치로 해석하지 않는다.\n\n점수 기준을 높이면 후보 채택에 더 엄격해질 수 있지만 올바른 루프도 놓칠 수 있다. 센서 중첩·TF·시간·실제 재방문 증거를 먼저 확인하고 점수 하나로 모든 문제를 해결하려 하지 않는다.\n\n## 7. 발행 주기는 실제 처리율이 아니다\n\n| 항목 | 실습 간격 | 간격의 역수 |\n| --- | --- | --- |\n| pose_publish_period_sec | 0.005 s | 타이머 설정상 200 Hz |\n| trajectory_publish_period_sec | 0.03 s | 약 33.3 Hz |\n| submap_publish_period_sec | 0.3 s | 약 3.33 Hz |\n| grid publish_period_sec | 1.0 s | 약 1 Hz |\n\n이는 센서 입력률이나 SLAM 정합 처리율의 측정값이 아니다. 센서·CPU·타이머 상태가 실제 발행률을 좌우한다. CPU 지연은 입력률과 backlog를 먼저 기록하고 local과 global 경로를 나눠 진단한다. 스레드만 늘려도 CPU 경쟁으로 지연이 커질 수 있다. [10, 27쪽]\n\n## 8. 실습 확인과 설정 반영 순서\n\n실행 위치와 설치본을 먼저 선택한다. HTML의 “환경·명령어”에서 Linux/WSL, Docker, SSH, Windows PowerShell 안내를 구분하고 배포판·경로·토픽·frame을 지정한다. 아래는 Bash 변수형 예제이며 관련 패키지·토픽·TF의 실제 실행이 필요하다. 특정 OS·배포판에서의 실행 성공을 의미하지 않는다.\n\n```bash\nros2 topic list -t\nros2 topic hz \"$SCAN_TOPIC\"\nros2 topic hz \"$ODOM_TOPIC\"\n# 시뮬레이션을 사용할 때만 실제 clock 토픽 확인\nros2 topic echo \"$CLOCK_TOPIC\" --once\nros2 run tf2_ros tf2_echo \"$ODOM_FRAME\" \"$BASE_FRAME\"\n```\n\n위 변수에는 실제 토픽·frame 이름을 먼저 지정한다. use_sim_time을 켠 환경에서는 clock도 확인한다. hz와 tf2_echo는 관찰 명령으로 계속 실행될 수 있으므로 관측 후 Ctrl+C로 종료한다. 입력이 없거나 TF가 끊기면 파라미터 비교를 시작하지 않는다. [9쪽]\n\n설치본에 맞춘 설정 반영 예. 변수값은 실제 환경에서 먼저 지정하고 패키지·launch 파일과 지원 인자를 확인한다:\n\n```bash\n# 먼저 ROS_DISTRO, ROS_WORKSPACE, SLAM_PACKAGE, SLAM_LAUNCH를 실제 값으로 지정\nsource \"/opt/ros/${ROS_DISTRO:?배포판을 지정하세요}/setup.bash\"\ncd \"${ROS_WORKSPACE:?실제 workspace 경로를 지정하세요}\"\nros2 pkg prefix \"${SLAM_PACKAGE:?실행 패키지를 지정하세요}\"\ncolcon build --packages-select \"$SLAM_PACKAGE\" --symlink-install\nsource install/setup.bash\nros2 launch \"$SLAM_PACKAGE\" \"${SLAM_LAUNCH:?launch 파일명을 지정하세요}\" --show-args\n# 지원 인자와 Lua 경로·토픽 remap·시간 설정을 확인한 다음 실행\nros2 launch \"$SLAM_PACKAGE\" \"$SLAM_LAUNCH\"\n```\n\n기존 Cartographer를 종료하고 다시 실행해 Lua를 읽는다. 새 터미널도 통신 상대와 같은 ROS_DOMAIN_ID를 사용한다. /opt/ros 경로가 아닌 설치본은 실제 setup 파일을 사용한다. 교안의 Lyrical·waffle-lyrical-slam·domain 174는 참고 조건이며 환경별 고정값이 아니다. [28쪽]\n\n## 9. 증상별 점검과 비교 기록\n\n| 증상 | 먼저 확인 | 그다음 한 항목씩 비교 |\n| --- | --- | --- |\n| 지도·위치가 없음 | 센서, TF, 시각, use_* 입력 | 입력 수, sampling, range |\n| 벽 두 겹·모서리 왜곡 | 센서 외부 보정, 로컬 submap | Ceres 가중치, local search window |\n| 재방문 보정 부족 | 중첩, 반복 구조, 후보 로그 | 점수, sampling, global search |\n| 처리 지연 | 입력률, CPU, backlog | voxel, 탐색 폭, 풀이 반복 수 |\n\n같은 rosbag·초기 상태·소스 commit을 유지한다. 원본 설정을 보관하고 한 값과 변경 이유를 적는다. 벽 두께·루프 오차·CPU·지연을 함께 측정하고 직선·회전·반복 복도에서도 다시 확인한다. 지도 그림만으로 성공을 판정하지 않는다. [32–33, 124쪽]\n\n기록 양식: 입력 bag / commit / 기존 값 / 변경 값 / 예상 / 관측 / 지연·CPU / 지도 품질 / 다른 구간 결과 / 유지 또는 되돌림 이유.\n\n## 10. 저장 형식과 위치 추정 모드\n\nPGM/YAML은 Nav2 등에 사용하는 2D 점유 격자이고 pbstream은 Cartographer SLAM 상태다. load_state_filename에 PGM/YAML을 넣지 않는다. [29–30, 120쪽]\n\n실행 위치: 같은 ROS 환경·domain의 터미널, /map 발행 중. 출력 폴더에 쓰기 권한이 있어야 한다.\n\n```bash\nMAP_OUTPUT_DIR=\"${MAP_OUTPUT_DIR:?지도를 저장할 폴더를 먼저 지정하세요}\"\nmkdir -p \"$MAP_OUTPUT_DIR\"\nPREFIX=\"$MAP_OUTPUT_DIR/map_$(date +%Y%m%d_%H%M%S)\"\nros2 run nav2_map_server map_saver_cli -f \"$PREFIX\"\nros2 service list -t\n# WRITE_STATE_SERVICE에는 설치본의 상태 저장 서비스를 지정\nros2 service call \"${WRITE_STATE_SERVICE:?상태 저장 서비스명을 지정하세요}\" cartographer_ros_msgs/srv/WriteState \\\n  \"{filename: '${PREFIX}.pbstream', include_unfinished_submaps: true}\"\n```\n\n생성 파일과 서비스 응답을 확인한다. 읽을 때 load_frozen_state=true는 기존 trajectory를 고정한다. pure_localization_trimmer는 새 submap 보관 수를 제한한다. 예전 문서의 pure_localization=true를 이 고정 소스에 무조건 추가하지 않는다. 정상 종료 저장 인자는 비정상 강제 종료까지 저장을 보장하지 않는다. [30, 48, 120–121쪽]\n\n## 11. 부록의 활성 조건\n\n- 3D: 3D 거리 관측, IMU, 중력축·외부 보정·시각이 필요하다. 2D LaserScan 설정을 켜는 것만으로 3D SLAM을 얻지 못한다. [31, 97–118쪽]\n- TSDF: 해당 2D 격자·삽입 기능을 선택한 경우에 읽는다. Waffle의 점유 확률 격자와 같은 활성 경로라고 가정하지 않는다. [68–74쪽]\n- IMU 외삽기: use_imu_based 및 해당 입력 조건을 함께 확인한다. 레거시 중력 시간상수와 중첩 pose_extrapolator 설정을 구분한다. [61–66, 99, 109–114쪽]\n- 겹친 submap trimmer: 기본 Lua에서 주석인 선택 기능이다. [96쪽]\n- occupancy_grid_topic: 이 ROS 2 포크의 실제 발행자는 map 상수를 사용하므로 변경은 remap을 사용한다. 일반적인 모든 포크의 동작으로 확대하지 않는다. [123쪽]\n\n## 12. 복습 질문\n\n1. use_odometry=true와 provide_odom_frame=false가 함께 가능한 이유는? 입력 사용과 TF 발행 책임이 다르다.\n2. 0.1°를 0.1 rad로 넣으면 같은 기준인가? 아니다. 0.1°는 약 0.001745 rad다.\n3. min_score=0.65는 성공 확률 65%인가? 아니다. 정합 점수의 채택 하한이다.\n4. 출력 해상도만 높이면 내부 지도 왜곡이 사라지는가? 아니다. 내부 정보와 로컬 정합 품질을 먼저 확보한다.\n5. optimize_every_n_nodes=0이면 모든 루프 관련 작업이 멈추는가? 아니다. 주기적 최적화, 후보 생성, 최종 최적화를 구분한다.\n6. pbstream과 PGM/YAML은 서로 대체 가능한가? 아니다. SLAM 상태와 출력 점유 격자는 목적과 정보가 다르다.\n\n오늘 복습 순서: 입력·TF → 로컬 정합 → Motion filter·submap → 루프·전역 최적화 → 저장·위치 추정. 관련 기존 학습은 37강, 38강 상태 추정, 39강 데이터 흐름 순서로 연결한다.\n"},{"id":"17","file":"docs/17-nav2-amcl-class.md","title":"Nav2·AMCL 수업 정리","framework":"2026-10-15 · KANT 수업 보충","intro":"Cartographer 저장 지도에서 AMCL 위치 추정과 Nav2 주행으로 연결합니다.","sections":[["수업 정리","# Nav2·AMCL 수업 정리\n\n2026-10-15 · KANT 교안 91쪽 · 전날 Cartographer 수업과 연결\n\n이 자료는 교안의 Waffle / ROS 2 Lyrical / 설치본 Nav2 1.5.0 설명을 바탕으로 한다. 표의 숫자는 교안 참고값 또는 명시된 예제값이다. Mac이나 실제 로봇에서 목표 도달을 검증한 기록이 아니다. 교안도 이번 제작에서 Nav2 목표 도달을 새로 검증하지 않았다고 밝힌다. [4, 85, 91쪽]\n\n## 1. 어제 만든 지도로 오늘 무엇을 할까?\n\n어제는 Cartographer가 센서와 odom을 이용해 지도와 위치를 함께 추정했다. 오늘은 저장한 지도 위에서 현재 위치를 찾고 목표까지 주행한다. 이때 지도 만들기, 위치 찾기, 경로 만들기, 바퀴를 움직일 속도 만들기를 나눠 이해한다. [6–10, 13–15쪽]\n\n| 질문 | 담당 | 입력 → 출력 | 이전 학습과 연결 |\n| --- | --- | --- | --- |\n| 여기는 어떤 공간인가? | Cartographer SLAM | scan·odom·TF → 지도와 자세 | 37강, 어제의 submap·loop closure |\n| 직전 위치에서 얼마나 움직였나? | odometry / 상태 추정 | 바퀴·선택한 센서 → 연속 상대 이동 | 38강, odom 누적 오차 |\n| 저장 지도에서 나는 어디인가? | AMCL | 저장 지도·scan·odom 기반 TF → 위치 가설과 전역 보정 | 38·39강, particle filter와 map→odom |\n| 목표까지 어디로 갈까? | Planner | 현재 위치·목표·global costmap → 경로 | 40강, 탐색과 비용 |\n| 지금 어떤 속도를 낼까? | Controller | 위치·속도·경로·local costmap → 속도 명령 | 44강, 추종과 충돌 평가 |\n| 언제 계획·제어·복구를 호출할까? | BT Navigator | 목표·각 작업의 결과 → 실행 흐름 | 40·43강, action·상태 전이 |\n\n경로가 나왔다고 로봇이 움직인 것은 아니다. 속도 명령이 나왔다고 목표 도달이 확인된 것도 아니다. 경로·명령·실제 움직임·도착 결과를 나눠 확인한다.\n\n## 2. 저장 파일과 TF부터 연결하기\n\nCartographer의 PGM/YAML은 2D 점유 지도이고 pbstream은 SLAM 상태다. 오늘 AMCL 실습의 map_server에는 저장 지도 YAML을 제공한다. 어제의 pbstream을 map YAML 대신 넣지 않는다. Cartographer의 고정 지도 위치 추정과 AMCL은 서로 다른 위치 추정 구성이다. [4, 6, 82–83쪽 · 전날 29–30쪽]\n\n저장 지도 주행의 좌표계:\n\n```text\nmap\n └─ odom                 AMCL: 전역 위치 보정\n     └─ base_footprint   Gazebo/odometry: 연속 상대 이동\n         └─ sensor      URDF: 장착 위치·방향\n```\n\nAMCL을 시작하기 전에 Cartographer·cuVSLAM의 map→odom 발행을 중지한다. 같은 변을 둘이 발행하면 전역 위치가 흔들릴 수 있다. Gazebo·Nav2·RViz의 clock과 use_sim_time도 맞춘다. [10–11쪽]\n\n회전을 무시한 1차원 예: odom 기준 몸체가 x=2.3 m이고 AMCL이 지도 기준 x=2.0 m로 추정하면, map→odom 보정은 −0.3 m다. (−0.3)+2.3=2.0이다. 실제 TF는 회전까지 포함한 변환 합성이다. map→odom이 보정돼도 odom→base의 연속 이동 역할은 유지한다.\n\n## 3. AMCL 입자는 무엇인가?\n\n입자 하나는 “로봇이 이 위치·방향에 있을지도 모른다”는 가설 하나다. 실제 AMCL의 상태는 (x, y, θ)다. 여러 가설에 관측 적합도에 따른 가중치를 부여하고 새 집합을 만든다. [13–16쪽]\n\n1. 예측: odometry 이동량에 잡음을 더해 가설들을 움직인다. 이동이 불확실하면 가설이 더 퍼질 수 있다.\n2. 관측 갱신: 각 가설에서 레이저가 지도와 얼마나 맞는지 비교해 가중치를 바꾼다.\n3. 재표본화: 가중치가 큰 가설에서 다음 입자를 더 많이 뽑는다. 새로운 독립 센서 측정을 만들어내는 과정은 아니다.\n4. 적응: 실제 AMCL은 불확실성에 따라 입자 수를 조절한다. 브라우저 예제는 설명을 위해 정한 입자 수로 한 번의 갱신만 보여준다.\n\nRViz의 2D Pose Estimate는 초기 위치·방향과 불확실성을 주는 단계다. 입자 구름이 좁아졌다는 것은 필터의 가설이 집중됐다는 뜻이지 정답 보장이 아니다. 반복 복도, 지도 불일치, 틀린 센서 TF 때문에 오수렴할 수도 있다. [16쪽]\n\n## 4. 어제의 스캔 정합·칼만 필터와 무엇이 다를까?\n\n| 개념 | 표현과 처리 | 이번 수업에서 기억할 차이 |\n| --- | --- | --- |\n| Cartographer scan matching | 점·submap과 운동 예측 사이 정합 | 지도 작성의 로컬 자세와 연결된다. AMCL 재표본화와 같은 연산이 아니다. |\n| KF / EKF | 평균·공분산, 모델과 관측 결합 | EKF는 추정점 근처에서 선형화한 단봉 표현을 쓴다. 이전 38강의 1D 보정 예제를 참고한다. |\n| AMCL | 지도 위 여러 위치·방향 가설 | 여러 후보 위치를 입자로 표현하고 관측으로 가중치를 바꾼다. |\n\n모두 불확실한 입력을 다루지만 같은 입력·출력·상태를 가진 대체품은 아니다. EKF가 odom→base를, AMCL이 map→odom을 맡는 구성에서는 서로 다른 책임으로 협력한다. 실제 sensor fusion과 TF 발행 책임은 사용하는 시스템에 맞춰 확인한다.\n\n## 5. AMCL 파라미터를 네 묶음으로 읽기\n\n| 묶음 | 교안 값·항목 | 쉽게 읽는 방법 |\n| --- | --- | --- |\n| frame·입력 | global=map, odom=odom, base=base_footprint, scan_topic | 같은 센서를 같은 시간·좌표계로 해석하는지 먼저 확인 |\n| 가설 수 | min_particles=500, max_particles=2000, pf_err=0.05, pf_z=0.99 | 가설 수·계산량과 적응 설정. 입자 수로 틀린 지도를 해결하지 못함 |\n| 이동 모델 | DifferentialMotionModel, alpha1–4 | 실제 odom의 직진·회전 오차를 반영하는 모델 |\n| 관측·갱신 | likelihood_field, sigma_hit=0.2 m, update_min_d=0.25 m, update_min_a=0.2 rad | 관측 일치의 폭과 필터 갱신 조건을 구분 |\n\nWaffle은 차동 구동이므로 횡이동이 안 된다. nav2_amcl::DifferentialMotionModel을 사용하며 Omni 모델용 alpha5를 차동 모델의 핵심 튜닝 항으로 외우지 않는다. [17–23쪽]\n\nalpha1은 회전 때문에 발생하는 회전 잡음, alpha2는 이동 때문에 발생하는 회전 잡음, alpha3는 이동 때문에 발생하는 이동 잡음, alpha4는 회전 때문에 발생하는 이동 잡음이다. 계수를 크게 하면 “더 정확함”이 아니라 해당 운동을 더 불확실하게 모델링하는 것이다. 직진·회전 실험으로 오차 경향을 먼저 본다. [20–21쪽]\n\nlikelihood_field는 레이저 끝점과 지도 장애물 간 거리를 이용한다. sigma_hit는 그 거리 오차 모델의 폭이다. 좁게 두면 작은 불일치에 민감해질 수 있다. z_hit/z_rand=0.5/0.5는 교안의 관측 혼합 가중치다. beam 모델과 사용 항이 다르므로 z_short·z_max를 모든 모델에 똑같이 적용하지 않는다. [22쪽]\n\nupdate_min_a=0.2 rad는 약 11.46°다. 어제 Cartographer의 motion_filter 예시 0.1°와 단위도 역할도 다르다. max_beams=60은 평가할 광선 수, resample_interval=1은 필터 갱신마다 재표본화하는 설정이다. transform_tolerance=1.0 s는 TF의 시간 여유이며 통신 지연 자체를 고치는 값이 아니다. [23–24쪽]\n\n## 6. Planner: 경로를 만드는 방법\n\n경로(Path)는 지나갈 위치·방향의 열이다. 시간에 따른 속도까지 반드시 포함하지 않는다. Controller가 운동 제약과 주변 장애물을 보며 추종한다. [8–9쪽]\n\n| 방식 | 후보를 고르는 원리 | 선택·비교 시 확인 |\n| --- | --- | --- |\n| Dijkstra | 출발점부터 누적 비용 g 최소 | 음수가 아닌 비용 그래프에서 최소 비용 경로. 넓게 탐색할 수 있음 |\n| A* | f=g+h, 목표까지의 예상 비용 포함 | 휴리스틱·구현 조건에 따라 최적성 결정. 항상 더 짧거나 빠른 것은 아님 |\n| Smac 2D | 비용을 고려하는 2D A* | 제자리 방향 전환이 가능한 로봇에서 비교 |\n| Theta* | 가시선을 이용하는 any-angle 탐색 | 격자 방향 제약 완화와 실제 회전 가능성은 별개 |\n| Hybrid-A* | 위치·방향 SE(2)와 운동 모델 | 최소 회전 반경과 전후진 조건을 실제 구동계에 맞춤 |\n| State Lattice | 가능한 움직임 프리미티브 연결 | 프리미티브·격자를 로봇에 맞춤 |\n\nWaffle은 제자리 회전이 가능하고 횡이동은 불가하다. 차량용 회전 반경 제약을 이유 없이 추가하지 않는다. RRT·PRM은 확장 계획 기법이며 Nav2 기본 플러그인 선택 목록과 구분한다. [5, 28–40쪽]\n\nNavFn에서 use_astar=false/true로 Dijkstra/A*를 바꾼다. allow_unknown=false는 미탐색 셀 통과를 허용하지 않는 예다. Unknown을 빈 공간으로 단정하지 않는다. 같은 지도·출발·목표·비용에서 비교해야 알고리즘 차이를 읽을 수 있다. [30–32, 40쪽]\n\nNavFn tolerance는 정확한 목표가 막혔을 때 근처에서 경로 끝점을 찾는 범위다. xy_goal_tolerance는 실제 주행의 목표 도착 판정 범위다. 단위가 m로 같아도 같은 설정이 아니다. [32, 75쪽]\n\n## 7. Controller: 경로에서 다음 속도로\n\nWaffle은 vx와 wz를 사용하고 vy=0이다. Controller는 현재 위치·속도·경로·local costmap을 받아 다음 속도를 만든다. 새 장애물의 반영과 필요 시 전역 재계획도 함께 동작해야 한다. [42쪽]\n\n| Controller | 핵심 과정 | 먼저 관찰할 것 |\n| --- | --- | --- |\n| DWB | 속도 후보 → 짧은 궤적 → Critic 비용 → 유효 후보 선택 | 후보 수, 진동, 충돌 검사, 경로·목표 비용의 균형 |\n| MPPI | 제어 시퀀스 샘플 → 미래 궤적 비용 → 가중 갱신 | 계산 시간, 시간 지평, 활성 Critic과 모델 |\n| RPP | 앞쪽 lookahead 지점 추종과 속도 규제 | 코너 추종 오차·속도·충돌 검사 |\n| Graceful | 매끄러운 접근·경로 추종 | lookahead와 제어 이득·운동·장애물 제약 |\n| Rotation Shim | 본 Controller 앞의 방향 정렬 | 시작 각도·회전 속도·primary_controller |\n\nDWB를 ROS 1 DWA와 완전히 동일하게 설명하지 않는다. StandardTrajectoryGenerator와 LimitedAccelGenerator는 후보 생성 방식이 다르다. Critic의 충돌 유효성 검사를 단순히 작은 가중치로 대신하지 않는다. [43–48쪽]\n\nMPPI는 첫 제어만 적용하고 다음 주기에 새 상태로 다시 계산한다. NVIDIA GPU 필수 알고리즘이 아니다. 교안 예측 길이 56×0.05=2.8 s, batch_size=2000, iteration_count=1은 설치본 참고값이다. 20 Hz라면 한 주기 예산은 50 ms다. 후보·단계를 늘리기 전에 실제 주기 초과를 측정한다. 2.8 s 동안 0.1 m/s로 일정하게 직진하면 0.28 m지만 실제 궤적은 속도 변화와 회전·관측 범위에 따라 달라진다. [49–55, 77쪽]\n\n교안 설치본 MPPI는 motion_model: diff_drive와 mppi::DiffDriveMotionModel 플러그인을 사용한다. 옛 DiffDrive 문자열이나 다른 버전 예제를 그대로 복사하지 않는다. MPPI temperature=0.3은 비용 가중 민감도, gamma=0.015는 제어 에너지 관련 정규화이며 Critic의 cost_weight와 역할이 다르다. [54–58쪽]\n\nRPP lookahead_dist가 작으면 민감하고 크면 코너를 크게 돌 수 있다. RPP는 복잡한 우회 계획을 대신하지 않는다. 교안의 DWPP는 Rolling 확장 소개이며 설치본에서 검증한 기본 기능이 아니다. RPP 최대 선속도 파라미터 이름도 설치본에서 확인한다. [59–65쪽]\n\n## 8. Costmap: 벽과 가까운 경로가 왜 더 비쌀까?\n\n점유 지도는 점유·자유·미지 상태를 나타내고 Costmap은 주행 위험을 비용으로 표현한다. Global은 map 기준의 경로 계획, Local은 보통 odom 기준 rolling window에서 주변 충돌·제어 평가를 담당한다. Static·Obstacle·Voxel·Inflation 레이어는 plugins 목록에 포함돼야 활성화된다. [27, 67쪽]\n\n- Footprint/robot_radius: 실제 외곽과 부착물을 반영한다. 통로를 지나게 하려고 작게 속이지 않는다.\n- Inflation radius: 장애물 주변에 비용을 퍼뜨리는 범위다. 실제 몸체 반경과 다르다.\n- Cost scaling factor: 같은 반경에서 클수록 비용이 더 빨리 감소한다. 숫자가 크다고 위험 영역이 더 넓어지는 것이 아니다.\n- Resolution: 셀 한 변 길이다. 같은 면적에서 한 변을 절반으로 하면 셀 수는 약 4배다. 정확도가 자동 4배 향상되는 것은 아니다.\n- Marking/clearing: 장애물 등록·제거다. 유령 장애물은 range뿐 아니라 센서·TF·시간을 확인한다.\n\n이는 어제의 submap 내부 해상도, 출력 지도 해상도와 구분하는 세 번째 맥락이다. 모두 m/cell로 읽을 수 있지만 적용 단계가 다르다. [68–70쪽 · 전날 21쪽]\n\n## 9. 경로 뒤에도 확인할 계층이 있다\n\nSmoother는 꺾임을 줄여도 충돌·운동 제약을 자동 보장하지 않는다. BT에서 SmoothPath가 호출돼야 적용된다. 전후진 전환점과 최소 회전 반경, 장애물 통과 여부를 다시 검사한다. [71–74쪽]\n\nGoal Checker는 위치·방향 도달을, Progress Checker는 시간 안의 진행을 평가한다. 지나치게 작은 yaw 허용 오차는 목표에서 회전을 지속하게 할 수 있다. [75쪽]\n\nVelocity Smoother는 속도·가감속 명령을 다루고 Collision Monitor는 센서 기반 감속·정지 감시를 추가한다. Behavior Server는 회전·후진·대기 등의 복구 동작을 제공한다. Controller와 구동계의 제한·명령 타입·토픽·활성 상태를 함께 맞춘다. [76–79쪽]\n\n## 10. 내 환경에 맞춘 실습 실행 순서\n\nHTML의 “환경·명령어”에서 실행 위치, 배포판, setup·workspace 경로, 토픽·frame과 package/launch를 지정한다. 아래는 Linux/WSL·컨테이너·원격 Linux의 Bash 변수형 예제다. 네이티브 Windows PowerShell은 별도 안내를 사용한다. 지도·설정 파일과 패키지가 실제로 있어야 하며 교안의 Ubuntu/Lyrical/Waffle 조합을 모든 환경의 호환성 보장으로 확대하지 않는다. [4, 82–85쪽]\n\n먼저 Cartographer·cuVSLAM의 map→odom 발행과 키보드 텔레옵을 중지한다. Gazebo 자체는 주행 시뮬레이션에 필요하므로 함께 종료하지 않는다.\n\n```bash\n# 먼저 ROS_DISTRO, NAV_MAP_YAML, SCAN_TOPIC, ODOM_FRAME, BASE_FRAME 지정\nsource \"/opt/ros/${ROS_DISTRO:?배포판을 지정하세요}/setup.bash\"\nMAP_YAML=\"${NAV_MAP_YAML:?실제 저장 지도 YAML 경로를 지정하세요}\"\nls \"$MAP_YAML\"\nros2 topic list -t\n# 시뮬레이션 모드일 때만 clock을 확인\nros2 topic hz \"${CLOCK_TOPIC:?실제 clock 토픽을 지정하세요}\"\nros2 topic hz \"${SCAN_TOPIC:?실제 scan 토픽을 지정하세요}\"\nros2 run tf2_ros tf2_echo \"${ODOM_FRAME:?odom frame 지정}\" \"${BASE_FRAME:?몸체 frame 지정}\"\n```\n\n모든 터미널의 ROS_DOMAIN_ID를 통신 상대와 맞춘다. 관찰 명령은 각각 확인 후 Ctrl+C로 종료한다. 설치 경로가 다르면 실제 setup 파일을 사용한다. 다음 launch 인자 이름은 흔한 예이며 실제 --show-args 출력에 있는 항목만 사용한다. YAML도 선택한 로봇·배포판·Nav2 버전용으로 준비한다.\n\n```bash\nros2 pkg prefix \"${NAV_PACKAGE:?Nav2 실행 패키지 지정}\"\nros2 launch \"$NAV_PACKAGE\" \"${NAV_LAUNCH:?launch 파일명 지정}\" --show-args\n# 아래 map/params_file/use_sim_time 지원을 확인한 설치본에서만 사용\nros2 launch \"$NAV_PACKAGE\" \"$NAV_LAUNCH\" \\\n  map:=\"$MAP_YAML\" \\\n  params_file:=\"${NAV_PARAMS_YAML:?로봇·설치본에 맞는 YAML 경로 지정}\" \\\n  use_sim_time:=\"${USE_SIM_TIME:?시뮬레이션 true 또는 실기기 false 지정}\"\n```\n\n별도 같은 ROS 환경의 터미널에서 RViz 실행 설정을 확인하고 초기 위치·활성 상태·명령 타입을 점검한다. 네임스페이스가 있으면 해당 이름을 사용한다.\n\n```bash\n# RViz launch 이름·인자는 설치본에서 확인\nros2 launch \"$NAV_PACKAGE\" \"${RVIZ_LAUNCH:?RViz launch 파일명 지정}\" --show-args\nros2 node list\n# 위 목록의 실제 노드 이름으로 조회\nros2 lifecycle get \"${AMCL_NODE:?실제 AMCL 노드 이름 지정}\"\nros2 lifecycle get \"${CONTROLLER_NODE:?실제 Controller 노드 이름 지정}\"\nros2 topic info \"${CMD_VEL_TOPIC:?실제 명령 토픽 지정}\" -v\n```\n\nRViz 2D Pose Estimate → 지도 벽과 scan 정렬 → 자유 공간의 가까운 Nav2 Goal 순서다. 교안의 MPPI vx_max=0.1 m/s, wz_max=0.2 rad/s와 Velocity Smoother max_velocity=[0.1,0,0.2]는 보수적인 시뮬레이션 시작값이다. 후진·가감속 제한과 enable_stamped_cmd_vel, 연결 노드의 TwistStamped 타입까지 확인한다. [84–85쪽]\n\n## 11. 증상을 보고 어느 단계부터 확인할까?\n\n| 증상 | 먼저 확인 | 그다음 비교 |\n| --- | --- | --- |\n| 지도는 맞는데 로봇 위치가 틀림 | 초기 위치·scan 정렬·TF·시간·odom·지도 | AMCL 모델·관측·입자 설정 |\n| 벽에 너무 붙음 | 실제 Footprint·Inflation | Planner 비용·Controller 장애물 비용 |\n| 코너에서 진동 | 위치 추정·경로·후보 궤적 | 속도·각속도·Critic 균형 |\n| 경로는 있지만 움직이지 않음 | lifecycle active·cmd_vel 타입/토픽·정지 감시 | Controller 유효 후보·구동계 연결 |\n| 제어 주기를 넘김 | 실제 계산 시간·센서/Costmap 주기 | MPPI 단계·후보 수, DWB 샘플, 활성 Critic |\n\n조정 순서는 지도·TF·시간·센서·odom·AMCL → Footprint·Costmap·속도·가속 → Planner → Controller → 도착·진행 판정이다. [25, 78–79쪽]\n\n## 12. 비교 실험과 복습\n\n같은 지도·출발·목표·속도에서 NavFn Dijkstra↔A*를 비교한다. 그다음 Controller만 교체한다. 실험별 YAML을 복사하고 plugin과 해당 파라미터 묶음을 함께 바꾼 뒤 재시작·노드 상태·토픽을 확인한다. [86–89쪽]\n\n기록 양식: 지도/YAML 버전 / 시작·목표 / 알고리즘 / 변경 한 항목 / 예상 / 도달 성공·실패 / 시간·거리 / 최소 장애물 간격 / 진동·재계획·복구 / CPU·주기 초과 / 다음 실험.\n\n복습 질문:\n\n1. AMCL을 켤 때 Cartographer의 map→odom 발행을 중지하는 이유는? 같은 TF 변의 발행 책임이 중복되기 때문이다.\n2. AMCL 입자가 모였는데도 틀릴 수 있나? 반복 구조·잘못된 모델·지도·TF로 오수렴할 수 있다.\n3. A* 경로가 있어도 왜 정지할까? 경로는 명령이나 구동 결과가 아니며 Controller·타입·상태·감시·구동계를 확인해야 한다.\n4. Inflation radius와 robot_radius는 같은가? 비용 범위와 실제 몸체 외곽은 다르다.\n5. MPPI batch_size를 두 배로 하기 전에 무엇을 재나? 제어 주기 안의 처리 시간과 실제 주기 초과를 측정한다.\n6. NavFn tolerance를 키우면 Goal Checker 허용 오차도 바뀌나? 별도 역할과 설정이므로 그렇지 않다.\n\n관련 기존 강의: 37강 SLAM → 38강 상태 추정 → 39강 데이터 흐름 → 40강 Nav2 구조 → 43강 Waypoint → 44강 튜닝 → 45강 성능 측정. 41·42강의 cuVSLAM/nvblox는 오늘 기본 AMCL/Gazebo 실습과 구분한다.\n"]],"markdown":"# Nav2·AMCL 수업 정리\n\n2026-10-15 · KANT 교안 91쪽 · 전날 Cartographer 수업과 연결\n\n이 자료는 교안의 Waffle / ROS 2 Lyrical / 설치본 Nav2 1.5.0 설명을 바탕으로 한다. 표의 숫자는 교안 참고값 또는 명시된 예제값이다. Mac이나 실제 로봇에서 목표 도달을 검증한 기록이 아니다. 교안도 이번 제작에서 Nav2 목표 도달을 새로 검증하지 않았다고 밝힌다. [4, 85, 91쪽]\n\n## 1. 어제 만든 지도로 오늘 무엇을 할까?\n\n어제는 Cartographer가 센서와 odom을 이용해 지도와 위치를 함께 추정했다. 오늘은 저장한 지도 위에서 현재 위치를 찾고 목표까지 주행한다. 이때 지도 만들기, 위치 찾기, 경로 만들기, 바퀴를 움직일 속도 만들기를 나눠 이해한다. [6–10, 13–15쪽]\n\n| 질문 | 담당 | 입력 → 출력 | 이전 학습과 연결 |\n| --- | --- | --- | --- |\n| 여기는 어떤 공간인가? | Cartographer SLAM | scan·odom·TF → 지도와 자세 | 37강, 어제의 submap·loop closure |\n| 직전 위치에서 얼마나 움직였나? | odometry / 상태 추정 | 바퀴·선택한 센서 → 연속 상대 이동 | 38강, odom 누적 오차 |\n| 저장 지도에서 나는 어디인가? | AMCL | 저장 지도·scan·odom 기반 TF → 위치 가설과 전역 보정 | 38·39강, particle filter와 map→odom |\n| 목표까지 어디로 갈까? | Planner | 현재 위치·목표·global costmap → 경로 | 40강, 탐색과 비용 |\n| 지금 어떤 속도를 낼까? | Controller | 위치·속도·경로·local costmap → 속도 명령 | 44강, 추종과 충돌 평가 |\n| 언제 계획·제어·복구를 호출할까? | BT Navigator | 목표·각 작업의 결과 → 실행 흐름 | 40·43강, action·상태 전이 |\n\n경로가 나왔다고 로봇이 움직인 것은 아니다. 속도 명령이 나왔다고 목표 도달이 확인된 것도 아니다. 경로·명령·실제 움직임·도착 결과를 나눠 확인한다.\n\n## 2. 저장 파일과 TF부터 연결하기\n\nCartographer의 PGM/YAML은 2D 점유 지도이고 pbstream은 SLAM 상태다. 오늘 AMCL 실습의 map_server에는 저장 지도 YAML을 제공한다. 어제의 pbstream을 map YAML 대신 넣지 않는다. Cartographer의 고정 지도 위치 추정과 AMCL은 서로 다른 위치 추정 구성이다. [4, 6, 82–83쪽 · 전날 29–30쪽]\n\n저장 지도 주행의 좌표계:\n\n```text\nmap\n └─ odom                 AMCL: 전역 위치 보정\n     └─ base_footprint   Gazebo/odometry: 연속 상대 이동\n         └─ sensor      URDF: 장착 위치·방향\n```\n\nAMCL을 시작하기 전에 Cartographer·cuVSLAM의 map→odom 발행을 중지한다. 같은 변을 둘이 발행하면 전역 위치가 흔들릴 수 있다. Gazebo·Nav2·RViz의 clock과 use_sim_time도 맞춘다. [10–11쪽]\n\n회전을 무시한 1차원 예: odom 기준 몸체가 x=2.3 m이고 AMCL이 지도 기준 x=2.0 m로 추정하면, map→odom 보정은 −0.3 m다. (−0.3)+2.3=2.0이다. 실제 TF는 회전까지 포함한 변환 합성이다. map→odom이 보정돼도 odom→base의 연속 이동 역할은 유지한다.\n\n## 3. AMCL 입자는 무엇인가?\n\n입자 하나는 “로봇이 이 위치·방향에 있을지도 모른다”는 가설 하나다. 실제 AMCL의 상태는 (x, y, θ)다. 여러 가설에 관측 적합도에 따른 가중치를 부여하고 새 집합을 만든다. [13–16쪽]\n\n1. 예측: odometry 이동량에 잡음을 더해 가설들을 움직인다. 이동이 불확실하면 가설이 더 퍼질 수 있다.\n2. 관측 갱신: 각 가설에서 레이저가 지도와 얼마나 맞는지 비교해 가중치를 바꾼다.\n3. 재표본화: 가중치가 큰 가설에서 다음 입자를 더 많이 뽑는다. 새로운 독립 센서 측정을 만들어내는 과정은 아니다.\n4. 적응: 실제 AMCL은 불확실성에 따라 입자 수를 조절한다. 브라우저 예제는 설명을 위해 정한 입자 수로 한 번의 갱신만 보여준다.\n\nRViz의 2D Pose Estimate는 초기 위치·방향과 불확실성을 주는 단계다. 입자 구름이 좁아졌다는 것은 필터의 가설이 집중됐다는 뜻이지 정답 보장이 아니다. 반복 복도, 지도 불일치, 틀린 센서 TF 때문에 오수렴할 수도 있다. [16쪽]\n\n## 4. 어제의 스캔 정합·칼만 필터와 무엇이 다를까?\n\n| 개념 | 표현과 처리 | 이번 수업에서 기억할 차이 |\n| --- | --- | --- |\n| Cartographer scan matching | 점·submap과 운동 예측 사이 정합 | 지도 작성의 로컬 자세와 연결된다. AMCL 재표본화와 같은 연산이 아니다. |\n| KF / EKF | 평균·공분산, 모델과 관측 결합 | EKF는 추정점 근처에서 선형화한 단봉 표현을 쓴다. 이전 38강의 1D 보정 예제를 참고한다. |\n| AMCL | 지도 위 여러 위치·방향 가설 | 여러 후보 위치를 입자로 표현하고 관측으로 가중치를 바꾼다. |\n\n모두 불확실한 입력을 다루지만 같은 입력·출력·상태를 가진 대체품은 아니다. EKF가 odom→base를, AMCL이 map→odom을 맡는 구성에서는 서로 다른 책임으로 협력한다. 실제 sensor fusion과 TF 발행 책임은 사용하는 시스템에 맞춰 확인한다.\n\n## 5. AMCL 파라미터를 네 묶음으로 읽기\n\n| 묶음 | 교안 값·항목 | 쉽게 읽는 방법 |\n| --- | --- | --- |\n| frame·입력 | global=map, odom=odom, base=base_footprint, scan_topic | 같은 센서를 같은 시간·좌표계로 해석하는지 먼저 확인 |\n| 가설 수 | min_particles=500, max_particles=2000, pf_err=0.05, pf_z=0.99 | 가설 수·계산량과 적응 설정. 입자 수로 틀린 지도를 해결하지 못함 |\n| 이동 모델 | DifferentialMotionModel, alpha1–4 | 실제 odom의 직진·회전 오차를 반영하는 모델 |\n| 관측·갱신 | likelihood_field, sigma_hit=0.2 m, update_min_d=0.25 m, update_min_a=0.2 rad | 관측 일치의 폭과 필터 갱신 조건을 구분 |\n\nWaffle은 차동 구동이므로 횡이동이 안 된다. nav2_amcl::DifferentialMotionModel을 사용하며 Omni 모델용 alpha5를 차동 모델의 핵심 튜닝 항으로 외우지 않는다. [17–23쪽]\n\nalpha1은 회전 때문에 발생하는 회전 잡음, alpha2는 이동 때문에 발생하는 회전 잡음, alpha3는 이동 때문에 발생하는 이동 잡음, alpha4는 회전 때문에 발생하는 이동 잡음이다. 계수를 크게 하면 “더 정확함”이 아니라 해당 운동을 더 불확실하게 모델링하는 것이다. 직진·회전 실험으로 오차 경향을 먼저 본다. [20–21쪽]\n\nlikelihood_field는 레이저 끝점과 지도 장애물 간 거리를 이용한다. sigma_hit는 그 거리 오차 모델의 폭이다. 좁게 두면 작은 불일치에 민감해질 수 있다. z_hit/z_rand=0.5/0.5는 교안의 관측 혼합 가중치다. beam 모델과 사용 항이 다르므로 z_short·z_max를 모든 모델에 똑같이 적용하지 않는다. [22쪽]\n\nupdate_min_a=0.2 rad는 약 11.46°다. 어제 Cartographer의 motion_filter 예시 0.1°와 단위도 역할도 다르다. max_beams=60은 평가할 광선 수, resample_interval=1은 필터 갱신마다 재표본화하는 설정이다. transform_tolerance=1.0 s는 TF의 시간 여유이며 통신 지연 자체를 고치는 값이 아니다. [23–24쪽]\n\n## 6. Planner: 경로를 만드는 방법\n\n경로(Path)는 지나갈 위치·방향의 열이다. 시간에 따른 속도까지 반드시 포함하지 않는다. Controller가 운동 제약과 주변 장애물을 보며 추종한다. [8–9쪽]\n\n| 방식 | 후보를 고르는 원리 | 선택·비교 시 확인 |\n| --- | --- | --- |\n| Dijkstra | 출발점부터 누적 비용 g 최소 | 음수가 아닌 비용 그래프에서 최소 비용 경로. 넓게 탐색할 수 있음 |\n| A* | f=g+h, 목표까지의 예상 비용 포함 | 휴리스틱·구현 조건에 따라 최적성 결정. 항상 더 짧거나 빠른 것은 아님 |\n| Smac 2D | 비용을 고려하는 2D A* | 제자리 방향 전환이 가능한 로봇에서 비교 |\n| Theta* | 가시선을 이용하는 any-angle 탐색 | 격자 방향 제약 완화와 실제 회전 가능성은 별개 |\n| Hybrid-A* | 위치·방향 SE(2)와 운동 모델 | 최소 회전 반경과 전후진 조건을 실제 구동계에 맞춤 |\n| State Lattice | 가능한 움직임 프리미티브 연결 | 프리미티브·격자를 로봇에 맞춤 |\n\nWaffle은 제자리 회전이 가능하고 횡이동은 불가하다. 차량용 회전 반경 제약을 이유 없이 추가하지 않는다. RRT·PRM은 확장 계획 기법이며 Nav2 기본 플러그인 선택 목록과 구분한다. [5, 28–40쪽]\n\nNavFn에서 use_astar=false/true로 Dijkstra/A*를 바꾼다. allow_unknown=false는 미탐색 셀 통과를 허용하지 않는 예다. Unknown을 빈 공간으로 단정하지 않는다. 같은 지도·출발·목표·비용에서 비교해야 알고리즘 차이를 읽을 수 있다. [30–32, 40쪽]\n\nNavFn tolerance는 정확한 목표가 막혔을 때 근처에서 경로 끝점을 찾는 범위다. xy_goal_tolerance는 실제 주행의 목표 도착 판정 범위다. 단위가 m로 같아도 같은 설정이 아니다. [32, 75쪽]\n\n## 7. Controller: 경로에서 다음 속도로\n\nWaffle은 vx와 wz를 사용하고 vy=0이다. Controller는 현재 위치·속도·경로·local costmap을 받아 다음 속도를 만든다. 새 장애물의 반영과 필요 시 전역 재계획도 함께 동작해야 한다. [42쪽]\n\n| Controller | 핵심 과정 | 먼저 관찰할 것 |\n| --- | --- | --- |\n| DWB | 속도 후보 → 짧은 궤적 → Critic 비용 → 유효 후보 선택 | 후보 수, 진동, 충돌 검사, 경로·목표 비용의 균형 |\n| MPPI | 제어 시퀀스 샘플 → 미래 궤적 비용 → 가중 갱신 | 계산 시간, 시간 지평, 활성 Critic과 모델 |\n| RPP | 앞쪽 lookahead 지점 추종과 속도 규제 | 코너 추종 오차·속도·충돌 검사 |\n| Graceful | 매끄러운 접근·경로 추종 | lookahead와 제어 이득·운동·장애물 제약 |\n| Rotation Shim | 본 Controller 앞의 방향 정렬 | 시작 각도·회전 속도·primary_controller |\n\nDWB를 ROS 1 DWA와 완전히 동일하게 설명하지 않는다. StandardTrajectoryGenerator와 LimitedAccelGenerator는 후보 생성 방식이 다르다. Critic의 충돌 유효성 검사를 단순히 작은 가중치로 대신하지 않는다. [43–48쪽]\n\nMPPI는 첫 제어만 적용하고 다음 주기에 새 상태로 다시 계산한다. NVIDIA GPU 필수 알고리즘이 아니다. 교안 예측 길이 56×0.05=2.8 s, batch_size=2000, iteration_count=1은 설치본 참고값이다. 20 Hz라면 한 주기 예산은 50 ms다. 후보·단계를 늘리기 전에 실제 주기 초과를 측정한다. 2.8 s 동안 0.1 m/s로 일정하게 직진하면 0.28 m지만 실제 궤적은 속도 변화와 회전·관측 범위에 따라 달라진다. [49–55, 77쪽]\n\n교안 설치본 MPPI는 motion_model: diff_drive와 mppi::DiffDriveMotionModel 플러그인을 사용한다. 옛 DiffDrive 문자열이나 다른 버전 예제를 그대로 복사하지 않는다. MPPI temperature=0.3은 비용 가중 민감도, gamma=0.015는 제어 에너지 관련 정규화이며 Critic의 cost_weight와 역할이 다르다. [54–58쪽]\n\nRPP lookahead_dist가 작으면 민감하고 크면 코너를 크게 돌 수 있다. RPP는 복잡한 우회 계획을 대신하지 않는다. 교안의 DWPP는 Rolling 확장 소개이며 설치본에서 검증한 기본 기능이 아니다. RPP 최대 선속도 파라미터 이름도 설치본에서 확인한다. [59–65쪽]\n\n## 8. Costmap: 벽과 가까운 경로가 왜 더 비쌀까?\n\n점유 지도는 점유·자유·미지 상태를 나타내고 Costmap은 주행 위험을 비용으로 표현한다. Global은 map 기준의 경로 계획, Local은 보통 odom 기준 rolling window에서 주변 충돌·제어 평가를 담당한다. Static·Obstacle·Voxel·Inflation 레이어는 plugins 목록에 포함돼야 활성화된다. [27, 67쪽]\n\n- Footprint/robot_radius: 실제 외곽과 부착물을 반영한다. 통로를 지나게 하려고 작게 속이지 않는다.\n- Inflation radius: 장애물 주변에 비용을 퍼뜨리는 범위다. 실제 몸체 반경과 다르다.\n- Cost scaling factor: 같은 반경에서 클수록 비용이 더 빨리 감소한다. 숫자가 크다고 위험 영역이 더 넓어지는 것이 아니다.\n- Resolution: 셀 한 변 길이다. 같은 면적에서 한 변을 절반으로 하면 셀 수는 약 4배다. 정확도가 자동 4배 향상되는 것은 아니다.\n- Marking/clearing: 장애물 등록·제거다. 유령 장애물은 range뿐 아니라 센서·TF·시간을 확인한다.\n\n이는 어제의 submap 내부 해상도, 출력 지도 해상도와 구분하는 세 번째 맥락이다. 모두 m/cell로 읽을 수 있지만 적용 단계가 다르다. [68–70쪽 · 전날 21쪽]\n\n## 9. 경로 뒤에도 확인할 계층이 있다\n\nSmoother는 꺾임을 줄여도 충돌·운동 제약을 자동 보장하지 않는다. BT에서 SmoothPath가 호출돼야 적용된다. 전후진 전환점과 최소 회전 반경, 장애물 통과 여부를 다시 검사한다. [71–74쪽]\n\nGoal Checker는 위치·방향 도달을, Progress Checker는 시간 안의 진행을 평가한다. 지나치게 작은 yaw 허용 오차는 목표에서 회전을 지속하게 할 수 있다. [75쪽]\n\nVelocity Smoother는 속도·가감속 명령을 다루고 Collision Monitor는 센서 기반 감속·정지 감시를 추가한다. Behavior Server는 회전·후진·대기 등의 복구 동작을 제공한다. Controller와 구동계의 제한·명령 타입·토픽·활성 상태를 함께 맞춘다. [76–79쪽]\n\n## 10. 내 환경에 맞춘 실습 실행 순서\n\nHTML의 “환경·명령어”에서 실행 위치, 배포판, setup·workspace 경로, 토픽·frame과 package/launch를 지정한다. 아래는 Linux/WSL·컨테이너·원격 Linux의 Bash 변수형 예제다. 네이티브 Windows PowerShell은 별도 안내를 사용한다. 지도·설정 파일과 패키지가 실제로 있어야 하며 교안의 Ubuntu/Lyrical/Waffle 조합을 모든 환경의 호환성 보장으로 확대하지 않는다. [4, 82–85쪽]\n\n먼저 Cartographer·cuVSLAM의 map→odom 발행과 키보드 텔레옵을 중지한다. Gazebo 자체는 주행 시뮬레이션에 필요하므로 함께 종료하지 않는다.\n\n```bash\n# 먼저 ROS_DISTRO, NAV_MAP_YAML, SCAN_TOPIC, ODOM_FRAME, BASE_FRAME 지정\nsource \"/opt/ros/${ROS_DISTRO:?배포판을 지정하세요}/setup.bash\"\nMAP_YAML=\"${NAV_MAP_YAML:?실제 저장 지도 YAML 경로를 지정하세요}\"\nls \"$MAP_YAML\"\nros2 topic list -t\n# 시뮬레이션 모드일 때만 clock을 확인\nros2 topic hz \"${CLOCK_TOPIC:?실제 clock 토픽을 지정하세요}\"\nros2 topic hz \"${SCAN_TOPIC:?실제 scan 토픽을 지정하세요}\"\nros2 run tf2_ros tf2_echo \"${ODOM_FRAME:?odom frame 지정}\" \"${BASE_FRAME:?몸체 frame 지정}\"\n```\n\n모든 터미널의 ROS_DOMAIN_ID를 통신 상대와 맞춘다. 관찰 명령은 각각 확인 후 Ctrl+C로 종료한다. 설치 경로가 다르면 실제 setup 파일을 사용한다. 다음 launch 인자 이름은 흔한 예이며 실제 --show-args 출력에 있는 항목만 사용한다. YAML도 선택한 로봇·배포판·Nav2 버전용으로 준비한다.\n\n```bash\nros2 pkg prefix \"${NAV_PACKAGE:?Nav2 실행 패키지 지정}\"\nros2 launch \"$NAV_PACKAGE\" \"${NAV_LAUNCH:?launch 파일명 지정}\" --show-args\n# 아래 map/params_file/use_sim_time 지원을 확인한 설치본에서만 사용\nros2 launch \"$NAV_PACKAGE\" \"$NAV_LAUNCH\" \\\n  map:=\"$MAP_YAML\" \\\n  params_file:=\"${NAV_PARAMS_YAML:?로봇·설치본에 맞는 YAML 경로 지정}\" \\\n  use_sim_time:=\"${USE_SIM_TIME:?시뮬레이션 true 또는 실기기 false 지정}\"\n```\n\n별도 같은 ROS 환경의 터미널에서 RViz 실행 설정을 확인하고 초기 위치·활성 상태·명령 타입을 점검한다. 네임스페이스가 있으면 해당 이름을 사용한다.\n\n```bash\n# RViz launch 이름·인자는 설치본에서 확인\nros2 launch \"$NAV_PACKAGE\" \"${RVIZ_LAUNCH:?RViz launch 파일명 지정}\" --show-args\nros2 node list\n# 위 목록의 실제 노드 이름으로 조회\nros2 lifecycle get \"${AMCL_NODE:?실제 AMCL 노드 이름 지정}\"\nros2 lifecycle get \"${CONTROLLER_NODE:?실제 Controller 노드 이름 지정}\"\nros2 topic info \"${CMD_VEL_TOPIC:?실제 명령 토픽 지정}\" -v\n```\n\nRViz 2D Pose Estimate → 지도 벽과 scan 정렬 → 자유 공간의 가까운 Nav2 Goal 순서다. 교안의 MPPI vx_max=0.1 m/s, wz_max=0.2 rad/s와 Velocity Smoother max_velocity=[0.1,0,0.2]는 보수적인 시뮬레이션 시작값이다. 후진·가감속 제한과 enable_stamped_cmd_vel, 연결 노드의 TwistStamped 타입까지 확인한다. [84–85쪽]\n\n## 11. 증상을 보고 어느 단계부터 확인할까?\n\n| 증상 | 먼저 확인 | 그다음 비교 |\n| --- | --- | --- |\n| 지도는 맞는데 로봇 위치가 틀림 | 초기 위치·scan 정렬·TF·시간·odom·지도 | AMCL 모델·관측·입자 설정 |\n| 벽에 너무 붙음 | 실제 Footprint·Inflation | Planner 비용·Controller 장애물 비용 |\n| 코너에서 진동 | 위치 추정·경로·후보 궤적 | 속도·각속도·Critic 균형 |\n| 경로는 있지만 움직이지 않음 | lifecycle active·cmd_vel 타입/토픽·정지 감시 | Controller 유효 후보·구동계 연결 |\n| 제어 주기를 넘김 | 실제 계산 시간·센서/Costmap 주기 | MPPI 단계·후보 수, DWB 샘플, 활성 Critic |\n\n조정 순서는 지도·TF·시간·센서·odom·AMCL → Footprint·Costmap·속도·가속 → Planner → Controller → 도착·진행 판정이다. [25, 78–79쪽]\n\n## 12. 비교 실험과 복습\n\n같은 지도·출발·목표·속도에서 NavFn Dijkstra↔A*를 비교한다. 그다음 Controller만 교체한다. 실험별 YAML을 복사하고 plugin과 해당 파라미터 묶음을 함께 바꾼 뒤 재시작·노드 상태·토픽을 확인한다. [86–89쪽]\n\n기록 양식: 지도/YAML 버전 / 시작·목표 / 알고리즘 / 변경 한 항목 / 예상 / 도달 성공·실패 / 시간·거리 / 최소 장애물 간격 / 진동·재계획·복구 / CPU·주기 초과 / 다음 실험.\n\n복습 질문:\n\n1. AMCL을 켤 때 Cartographer의 map→odom 발행을 중지하는 이유는? 같은 TF 변의 발행 책임이 중복되기 때문이다.\n2. AMCL 입자가 모였는데도 틀릴 수 있나? 반복 구조·잘못된 모델·지도·TF로 오수렴할 수 있다.\n3. A* 경로가 있어도 왜 정지할까? 경로는 명령이나 구동 결과가 아니며 Controller·타입·상태·감시·구동계를 확인해야 한다.\n4. Inflation radius와 robot_radius는 같은가? 비용 범위와 실제 몸체 외곽은 다르다.\n5. MPPI batch_size를 두 배로 하기 전에 무엇을 재나? 제어 주기 안의 처리 시간과 실제 주기 초과를 측정한다.\n6. NavFn tolerance를 키우면 Goal Checker 허용 오차도 바뀌나? 별도 역할과 설정이므로 그렇지 않다.\n\n관련 기존 강의: 37강 SLAM → 38강 상태 추정 → 39강 데이터 흐름 → 40강 Nav2 구조 → 43강 Waypoint → 44강 튜닝 → 45강 성능 측정. 41·42강의 cuVSLAM/nvblox는 오늘 기본 AMCL/Gazebo 실습과 구분한다.\n"},{"id":"18","file":"docs/18-isaac-class.md","title":"NVIDIA Isaac 생태계 · 시뮬레이션과 강화학습","framework":"2026-10-19 · KANT 수업 보충","intro":"기존 TF·SLAM·Nav2 학습에서 시뮬레이션·정책 학습·실제 배포로 연결합니다.","sections":[["수업 정리","# NVIDIA Isaac 생태계 · 시뮬레이션과 강화학습\n\n상태: 수업 복습·추가 설명. 실제 설치·학습·장치 시험 결과가 아닙니다.\n\n원본: /Users/june/Downloads/NVIDIA_Isaac_생태계_강화학습_설치_KANT_v1.pdf\n\n수업: 2026-10-19 / 공식 문서 비교: 2026-10-20\n\nMac Apple Silicon의 ROS 2 Docker 환경으로 가능한 ROS 개념 실습과 RTX·Jetson 전용 경로를 구분합니다. Docker만으로 NVIDIA GPU 환경이 생기는 것은 아닙니다.\n\n## 1. 어디에서 무엇을 계산할까?\n\n교안: 4–8쪽 / 연결: 65강, 66강, 68강\n\n이전 개념: 앞 수업에서 센서 데이터의 시간과 단위가 왜 중요했나요?\n\n개발 PC, RTX PC, Jetson은 서로 다른 역할을 맡습니다. 한 PC가 여러 역할을 겸할 수는 있지만, 설치·학습·현장 실행이라는 역할은 구분해야 합니다.\n장치 | 수업에서의 역할 | 창고 로봇 적용 예 |\nUbuntu 호스트 PC | Jetson OS 설치와 개발 준비 | 로봇에 들어갈 컴퓨터 초기 설정 |\nRTX PC | 시뮬레이션 실행과 정책 학습 | 가상 창고에서 여러 주행 실험 |\nJetson | 센서 처리와 모델 추론 | 실제 영상으로 현재 상태와 행동 계산 |\n모터 제어기 | 모터 구동과 하위 제어 | 바퀴가 목표 속도를 따르도록 제어 |\nCPU · GPU · CUDA\nCPU는 순서와 분기가 많은 처리, 통신, 파일, 작업 관리를 맡습니다. GPU는 영상·행렬·신경망처럼 비슷한 계산을 대량으로 수행할 때 유리합니다. CUDA는 NVIDIA GPU의 병렬 계산 기능을 활용하는 플랫폼입니다.\ncuDNN은 신경망 연산에 쓰이는 라이브러리이며, TensorRT는 학습한 모델의 추론 실행을 최적화하는 도구입니다. 모델을 학습하는 일과 학습한 모델을 실행하는 일은 다릅니다.\nRTX GPU의 VRAM에는 모델, 텍스처, 센서 출력 등이 들어갑니다. Jetson에서는 CPU와 GPU가 시스템 메모리를 공유하므로 모델과 ROS 노드, 센서가 함께 쓰는 메모리 양을 고려해야 합니다.\n빠른 GPU가 곧 빠른 로봇일까?\n전체 반응 시간에는 영상 획득, 대기, 전처리, 추론, 통신, 제어 전달이 포함됩니다. 초당 처리량과 입력부터 출력까지의 지연을 함께 확인해야 합니다.\n추가 예시 · 가정한 수치\n영상 획득·대기 30ms + 전처리 10ms + 추론 5ms + 통신·전달 15ms = 순차 처리 시 총 60ms. 추론을 2ms로 줄여도 총 57ms입니다. 영상 대기열이 쌓인다면 빠른 모델도 오래된 장면을 보고 움직일 수 있습니다.\n\n확인 질문: 추론만 빨라졌는데 로봇 반응이 거의 같다면?\n\n비교 답: 영상 대기·전처리·메모리 전달·통신·제어 지연을 포함한 전체 경로를 측정합니다.\n\n## 2. 로봇을 시험할 가상 세계\n\n교안: 9–13쪽 / 연결: 55강, 59강\n\n이전 개념: Nav2에서 로봇 몸체와 장애물을 어떻게 표현했나요?\n\nIsaac Sim은 로봇, 물리 법칙, 가상 센서가 있는 환경을 구성하고 시험하는 도구입니다. 창고의 선반·바닥·장애물과 로봇을 만들고, 제어 명령에 따른 움직임을 확인할 수 있습니다.\n겉모습만 그럴듯해서는 부족합니다. 질량, 관성, 바퀴 마찰, 충돌체, 관절 한계와 센서 위치를 맞춰야 합니다. 마찰이 다르면 미끄러지고 관성이 다르면 가속·회전 반응이 달라집니다.\n개념 | 의미 | 확인할 것 |\nURDF | 링크와 관절, 시각·충돌 형상, 관성 등 로봇 구조 기술 | 관절 방향, 충돌체, 질량·관성 |\nOpenUSD | 장면과 여러 자산을 계층적으로 조합·관리하는 기반 | 자산 배치, 계층과 물리 속성 |\n가상 센서와 합성 데이터\nRGB는 색 영상, 깊이는 표면까지의 거리, 분할은 픽셀이 속한 물체나 종류를 나타냅니다. 가상 세계는 물체의 위치와 종류를 알기 때문에 정답 라벨을 자동으로 만들 수 있습니다.\n추가 적용 예시\n상자 인식기를 만들 때 상자의 색, 조명, 카메라 각도를 바꿔 정답이 붙은 영상을 생성합니다. 다만 현실의 반사·먼지·흐림이 충분히 반영되는지 실제 데이터로도 검증해야 합니다.\n\n확인 질문: 가상 로봇의 겉모습이 정확하면 물리도 맞을까요?\n\n비교 답: 아닙니다. 질량·관성·충돌체·마찰과 관절·센서 설정을 따로 확인합니다.\n\n## 3. 그 세계에서 행동을 학습하기\n\n교안: 14–16쪽 / 연결: 55강, 60강\n\n이전 개념: 시뮬레이터에서 명령을 주면 무엇이 바뀌나요?\n\nIsaac Lab은 로봇 학습 과제를 구성하고 실험하는 프레임워크입니다. 가상 세계를 마련한 다음, 무엇을 관측하고 어떤 행동을 선택하며 결과를 어떻게 평가할지 정의합니다.\n구성 | 핵심 질문 | 이동 로봇 예시 |\n관측 | 어떤 정보를 줄까? | 목표 방향·거리, 현재 속도, 장애물 거리 |\n행동 | 무엇을 조절할까? | 전진 속도·회전 속도 목표 |\n보상 | 어떤 결과가 좋을까? | 목표 접근·도착, 충돌 벌점 |\n종료 | 언제 한 시도를 끝낼까? | 도착·충돌·시간 초과 |\n초기화 | 다음 시도는 어디에서 시작할까? | 시작점·목표·장애물 배치 변경 |\n병렬 환경 16개는 무엇을 뜻할까?\n보통 하나의 정책이 여러 환경에서 동시에 경험을 모읍니다. 환경마다 시작점과 상태를 달리할 수 있습니다. 환경이 16개라고 독립적인 정책 16개를 반드시 학습하는 것은 아닙니다.\n환경 수가 늘면 경험을 더 많이 모을 수 있지만 물리 상태와 센서 데이터를 위한 메모리도 증가합니다. 실행 속도가 환경 수에 비례해서 증가한다고 보장할 수는 없습니다.\n교안의 실행 경로\n본 실습 52–53쪽은 Newton 물리와 Newton 화면을 사용합니다. 부록 57쪽의 Isaac Sim PhysX·Kit 경로와 구분하세요. Lab을 항상 Isaac Sim 위에서만 실행하는 것으로 이해하면 이 실습 흐름을 놓치게 됩니다.\n\n확인 질문: 병렬 환경 16개는 독립 정책 16개를 뜻할까요?\n\n비교 답: 보통 하나의 정책이 여러 환경에서 경험을 모읍니다. 환경 수와 정책 수는 다릅니다.\n\n## 4. 프로그램을 연결하는 ROS 2\n\n교안: 17–18쪽 / 연결: 37강, 39강\n\n이전 개념: TF는 메시지를 전달하는 통로인가요?\n\n카메라, 위치 추정기, 주행 프로그램, 모터 드라이버는 별도의 프로그램으로 동작할 수 있습니다. ROS 2는 이들이 메시지를 주고받으며 협력하도록 돕습니다.\n용어 | 뜻 | 예시 |\nNode | 기능을 수행하는 실행 단위 | 카메라 드라이버, 위치 추정기 |\nTopic | 데이터를 발행하고 구독하는 통로 | 영상, 위치, 속도 명령 |\nMessage | 주고받는 데이터 형식 | 문자열, 이미지, 속도 데이터 |\nTF | 좌표계 사이의 위치·방향 관계 | 카메라·로봇·지도 좌표계 |\n시간 | 측정과 처리의 시각 | 카메라와 IMU 데이터 정렬 |\n카메라 노드영상 발행→위치 추정 노드위치 발행→주행 노드속도 명령→모터 드라이버구동\n토픽 이름으로 /camera/image_raw, /odom, /cmd_vel 등을 볼 수 있지만, 이름과 타입은 프로젝트 설정에 따라 달라집니다.\nTF와 시간이 틀리면?\n카메라가 로봇 중심보다 앞에 달려 있다면 “카메라에서 1m 앞”은 “로봇 중심에서 1m 앞”과 다릅니다. TF를 잘못 설정하면 장애물 위치를 엉뚱하게 해석할 수 있습니다. 서로 다른 시점의 영상과 IMU 데이터를 합치면 회전 중의 상태를 잘못 추정할 수도 있습니다.\nIsaac ROS는 ROS 2에서 사용할 NVIDIA 가속 패키지와 개발 도구입니다. ROS 2 설치와 cuVSLAM 등 Isaac ROS 기능 실행은 별도의 단계입니다.\n\n확인 질문: 카메라 좌표를 로봇 좌표로 바로 써도 될까요?\n\n비교 답: 장착 위치·방향과 관측 시각의 TF를 적용해야 합니다.\n\n## 5. 위치를 알고, 장면을 이해하고, 행동하기\n\n교안: 19–23쪽 / 연결: 41강, 42강\n\n이전 개념: SLAM과 AMCL은 어떤 조건에서 위치를 추정했나요?\n\nVSLAM, VLM, VLA는 입력이 일부 비슷해도 해결하는 문제와 출력이 다릅니다.\n개념 | 답하려는 질문 | 입력 → 출력 |\nVSLAM | 나는 어디에 있고 공간은 어떻게 생겼나? | 연속 영상·센서 → 위치와 기하학적 지도 |\nVLM | 이 장면은 무슨 의미인가? | 영상·언어 → 장면 설명·질의 응답 |\nVLA | 이 장면과 지시를 보고 어떻게 움직일까? | 영상·지시·로봇 상태 → 행동 또는 행동 토큰 |\nVSLAM은 연속 영상에서 특징의 변화 등을 이용해 움직임과 공간 구조를 추정합니다. 어둠, 무늬 없는 벽, 흔들린 영상, 잘못된 보정과 시각 정렬이 문제를 만들 수 있습니다. cuVSLAM은 NVIDIA의 가속 시각 위치 추정 기술입니다.\n위치 추정용 지도와 주행용 지도는 같은 형태가 아닐 수 있습니다. 특징점 지도만으로 로봇의 통행 가능 영역이 바로 정해지지는 않습니다. 주행에는 장애물 정보, 점유 지도, 비용지도 등이 추가로 필요할 수 있습니다.\nNav2는 위치와 환경 정보를 이용해 경로와 주행 명령을 구성하는 내비게이션 체계입니다. 카메라 영상만 넣으면 모든 주행 준비가 자동으로 끝나는 도구로 이해하면 안 됩니다.\n추가 적용 예시 · 빨간 상자\nVLM은 “통로에 빨간 상자가 있다”라고 설명할 수 있습니다. VLA는 “빨간 상자를 집어라”라는 지시와 영상을 보고 행동을 생성할 수 있습니다. 행동이 관절 목표인지 말단 이동량인지에 따라 실제 로봇 제어기와 연결하는 방법은 달라집니다.\nGR00T는 로봇 행동 모델과 개발 도구의 맥락에서 이해하세요. 모델 출력과 실제 로봇의 관측·제어 규격을 맞추는 작업이 필요합니다.\n\n확인 질문: VLM이 상자를 설명하면 바로 모터를 제어할 수 있나요?\n\n비교 답: 장면 설명과 행동 출력은 다릅니다. 행동 생성과 로봇별 변환·제어기가 필요합니다.\n\n## 6. 강화학습과 Cartpole\n\n교안: 25–27쪽 / 연결: 55강\n\n이전 개념: 이전 상태 추정에서 위치만으로 다음 이동을 판단할 수 있었나요?\n\n강화학습은 환경과 상호작용하며 결과에 대한 평가를 받아 행동을 개선합니다. 목표는 당장의 점수 하나보다 장기적으로 좋은 결과를 내는 정책을 학습하는 것입니다.\n관측현재 정보를 읽음→정책과 행동행동을 선택→환경상태가 변함→새 관측·보상경험을 수집\n수집한 경험으로 정책을 갱신한 뒤 이 과정을 반복합니다. 학습된 정책을 추론할 때는 매 행동마다 파라미터를 갱신할 필요가 없습니다.\n용어 | Cartpole에서의 의미 |\nAgent | 환경과 상호작용하는 학습 주체 |\nPolicy · 정책 | 관측을 받아 행동을 고르는 규칙 |\nEnvironment | 카트와 막대의 움직임을 계산하는 환경 |\nObservation | 카트 위치·속도, 막대 각도·각속도 |\nAction | 카트에 가하는 힘 |\nReward | 균형 유지 등에 대한 평가 신호 |\nEpisode | 초기화부터 실패 또는 시간 종료까지 한 번의 시도 |\nat = πθ(ot)\n현재 관측 oₜ를 정책에 넣어 행동 aₜ를 얻는 표현입니다. θ는 학습으로 바뀌는 파라미터입니다. 확률적 정책은 행동의 확률분포를 출력하기도 합니다.\n왜 각속도도 관측할까?\n막대가 오른쪽으로 5도 기울어져 있어도, 더 빠르게 넘어지는 중인지 중앙으로 돌아오는 중인지에 따라 필요한 힘이 다릅니다. 자세뿐 아니라 변화 속도를 알아야 다음 움직임을 더 잘 판단할 수 있습니다.\n\n확인 질문: 막대 각도가 같아도 행동이 달라질 수 있는 이유는?\n\n비교 답: 넘어지는 중인지 돌아오는 중인지 각속도 등 동적 상태가 다르기 때문입니다.\n\n## 7. 관측·행동·보상을 설계하기\n\n교안: 28–29쪽 / 연결: 55강, 59강\n\n이전 개념: Nav2의 속도 제한과 도착 판정은 왜 필요했나요?\n\n이동 로봇에게 “목표까지 3m, 왼쪽 20도, 속도 0.2m/s, 정면 장애물까지 0.8m”라는 관측을 주고 전진·회전 속도를 출력하게 할 수 있습니다.\n관측은 실제 로봇에서도 얻을 수 있어야 합니다. 시뮬레이터의 완벽한 정보를 사용했다면, 실제 배포에서도 해당 정보를 어떻게 제공할지 설계해야 합니다. 속도 목표를 출력하는 경우에는 이를 바퀴 움직임으로 바꾸는 하위 제어기가 필요합니다.\n교안의 보상 예시를 계산해보기\nrt = 2(dt − dt+1) − 0.01Δt도착 시 +10 · 충돌 시 −20\ndₜ − dₜ₊₁은 목표에 가까워진 거리, Δt는 한 스텝에 경과한 시간입니다. 계수와 단위는 원리를 설명하는 예시이며 실제 최적값이 아닙니다.\n직접 바꿔보기 · 한 스텝의 보상\n접근 거리 (m)스텝 시간 (초)\n멀어졌다면 접근 거리에 음수를 입력하세요.\n도착 +10 충돌 −20\n0.399\n2 × 0.2 − 0.01 × 0.1 = 0.399\n교안의 “경과 시간”을 누적 시간으로 쓸지, 스텝 시간으로 쓸지 명확히 정의해야 합니다. 스텝별 고정 벌점은 제어 주기가 달라지면 초당 벌점도 달라집니다.\n도착 보상을 여러 번 받을 수 있으면 목표 주변에서 반복 행동을 할 수 있고, 충돌 벌점이 약하면 위험한 지름길을 선호할 수 있습니다. 보상 항목의 크기뿐 아니라 도착·충돌 판정과 초기화 시점도 살펴봐야 합니다.\n\n확인 질문: 도착 보상을 반복 지급하면 어떤 문제가 생길까요?\n\n비교 답: 목표 주변 반복 행동으로 점수를 얻을 수 있습니다. 도착·종료·초기화 조건을 함께 설계합니다.\n\n## 8. 정책을 개선하고 성능을 평가하기\n\n교안: 30–32쪽 / 연결: 46강, 47강, 53강\n\n이전 개념: 학습 데이터에서 잘한 것과 새 조건에서 잘한 것은 같나요?\n\nLab은 환경을 구성하고, 연결된 학습 라이브러리는 PPO 같은 알고리즘으로 정책을 최적화합니다.\nPPO는 좋은 결과와 연결된 행동은 더 선택하고 나쁜 결과와 연결된 행동은 덜 선택하되, 한 번의 갱신으로 정책이 과도하게 바뀌지 않도록 유도합니다. 가치 추정은 앞으로의 보상을 예상하고, 어드밴티지는 결과가 해당 상황의 예상보다 얼마나 좋았는지 판단하는 데 쓰입니다.\nPPO-Clip은 정책을 크게 바꾸는 데서 얻는 추가 이득을 제한합니다. 정책 변화나 성능 개선을 절대 보장하는 장치는 아닙니다. PPO 공식 설명 ↗\n단계 | 하는 일 | 확인할 결과 |\n학습 | 경험 수집 후 정책 파라미터 갱신 | 보상·손실·체크포인트 |\n추론 | 학습한 정책으로 행동 생성 | 행동·실행 시간 |\n평가 | 정해진 새 조건에서 반복 시험 | 성공률·충돌률·실패 유형 |\nrandom_agent는 행동을 무작위로 선택하는 기준 실험입니다. 학습 전 신경망 정책의 실행 방식과 정확히 같다고 단정할 수는 없습니다.\n모방학습과 강화학습\n모방학습은 사람이 보여준 관측·행동 관계를 배웁니다. 예를 들어 사람이 원격 조작으로 상자를 집은 시연을 학습합니다. 강화학습은 상호작용과 보상으로 행동을 개선합니다. 시연으로 초기 행동을 배운 뒤 강화학습으로 개선하는 조합도 가능합니다.\n보상과 성공률을 함께 확인\n보상이 증가해도 충돌이 증가할 수 있습니다. 새 배치 100회에서의 도착률, 충돌률, 도착 시간과 실패 유형을 함께 측정하세요.\n\n확인 질문: 보상은 증가했는데 충돌도 늘었다면?\n\n비교 답: 보상 항목별 크기와 판정, 행동 제한을 확인하고 독립적인 성공·충돌 지표로 평가합니다.\n\n## 9. 시뮬레이션에서 실제 로봇으로\n\n교안: 33쪽 / 연결: 56강, 57강, 61강\n\n이전 개념: TF와 단위가 맞지 않으면 실제 제어에 어떤 일이 생기나요?\n\n실제 바닥의 마찰, 질량과 무게중심, 모터 응답, 센서 잡음과 통신 지연은 시뮬레이션과 다릅니다. 이 차이가 학습한 행동의 성능을 떨어뜨릴 수 있습니다.\n도메인 랜덤화는 마찰·탑재 무게·센서 잡음·제어 지연 등을 일정 범위에서 바꾸며 다양한 경험을 제공하는 방법입니다. 특정한 가상 조건에만 맞는 행동을 줄이려는 것입니다.\n배포 항목 | 잘못 연결한 예 |\n관측 순서 | 각도와 각속도 위치를 뒤바꿈 |\n단위 | 라디안 대신 도를 입력 |\n정규화 | 학습 때의 입력 변환을 누락 |\n행동 스케일 | −1~1 출력을 실제 속도로 잘못 변환 |\n제어 주기 | 학습 때보다 훨씬 느리게 실행 |\n좌표·부호 | 왼쪽·오른쪽 회전을 반대로 연결 |\n배포의 의미\n체크포인트를 불러오는 것에 더해 관측 생성, 전처리, 행동 변환, 하위 제어기를 맞춰야 합니다. 이후 작은 동작부터 실제 성능을 검증합니다.\n\n확인 질문: 학습 체크포인트 외에 배포에 필요한 것은?\n\n비교 답: 관측 생성·순서·정규화, 단위, 행동 변환, 제어 주기와 하위 제어 연결입니다.\n\n## 10. 설치 명령을 목적과 연결하기\n\n교안: 34–53쪽 · 부록 55–62쪽 / 연결: 41강, 59강\n\n이전 개념: 두 터미널에서 hello를 주고받으면 모터까지 검증된 걸까요?\n\n설치는 Jetson 준비, ROS 통신, RTX PC의 시뮬레이션·학습으로 나뉩니다. 각 단계의 성공이 무엇을 증명하는지 구분해야 합니다.\n흐름 | 주요 작업 | 확인한 범위 |\nJetson 준비 | 복구 모드, OS 플래시, 첫 부팅 | 목표 장치·저장장치에서 OS 부팅 |\nROS 준비 | 저장소·패키지 설치, 환경 설정, pub/echo | 기본 ROS 실행과 메시지 통신 |\nRTX PC 실습 | Sim과 Lab 과제 실행·학습·재생 | 해당 가상 환경과 정책 실행 |\n복구 모드는 Jetson에 시스템을 기록하기 위한 상태입니다. 교안 37쪽의 J14 연결은 공식 Orin Nano 개발 키트 기준이며 다른 보드는 제조사 절차를 따라야 합니다. 플래시는 선택한 저장장치의 기존 데이터를 지우므로 대상을 확인해야 합니다.\n명령어의 역할\n명령·도구 | 왜 필요한가? |\n저장소와 서명 키 | 패키지 공급 위치와 서명 검증 설정 |\napt update | 패키지 목록 갱신 |\napt-cache policy | 설치 가능한 후보 버전 확인 |\nsource …/setup.bash | 현재 셸에 ROS 환경 적용 |\nrosdep | 프로젝트 외부 의존성 설치 지원 |\ncolcon | ROS 패키지 빌드 |\nvenv · uv · lockfile | Python 환경 분리와 의존성 재현 |\n고정 커밋 | 교안이 사용한 코드 상태 재현 |\n48쪽 · 두 터미널 통신\n터미널 1 — 발행\nsource /opt/ros/lyrical/setup.bash\nros2 topic pub --rate 1 /test_topic   std_msgs/msg/String \"{data: 'hello'}\"\n터미널 2 — 구독\nsource /opt/ros/lyrical/setup.bash\nros2 topic echo /test_topic\ndata: hello가 반복되면 기본 메시지 통신이 동작합니다. 카메라 처리, 다른 장치와의 네트워크 통신, 실제 모터 제어까지 검증된 것은 아닙니다. 종료는 각 터미널에서 Ctrl+C를 누릅니다.\n52–53쪽 · Lab 실행을 읽는 법\n명령 | 목적 |\nrandom_agent | 환경·행동 연결과 무작위 행동 결과 관찰 |\ntrain | 경험 수집·정책 갱신·체크포인트 저장 |\nplay | 저장한 정책의 행동 확인 |\n--task는 과제, --num_envs 16은 병렬 환경 수, physics=newton_mjwarp는 물리 백엔드, --viz newton_gl은 화면 경로입니다. --checkpoint latest는 최근 체크포인트를 선택하는 교안 예시입니다.\n정책 재생이 실패하면 task, 체크포인트, 관측·행동 규격과 백엔드를 먼저 확인합니다. 실행이 느리면 환경 수와 메모리 사용량을 확인하고 작은 설정으로 동작부터 검증합니다.\n\n확인 질문: 이번 Jetson 기본 실습의 완료 범위는?\n\n비교 답: OS 부팅 확인, ROS 설치와 두 터미널 문자열 통신입니다. 전체 Isaac ROS나 실물 정책 배포 완료와 구분합니다.\n\n## 11. 교안과 비교해서 기억할 경계\n\n교안: 56–61쪽 · 공식 자료 교차 확인 / 연결: 55강, 65강\n\n이전 개념: 같은 ROS 이름이면 모든 OS에서 설치 방법이 같을까요?\n\n아래 내용은 앞선 설명에서 확인한 설치 조건과 미확인 사항을 함께 옮긴 것입니다. 확인 기준일은 2026년 10월 20일이며, 설치 재현이나 하드웨어 실행 시험을 완료했다는 뜻은 아닙니다.\nROS 통신과 Sim Bridge는 별도\n교안은 Jetson의 Lyrical 통신과 RTX PC의 Lab 시연을 독립 실행합니다. 56쪽은 Sim 6.2·Ubuntu 24.04의 ROS Bridge에 Jazzy를 권장하는 조건을 별도로 다룹니다. 두 실습 성공만으로 실제 로봇 연결이 완성되지는 않습니다.\n항목 | 교안 표기와 비교 | 근거 |\nIsaac Sim 6.2 | Python 3.12 · torch 2.11.0 · cu130 조합 확인 | 공식 Python 설치 문서 ↗ |\nIsaac Lab 3.0 + Sim 6.2 | 확인한 release/3.0.0 README는 Sim 6.1 대상 표기. 교안 고정 커밋의 요구사항 별도 확인 필요 | 상류 브랜치 ↗ |\nJetPack | Orin Nano · JP 7.2 · Ubuntu 24.04 확인. 정확한 7.2.1 / R39.2.1 패치 표기는 이번 공식 자료 조사에서 미확인 | 공식 JetPack 자료 ↗ |\nIsaac ROS 5.0 | Lyrical 전환과 Noble Buildfarm 확인. NVMe 조건은 교안에 명시되어 있으나 이번 조사에서 지원표 직접 검증은 미완료 | 공식 릴리스 노트 ↗ |\n교안의 설치 명령을 다른 버전의 명령과 섞기보다, 고정 커밋과 lockfile 및 해당 버전의 지원표를 한 세트로 확인하세요.\n\n확인 질문: Sim과 Lab 명령을 서로 다른 버전에서 섞어도 될까요?\n\n비교 답: 교안 고정 커밋·lockfile과 해당 버전 공식 지원표를 한 세트로 확인해야 합니다.\n\n## 12. 확인 문제와 프로젝트 적용\n\n교안: 54쪽 · 63쪽 / 연결: 45강, 53강\n\n이전 개념: 이전 Nav2 실습에서 어떤 지표로 주행을 평가했나요?\n\n먼저 답을 생각해본 뒤 펼쳐보세요.\n카메라 위치 시험, 정책 학습, 실제 영상 가속에는 각각 무엇을 쓸까?\n가상 카메라 위치·출력 시험은 Isaac Sim, 학습 과제 구성과 정책 평가는 Isaac Lab, ROS 2에서의 가속 영상 처리는 해당 Isaac ROS 패키지를 선택합니다.\n보상이 증가했는데 충돌도 늘었다면?\n보상 항목별 크기, 충돌 판정, 도착 판정, 종료·초기화, 행동 제한, 학습·평가 조건을 확인합니다. 목표 접근 보상이 충돌 벌점보다 과하게 유리한지, 충돌 이후 보상이 계속 누적되는지도 살펴봅니다.\nSD 카드 Orin Nano에서 이번 기본 실습은 어디까지일까?\n교안상 목표는 OS 부팅 확인, ROS 2 설치, 두 터미널의 문자열 통신입니다. Isaac ROS 전체 기능 실행이나 실제 모터에 강화학습 정책을 배포하는 단계는 별도입니다.\n나의 로봇 프로젝트로 연결하기\n설계 질문 | 창고 이동 로봇 예시 |\n어떤 작업을 하는가? | 주어진 목적지까지 장애물을 피해 이동 |\n무엇을 관측하는가? | 목표 방향·거리, 현재 속도, 장애물 거리 |\n무엇을 출력하는가? | 전진·회전 속도 목표 |\n학습이 필요한가? | 기존 Nav2·제어 방식과 학습 기반 접근의 필요성 비교 |\n어떤 도구를 선택하는가? | Sim에서 시험, 필요하면 Lab에서 학습, ROS로 연결, Jetson에서 실행 |\n무엇으로 성공을 판단하는가? | 새 환경에서의 도착률·충돌률·소요 시간 |\n입력, 출력, 성공 지표를 먼저 적고 나면 각 도구가 필요한 이유를 설명할 수 있습니다. 모든 프로젝트에 VLA나 강화학습이 필요한 것은 아니므로 목표 작업에 맞춰 선택하세요.\n\n확인 질문: 강화학습이 꼭 필요한 프로젝트인지 어떻게 판단할까요?\n\n비교 답: 목표 작업과 센서·입출력·성공 지표를 정하고 일반 제어·Nav2 등 기존 접근과 필요성을 비교합니다.\n\n## 공식 근거\n\n- https://spinningup.openai.com/en/latest/algorithms/ppo.html\n- https://docs.isaacsim.omniverse.nvidia.com/6.2.0/installation/install_python.html\n- https://github.com/isaac-sim/IsaacLab/tree/release/3.0.0\n- https://developer.nvidia.com/embedded/jetpack/downloads/archive-7.2\n- https://nvidia-isaac-ros.github.io/v/release-5.0/releases/index.html\n"]],"markdown":"# NVIDIA Isaac 생태계 · 시뮬레이션과 강화학습\n\n상태: 수업 복습·추가 설명. 실제 설치·학습·장치 시험 결과가 아닙니다.\n\n원본: /Users/june/Downloads/NVIDIA_Isaac_생태계_강화학습_설치_KANT_v1.pdf\n\n수업: 2026-10-19 / 공식 문서 비교: 2026-10-20\n\nMac Apple Silicon의 ROS 2 Docker 환경으로 가능한 ROS 개념 실습과 RTX·Jetson 전용 경로를 구분합니다. Docker만으로 NVIDIA GPU 환경이 생기는 것은 아닙니다.\n\n## 1. 어디에서 무엇을 계산할까?\n\n교안: 4–8쪽 / 연결: 65강, 66강, 68강\n\n이전 개념: 앞 수업에서 센서 데이터의 시간과 단위가 왜 중요했나요?\n\n개발 PC, RTX PC, Jetson은 서로 다른 역할을 맡습니다. 한 PC가 여러 역할을 겸할 수는 있지만, 설치·학습·현장 실행이라는 역할은 구분해야 합니다.\n장치 | 수업에서의 역할 | 창고 로봇 적용 예 |\nUbuntu 호스트 PC | Jetson OS 설치와 개발 준비 | 로봇에 들어갈 컴퓨터 초기 설정 |\nRTX PC | 시뮬레이션 실행과 정책 학습 | 가상 창고에서 여러 주행 실험 |\nJetson | 센서 처리와 모델 추론 | 실제 영상으로 현재 상태와 행동 계산 |\n모터 제어기 | 모터 구동과 하위 제어 | 바퀴가 목표 속도를 따르도록 제어 |\nCPU · GPU · CUDA\nCPU는 순서와 분기가 많은 처리, 통신, 파일, 작업 관리를 맡습니다. GPU는 영상·행렬·신경망처럼 비슷한 계산을 대량으로 수행할 때 유리합니다. CUDA는 NVIDIA GPU의 병렬 계산 기능을 활용하는 플랫폼입니다.\ncuDNN은 신경망 연산에 쓰이는 라이브러리이며, TensorRT는 학습한 모델의 추론 실행을 최적화하는 도구입니다. 모델을 학습하는 일과 학습한 모델을 실행하는 일은 다릅니다.\nRTX GPU의 VRAM에는 모델, 텍스처, 센서 출력 등이 들어갑니다. Jetson에서는 CPU와 GPU가 시스템 메모리를 공유하므로 모델과 ROS 노드, 센서가 함께 쓰는 메모리 양을 고려해야 합니다.\n빠른 GPU가 곧 빠른 로봇일까?\n전체 반응 시간에는 영상 획득, 대기, 전처리, 추론, 통신, 제어 전달이 포함됩니다. 초당 처리량과 입력부터 출력까지의 지연을 함께 확인해야 합니다.\n추가 예시 · 가정한 수치\n영상 획득·대기 30ms + 전처리 10ms + 추론 5ms + 통신·전달 15ms = 순차 처리 시 총 60ms. 추론을 2ms로 줄여도 총 57ms입니다. 영상 대기열이 쌓인다면 빠른 모델도 오래된 장면을 보고 움직일 수 있습니다.\n\n확인 질문: 추론만 빨라졌는데 로봇 반응이 거의 같다면?\n\n비교 답: 영상 대기·전처리·메모리 전달·통신·제어 지연을 포함한 전체 경로를 측정합니다.\n\n## 2. 로봇을 시험할 가상 세계\n\n교안: 9–13쪽 / 연결: 55강, 59강\n\n이전 개념: Nav2에서 로봇 몸체와 장애물을 어떻게 표현했나요?\n\nIsaac Sim은 로봇, 물리 법칙, 가상 센서가 있는 환경을 구성하고 시험하는 도구입니다. 창고의 선반·바닥·장애물과 로봇을 만들고, 제어 명령에 따른 움직임을 확인할 수 있습니다.\n겉모습만 그럴듯해서는 부족합니다. 질량, 관성, 바퀴 마찰, 충돌체, 관절 한계와 센서 위치를 맞춰야 합니다. 마찰이 다르면 미끄러지고 관성이 다르면 가속·회전 반응이 달라집니다.\n개념 | 의미 | 확인할 것 |\nURDF | 링크와 관절, 시각·충돌 형상, 관성 등 로봇 구조 기술 | 관절 방향, 충돌체, 질량·관성 |\nOpenUSD | 장면과 여러 자산을 계층적으로 조합·관리하는 기반 | 자산 배치, 계층과 물리 속성 |\n가상 센서와 합성 데이터\nRGB는 색 영상, 깊이는 표면까지의 거리, 분할은 픽셀이 속한 물체나 종류를 나타냅니다. 가상 세계는 물체의 위치와 종류를 알기 때문에 정답 라벨을 자동으로 만들 수 있습니다.\n추가 적용 예시\n상자 인식기를 만들 때 상자의 색, 조명, 카메라 각도를 바꿔 정답이 붙은 영상을 생성합니다. 다만 현실의 반사·먼지·흐림이 충분히 반영되는지 실제 데이터로도 검증해야 합니다.\n\n확인 질문: 가상 로봇의 겉모습이 정확하면 물리도 맞을까요?\n\n비교 답: 아닙니다. 질량·관성·충돌체·마찰과 관절·센서 설정을 따로 확인합니다.\n\n## 3. 그 세계에서 행동을 학습하기\n\n교안: 14–16쪽 / 연결: 55강, 60강\n\n이전 개념: 시뮬레이터에서 명령을 주면 무엇이 바뀌나요?\n\nIsaac Lab은 로봇 학습 과제를 구성하고 실험하는 프레임워크입니다. 가상 세계를 마련한 다음, 무엇을 관측하고 어떤 행동을 선택하며 결과를 어떻게 평가할지 정의합니다.\n구성 | 핵심 질문 | 이동 로봇 예시 |\n관측 | 어떤 정보를 줄까? | 목표 방향·거리, 현재 속도, 장애물 거리 |\n행동 | 무엇을 조절할까? | 전진 속도·회전 속도 목표 |\n보상 | 어떤 결과가 좋을까? | 목표 접근·도착, 충돌 벌점 |\n종료 | 언제 한 시도를 끝낼까? | 도착·충돌·시간 초과 |\n초기화 | 다음 시도는 어디에서 시작할까? | 시작점·목표·장애물 배치 변경 |\n병렬 환경 16개는 무엇을 뜻할까?\n보통 하나의 정책이 여러 환경에서 동시에 경험을 모읍니다. 환경마다 시작점과 상태를 달리할 수 있습니다. 환경이 16개라고 독립적인 정책 16개를 반드시 학습하는 것은 아닙니다.\n환경 수가 늘면 경험을 더 많이 모을 수 있지만 물리 상태와 센서 데이터를 위한 메모리도 증가합니다. 실행 속도가 환경 수에 비례해서 증가한다고 보장할 수는 없습니다.\n교안의 실행 경로\n본 실습 52–53쪽은 Newton 물리와 Newton 화면을 사용합니다. 부록 57쪽의 Isaac Sim PhysX·Kit 경로와 구분하세요. Lab을 항상 Isaac Sim 위에서만 실행하는 것으로 이해하면 이 실습 흐름을 놓치게 됩니다.\n\n확인 질문: 병렬 환경 16개는 독립 정책 16개를 뜻할까요?\n\n비교 답: 보통 하나의 정책이 여러 환경에서 경험을 모읍니다. 환경 수와 정책 수는 다릅니다.\n\n## 4. 프로그램을 연결하는 ROS 2\n\n교안: 17–18쪽 / 연결: 37강, 39강\n\n이전 개념: TF는 메시지를 전달하는 통로인가요?\n\n카메라, 위치 추정기, 주행 프로그램, 모터 드라이버는 별도의 프로그램으로 동작할 수 있습니다. ROS 2는 이들이 메시지를 주고받으며 협력하도록 돕습니다.\n용어 | 뜻 | 예시 |\nNode | 기능을 수행하는 실행 단위 | 카메라 드라이버, 위치 추정기 |\nTopic | 데이터를 발행하고 구독하는 통로 | 영상, 위치, 속도 명령 |\nMessage | 주고받는 데이터 형식 | 문자열, 이미지, 속도 데이터 |\nTF | 좌표계 사이의 위치·방향 관계 | 카메라·로봇·지도 좌표계 |\n시간 | 측정과 처리의 시각 | 카메라와 IMU 데이터 정렬 |\n카메라 노드영상 발행→위치 추정 노드위치 발행→주행 노드속도 명령→모터 드라이버구동\n토픽 이름으로 /camera/image_raw, /odom, /cmd_vel 등을 볼 수 있지만, 이름과 타입은 프로젝트 설정에 따라 달라집니다.\nTF와 시간이 틀리면?\n카메라가 로봇 중심보다 앞에 달려 있다면 “카메라에서 1m 앞”은 “로봇 중심에서 1m 앞”과 다릅니다. TF를 잘못 설정하면 장애물 위치를 엉뚱하게 해석할 수 있습니다. 서로 다른 시점의 영상과 IMU 데이터를 합치면 회전 중의 상태를 잘못 추정할 수도 있습니다.\nIsaac ROS는 ROS 2에서 사용할 NVIDIA 가속 패키지와 개발 도구입니다. ROS 2 설치와 cuVSLAM 등 Isaac ROS 기능 실행은 별도의 단계입니다.\n\n확인 질문: 카메라 좌표를 로봇 좌표로 바로 써도 될까요?\n\n비교 답: 장착 위치·방향과 관측 시각의 TF를 적용해야 합니다.\n\n## 5. 위치를 알고, 장면을 이해하고, 행동하기\n\n교안: 19–23쪽 / 연결: 41강, 42강\n\n이전 개념: SLAM과 AMCL은 어떤 조건에서 위치를 추정했나요?\n\nVSLAM, VLM, VLA는 입력이 일부 비슷해도 해결하는 문제와 출력이 다릅니다.\n개념 | 답하려는 질문 | 입력 → 출력 |\nVSLAM | 나는 어디에 있고 공간은 어떻게 생겼나? | 연속 영상·센서 → 위치와 기하학적 지도 |\nVLM | 이 장면은 무슨 의미인가? | 영상·언어 → 장면 설명·질의 응답 |\nVLA | 이 장면과 지시를 보고 어떻게 움직일까? | 영상·지시·로봇 상태 → 행동 또는 행동 토큰 |\nVSLAM은 연속 영상에서 특징의 변화 등을 이용해 움직임과 공간 구조를 추정합니다. 어둠, 무늬 없는 벽, 흔들린 영상, 잘못된 보정과 시각 정렬이 문제를 만들 수 있습니다. cuVSLAM은 NVIDIA의 가속 시각 위치 추정 기술입니다.\n위치 추정용 지도와 주행용 지도는 같은 형태가 아닐 수 있습니다. 특징점 지도만으로 로봇의 통행 가능 영역이 바로 정해지지는 않습니다. 주행에는 장애물 정보, 점유 지도, 비용지도 등이 추가로 필요할 수 있습니다.\nNav2는 위치와 환경 정보를 이용해 경로와 주행 명령을 구성하는 내비게이션 체계입니다. 카메라 영상만 넣으면 모든 주행 준비가 자동으로 끝나는 도구로 이해하면 안 됩니다.\n추가 적용 예시 · 빨간 상자\nVLM은 “통로에 빨간 상자가 있다”라고 설명할 수 있습니다. VLA는 “빨간 상자를 집어라”라는 지시와 영상을 보고 행동을 생성할 수 있습니다. 행동이 관절 목표인지 말단 이동량인지에 따라 실제 로봇 제어기와 연결하는 방법은 달라집니다.\nGR00T는 로봇 행동 모델과 개발 도구의 맥락에서 이해하세요. 모델 출력과 실제 로봇의 관측·제어 규격을 맞추는 작업이 필요합니다.\n\n확인 질문: VLM이 상자를 설명하면 바로 모터를 제어할 수 있나요?\n\n비교 답: 장면 설명과 행동 출력은 다릅니다. 행동 생성과 로봇별 변환·제어기가 필요합니다.\n\n## 6. 강화학습과 Cartpole\n\n교안: 25–27쪽 / 연결: 55강\n\n이전 개념: 이전 상태 추정에서 위치만으로 다음 이동을 판단할 수 있었나요?\n\n강화학습은 환경과 상호작용하며 결과에 대한 평가를 받아 행동을 개선합니다. 목표는 당장의 점수 하나보다 장기적으로 좋은 결과를 내는 정책을 학습하는 것입니다.\n관측현재 정보를 읽음→정책과 행동행동을 선택→환경상태가 변함→새 관측·보상경험을 수집\n수집한 경험으로 정책을 갱신한 뒤 이 과정을 반복합니다. 학습된 정책을 추론할 때는 매 행동마다 파라미터를 갱신할 필요가 없습니다.\n용어 | Cartpole에서의 의미 |\nAgent | 환경과 상호작용하는 학습 주체 |\nPolicy · 정책 | 관측을 받아 행동을 고르는 규칙 |\nEnvironment | 카트와 막대의 움직임을 계산하는 환경 |\nObservation | 카트 위치·속도, 막대 각도·각속도 |\nAction | 카트에 가하는 힘 |\nReward | 균형 유지 등에 대한 평가 신호 |\nEpisode | 초기화부터 실패 또는 시간 종료까지 한 번의 시도 |\nat = πθ(ot)\n현재 관측 oₜ를 정책에 넣어 행동 aₜ를 얻는 표현입니다. θ는 학습으로 바뀌는 파라미터입니다. 확률적 정책은 행동의 확률분포를 출력하기도 합니다.\n왜 각속도도 관측할까?\n막대가 오른쪽으로 5도 기울어져 있어도, 더 빠르게 넘어지는 중인지 중앙으로 돌아오는 중인지에 따라 필요한 힘이 다릅니다. 자세뿐 아니라 변화 속도를 알아야 다음 움직임을 더 잘 판단할 수 있습니다.\n\n확인 질문: 막대 각도가 같아도 행동이 달라질 수 있는 이유는?\n\n비교 답: 넘어지는 중인지 돌아오는 중인지 각속도 등 동적 상태가 다르기 때문입니다.\n\n## 7. 관측·행동·보상을 설계하기\n\n교안: 28–29쪽 / 연결: 55강, 59강\n\n이전 개념: Nav2의 속도 제한과 도착 판정은 왜 필요했나요?\n\n이동 로봇에게 “목표까지 3m, 왼쪽 20도, 속도 0.2m/s, 정면 장애물까지 0.8m”라는 관측을 주고 전진·회전 속도를 출력하게 할 수 있습니다.\n관측은 실제 로봇에서도 얻을 수 있어야 합니다. 시뮬레이터의 완벽한 정보를 사용했다면, 실제 배포에서도 해당 정보를 어떻게 제공할지 설계해야 합니다. 속도 목표를 출력하는 경우에는 이를 바퀴 움직임으로 바꾸는 하위 제어기가 필요합니다.\n교안의 보상 예시를 계산해보기\nrt = 2(dt − dt+1) − 0.01Δt도착 시 +10 · 충돌 시 −20\ndₜ − dₜ₊₁은 목표에 가까워진 거리, Δt는 한 스텝에 경과한 시간입니다. 계수와 단위는 원리를 설명하는 예시이며 실제 최적값이 아닙니다.\n직접 바꿔보기 · 한 스텝의 보상\n접근 거리 (m)스텝 시간 (초)\n멀어졌다면 접근 거리에 음수를 입력하세요.\n도착 +10 충돌 −20\n0.399\n2 × 0.2 − 0.01 × 0.1 = 0.399\n교안의 “경과 시간”을 누적 시간으로 쓸지, 스텝 시간으로 쓸지 명확히 정의해야 합니다. 스텝별 고정 벌점은 제어 주기가 달라지면 초당 벌점도 달라집니다.\n도착 보상을 여러 번 받을 수 있으면 목표 주변에서 반복 행동을 할 수 있고, 충돌 벌점이 약하면 위험한 지름길을 선호할 수 있습니다. 보상 항목의 크기뿐 아니라 도착·충돌 판정과 초기화 시점도 살펴봐야 합니다.\n\n확인 질문: 도착 보상을 반복 지급하면 어떤 문제가 생길까요?\n\n비교 답: 목표 주변 반복 행동으로 점수를 얻을 수 있습니다. 도착·종료·초기화 조건을 함께 설계합니다.\n\n## 8. 정책을 개선하고 성능을 평가하기\n\n교안: 30–32쪽 / 연결: 46강, 47강, 53강\n\n이전 개념: 학습 데이터에서 잘한 것과 새 조건에서 잘한 것은 같나요?\n\nLab은 환경을 구성하고, 연결된 학습 라이브러리는 PPO 같은 알고리즘으로 정책을 최적화합니다.\nPPO는 좋은 결과와 연결된 행동은 더 선택하고 나쁜 결과와 연결된 행동은 덜 선택하되, 한 번의 갱신으로 정책이 과도하게 바뀌지 않도록 유도합니다. 가치 추정은 앞으로의 보상을 예상하고, 어드밴티지는 결과가 해당 상황의 예상보다 얼마나 좋았는지 판단하는 데 쓰입니다.\nPPO-Clip은 정책을 크게 바꾸는 데서 얻는 추가 이득을 제한합니다. 정책 변화나 성능 개선을 절대 보장하는 장치는 아닙니다. PPO 공식 설명 ↗\n단계 | 하는 일 | 확인할 결과 |\n학습 | 경험 수집 후 정책 파라미터 갱신 | 보상·손실·체크포인트 |\n추론 | 학습한 정책으로 행동 생성 | 행동·실행 시간 |\n평가 | 정해진 새 조건에서 반복 시험 | 성공률·충돌률·실패 유형 |\nrandom_agent는 행동을 무작위로 선택하는 기준 실험입니다. 학습 전 신경망 정책의 실행 방식과 정확히 같다고 단정할 수는 없습니다.\n모방학습과 강화학습\n모방학습은 사람이 보여준 관측·행동 관계를 배웁니다. 예를 들어 사람이 원격 조작으로 상자를 집은 시연을 학습합니다. 강화학습은 상호작용과 보상으로 행동을 개선합니다. 시연으로 초기 행동을 배운 뒤 강화학습으로 개선하는 조합도 가능합니다.\n보상과 성공률을 함께 확인\n보상이 증가해도 충돌이 증가할 수 있습니다. 새 배치 100회에서의 도착률, 충돌률, 도착 시간과 실패 유형을 함께 측정하세요.\n\n확인 질문: 보상은 증가했는데 충돌도 늘었다면?\n\n비교 답: 보상 항목별 크기와 판정, 행동 제한을 확인하고 독립적인 성공·충돌 지표로 평가합니다.\n\n## 9. 시뮬레이션에서 실제 로봇으로\n\n교안: 33쪽 / 연결: 56강, 57강, 61강\n\n이전 개념: TF와 단위가 맞지 않으면 실제 제어에 어떤 일이 생기나요?\n\n실제 바닥의 마찰, 질량과 무게중심, 모터 응답, 센서 잡음과 통신 지연은 시뮬레이션과 다릅니다. 이 차이가 학습한 행동의 성능을 떨어뜨릴 수 있습니다.\n도메인 랜덤화는 마찰·탑재 무게·센서 잡음·제어 지연 등을 일정 범위에서 바꾸며 다양한 경험을 제공하는 방법입니다. 특정한 가상 조건에만 맞는 행동을 줄이려는 것입니다.\n배포 항목 | 잘못 연결한 예 |\n관측 순서 | 각도와 각속도 위치를 뒤바꿈 |\n단위 | 라디안 대신 도를 입력 |\n정규화 | 학습 때의 입력 변환을 누락 |\n행동 스케일 | −1~1 출력을 실제 속도로 잘못 변환 |\n제어 주기 | 학습 때보다 훨씬 느리게 실행 |\n좌표·부호 | 왼쪽·오른쪽 회전을 반대로 연결 |\n배포의 의미\n체크포인트를 불러오는 것에 더해 관측 생성, 전처리, 행동 변환, 하위 제어기를 맞춰야 합니다. 이후 작은 동작부터 실제 성능을 검증합니다.\n\n확인 질문: 학습 체크포인트 외에 배포에 필요한 것은?\n\n비교 답: 관측 생성·순서·정규화, 단위, 행동 변환, 제어 주기와 하위 제어 연결입니다.\n\n## 10. 설치 명령을 목적과 연결하기\n\n교안: 34–53쪽 · 부록 55–62쪽 / 연결: 41강, 59강\n\n이전 개념: 두 터미널에서 hello를 주고받으면 모터까지 검증된 걸까요?\n\n설치는 Jetson 준비, ROS 통신, RTX PC의 시뮬레이션·학습으로 나뉩니다. 각 단계의 성공이 무엇을 증명하는지 구분해야 합니다.\n흐름 | 주요 작업 | 확인한 범위 |\nJetson 준비 | 복구 모드, OS 플래시, 첫 부팅 | 목표 장치·저장장치에서 OS 부팅 |\nROS 준비 | 저장소·패키지 설치, 환경 설정, pub/echo | 기본 ROS 실행과 메시지 통신 |\nRTX PC 실습 | Sim과 Lab 과제 실행·학습·재생 | 해당 가상 환경과 정책 실행 |\n복구 모드는 Jetson에 시스템을 기록하기 위한 상태입니다. 교안 37쪽의 J14 연결은 공식 Orin Nano 개발 키트 기준이며 다른 보드는 제조사 절차를 따라야 합니다. 플래시는 선택한 저장장치의 기존 데이터를 지우므로 대상을 확인해야 합니다.\n명령어의 역할\n명령·도구 | 왜 필요한가? |\n저장소와 서명 키 | 패키지 공급 위치와 서명 검증 설정 |\napt update | 패키지 목록 갱신 |\napt-cache policy | 설치 가능한 후보 버전 확인 |\nsource …/setup.bash | 현재 셸에 ROS 환경 적용 |\nrosdep | 프로젝트 외부 의존성 설치 지원 |\ncolcon | ROS 패키지 빌드 |\nvenv · uv · lockfile | Python 환경 분리와 의존성 재현 |\n고정 커밋 | 교안이 사용한 코드 상태 재현 |\n48쪽 · 두 터미널 통신\n터미널 1 — 발행\nsource /opt/ros/lyrical/setup.bash\nros2 topic pub --rate 1 /test_topic   std_msgs/msg/String \"{data: 'hello'}\"\n터미널 2 — 구독\nsource /opt/ros/lyrical/setup.bash\nros2 topic echo /test_topic\ndata: hello가 반복되면 기본 메시지 통신이 동작합니다. 카메라 처리, 다른 장치와의 네트워크 통신, 실제 모터 제어까지 검증된 것은 아닙니다. 종료는 각 터미널에서 Ctrl+C를 누릅니다.\n52–53쪽 · Lab 실행을 읽는 법\n명령 | 목적 |\nrandom_agent | 환경·행동 연결과 무작위 행동 결과 관찰 |\ntrain | 경험 수집·정책 갱신·체크포인트 저장 |\nplay | 저장한 정책의 행동 확인 |\n--task는 과제, --num_envs 16은 병렬 환경 수, physics=newton_mjwarp는 물리 백엔드, --viz newton_gl은 화면 경로입니다. --checkpoint latest는 최근 체크포인트를 선택하는 교안 예시입니다.\n정책 재생이 실패하면 task, 체크포인트, 관측·행동 규격과 백엔드를 먼저 확인합니다. 실행이 느리면 환경 수와 메모리 사용량을 확인하고 작은 설정으로 동작부터 검증합니다.\n\n확인 질문: 이번 Jetson 기본 실습의 완료 범위는?\n\n비교 답: OS 부팅 확인, ROS 설치와 두 터미널 문자열 통신입니다. 전체 Isaac ROS나 실물 정책 배포 완료와 구분합니다.\n\n## 11. 교안과 비교해서 기억할 경계\n\n교안: 56–61쪽 · 공식 자료 교차 확인 / 연결: 55강, 65강\n\n이전 개념: 같은 ROS 이름이면 모든 OS에서 설치 방법이 같을까요?\n\n아래 내용은 앞선 설명에서 확인한 설치 조건과 미확인 사항을 함께 옮긴 것입니다. 확인 기준일은 2026년 10월 20일이며, 설치 재현이나 하드웨어 실행 시험을 완료했다는 뜻은 아닙니다.\nROS 통신과 Sim Bridge는 별도\n교안은 Jetson의 Lyrical 통신과 RTX PC의 Lab 시연을 독립 실행합니다. 56쪽은 Sim 6.2·Ubuntu 24.04의 ROS Bridge에 Jazzy를 권장하는 조건을 별도로 다룹니다. 두 실습 성공만으로 실제 로봇 연결이 완성되지는 않습니다.\n항목 | 교안 표기와 비교 | 근거 |\nIsaac Sim 6.2 | Python 3.12 · torch 2.11.0 · cu130 조합 확인 | 공식 Python 설치 문서 ↗ |\nIsaac Lab 3.0 + Sim 6.2 | 확인한 release/3.0.0 README는 Sim 6.1 대상 표기. 교안 고정 커밋의 요구사항 별도 확인 필요 | 상류 브랜치 ↗ |\nJetPack | Orin Nano · JP 7.2 · Ubuntu 24.04 확인. 정확한 7.2.1 / R39.2.1 패치 표기는 이번 공식 자료 조사에서 미확인 | 공식 JetPack 자료 ↗ |\nIsaac ROS 5.0 | Lyrical 전환과 Noble Buildfarm 확인. NVMe 조건은 교안에 명시되어 있으나 이번 조사에서 지원표 직접 검증은 미완료 | 공식 릴리스 노트 ↗ |\n교안의 설치 명령을 다른 버전의 명령과 섞기보다, 고정 커밋과 lockfile 및 해당 버전의 지원표를 한 세트로 확인하세요.\n\n확인 질문: Sim과 Lab 명령을 서로 다른 버전에서 섞어도 될까요?\n\n비교 답: 교안 고정 커밋·lockfile과 해당 버전 공식 지원표를 한 세트로 확인해야 합니다.\n\n## 12. 확인 문제와 프로젝트 적용\n\n교안: 54쪽 · 63쪽 / 연결: 45강, 53강\n\n이전 개념: 이전 Nav2 실습에서 어떤 지표로 주행을 평가했나요?\n\n먼저 답을 생각해본 뒤 펼쳐보세요.\n카메라 위치 시험, 정책 학습, 실제 영상 가속에는 각각 무엇을 쓸까?\n가상 카메라 위치·출력 시험은 Isaac Sim, 학습 과제 구성과 정책 평가는 Isaac Lab, ROS 2에서의 가속 영상 처리는 해당 Isaac ROS 패키지를 선택합니다.\n보상이 증가했는데 충돌도 늘었다면?\n보상 항목별 크기, 충돌 판정, 도착 판정, 종료·초기화, 행동 제한, 학습·평가 조건을 확인합니다. 목표 접근 보상이 충돌 벌점보다 과하게 유리한지, 충돌 이후 보상이 계속 누적되는지도 살펴봅니다.\nSD 카드 Orin Nano에서 이번 기본 실습은 어디까지일까?\n교안상 목표는 OS 부팅 확인, ROS 2 설치, 두 터미널의 문자열 통신입니다. Isaac ROS 전체 기능 실행이나 실제 모터에 강화학습 정책을 배포하는 단계는 별도입니다.\n나의 로봇 프로젝트로 연결하기\n설계 질문 | 창고 이동 로봇 예시 |\n어떤 작업을 하는가? | 주어진 목적지까지 장애물을 피해 이동 |\n무엇을 관측하는가? | 목표 방향·거리, 현재 속도, 장애물 거리 |\n무엇을 출력하는가? | 전진·회전 속도 목표 |\n학습이 필요한가? | 기존 Nav2·제어 방식과 학습 기반 접근의 필요성 비교 |\n어떤 도구를 선택하는가? | Sim에서 시험, 필요하면 Lab에서 학습, ROS로 연결, Jetson에서 실행 |\n무엇으로 성공을 판단하는가? | 새 환경에서의 도착률·충돌률·소요 시간 |\n입력, 출력, 성공 지표를 먼저 적고 나면 각 도구가 필요한 이유를 설명할 수 있습니다. 모든 프로젝트에 VLA나 강화학습이 필요한 것은 아니므로 목표 작업에 맞춰 선택하세요.\n\n확인 질문: 강화학습이 꼭 필요한 프로젝트인지 어떻게 판단할까요?\n\n비교 답: 목표 작업과 센서·입출력·성공 지표를 정하고 일반 제어·Nav2 등 기존 접근과 필요성을 비교합니다.\n\n## 공식 근거\n\n- https://spinningup.openai.com/en/latest/algorithms/ppo.html\n- https://docs.isaacsim.omniverse.nvidia.com/6.2.0/installation/install_python.html\n- https://github.com/isaac-sim/IsaacLab/tree/release/3.0.0\n- https://developer.nvidia.com/embedded/jetpack/downloads/archive-7.2\n- https://nvidia-isaac-ros.github.io/v/release-5.0/releases/index.html\n"},{"id":"15","file":"docs/15-tf-tree.md","title":"TF 트리와 발행 책임","framework":"REP 103 / REP 105 · 참조 URDF","intro":"팔과 카메라가 이동 베이스에 장착된 참조 트리입니다. 실제 URDF의 링크·joint·frame 이름·보정값으로 검증해야 합니다.","sections":[["읽는 방법","부모 → 자식은 좌표계 관계이며 topic 전달 화살표가 아닙니다. map→odom은 localization/SLAM, odom→base_link는 odometry source/EKF, 본체→장착점은 고정 URDF, 관절 경로는 joint_states로 계산합니다. 각 변의 publisher는 하나로 정합니다."],["그리퍼 카메라","gripper_link→gripper_camera_link는 정적 장착입니다. base_link에서 그리퍼 카메라까지 전체 경로는 팔 관절 때문에 동적입니다. arm_link_1→tool0는 중간 링크를 생략한 예시이며 실제 URDF에 생략된 관절을 추가해야 합니다."],["센서 축과 시간","body: x 전방·y 좌측·z 위. optical: z 전방·x 우측·y 아래. 물체 pose는 관측 timestamp의 TF로 계획 frame에 변환합니다. depth→scan은 가상 관측이며 실제 LaserScan header.frame_id와 변환을 확인합니다."],["발행 책임 등록부","map | parent: root | 동적 추정\n발행: localization / SLAM\n의미: 긴 시간 기준 위치. localization 보정으로 점프할 수 있음\n상태: 표준 관례\n\nodom | parent: map | 동적\n발행: localization 또는 SLAM: map→odom\n의미: 연속적 이동을 표현하지만 시간·거리에 따라 drift 누적\n상태: 표준 관례\n\nbase_link | parent: odom | 동적\n발행: odometry source 또는 EKF: odom→base_link (하나 선택)\n의미: 로봇에 붙어 이동하는 기준. x 전방, y 좌측, z 위\n상태: 표준 관례\n\npole_mount | parent: base_link | 정적\n발행: URDF fixed joint / 보정된 static TF\n의미: 본체에 고정된 pole camera의 장착 위치\n상태: 참조 제안\n\npole_camera_link | parent: pole_mount | 정적\n발행: robot_state_publisher 또는 camera driver (중복 금지)\n의미: 물리 장착과 calibration을 반영. 실제 driver frame 이름 사용\n상태: 참조 제안\n\npole_camera_optical_frame | parent: pole_camera_link | 정적\n발행: URDF / camera driver\n의미: optical: z 전방, x 우측, y 아래. body frame 축과 다름\n상태: REP 103 관례\n\narm_base_link | parent: base_link | 정적\n발행: URDF fixed joint\n의미: 모바일 매니퓰레이터일 때 본체에 고정. 별도 팔이면 실제 parent로 변경\n상태: 참조 제안\n\narm_link_1 | parent: arm_base_link | 동적\n발행: robot_state_publisher + joint_states\n의미: 실제 URDF의 joint 종류·축·joint_names에 따라 변환\n상태: 축약 예시\n\ntool0 | parent: arm_link_1 | 동적 경로 축약\n발행: robot_state_publisher + 실제 링크 체인\n의미: 그림은 중간 관절을 생략. 실제 URDF에는 모든 링크 포함\n상태: 축약 예시\n\ngripper_link | parent: tool0 | 정적 가정\n발행: URDF fixed joint\n의미: 그리퍼 관절·finger 링크는 실제 모델에서 추가\n상태: 참조 제안\n\ngripper_camera_link | parent: gripper_link | 정적 장착\n발행: URDF fixed joint / hand-eye calibration\n의미: 장착 TF는 정적이지만 base에서 카메라까지 전체 경로는 팔 운동으로 동적\n상태: 참조 제안\n\ngripper_camera_optical_frame | parent: gripper_camera_link | 정적\n발행: URDF / camera driver\n의미: object pose를 이 frame으로 받으면 해당 timestamp의 TF로 변환\n상태: REP 103 관례\n\nimu_link | parent: base_link | 정적\n발행: URDF fixed joint\n의미: IMU가 있을 때만 채택. 장착 축과 측정 covariance 확인\n상태: 선택 센서\n\nlaser_frame | parent: base_link | 정적\n발행: URDF fixed joint\n의미: 물리 라이다가 있는 경우. depth 가상 scan은 실제 message frame을 사용\n상태: 선택 센서"],["확인 절차","ROS 환경에서 실행:\nros2 run tf2_tools view_frames\nros2 run tf2_ros tf2_echo map base_link\nros2 run tf2_ros tf2_echo base_link gripper_camera_optical_frame\n\n필수: 끊김·중복 publisher·loop·stale timestamp·축·calibration·joint name 확인. TF 도구 패키지가 설치되어 있고 실제 broadcaster가 실행 중이어야 합니다."],["근거","REP 105: https://github.com/ros-infrastructure/rep/blob/master/rep-0105.rst\nREP 103: https://github.com/ros-infrastructure/rep/blob/master/rep-0103.rst"]],"markdown":"# TF 트리와 발행 책임\n\n상태: Draft · 실제 URDF 미검증\n\n팔과 카메라가 이동 베이스에 장착된 참조 트리입니다. 실제 URDF의 링크·joint·frame 이름·보정값으로 검증해야 합니다.\n\n## 읽는 방법\n\n부모 → 자식은 좌표계 관계이며 topic 전달 화살표가 아닙니다. map→odom은 localization/SLAM, odom→base_link는 odometry source/EKF, 본체→장착점은 고정 URDF, 관절 경로는 joint_states로 계산합니다. 각 변의 publisher는 하나로 정합니다.\n\n## 그리퍼 카메라\n\ngripper_link→gripper_camera_link는 정적 장착입니다. base_link에서 그리퍼 카메라까지 전체 경로는 팔 관절 때문에 동적입니다. arm_link_1→tool0는 중간 링크를 생략한 예시이며 실제 URDF에 생략된 관절을 추가해야 합니다.\n\n## 센서 축과 시간\n\nbody: x 전방·y 좌측·z 위. optical: z 전방·x 우측·y 아래. 물체 pose는 관측 timestamp의 TF로 계획 frame에 변환합니다. depth→scan은 가상 관측이며 실제 LaserScan header.frame_id와 변환을 확인합니다.\n\n## 발행 책임 등록부\n\nmap | parent: root | 동적 추정\n발행: localization / SLAM\n의미: 긴 시간 기준 위치. localization 보정으로 점프할 수 있음\n상태: 표준 관례\n\nodom | parent: map | 동적\n발행: localization 또는 SLAM: map→odom\n의미: 연속적 이동을 표현하지만 시간·거리에 따라 drift 누적\n상태: 표준 관례\n\nbase_link | parent: odom | 동적\n발행: odometry source 또는 EKF: odom→base_link (하나 선택)\n의미: 로봇에 붙어 이동하는 기준. x 전방, y 좌측, z 위\n상태: 표준 관례\n\npole_mount | parent: base_link | 정적\n발행: URDF fixed joint / 보정된 static TF\n의미: 본체에 고정된 pole camera의 장착 위치\n상태: 참조 제안\n\npole_camera_link | parent: pole_mount | 정적\n발행: robot_state_publisher 또는 camera driver (중복 금지)\n의미: 물리 장착과 calibration을 반영. 실제 driver frame 이름 사용\n상태: 참조 제안\n\npole_camera_optical_frame | parent: pole_camera_link | 정적\n발행: URDF / camera driver\n의미: optical: z 전방, x 우측, y 아래. body frame 축과 다름\n상태: REP 103 관례\n\narm_base_link | parent: base_link | 정적\n발행: URDF fixed joint\n의미: 모바일 매니퓰레이터일 때 본체에 고정. 별도 팔이면 실제 parent로 변경\n상태: 참조 제안\n\narm_link_1 | parent: arm_base_link | 동적\n발행: robot_state_publisher + joint_states\n의미: 실제 URDF의 joint 종류·축·joint_names에 따라 변환\n상태: 축약 예시\n\ntool0 | parent: arm_link_1 | 동적 경로 축약\n발행: robot_state_publisher + 실제 링크 체인\n의미: 그림은 중간 관절을 생략. 실제 URDF에는 모든 링크 포함\n상태: 축약 예시\n\ngripper_link | parent: tool0 | 정적 가정\n발행: URDF fixed joint\n의미: 그리퍼 관절·finger 링크는 실제 모델에서 추가\n상태: 참조 제안\n\ngripper_camera_link | parent: gripper_link | 정적 장착\n발행: URDF fixed joint / hand-eye calibration\n의미: 장착 TF는 정적이지만 base에서 카메라까지 전체 경로는 팔 운동으로 동적\n상태: 참조 제안\n\ngripper_camera_optical_frame | parent: gripper_camera_link | 정적\n발행: URDF / camera driver\n의미: object pose를 이 frame으로 받으면 해당 timestamp의 TF로 변환\n상태: REP 10
