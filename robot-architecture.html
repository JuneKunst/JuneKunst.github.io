 trajectory별로 센서 정렬기를 분리한다. 여러 trajectory의 대기·정렬 동작에 영향을 준다.","title":"Map Builder 2/2","scope":"공통"},{"slide":47,"text":"Lv.2 06 Cartographer\nKANT\n047\nTrajectory 공통\nTRAJECTORY_BUILDER\n파라미터\n기본 / 실습\n단위와 의미\ncollate_fixed_frame\ntrue\nbool / 고정 좌표계 입력을 센서 시간 정렬에 포함한다. 데이터 중단 시 대기 조건을 확인한다.\ncollate_landmarks\nfalse\nbool / 랜드마크를 센서 시간 정렬에 포함한다. true이면 메시지가 없는 구간의 대기에 유의한다.","title":"Trajectory 공통","scope":"공통"},{"slide":48,"text":"Lv.2 06 Cartographer\nKANT\n048\nTrajectory 위치 추정 정리\nTRAJECTORY_BUILDER.pure_localization_trimmer\n파라미터\n기본 / 실습\n단위와 의미\nmax_submaps_to_keep\n3 (주석 예시)\nsubmap 수 / pure localization에서 새 trajectory가 보관할 submap 수. 고정 지도를 읽는 옵션은 별개다.\n선택 기능 / 기본 Lua에서 활성화하지 않음","title":"Trajectory 위치 추정 정리","scope":"공통"},{"slide":49,"text":"Lv.2 06 Cartographer\nKANT\n049\nTrajectory Odom 필터\nTRAJECTORY_BUILDER.pose_graph_odometry_motion_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_time_seconds\n미지정\ns / 선택적 pose graph odometry 필터의 시간 차 기준. 로컬 SLAM motion_filter와 별도다.\nmax_distance_meters\n미지정\nm / 선택적 pose graph odometry 필터의 거리 차 기준. 로컬 SLAM motion_filter와 별도다.\nmax_angle_radians\n미지정\nrad / 선택적 pose graph odometry 필터의 회전 차 기준. 로컬 SLAM motion_filter와 별도다.\n선택 기능 / 기본 Lua에서 활성화하지 않음","title":"Trajectory Odom 필터","scope":"공통"},{"slide":50,"text":"Lv.2 06 Cartographer\nKANT\n050\n2D 기본 처리 1/4\nTRAJECTORY_BUILDER_2D\n파라미터\n기본 / 실습\n단위와 의미\nuse_imu_data\n기본 true 실습 false\nbool / 2D SLAM에서 IMU 입력을 사용한다. true로 바꾸기 전에 시각·축·TF를 점검한다.\nmin_range\n기본 0. 실습 0.12\nm / 이 거리보다 가까운 측정을 제거한다. 자기 몸체 반사와 센서 최소 유효 거리를 고려한다.\nmax_range\n기본 30. 실습 3.5\nm / 사용할 거리 측정의 상한. 줄이면 먼 노이즈와 계산량이 줄지만 구조 정보도 감소한다.","title":"2D 기본 처리 1/4","scope":"2D"},{"slide":51,"text":"Lv.2 06 Cartographer\nKANT\n051\n2D 기본 처리 2/4\nTRAJECTORY_BUILDER_2D\n파라미터\n기본 / 실습\n단위와 의미\nmin_z\n-0.8\nm / 2D 처리에 남길 점의 높이 하한. tracking 좌표계와 센서 장착 높이를 함께 확인한다.\nmax_z\n2.\nm / 2D 처리에 남길 점의 높이 상한. 평면과 관계없는 높은 구조의 점을 걸러낼 수 있다.\nmissing_data_ray_length\n기본 5. 실습 3.\nm / max_range를 넘긴 측정에 사용할 자유 공간 ray 길이. 장애물 hit와 구분한다.","title":"2D 기본 처리 2/4","scope":"2D"},{"slide":52,"text":"Lv.2 06 Cartographer\nKANT\n052\n2D 기본 처리 3/4\nTRAJECTORY_BUILDER_2D\n파라미터\n기본 / 실습\n단위와 의미\nnum_accumulated_range_data\n1\n입력 수 / 정합 전에 모을 거리 데이터 수. 늘리면 점은 많아지지만 갱신 지연도 증가한다.\nvoxel_filter_size\n0.025\nm / 고정 voxel 격자의 한 변 길이. 크게 하면 점 수가 줄고 작은 구조가 사라질 수 있다.\nuse_online_correlative_scan_matching\n기본 false 실습 true\nbool / 로컬 Ceres 정합 전 격자 탐색으로 초기 추정치를 보완한다. 켜면 탐색 비용이 추가된다.","title":"2D 기본 처리 3/4","scope":"2D"},{"slide":53,"text":"Lv.2 06 Cartographer\nKANT\n053\n2D 기본 처리 4/4\nTRAJECTORY_BUILDER_2D\n파라미터\n기본 / 실습\n단위와 의미\nimu_gravity_time_constant\n10.\ns / ROS 호환을 위해 남은 레거시 중력 시간상수. 중첩 pose_extrapolator 설정과 혼동하지 않는다.","title":"2D 기본 처리 4/4","scope":"2D"},{"slide":54,"text":"Lv.2 06 Cartographer\nKANT\n054\n2D 적응형 Voxel\nTRAJECTORY_BUILDER_2D.adaptive_voxel_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_length\n0.5\nm / 적응형 voxel 크기의 최대 한 변 길이. 커질수록 더 거친 필터를 사용할 수 있다.\nmin_num_points\n200\n점 수 / 적응형 필터가 남기려는 최소 점 수 기준. 원래 관측에 없던 점을 만들어 주지는 않는다.\nmax_range\n50.\nm / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.","title":"2D 적응형 Voxel","scope":"2D"},{"slide":55,"text":"Lv.2 06 Cartographer\nKANT\n055\n2D 루프용 Voxel\nTRAJECTORY_BUILDER_2D.loop_closure_adaptive_voxel_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_length\n0.9\nm / 적응형 voxel 크기의 최대 한 변 길이. 커질수록 더 거친 필터를 사용할 수 있다.\nmin_num_points\n100\n점 수 / 적응형 필터가 남기려는 최소 점 수 기준. 원래 관측에 없던 점을 만들어 주지는 않는다.\nmax_range\n50.\nm / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.","title":"2D 루프용 Voxel","scope":"2D"},{"slide":56,"text":"Lv.2 06 Cartographer\nKANT\n056\n2D 로컬 후보 탐색 1/2\nTRAJECTORY_BUILDER_2D.real_time_correlative_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\nlinear_search_window\n0.1\nm / 기준 자세 주변의 병진 탐색 폭. 범위를 늘리면 후보와 계산량이 증가한다.\nangular_search_window\n20° 0.34907 rad\nrad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.\ntranslation_delta_cost_weight\n1e-1\n상대 가중치 / correlative 탐색에서 기준 병진 자세에서 멀어지는 후보에 주는 벌점이다.","title":"2D 로컬 후보 탐색 1/2","scope":"2D"},{"slide":57,"text":"Lv.2 06 Cartographer\nKANT\n057\n2D 로컬 후보 탐색 2/2\nTRAJECTORY_BUILDER_2D.real_time_correlative_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\nrotation_delta_cost_weight\n1e-1\n상대 가중치 / correlative 탐색에서 기준 회전 자세에서 멀어지는 후보에 주는 벌점이다.","title":"2D 로컬 후보 탐색 2/2","scope":"2D"},{"slide":58,"text":"Lv.2 06 Cartographer\nKANT\n058\n2D 정밀 정합\nTRAJECTORY_BUILDER_2D.ceres_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\noccupied_space_weight\n1.\n상대 가중치 / 점이 지도의 점유 구조에 맞는 정도를 강조한다. prior 가중치와의 균형이 중요하다.\ntranslation_weight\n10.\n상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.\nrotation_weight\n40.\n상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.","title":"2D 정밀 정합","scope":"2D"},{"slide":59,"text":"Lv.2 06 Cartographer\nKANT\n059\n2D Ceres 풀이\nTRAJECTORY_BUILDER_2D.ceres_scan_matcher.ceres_solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\nfalse\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n20\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n1\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.","title":"2D Ceres 풀이","scope":"2D"},{"slide":60,"text":"Lv.2 06 Cartographer\nKANT\n060\n2D Motion Filter\nTRAJECTORY_BUILDER_2D.motion_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_time_seconds\n5.\ns / 마지막 채택 이후 시간 차 기준. 거리·각도 변화도 모두 작으면 중복 입력을 생략한다.\nmax_distance_meters\n0.2\nm / 마지막 채택 자세와의 거리 차 기준. 낮추면 자세 노드·submap 삽입이 더 자주 발생할 수 있다.\nmax_angle_radians\n기본 1° 0.017453 rad 실습 0.1° 0.0017453 rad\nrad / 마지막 채택 자세와의 회전 차 기준. 낮추면 회전 중 더 촘촘히 관측을 삽입한다.","title":"2D Motion Filter","scope":"2D"},{"slide":61,"text":"Lv.2 06 Cartographer\nKANT\n061\n2D 자세 외삽\nTRAJECTORY_BUILDER_2D.pose_extrapolator\n파라미터\n기본 / 실습\n단위와 의미\nuse_imu_based\nfalse\nbool / IMU 기반 최적화형 외삽기 선택. false는 constant_velocity 계열을 사용한다.","title":"2D 자세 외삽","scope":"2D"},{"slide":62,"text":"Lv.2 06 Cartographer\nKANT\n062\n2D 등속 외삽\nTRAJECTORY_BUILDER_2D.pose_extrapolator.constant_velocity\n파라미터\n기본 / 실습\n단위와 의미\nimu_gravity_time_constant\n10.\ns / IMU 가속도에서 중력 방향을 추정하는 시간상수. 큰 값은 더 완만하게 반응한다.\npose_queue_duration\n0.001\ns / 외삽기가 유지할 자세 이력의 시간 폭. 응답성과 이력 정보의 균형을 바꾼다.","title":"2D 등속 외삽","scope":"2D"},{"slide":63,"text":"Lv.2 06 Cartographer\nKANT\n063\n2D IMU 외삽 1/3\nTRAJECTORY_BUILDER_2D.pose_extrapolator.imu_based\n파라미터\n기본 / 실습\n단위와 의미\npose_queue_duration\n5.\ns / 외삽기가 유지할 자세 이력의 시간 폭. 응답성과 이력 정보의 균형을 바꾼다.\ngravity_constant\n9.806\nm/s² / IMU 외삽기의 중력 가속도 크기. 센서 단위를 확인하고 임의 튜닝값처럼 바꾸지 않는다.\npose_translation_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 SLAM 병진 자세 관측의 영향이다.\nIMU 기반 외삽기 선택 시 사용 / 현재 use_imu_based=false","title":"2D IMU 외삽 1/3","scope":"2D"},{"slide":64,"text":"Lv.2 06 Cartographer\nKANT\n064\n2D IMU 외삽 2/3\nTRAJECTORY_BUILDER_2D.pose_extrapolator.imu_based\n파라미터\n기본 / 실습\n단위와 의미\npose_rotation_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 SLAM 회전 자세 관측의 영향이다.\nimu_acceleration_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 가속도 관측의 영향이다. 바이어스·진동·단위를 먼저 확인한다.\nimu_rotation_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 각운동 관측의 영향이다. 축과 타임스탬프를 먼저 확인한다.\nIMU 기반 외삽기 선택 시 사용 / 현재 use_imu_based=false","title":"2D IMU 외삽 2/3","scope":"2D"},{"slide":65,"text":"Lv.2 06 Cartographer\nKANT\n065\n2D IMU 외삽 3/3\nTRAJECTORY_BUILDER_2D.pose_extrapolator.imu_based\n파라미터\n기본 / 실습\n단위와 의미\nodometry_translation_weight\n1.\n상대 가중치 / odometry의 상대 병진 제약을 얼마나 따를지 결정한다. 바퀴 미끄러짐의 영향을 비교한다.\nodometry_rotation_weight\n1.\n상대 가중치 / odometry의 상대 회전 제약을 얼마나 따를지 결정한다. 회전 odom 불확실성이 크면 신뢰도를 낮춘다.\nIMU 기반 외삽기 선택 시 사용 / 현재 use_imu_based=false","title":"2D IMU 외삽 3/3","scope":"2D"},{"slide":66,"text":"Lv.2 06 Cartographer\nKANT\n066\n2D IMU 외삽 풀이\nTRAJECTORY_BUILDER_2D.pose_extrapolator.imu_based.solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\nfalse\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n10\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n1\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.\nIMU 기반 외삽기 선택 시 사용 / 현재 use_imu_based=false","title":"2D IMU 외삽 풀이","scope":"2D"},{"slide":67,"text":"Lv.2 06 Cartographer\nKANT\n067\n2D Submap\nTRAJECTORY_BUILDER_2D.submaps\n파라미터\n기본 / 실습\n단위와 의미\nnum_range_data\n90\n삽입 수 / 새 submap 생성 간격의 기준. 한 submap은 겹침을 위해 약 두 배의 삽입을 받는다.","title":"2D Submap","scope":"2D"},{"slide":68,"text":"Lv.2 06 Cartographer\nKANT\n068\n2D 격자 표현\nTRAJECTORY_BUILDER_2D.submaps.grid_options_2d\n파라미터\n기본 / 실습\n단위와 의미\ngrid_type\nPROBABILITY_GRID\nenum / 2D 격자 표현 선택. PROBABILITY_GRID와 TSDF에 맞는 inserter를 짝지어 사용한다.\nresolution\n0.05\nm/cell / 2D submap 격자 한 칸의 길이. 작게 하면 세부 구조와 메모리·처리 부담이 증가한다.","title":"2D 격자 표현","scope":"2D"},{"slide":69,"text":"Lv.2 06 Cartographer\nKANT\n069\n2D 격자 삽입\nTRAJECTORY_BUILDER_2D.submaps.range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\nrange_data_inserter_type\nPROBABILITY_GRID_INSERTER_2D\nenum / 거리 데이터를 격자에 넣는 방식. 선택한 grid_type과 호환되는 inserter가 필요하다.","title":"2D 격자 삽입","scope":"2D"},{"slide":70,"text":"Lv.2 06 Cartographer\nKANT\n070\n2D 점유 확률 갱신\nTRAJECTORY_BUILDER_2D.submaps.range_data_inserter.probability_grid_range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\ninsert_free_space\ntrue\nbool / ray가 지나간 공간도 비점유 증거로 갱신한다. 끄면 hit 위주의 지도 갱신이 된다.\nhit_probability\n0.55\n0~1 / 관측 끝점의 점유 갱신 확률. 높이면 장애물 증거를 더 강하게 누적한다.\nmiss_probability\n0.49\n0~1 / ray가 지나간 공간의 점유 갱신 확률. 0.5보다 낮을수록 자유 공간 증거가 강하다.","title":"2D 점유 확률 갱신","scope":"2D"},{"slide":71,"text":"Lv.2 06 Cartographer\nKANT\n071\n2D TSDF 갱신 1/3\nTRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\ntruncation_distance\n0.3\nm / TSDF에서 표면 주변의 거리 값을 누적할 범위. 해상도·노이즈와 함께 조정한다.\nmaximum_weight\n10.\n누적 가중치 / TSDF 셀에 누적할 가중치 상한. 오래된 관측과 새 관측의 상대 영향을 바꾼다.\nupdate_free_space\nfalse\nbool / TSDF에서 표면 주변 외 자유 공간도 갱신할지 선택한다. 갱신 범위와 비용에 영향이 있다.\nTSDF 격자·inserter 선택 시 사용 / 현재 probability grid에서는 비활성","title":"2D TSDF 갱신 1/3","scope":"TSDF"},{"slide":72,"text":"Lv.2 06 Cartographer\nKANT\n072\n2D TSDF 갱신 2/3\nTRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\nproject_sdf_distance_to_scan_normal\ntrue\nbool / TSDF 거리 계산에 추정한 스캔 법선 방향을 반영한다. 법선 품질에 영향을 받는다.\nupdate_weight_range_exponent\n0\n지수 / TSDF 관측 가중치의 거리 의존성을 조절한다. 0은 이 거리 항의 영향을 없앤다.\nupdate_weight_angle_scan_normal_to_ray_kernel_bandwidth\n0.5\n가중 폭 / TSDF에서 ray와 법선의 각도 관계를 반영하는 커널 폭. 표면 방향별 가중을 바꾼다.\nTSDF 격자·inserter 선택 시 사용 / 현재 probability grid에서는 비활성","title":"2D TSDF 갱신 2/3","scope":"TSDF"},{"slide":73,"text":"Lv.2 06 Cartographer\nKANT\n073\n2D TSDF 갱신 3/3\nTRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\nupdate_weight_distance_cell_to_hit_kernel_bandwidth\n0.5\n가중 폭 / TSDF에서 셀과 hit의 거리 관계를 반영하는 커널 폭. 표면 주변 갱신 가중을 바꾼다.\nTSDF 격자·inserter 선택 시 사용 / 현재 probability grid에서는 비활성","title":"2D TSDF 갱신 3/3","scope":"TSDF"},{"slide":74,"text":"Lv.2 06 Cartographer\nKANT\n074\n2D TSDF 법선\nTRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter.normal_estimation_options\n파라미터\n기본 / 실습\n단위와 의미\nnum_normal_samples\n4\n점 수 / TSDF 법선 추정에 사용할 이웃 샘플 수. 표면 방향의 안정성과 비용을 바꾼다.\nsample_radius\n0.5\nm / TSDF 법선 추정의 주변 검색 반경. 모서리와 서로 다른 면을 섞지 않도록 조정한다.\nTSDF 격자·inserter 선택 시 사용 / 현재 probability grid에서는 비활성","title":"2D TSDF 법선","scope":"TSDF"},{"slide":75,"text":"Lv.2 06 Cartographer\nKANT\n075\nPose Graph 공통 1/3\nPOSE_GRAPH\n파라미터\n기본 / 실습\n단위와 의미\noptimize_every_n_nodes\n90\n노드 수 / 주기적 전역 최적화 간격. 0은 주기 실행을 끄며 종료 시 최종 최적화와 구분한다.\nmatcher_translation_weight\n5e2\n상대 가중치 / 같은 submap에 삽입한 node와 submap 사이의 병진 제약 가중치다.\nmatcher_rotation_weight\n1.6e3\n상대 가중치 / 같은 submap에 삽입한 node와 submap 사이의 회전 제약 가중치다.","title":"Pose Graph 공통 1/3","scope":"공통"},{"slide":76,"text":"Lv.2 06 Cartographer\nKANT\n076\nPose Graph 공통 2/3\nPOSE_GRAPH\n파라미터\n기본 / 실습\n단위와 의미\nmax_num_final_iterations\n200\n반복 수 / 종료·명시적 최종 최적화 때 허용할 최대 반복 수. 주기적 풀이와 별개다.\nglobal_sampling_ratio\n0.003\n0~1 / 전역 제약 탐색을 시도할 샘플 비율. 일반 constraint_builder.sampling_ratio와 구분한다.\nlog_residual_histograms\ntrue\nbool / 최적화 잔차 분포를 기록한다. 어떤 제약이 큰 잔차를 보이는지 확인할 때 쓴다.","title":"Pose Graph 공통 2/3","scope":"공통"},{"slide":77,"text":"Lv.2 06 Cartographer\nKANT\n077\nPose Graph 공통 3/3\nPOSE_GRAPH\n파라미터\n기본 / 실습\n단위와 의미\nglobal_constraint_search_after_n_seconds\n10.\ns / 마지막 연결 이후 전역 제약 탐색을 고려할 시간 기준. 더 작으면 재탐색이 빨라질 수 있다.","title":"Pose Graph 공통 3/3","scope":"공통"},{"slide":78,"text":"Lv.2 06 Cartographer\nKANT\n078\nPose Graph 루프 제약 1/3\nPOSE_GRAPH.constraint_builder\n파라미터\n기본 / 실습\n단위와 의미\nsampling_ratio\n0.3\n0~1 / 루프 제약 생성 후보를 채택할 비율. 낮추면 전역 정합 계산과 재방문 기회가 함께 감소한다.\nmax_constraint_distance\n15.\nm / 일반적인 node-submap 제약 탐색의 거리 한계. 전역 재위치 탐색과 구분한다.\nmin_score\n기본 0.55 실습 0.65\n정합 점수 / 일반 제약 후보를 통과시킬 정합 점수 하한. 확률이 아니며 높이면 더 보수적이다.","title":"Pose Graph 루프 제약 1/3","scope":"공통"},{"slide":79,"text":"Lv.2 06 Cartographer\nKANT\n079\nPose Graph 루프 제약 2/3\nPOSE_GRAPH.constraint_builder\n파라미터\n기본 / 실습\n단위와 의미\nglobal_localization_min_score\n기본 0.6 실습 0.7\n정합 점수 / 전역 재위치 정합 후보의 점수 하한. 일반 min_score와 따로 적용한다.\nloop_closure_translation_weight\n1.1e4\n상대 가중치 / 채택한 루프 제약의 병진 성분 가중치. 잘못된 루프도 강하게 당길 수 있다.\nloop_closure_rotation_weight\n1e5\n상대 가중치 / 채택한 루프 제약의 회전 성분 가중치. min_score와 역할이 다르다.","title":"Pose Graph 루프 제약 2/3","scope":"공통"},{"slide":80,"text":"Lv.2 06 Cartographer\nKANT\n080\nPose Graph 루프 제약 3/3\nPOSE_GRAPH.constraint_builder\n파라미터\n기본 / 실습\n단위와 의미\nlog_matches\ntrue\nbool / 제약 정합 결과 로그를 출력한다. 후보·채택 상태를 살피는 진단 설정이다.","title":"Pose Graph 루프 제약 3/3","scope":"공통"},{"slide":81,"text":"Lv.2 06 Cartographer\nKANT\n081\nPose Graph 2D 후보 탐색\nPOSE_GRAPH.constraint_builder.fast_correlative_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\nlinear_search_window\n7.\nm / 기준 자세 주변의 병진 탐색 폭. 범위를 늘리면 후보와 계산량이 증가한다.\nangular_search_window\n30° 0.5236 rad\nrad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.\nbranch_and_bound_depth\n7\n단계 수 / 빠른 correlative 탐색의 다중 해상도 깊이. 사전 계산 격자와 후보 가지치기에 영향이 있다.","title":"Pose Graph 2D 후보 탐색","scope":"2D"},{"slide":82,"text":"Lv.2 06 Cartographer\nKANT\n082\nPose Graph 정밀 정합\nPOSE_GRAPH.constraint_builder.ceres_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\noccupied_space_weight\n20.\n상대 가중치 / 점이 지도의 점유 구조에 맞는 정도를 강조한다. prior 가중치와의 균형이 중요하다.\ntranslation_weight\n10.\n상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.\nrotation_weight\n1.\n상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.","title":"Pose Graph 정밀 정합","scope":"공통"},{"slide":83,"text":"Lv.2 06 Cartographer\nKANT\n083\nPose Graph Ceres 풀이\nPOSE_GRAPH.constraint_builder.ceres_scan_matcher.ceres_solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\ntrue\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n10\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n1\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.","title":"Pose Graph Ceres 풀이","scope":"공통"},{"slide":84,"text":"Lv.2 06 Cartographer\nKANT\n084\nPose Graph 3D 후보 탐색 1/3\nPOSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d\n파라미터\n기본 / 실습\n단위와 의미\nbranch_and_bound_depth\n8\n단계 수 / 빠른 correlative 탐색의 다중 해상도 깊이. 사전 계산 격자와 후보 가지치기에 영향이 있다.\nfull_resolution_depth\n3\n단계 수 / 3D 탐색에서 최고 해상도 비교를 적용할 깊이. 탐색 비용과 정합 판정을 바꾼다.\nmin_rotational_score\n0.77\n점수 / 3D 회전 히스토그램 비교를 통과할 하한. 높이면 방향 후보가 더 적게 남는다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"Pose Graph 3D 후보 탐색 1/3","scope":"3D"},{"slide":85,"text":"Lv.2 06 Cartographer\nKANT\n085\nPose Graph 3D 후보 탐색 2/3\nPOSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d\n파라미터\n기본 / 실습\n단위와 의미\nmin_low_resolution_score\n0.55\n점수 / 3D 저해상도 정합의 통과 하한. 상세 정합 전에 후보를 거르는 기준이다.\nlinear_xy_search_window\n5.\nm / 3D 제약 탐색에서 수평 병진 검색 범위. 늘리면 후보 수와 탐색 비용이 증가한다.\nlinear_z_search_window\n1.\nm / 3D 제약 탐색에서 높이 검색 범위. 실제 높이 변화와 IMU 중력 정렬을 확인한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"Pose Graph 3D 후보 탐색 2/3","scope":"3D"},{"slide":86,"text":"Lv.2 06 Cartographer\nKANT\n086\nPose Graph 3D 후보 탐색 3/3\nPOSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d\n파라미터\n기본 / 실습\n단위와 의미\nangular_search_window\n15° 0.2618 rad\nrad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"Pose Graph 3D 후보 탐색 3/3","scope":"3D"},{"slide":87,"text":"Lv.2 06 Cartographer\nKANT\n087\nPose Graph 3D 정밀 정합 1/2\nPOSE_GRAPH.constraint_builder.ceres_scan_matcher_3d\n파라미터\n기본 / 실습\n단위와 의미\noccupied_space_weight_0\n5.\n상대 가중치 / 3D의 첫 번째, 고해상도 격자 정합 항을 강조한다. 저해상도 항과 함께 조정한다.\noccupied_space_weight_1\n30.\n상대 가중치 / 3D의 두 번째, 저해상도 격자 정합 항을 강조한다. 넓은 구조 정합에 관여한다.\ntranslation_weight\n10.\n상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"Pose Graph 3D 정밀 정합 1/2","scope":"3D"},{"slide":88,"text":"Lv.2 06 Cartographer\nKANT\n088\nPose Graph 3D 정밀 정합 2/2\nPOSE_GRAPH.constraint_builder.ceres_scan_matcher_3d\n파라미터\n기본 / 실습\n단위와 의미\nrotation_weight\n1.\n상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.\nonly_optimize_yaw\nfalse\nbool / 3D 정합의 회전 자유도를 yaw로 제한한다. 병진까지 2D로 제한하는 설정은 아니다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"Pose Graph 3D 정밀 정합 2/2","scope":"3D"},{"slide":89,"text":"Lv.2 06 Cartographer\nKANT\n089\nPose Graph Ceres 풀이\nPOSE_GRAPH.constraint_builder.ceres_scan_matcher_3d.ceres_solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\nfalse\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n10\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n1\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"Pose Graph Ceres 풀이","scope":"3D"},{"slide":90,"text":"Lv.2 06 Cartographer\nKANT\n090\nPose Graph 전역 최적화 1/5\nPOSE_GRAPH.optimization_problem\n파라미터\n기본 / 실습\n단위와 의미\nhuber_scale\n1e1\n잔차 척도 / Huber 손실이 큰 잔차의 영향을 완화하는 전환 크기. 작으면 더 이르게 robust 구간으로 간다.\nacceleration_weight\n1.1e2\n상대 가중치 / 3D pose graph에서 IMU 가속도 관련 잔차의 가중치. IMU 단위와 보정을 먼저 확인한다.\nrotation_weight\n1.6e4\n상대 가중치 / 3D 전역 최적화에서 IMU 각운동 관련 잔차의 가중치. 로컬 scan matcher의 prior 항과 다르다.","title":"Pose Graph 전역 최적화 1/5","scope":"공통"},{"slide":91,"text":"Lv.2 06 Cartographer\nKANT\n091\nPose Graph 전역 최적화 2/5\nPOSE_GRAPH.optimization_problem\n파라미터\n기본 / 실습\n단위와 의미\nlocal_slam_pose_translation_weight\n1e5\n상대 가중치 / 연속 로컬 SLAM 자세의 상대 병진을 전역 최적화에서 유지하려는 가중치다.\nlocal_slam_pose_rotation_weight\n1e5\n상대 가중치 / 연속 로컬 SLAM 자세의 상대 회전을 전역 최적화에서 유지하려는 가중치다.\nodometry_translation_weight\n1e5\n상대 가중치 / odometry의 상대 병진 제약을 얼마나 따를지 결정한다. 바퀴 미끄러짐의 영향을 비교한다.","title":"Pose Graph 전역 최적화 2/5","scope":"공통"},{"slide":92,"text":"Lv.2 06 Cartographer\nKANT\n092\nPose Graph 전역 최적화 3/5\nPOSE_GRAPH.optimization_problem\n파라미터\n기본 / 실습\n단위와 의미\nodometry_rotation_weight\n1e5\n상대 가중치 / odometry의 상대 회전 제약을 얼마나 따를지 결정한다. 회전 odom 불확실성이 크면 신뢰도를 낮춘다.\nfixed_frame_pose_translation_weight\n1e1\n상대 가중치 / 위성 위치 등 고정 기준 위치 제약의 병진 가중치. 실내 비사용 시 직접 효과가 없다.\nfixed_frame_pose_rotation_weight\n1e2\n상대 가중치 / 고정 기준 자세 제약의 회전 가중치. 해당 입력과 추정 가능한 방향 정보가 필요하다.","title":"Pose Graph 전역 최적화 3/5","scope":"공통"},{"slide":93,"text":"Lv.2 06 Cartographer\nKANT\n093\nPose Graph 전역 최적화 4/5\nPOSE_GRAPH.optimization_problem\n파라미터\n기본 / 실습\n단위와 의미\nfixed_frame_pose_use_tolerant_loss\nfalse\nbool / 고정 기준 위치 제약에 tolerant loss를 적용한다. 허용 오차 안의 잔차 취급을 바꾼다.\nfixed_frame_pose_tolerant_loss_param_a\n1\n잔차 척도 / tolerant loss의 허용 구간 위치를 조절한다. 거리 m 자체와 혼동하지 않는다.\nfixed_frame_pose_tolerant_loss_param_b\n1\n잔차 척도 / tolerant loss의 전환 부드러움을 조절한다. a와 함께 손실 형태를 바꾼다.","title":"Pose Graph 전역 최적화 4/5","scope":"공통"},{"slide":94,"text":"Lv.2 06 Cartographer\nKANT\n094\nPose Graph 전역 최적화 5/5\nPOSE_GRAPH.optimization_problem\n파라미터\n기본 / 실습\n단위와 의미\nlog_solver_summary\nfalse\nbool / 전역 최적화 풀이 요약을 로그로 남긴다. 계산 시간·수렴 상태를 진단한다.\nuse_online_imu_extrinsics_in_3d\ntrue\nbool / 3D 전역 최적화에서 IMU 외부 회전 보정을 추정할지 선택한다.\nfix_z_in_3d\nfalse\nbool / 3D 전역 최적화의 높이 방향 자유도를 고정한다. 경사·층간 이동과 맞는지 확인한다.","title":"Pose Graph 전역 최적화 5/5","scope":"공통"},{"slide":95,"text":"Lv.2 06 Cartographer\nKANT\n095\nPose Graph Ceres 풀이\nPOSE_GRAPH.optimization_problem.ceres_solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\nfalse\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n50\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n7\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.","title":"Pose Graph Ceres 풀이","scope":"공통"},{"slide":96,"text":"Lv.2 06 Cartographer\nKANT\n096\nPose Graph 겹친 Submap 정리\nPOSE_GRAPH.overlapping_submaps_trimmer_2d\n파라미터\n기본 / 실습\n단위와 의미\nfresh_submaps_count\n1 (주석 예시)\nsubmap 수 / 겹침 정리에서 최근 submap으로 보호할 개수. 선택 기능이며 기본 Lua에서는 주석이다.\nmin_covered_area\n2 (주석 예시)\nm² / 오래된 submap을 정리할 때 요구하는 덮인 면적 기준. 겹침 정리 기능에서만 사용한다.\nmin_added_submaps_count\n5 (주석 예시)\nsubmap 수 / 겹침 정리를 다시 고려하기 전 추가할 submap 수. 선택 기능의 실행 간격에 관여한다.\n선택 기능 / 기본 Lua에서 활성화하지 않음","title":"Pose Graph 겹친 Submap 정리","scope":"공통"},{"slide":97,"text":"Lv.2 06 Cartographer\nKANT\n097\n3D 기본 처리 1/3\nTRAJECTORY_BUILDER_3D\n파라미터\n기본 / 실습\n단위와 의미\nmin_range\n1.\nm / 이 거리보다 가까운 측정을 제거한다. 자기 몸체 반사와 센서 최소 유효 거리를 고려한다.\nmax_range\n60.\nm / 사용할 거리 측정의 상한. 줄이면 먼 노이즈와 계산량이 줄지만 구조 정보도 감소한다.\nnum_accumulated_range_data\n1\n입력 수 / 정합 전에 모을 거리 데이터 수. 늘리면 점은 많아지지만 갱신 지연도 증가한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 기본 처리 1/3","scope":"3D"},{"slide":98,"text":"Lv.2 06 Cartographer\nKANT\n098\n3D 기본 처리 2/3\nTRAJECTORY_BUILDER_3D\n파라미터\n기본 / 실습\n단위와 의미\nvoxel_filter_size\n0.15\nm / 고정 voxel 격자의 한 변 길이. 크게 하면 점 수가 줄고 작은 구조가 사라질 수 있다.\nuse_online_correlative_scan_matching\nfalse\nbool / 로컬 Ceres 정합 전 격자 탐색으로 초기 추정치를 보완한다. 켜면 탐색 비용이 추가된다.\nrotational_histogram_size\n120\nbin 수 / 3D 회전 정합용 히스토그램 분할 수. 방향 구분과 비교 비용에 영향을 준다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 기본 처리 2/3","scope":"3D"},{"slide":99,"text":"Lv.2 06 Cartographer\nKANT\n099\n3D 기본 처리 3/3\nTRAJECTORY_BUILDER_3D\n파라미터\n기본 / 실습\n단위와 의미\nimu_gravity_time_constant\n10.\ns / ROS 호환을 위해 남은 레거시 중력 시간상수. 중첩 pose_extrapolator 설정과 혼동하지 않는다.\nuse_intensities\nfalse\nbool / 3D LiDAR 반사강도를 정합에 활용한다. 센서 강도 입력과 intensity 비용 설정이 필요하다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 기본 처리 3/3","scope":"3D"},{"slide":100,"text":"Lv.2 06 Cartographer\nKANT\n100\n3D 고해상도 Voxel\nTRAJECTORY_BUILDER_3D.high_resolution_adaptive_voxel_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_length\n2.\nm / 적응형 voxel 크기의 최대 한 변 길이. 커질수록 더 거친 필터를 사용할 수 있다.\nmin_num_points\n150\n점 수 / 적응형 필터가 남기려는 최소 점 수 기준. 원래 관측에 없던 점을 만들어 주지는 않는다.\nmax_range\n15.\nm / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 고해상도 Voxel","scope":"3D"},{"slide":101,"text":"Lv.2 06 Cartographer\nKANT\n101\n3D 저해상도 Voxel\nTRAJECTORY_BUILDER_3D.low_resolution_adaptive_voxel_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_length\n4.\nm / 적응형 voxel 크기의 최대 한 변 길이. 커질수록 더 거친 필터를 사용할 수 있다.\nmin_num_points\n200\n점 수 / 적응형 필터가 남기려는 최소 점 수 기준. 원래 관측에 없던 점을 만들어 주지는 않는다.\nmax_range\n60.\nm / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 저해상도 Voxel","scope":"3D"},{"slide":102,"text":"Lv.2 06 Cartographer\nKANT\n102\n3D 로컬 후보 탐색 1/2\nTRAJECTORY_BUILDER_3D.real_time_correlative_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\nlinear_search_window\n0.15\nm / 기준 자세 주변의 병진 탐색 폭. 범위를 늘리면 후보와 계산량이 증가한다.\nangular_search_window\n1° 0.017453 rad\nrad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.\ntranslation_delta_cost_weight\n1e-1\n상대 가중치 / correlative 탐색에서 기준 병진 자세에서 멀어지는 후보에 주는 벌점이다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 로컬 후보 탐색 1/2","scope":"3D"},{"slide":103,"text":"Lv.2 06 Cartographer\nKANT\n103\n3D 로컬 후보 탐색 2/2\nTRAJECTORY_BUILDER_3D.real_time_correlative_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\nrotation_delta_cost_weight\n1e-1\n상대 가중치 / correlative 탐색에서 기준 회전 자세에서 멀어지는 후보에 주는 벌점이다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 로컬 후보 탐색 2/2","scope":"3D"},{"slide":104,"text":"Lv.2 06 Cartographer\nKANT\n104\n3D 정밀 정합 1/2\nTRAJECTORY_BUILDER_3D.ceres_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\noccupied_space_weight_0\n1.\n상대 가중치 / 3D의 첫 번째, 고해상도 격자 정합 항을 강조한다. 저해상도 항과 함께 조정한다.\noccupied_space_weight_1\n6.\n상대 가중치 / 3D의 두 번째, 저해상도 격자 정합 항을 강조한다. 넓은 구조 정합에 관여한다.\ntranslation_weight\n5.\n상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 정밀 정합 1/2","scope":"3D"},{"slide":105,"text":"Lv.2 06 Cartographer\nKANT\n105\n3D 정밀 정합 2/2\nTRAJECTORY_BUILDER_3D.ceres_scan_matcher\n파라미터\n기본 / 실습\n단위와 의미\nrotation_weight\n4e2\n상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.\nonly_optimize_yaw\nfalse\nbool / 3D 정합의 회전 자유도를 yaw로 제한한다. 병진까지 2D로 제한하는 설정은 아니다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 정밀 정합 2/2","scope":"3D"},{"slide":106,"text":"Lv.2 06 Cartographer\nKANT\n106\n3D 반사강도 정합\nTRAJECTORY_BUILDER_3D.ceres_scan_matcher.intensity_cost_function_options_0\n파라미터\n기본 / 실습\n단위와 의미\nweight\n0.5\n상대 가중치 / 3D intensity 비용 항의 영향. 형상 정합 가중치와의 균형을 조절한다.\nhuber_scale\n0.3\n잔차 척도 / Huber 손실이 큰 잔차의 영향을 완화하는 전환 크기. 작으면 더 이르게 robust 구간으로 간다.\nintensity_threshold\n40\n센서 강도 / 강도 정보를 사용할 상한 기준. 센서별 강도 스케일을 확인한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 반사강도 정합","scope":"3D"},{"slide":107,"text":"Lv.2 06 Cartographer\nKANT\n107\n3D Ceres 풀이\nTRAJECTORY_BUILDER_3D.ceres_scan_matcher.ceres_solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\nfalse\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n12\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n1\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D Ceres 풀이","scope":"3D"},{"slide":108,"text":"Lv.2 06 Cartographer\nKANT\n108\n3D Motion Filter\nTRAJECTORY_BUILDER_3D.motion_filter\n파라미터\n기본 / 실습\n단위와 의미\nmax_time_seconds\n0.5\ns / 마지막 채택 이후 시간 차 기준. 거리·각도 변화도 모두 작으면 중복 입력을 생략한다.\nmax_distance_meters\n0.1\nm / 마지막 채택 자세와의 거리 차 기준. 낮추면 자세 노드·submap 삽입이 더 자주 발생할 수 있다.\nmax_angle_radians\n0.004\nrad / 마지막 채택 자세와의 회전 차 기준. 낮추면 회전 중 더 촘촘히 관측을 삽입한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D Motion Filter","scope":"3D"},{"slide":109,"text":"Lv.2 06 Cartographer\nKANT\n109\n3D 자세 외삽\nTRAJECTORY_BUILDER_3D.pose_extrapolator\n파라미터\n기본 / 실습\n단위와 의미\nuse_imu_based\nfalse\nbool / IMU 기반 최적화형 외삽기 선택. false는 constant_velocity 계열을 사용한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 자세 외삽","scope":"3D"},{"slide":110,"text":"Lv.2 06 Cartographer\nKANT\n110\n3D 등속 외삽\nTRAJECTORY_BUILDER_3D.pose_extrapolator.constant_velocity\n파라미터\n기본 / 실습\n단위와 의미\nimu_gravity_time_constant\n10.\ns / IMU 가속도에서 중력 방향을 추정하는 시간상수. 큰 값은 더 완만하게 반응한다.\npose_queue_duration\n0.001\ns / 외삽기가 유지할 자세 이력의 시간 폭. 응답성과 이력 정보의 균형을 바꾼다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 등속 외삽","scope":"3D"},{"slide":111,"text":"Lv.2 06 Cartographer\nKANT\n111\n3D IMU 외삽 1/3\nTRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based\n파라미터\n기본 / 실습\n단위와 의미\npose_queue_duration\n5.\ns / 외삽기가 유지할 자세 이력의 시간 폭. 응답성과 이력 정보의 균형을 바꾼다.\ngravity_constant\n9.806\nm/s² / IMU 외삽기의 중력 가속도 크기. 센서 단위를 확인하고 임의 튜닝값처럼 바꾸지 않는다.\npose_translation_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 SLAM 병진 자세 관측의 영향이다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D IMU 외삽 1/3","scope":"3D"},{"slide":112,"text":"Lv.2 06 Cartographer\nKANT\n112\n3D IMU 외삽 2/3\nTRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based\n파라미터\n기본 / 실습\n단위와 의미\npose_rotation_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 SLAM 회전 자세 관측의 영향이다.\nimu_acceleration_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 가속도 관측의 영향이다. 바이어스·진동·단위를 먼저 확인한다.\nimu_rotation_weight\n1.\n상대 가중치 / IMU 기반 외삽기에서 각운동 관측의 영향이다. 축과 타임스탬프를 먼저 확인한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D IMU 외삽 2/3","scope":"3D"},{"slide":113,"text":"Lv.2 06 Cartographer\nKANT\n113\n3D IMU 외삽 3/3\nTRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based\n파라미터\n기본 / 실습\n단위와 의미\nodometry_translation_weight\n1.\n상대 가중치 / odometry의 상대 병진 제약을 얼마나 따를지 결정한다. 바퀴 미끄러짐의 영향을 비교한다.\nodometry_rotation_weight\n1.\n상대 가중치 / odometry의 상대 회전 제약을 얼마나 따를지 결정한다. 회전 odom 불확실성이 크면 신뢰도를 낮춘다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D IMU 외삽 3/3","scope":"3D"},{"slide":114,"text":"Lv.2 06 Cartographer\nKANT\n114\n3D IMU 외삽 풀이\nTRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based.solver_options\n파라미터\n기본 / 실습\n단위와 의미\nuse_nonmonotonic_steps\nfalse\nbool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.\nmax_num_iterations\n10\n반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.\nnum_threads\n1\nthread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D IMU 외삽 풀이","scope":"3D"},{"slide":115,"text":"Lv.2 06 Cartographer\nKANT\n115\n3D Submap 1/2\nTRAJECTORY_BUILDER_3D.submaps\n파라미터\n기본 / 실습\n단위와 의미\nhigh_resolution\n0.10\nm/voxel / 3D submap의 고해상도 voxel 크기. 세부 구조와 근거리 정합에 관여한다.\nhigh_resolution_max_range\n20.\nm / 3D 고해상도 격자에 사용할 최대 거리. 먼 점은 저해상도 경로로 다룰 수 있다.\nlow_resolution\n0.45\nm/voxel / 3D submap의 저해상도 voxel 크기. 넓은 범위를 더 거친 해상도로 표현한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D Submap 1/2","scope":"3D"},{"slide":116,"text":"Lv.2 06 Cartographer\nKANT\n116\n3D Submap 2/2\nTRAJECTORY_BUILDER_3D.submaps\n파라미터\n기본 / 실습\n단위와 의미\nnum_range_data\n160\n삽입 수 / 3D 새 submap 생성 간격의 삽입 수 기준. 겹쳐 운용하며 시간이나 길이 m를 직접 지정하지 않는다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D Submap 2/2","scope":"3D"},{"slide":117,"text":"Lv.2 06 Cartographer\nKANT\n117\n3D 격자 삽입 1/2\nTRAJECTORY_BUILDER_3D.submaps.range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\nhit_probability\n0.55\n0~1 / 관측 끝점의 점유 갱신 확률. 높이면 장애물 증거를 더 강하게 누적한다.\nmiss_probability\n0.49\n0~1 / ray가 지나간 공간의 점유 갱신 확률. 0.5보다 낮을수록 자유 공간 증거가 강하다.\nnum_free_space_voxels\n2\nvoxel 수 / 3D hit 앞쪽에서 자유 공간으로 갱신할 voxel 수. ray 전체를 칠하는 설정과 구분한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 격자 삽입 1/2","scope":"3D"},{"slide":118,"text":"Lv.2 06 Cartographer\nKANT\n118\n3D 격자 삽입 2/2\nTRAJECTORY_BUILDER_3D.submaps.range_data_inserter\n파라미터\n기본 / 실습\n단위와 의미\nintensity_threshold\n40\n센서 강도 / 강도 정보를 사용할 상한 기준. 센서별 강도 스케일을 확인한다.\n3D 선택 시 사용 / Waffle 2D 실습에서는 비활성","title":"3D 격자 삽입 2/2","scope":"3D"},{"slide":119,"text":"Lv.2 06 Cartographer\nKANT\n119\nCartographer 실행 인자 1/3\nnode_flags\n파라미터\n기본 / 실습\n단위와 의미\ncollect_metrics\nfalse\nbool / 런타임 지표 수집을 켠다. 관련 ROS 서비스로 처리 상태를 관찰한다.\nconfiguration_directory\n\"\" (빈 문자열)\n경로 / 주 Lua를 먼저 찾을 디렉터리. include는 설치된 Cartographer 설정 경로도 검색한다.\nconfiguration_basename\n\"\" (빈 문자열)\n파일명 / 주 Lua 파일 이름. 디렉터리 경로를 붙이지 않고 basename을 지정한다.","title":"Cartographer 실행 인자 1/3","scope":"공통"},{"slide":120,"text":"Lv.2 06 Cartographer\nKANT\n120\nCartographer 실행 인자 2/3\nnode_flags\n파라미터\n기본 / 실습\n단위와 의미\nload_state_filename\n\"\" (빈 문자열)\n경로 / 시작할 때 읽을 pbstream 파일. PGM/YAML 지도 파일을 넣는 자리가 아니다.\nload_frozen_state\ntrue\nbool / 읽은 trajectory를 고정 상태로 유지한다. true이면 해당 기존 trajectory를 다시 최적화하지 않는다.\nstart_trajectory_with_default_topics\ntrue\nbool / 시작 시 기본 토픽으로 첫 trajectory를 자동 시작한다. false이면 서비스로 시작한다.","title":"Cartographer 실행 인자 2/3","scope":"공통"},{"slide":121,"text":"Lv.2 06 Cartographer\nKANT\n121\nCartographer 실행 인자 3/3\nnode_flags\n파라미터\n기본 / 실습\n단위와 의미\nsave_state_filename\n\"\" (빈 문자열)\n경로 / 정상 종료 때 SLAM 상태를 저장할 pbstream 파일 이름. 비정상 강제 종료를 보장하지 않는다.","title":"Cartographer 실행 인자 3/3","scope":"공통"},{"slide":122,"text":"Lv.2 06 Cartographer\nKANT\n122\n지도 출력 실행 인자 1/2\ngrid_flags\n파라미터\n기본 / 실습\n단위와 의미\nresolution\n기본 0.05 실습 .05\nm/cell / 최종 /map을 합성할 셀 크기. submap 내부 해상도와 별개이며 작은 값으로 잃은 정보를 복원하지 못한다.\npublish_period_sec\n기본 1.0 실습 1.0\ns / occupancy grid를 합성·발행하는 타이머 간격. submap 생성 주기와 다르다.\ninclude_frozen_submaps\ntrue\nbool / 고정된 submap을 출력 점유 격자에 포함한다. unfrozen 항과 둘 다 false로 두지 않는다.","title":"지도 출력 실행 인자 1/2","scope":"공통"},{"slide":123,"text":"Lv.2 06 Cartographer\nKANT\n123\n지도 출력 실행 인자 2/2\ngrid_flags\n파라미터\n기본 / 실습\n단위와 의미\ninclude_unfrozen_submaps\ntrue\nbool / 현재 변하는 submap을 출력 점유 격자에 포함한다. 출력 지도에 담을 대상 선택이다.\noccupancy_grid_topic\nmap\n토픽 / 선언된 grid 토픽 플래그. 이 ROS 2 포크의 실제 발행자는 map 상수를 사용하므로 remap으로 바꾼다.","title":"지도 출력 실행 인자 2/2","scope":"공통"},{"slide":124,"text":"Lv.2 06 Cartographer\nKANT\n124\n실습 적용 순서\n입력·TF·시각을 확인한 뒤 로컬 정합을 비교한다\nsubmap 내부 품질을 확보한 다음 루프 제약과 전역 최적화를 조정한다\n원본 설정을 보관하고 같은 입력으로 한 항목씩 비교한다\n3D·TSDF·위치 추정은 센서와 활성 조건부터 별도로 준비한다","title":"실습 적용 순서","scope":"공통"}],"parameters":[{"slide":35,"group":"options","name":"map_frame","value":"실습 map","meaning":"frame / SLAM 결과의 전역 좌표계. 보통 map이며 TF와 지도 메시지의 기준이다.","scope":"공통"},{"slide":35,"group":"options","name":"tracking_frame","value":"실습 base_footprint","meaning":"frame / 알고리즘이 추적하는 몸체 좌표계. IMU 사용 시 센서 위치·외부 보정을 확인한다.","scope":"공통"},{"slide":35,"group":"options","name":"published_frame","value":"실습 odom","meaning":"frame / 전역 위치를 발행할 대상 좌표계. Waffle은 외부 odom을 보정하도록 odom을 선택한다.","scope":"공통"},{"slide":36,"group":"options","name":"odom_frame","value":"실습 odom","meaning":"frame / provide_odom_frame=true일 때 중간에 둘 연속적인 로컬 좌표계 이름이다.","scope":"공통"},{"slide":36,"group":"options","name":"provide_odom_frame","value":"실습 false","meaning":"bool / Cartographer가 로컬 odom 프레임까지 제공할지 선택한다. 기존 odom TF와 중복하면 안 된다.","scope":"공통"},{"slide":36,"group":"options","name":"publish_frame_projected_to_2d","value":"실습 true","meaning":"bool / 발행 자세에서 z·roll·pitch 성분을 제거한다. 2D 이동체의 평면 TF에 사용한다.","scope":"공통"},{"slide":37,"group":"options","name":"use_odometry","value":"실습 true","meaning":"bool / odom 센서 입력을 사용한다. true이면 해당 데이터와 TF가 실제로 들어와야 한다.","scope":"공통"},{"slide":37,"group":"options","name":"use_nav_sat","value":"실습 false","meaning":"bool / fix의 위성 위치 입력을 전역 SLAM에 사용한다. 실내 Waffle 예제는 끈다.","scope":"공통"},{"slide":37,"group":"options","name":"use_landmarks","value":"실습 false","meaning":"bool / ID가 있는 랜드마크 관측을 사용한다. 별도 landmarks 메시지 입력이 필요하다.","scope":"공통"},{"slide":38,"group":"options","name":"num_laser_scans","value":"실습 1","meaning":"개 / LaserScan 입력 개수. 1개는 scan, 여러 개는 scan_1 등이며 remap으로 연결한다.","scope":"공통"},{"slide":38,"group":"options","name":"num_multi_echo_laser_scans","value":"실습 0","meaning":"개 / MultiEchoLaserScan 입력 개수. 일반 단일 에코 LiDAR와 구분한다.","scope":"공통"},{"slide":38,"group":"options","name":"num_subdivisions_per_laser_scan","value":"실습 1","meaning":"분할 수 / 한 스캔을 시간순 조각으로 나눈다. 스캔 중 이동 왜곡 보정과 누적 수를 함께 고려한다.","scope":"공통"},{"slide":39,"group":"options","name":"num_point_clouds","value":"실습 0","meaning":"개 / PointCloud2 입력 개수. 단일 points2 또는 복수 points2_1 등의 토픽을 연결한다.","scope":"공통"},{"slide":39,"group":"options","name":"lookup_transform_timeout_sec","value":"실습 0.2","meaning":"s / 센서 시각의 TF를 기다리는 시간. 늘려도 누락되거나 잘못된 TF 자체가 고쳐지지는 않는다.","scope":"공통"},{"slide":39,"group":"options","name":"submap_publish_period_sec","value":"실습 0.3","meaning":"s / submap 목록과 자세의 발행 간격. 작게 하면 표시 갱신과 통신량이 증가한다.","scope":"공통"},{"slide":40,"group":"options","name":"pose_publish_period_sec","value":"실습 5e-3","meaning":"s / 추적 자세 발행 타이머의 간격. 센서 처리율이나 지도 정합 주기를 뜻하지 않는다.","scope":"공통"},{"slide":40,"group":"options","name":"trajectory_publish_period_sec","value":"실습 30e-3","meaning":"s / trajectory 시각화 마커의 발행 간격. 짧게 하면 RViz 갱신과 메시지 부하가 증가한다.","scope":"공통"},{"slide":40,"group":"options","name":"rangefinder_sampling_ratio","value":"실습 1.","meaning":"0~1 / 거리 센서 메시지를 채택할 비율. 낮추면 부하는 줄지만 관측을 잃을 수 있다.","scope":"공통"},{"slide":41,"group":"options","name":"odometry_sampling_ratio","value":"실습 1.","meaning":"0~1 / odometry 메시지를 채택할 비율. 낮출수록 시간 해상도와 운동 예측 정보가 감소한다.","scope":"공통"},{"slide":41,"group":"options","name":"fixed_frame_pose_sampling_ratio","value":"실습 1.","meaning":"0~1 / 위성 위치 등 고정 기준 좌표계 입력의 채택 비율. use_nav_sat와 함께 본다.","scope":"공통"},{"slide":41,"group":"options","name":"imu_sampling_ratio","value":"실습 1.","meaning":"0~1 / IMU 메시지 채택 비율. 빠른 회전 추적과 계산량 사이의 영향을 확인한다.","scope":"공통"},{"slide":42,"group":"options","name":"landmarks_sampling_ratio","value":"실습 1.","meaning":"0~1 / 랜드마크 메시지 채택 비율. ID 관측의 빈도와 시간 정렬 조건을 함께 확인한다.","scope":"공통"},{"slide":42,"group":"options","name":"publish_to_tf","value":"true","meaning":"bool / TF 발행 스위치. false이면 다른 노드가 필요한 map 변환을 제공해야 한다.","scope":"공통"},{"slide":42,"group":"options","name":"publish_tracked_pose","value":"false","meaning":"bool / 추적 자세를 tracked_pose의 PoseStamped로 추가 발행한다. 진단·시각화에 쓴다.","scope":"공통"},{"slide":43,"group":"options","name":"use_pose_extrapolator","value":"true","meaning":"bool / 발행 시각의 자세를 외삽한다. 끄면 마지막 SLAM 결과 기반 발행으로 바뀐다.","scope":"공통"},{"slide":44,"group":"ROS","name":"use_sim_time","value":"기본 false 실습 true","meaning":"bool / ROS 시간을 clock 토픽으로 맞춘다. Gazebo 실습의 관련 노드에서 true를 일관되게 사용한다.","scope":"공통"},{"slide":44,"group":"ROS","name":"scan_remapping","value":"기본 scan 실습 /scan","meaning":"토픽 / Lua가 기대하는 scan 입력을 실제 /scan에 연결한다. ROS launch의 remapping 설정이다.","scope":"공통"},{"slide":44,"group":"ROS","name":"odom_remapping","value":"기본 odom 실습 /odom","meaning":"토픽 / Lua가 기대하는 odom 입력을 실제 /odom에 연결한다. TF 소유권 설정과 별개다.","scope":"공통"},{"slide":45,"group":"MAP_BUILDER","name":"use_trajectory_builder_2d","value":"기본 false 실습 true","meaning":"bool / 2D 로컬 SLAM 선택. 3D 스위치와 동시에 켜지 않고 입력 센서 조합을 맞춘다.","scope":"공통"},{"slide":45,"group":"MAP_BUILDER","name":"use_trajectory_builder_3d","value":"false","meaning":"bool / 3D 로컬 SLAM 선택. 3D 거리 관측과 IMU·외부 보정이 필요하다.","scope":"공통"},{"slide":45,"group":"MAP_BUILDER","name":"num_background_threads","value":"4","meaning":"thread / 제약 탐색 등 백그라운드 작업의 스레드 수. 코어 수와 전경 작업의 부하를 함께 본다.","scope":"공통"},{"slide":46,"group":"MAP_BUILDER","name":"collate_by_trajectory","value":"false","meaning":"bool / trajectory별로 센서 정렬기를 분리한다. 여러 trajectory의 대기·정렬 동작에 영향을 준다.","scope":"공통"},{"slide":47,"group":"TRAJECTORY_BUILDER","name":"collate_fixed_frame","value":"true","meaning":"bool / 고정 좌표계 입력을 센서 시간 정렬에 포함한다. 데이터 중단 시 대기 조건을 확인한다.","scope":"공통"},{"slide":47,"group":"TRAJECTORY_BUILDER","name":"collate_landmarks","value":"false","meaning":"bool / 랜드마크를 센서 시간 정렬에 포함한다. true이면 메시지가 없는 구간의 대기에 유의한다.","scope":"공통"},{"slide":48,"group":"TRAJECTORY_BUILDER.pure_localization_trimmer","name":"max_submaps_to_keep","value":"3 (주석 예시)","meaning":"submap 수 / pure localization에서 새 trajectory가 보관할 submap 수. 고정 지도를 읽는 옵션은 별개다.","scope":"공통"},{"slide":49,"group":"TRAJECTORY_BUILDER.pose_graph_odometry_motion_filter","name":"max_time_seconds","value":"미지정","meaning":"s / 선택적 pose graph odometry 필터의 시간 차 기준. 로컬 SLAM motion_filter와 별도다.","scope":"공통"},{"slide":49,"group":"TRAJECTORY_BUILDER.pose_graph_odometry_motion_filter","name":"max_distance_meters","value":"미지정","meaning":"m / 선택적 pose graph odometry 필터의 거리 차 기준. 로컬 SLAM motion_filter와 별도다.","scope":"공통"},{"slide":49,"group":"TRAJECTORY_BUILDER.pose_graph_odometry_motion_filter","name":"max_angle_radians","value":"미지정","meaning":"rad / 선택적 pose graph odometry 필터의 회전 차 기준. 로컬 SLAM motion_filter와 별도다.","scope":"공통"},{"slide":50,"group":"TRAJECTORY_BUILDER_2D","name":"use_imu_data","value":"기본 true 실습 false","meaning":"bool / 2D SLAM에서 IMU 입력을 사용한다. true로 바꾸기 전에 시각·축·TF를 점검한다.","scope":"2D"},{"slide":50,"group":"TRAJECTORY_BUILDER_2D","name":"min_range","value":"기본 0. 실습 0.12","meaning":"m / 이 거리보다 가까운 측정을 제거한다. 자기 몸체 반사와 센서 최소 유효 거리를 고려한다.","scope":"2D"},{"slide":50,"group":"TRAJECTORY_BUILDER_2D","name":"max_range","value":"기본 30. 실습 3.5","meaning":"m / 사용할 거리 측정의 상한. 줄이면 먼 노이즈와 계산량이 줄지만 구조 정보도 감소한다.","scope":"2D"},{"slide":51,"group":"TRAJECTORY_BUILDER_2D","name":"min_z","value":"-0.8","meaning":"m / 2D 처리에 남길 점의 높이 하한. tracking 좌표계와 센서 장착 높이를 함께 확인한다.","scope":"2D"},{"slide":51,"group":"TRAJECTORY_BUILDER_2D","name":"max_z","value":"2.","meaning":"m / 2D 처리에 남길 점의 높이 상한. 평면과 관계없는 높은 구조의 점을 걸러낼 수 있다.","scope":"2D"},{"slide":51,"group":"TRAJECTORY_BUILDER_2D","name":"missing_data_ray_length","value":"기본 5. 실습 3.","meaning":"m / max_range를 넘긴 측정에 사용할 자유 공간 ray 길이. 장애물 hit와 구분한다.","scope":"2D"},{"slide":52,"group":"TRAJECTORY_BUILDER_2D","name":"num_accumulated_range_data","value":"1","meaning":"입력 수 / 정합 전에 모을 거리 데이터 수. 늘리면 점은 많아지지만 갱신 지연도 증가한다.","scope":"2D"},{"slide":52,"group":"TRAJECTORY_BUILDER_2D","name":"voxel_filter_size","value":"0.025","meaning":"m / 고정 voxel 격자의 한 변 길이. 크게 하면 점 수가 줄고 작은 구조가 사라질 수 있다.","scope":"2D"},{"slide":52,"group":"TRAJECTORY_BUILDER_2D","name":"use_online_correlative_scan_matching","value":"기본 false 실습 true","meaning":"bool / 로컬 Ceres 정합 전 격자 탐색으로 초기 추정치를 보완한다. 켜면 탐색 비용이 추가된다.","scope":"2D"},{"slide":53,"group":"TRAJECTORY_BUILDER_2D","name":"imu_gravity_time_constant","value":"10.","meaning":"s / ROS 호환을 위해 남은 레거시 중력 시간상수. 중첩 pose_extrapolator 설정과 혼동하지 않는다.","scope":"2D"},{"slide":54,"group":"TRAJECTORY_BUILDER_2D.adaptive_voxel_filter","name":"max_length","value":"0.5","meaning":"m / 적응형 voxel 크기의 최대 한 변 길이. 커질수록 더 거친 필터를 사용할 수 있다.","scope":"2D"},{"slide":54,"group":"TRAJECTORY_BUILDER_2D.adaptive_voxel_filter","name":"min_num_points","value":"200","meaning":"점 수 / 적응형 필터가 남기려는 최소 점 수 기준. 원래 관측에 없던 점을 만들어 주지는 않는다.","scope":"2D"},{"slide":54,"group":"TRAJECTORY_BUILDER_2D.adaptive_voxel_filter","name":"max_range","value":"50.","meaning":"m / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.","scope":"2D"},{"slide":55,"group":"TRAJECTORY_BUILDER_2D.loop_closure_adaptive_voxel_filter","name":"max_length","value":"0.9","meaning":"m / 적응형 voxel 크기의 최대 한 변 길이. 커질수록 더 거친 필터를 사용할 수 있다.","scope":"2D"},{"slide":55,"group":"TRAJECTORY_BUILDER_2D.loop_closure_adaptive_voxel_filter","name":"min_num_points","value":"100","meaning":"점 수 / 적응형 필터가 남기려는 최소 점 수 기준. 원래 관측에 없던 점을 만들어 주지는 않는다.","scope":"2D"},{"slide":55,"group":"TRAJECTORY_BUILDER_2D.loop_closure_adaptive_voxel_filter","name":"max_range","value":"50.","meaning":"m / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.","scope":"2D"},{"slide":56,"group":"TRAJECTORY_BUILDER_2D.real_time_correlative_scan_matcher","name":"linear_search_window","value":"0.1","meaning":"m / 기준 자세 주변의 병진 탐색 폭. 범위를 늘리면 후보와 계산량이 증가한다.","scope":"2D"},{"slide":56,"group":"TRAJECTORY_BUILDER_2D.real_time_correlative_scan_matcher","name":"angular_search_window","value":"20° 0.34907 rad","meaning":"rad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.","scope":"2D"},{"slide":56,"group":"TRAJECTORY_BUILDER_2D.real_time_correlative_scan_matcher","name":"translation_delta_cost_weight","value":"1e-1","meaning":"상대 가중치 / correlative 탐색에서 기준 병진 자세에서 멀어지는 후보에 주는 벌점이다.","scope":"2D"},{"slide":57,"group":"TRAJECTORY_BUILDER_2D.real_time_correlative_scan_matcher","name":"rotation_delta_cost_weight","value":"1e-1","meaning":"상대 가중치 / correlative 탐색에서 기준 회전 자세에서 멀어지는 후보에 주는 벌점이다.","scope":"2D"},{"slide":58,"group":"TRAJECTORY_BUILDER_2D.ceres_scan_matcher","name":"occupied_space_weight","value":"1.","meaning":"상대 가중치 / 점이 지도의 점유 구조에 맞는 정도를 강조한다. prior 가중치와의 균형이 중요하다.","scope":"2D"},{"slide":58,"group":"TRAJECTORY_BUILDER_2D.ceres_scan_matcher","name":"translation_weight","value":"10.","meaning":"상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.","scope":"2D"},{"slide":58,"group":"TRAJECTORY_BUILDER_2D.ceres_scan_matcher","name":"rotation_weight","value":"40.","meaning":"상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.","scope":"2D"},{"slide":59,"group":"TRAJECTORY_BUILDER_2D.ceres_scan_matcher.ceres_solver_options","name":"use_nonmonotonic_steps","value":"false","meaning":"bool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.","scope":"2D"},{"slide":59,"group":"TRAJECTORY_BUILDER_2D.ceres_scan_matcher.ceres_solver_options","name":"max_num_iterations","value":"20","meaning":"반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.","scope":"2D"},{"slide":59,"group":"TRAJECTORY_BUILDER_2D.ceres_scan_matcher.ceres_solver_options","name":"num_threads","value":"1","meaning":"thread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.","scope":"2D"},{"slide":60,"group":"TRAJECTORY_BUILDER_2D.motion_filter","name":"max_time_seconds","value":"5.","meaning":"s / 마지막 채택 이후 시간 차 기준. 거리·각도 변화도 모두 작으면 중복 입력을 생략한다.","scope":"2D"},{"slide":60,"group":"TRAJECTORY_BUILDER_2D.motion_filter","name":"max_distance_meters","value":"0.2","meaning":"m / 마지막 채택 자세와의 거리 차 기준. 낮추면 자세 노드·submap 삽입이 더 자주 발생할 수 있다.","scope":"2D"},{"slide":60,"group":"TRAJECTORY_BUILDER_2D.motion_filter","name":"max_angle_radians","value":"기본 1° 0.017453 rad 실습 0.1° 0.0017453 rad","meaning":"rad / 마지막 채택 자세와의 회전 차 기준. 낮추면 회전 중 더 촘촘히 관측을 삽입한다.","scope":"2D"},{"slide":61,"group":"TRAJECTORY_BUILDER_2D.pose_extrapolator","name":"use_imu_based","value":"false","meaning":"bool / IMU 기반 최적화형 외삽기 선택. false는 constant_velocity 계열을 사용한다.","scope":"2D"},{"slide":62,"group":"TRAJECTORY_BUILDER_2D.pose_extrapolator.constant_velocity","name":"imu_gravity_time_constan ","meaning":"bool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.","scope":"2D"},{"slide":66,"group":"TRAJECTORY_BUILDER_2D.pose_extrapolator.imu_based.solver_options","name":"max_num_iterations","value":"10","meaning":"반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.","scope":"2D"},{"slide":66,"group":"TRAJECTORY_BUILDER_2D.pose_extrapolator.imu_based.solver_options","name":"num_threads","value":"1","meaning":"thread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.","scope":"2D"},{"slide":67,"group":"TRAJECTORY_BUILDER_2D.submaps","name":"num_range_data","value":"90","meaning":"삽입 수 / 새 submap 생성 간격의 기준. 한 submap은 겹침을 위해 약 두 배의 삽입을 받는다.","scope":"2D"},{"slide":68,"group":"TRAJECTORY_BUILDER_2D.submaps.grid_options_2d","name":"grid_type","value":"PROBABILITY_GRID","meaning":"enum / 2D 격자 표현 선택. PROBABILITY_GRID와 TSDF에 맞는 inserter를 짝지어 사용한다.","scope":"2D"},{"slide":68,"group":"TRAJECTORY_BUILDER_2D.submaps.grid_options_2d","name":"resolution","value":"0.05","meaning":"m/cell / 2D submap 격자 한 칸의 길이. 작게 하면 세부 구조와 메모리·처리 부담이 증가한다.","scope":"2D"},{"slide":69,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter","name":"range_data_inserter_type","value":"PROBABILITY_GRID_INSERTER_2D","meaning":"enum / 거리 데이터를 격자에 넣는 방식. 선택한 grid_type과 호환되는 inserter가 필요하다.","scope":"2D"},{"slide":70,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.probability_grid_range_data_inserter","name":"insert_free_space","value":"true","meaning":"bool / ray가 지나간 공간도 비점유 증거로 갱신한다. 끄면 hit 위주의 지도 갱신이 된다.","scope":"2D"},{"slide":70,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.probability_grid_range_data_inserter","name":"hit_probability","value":"0.55","meaning":"0~1 / 관측 끝점의 점유 갱신 확률. 높이면 장애물 증거를 더 강하게 누적한다.","scope":"2D"},{"slide":70,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.probability_grid_range_data_inserter","name":"miss_probability","value":"0.49","meaning":"0~1 / ray가 지나간 공간의 점유 갱신 확률. 0.5보다 낮을수록 자유 공간 증거가 강하다.","scope":"2D"},{"slide":71,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"truncation_distance","value":"0.3","meaning":"m / TSDF에서 표면 주변의 거리 값을 누적할 범위. 해상도·노이즈와 함께 조정한다.","scope":"TSDF"},{"slide":71,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"maximum_weight","value":"10.","meaning":"누적 가중치 / TSDF 셀에 누적할 가중치 상한. 오래된 관측과 새 관측의 상대 영향을 바꾼다.","scope":"TSDF"},{"slide":71,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"update_free_space","value":"false","meaning":"bool / TSDF에서 표면 주변 외 자유 공간도 갱신할지 선택한다. 갱신 범위와 비용에 영향이 있다.","scope":"TSDF"},{"slide":72,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"project_sdf_distance_to_scan_normal","value":"true","meaning":"bool / TSDF 거리 계산에 추정한 스캔 법선 방향을 반영한다. 법선 품질에 영향을 받는다.","scope":"TSDF"},{"slide":72,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"update_weight_range_exponent","value":"0","meaning":"지수 / TSDF 관측 가중치의 거리 의존성을 조절한다. 0은 이 거리 항의 영향을 없앤다.","scope":"TSDF"},{"slide":72,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"update_weight_angle_scan_normal_to_ray_kernel_bandwidth","value":"0.5","meaning":"가중 폭 / TSDF에서 ray와 법선의 각도 관계를 반영하는 커널 폭. 표면 방향별 가중을 바꾼다.","scope":"TSDF"},{"slide":73,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter","name":"update_weight_distance_cell_to_hit_kernel_bandwidth","value":"0.5","meaning":"가중 폭 / TSDF에서 셀과 hit의 거리 관계를 반영하는 커널 폭. 표면 주변 갱신 가중을 바꾼다.","scope":"TSDF"},{"slide":74,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter.normal_estimation_options","name":"num_normal_samples","value":"4","meaning":"점 수 / TSDF 법선 추정에 사용할 이웃 샘플 수. 표면 방향의 안정성과 비용을 바꾼다.","scope":"TSDF"},{"slide":74,"group":"TRAJECTORY_BUILDER_2D.submaps.range_data_inserter.tsdf_range_data_inserter.normal_estimation_options","name":"sample_radius","value":"0.5","meaning":"m / TSDF 법선 추정의 주변 검색 반경. 모서리와 서로 다른 면을 섞지 않도록 조정한다.","scope":"TSDF"},{"slide":75,"group":"POSE_GRAPH","name":"optimize_every_n_nodes","value":"90","meaning":"노드 수 / 주기적 전역 최적화 간격. 0은 주기 실행을 끄며 종료 시 최종 최적화와 구분한다.","scope":"공통"},{"slide":75,"group":"POSE_GRAPH","name":"matcher_translation_weight","value":"5e2","meaning":"상대 가중치 / 같은 submap에 삽입한 node와 submap 사이의 병진 제약 가중치다.","scope":"공통"},{"slide":75,"group":"POSE_GRAPH","name":"matcher_rotation_weight","value":"1.6e3","meaning":"상대 가중치 / 같은 submap에 삽입한 node와 submap 사이의 회전 제약 가중치다.","scope":"공통"},{"slide":76,"group":"POSE_GRAPH","name":"max_num_final_iterations","value":"200","meaning":"반복 수 / 종료·명시적 최종 최적화 때 허용할 최대 반복 수. 주기적 풀이와 별개다.","scope":"공통"},{"slide":76,"group":"POSE_GRAPH","name":"global_sampling_ratio","value":"0.003","meaning":"0~1 / 전역 제약 탐색을 시도할 샘플 비율. 일반 constraint_builder.sampling_ratio와 구분한다.","scope":"공통"},{"slide":76,"group":"POSE_GRAPH","name":"log_residual_histograms","value":"true","meaning":"bool / 최적화 잔차 분포를 기록한다. 어떤 제약이 큰 잔차를 보이는지 확인할 때 쓴다.","scope":"공통"},{"slide":77,"group":"POSE_GRAPH","name":"global_constraint_search_after_n_seconds","value":"10.","meaning":"s / 마지막 연결 이후 전역 제약 탐색을 고려할 시간 기준. 더 작으면 재탐색이 빨라질 수 있다.","scope":"공통"},{"slide":78,"group":"POSE_GRAPH.constraint_builder","name":"sampling_ratio","value":"0.3","meaning":"0~1 / 루프 제약 생성 후보를 채택할 비율. 낮추면 전역 정합 계산과 재방문 기회가 함께 감소한다.","scope":"공통"},{"slide":78,"group":"POSE_GRAPH.constraint_builder","name":"max_constraint_distance","value":"15.","meaning":"m / 일반적인 node-submap 제약 탐색의 거리 한계. 전역 재위치 탐색과 구분한다.","scope":"공통"},{"slide":78,"group":"POSE_GRAPH.constraint_builder","name":"min_score","value":"기본 0.55 실습 0.65","meaning":"정합 점수 / 일반 제약 후보를 통과시킬 정합 점수 하한. 확률이 아니며 높이면 더 보수적이다.","scope":"공통"},{"slide":79,"group":"POSE_GRAPH.constraint_builder","name":"global_localization_min_score","value":"기본 0.6 실습 0.7","meaning":"정합 점수 / 전역 재위치 정합 후보의 점수 하한. 일반 min_score와 따로 적용한다.","scope":"공통"},{"slide":79,"group":"POSE_GRAPH.constraint_builder","name":"loop_closure_translation_weight","value":"1.1e4","meaning":"상대 가중치 / 채택한 루프 제약의 병진 성분 가중치. 잘못된 루프도 강하게 당길 수 있다.","scope":"공통"},{"slide":79,"group":"POSE_GRAPH.constraint_builder","name":"loop_closure_rotation_weight","value":"1e5","meaning":"상대 가중치 / 채택한 루프 제약의 회전 성분 가중치. min_score와 역할이 다르다.","scope":"공통"},{"slide":80,"group":"POSE_GRAPH.constraint_builder","name":"log_matches","value":"true","meaning":"bool / 제약 정합 결과 로그를 출력한다. 후보·채택 상태를 살피는 진단 설정이다.","scope":"공통"},{"slide":81,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher","name":"linear_search_window","value":"7.","meaning":"m / 기준 자세 주변의 병진 탐색 폭. 범위를 늘리면 후보와 계산량이 증가한다.","scope":"2D"},{"slide":81,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher","name":"angular_search_window","value":"30° 0.5236 rad","meaning":"rad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.","scope":"2D"},{"slide":81,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher","name":"branch_and_bound_depth","value":"7","meaning":"단계 수 / 빠른 correlative 탐색의 다중 해상도 깊이. 사전 계산 격자와 후보 가지치기에 영향이 있다.","scope":"2D"},{"slide":82,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher","name":"occupied_space_weight","value":"20.","meaning":"상대 가중치 / 점이 지도의 점유 구조에 맞는 정도를 강조한다. prior 가중치와의 균형이 중요하다.","scope":"공통"},{"slide":82,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher","name":"translation_weight","value":"10.","meaning":"상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.","scope":"공통"},{"slide":82,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher","name":"rotation_weight","value":"1.","meaning":"상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.","scope":"공통"},{"slide":83,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher.ceres_solver_options","name":"use_nonmonotonic_steps","value":"true","meaning":"bool / 최적화 중 비용이 잠시 증가하는 단계를 허용한다. 최종 품질·반복 수를 함께 비교한다.","scope":"공통"},{"slide":83,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher.ceres_solver_options","name":"max_num_iterations","value":"10","meaning":"반복 수 / 해당 Ceres 풀이의 최대 반복 횟수. 늘려도 입력·초기값·모델 오류를 해결하지는 못한다.","scope":"공통"},{"slide":83,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher.ceres_solver_options","name":"num_threads","value":"1","meaning":"thread / 해당 Ceres 풀이가 사용하는 스레드 수. MAP_BUILDER의 백그라운드 수와 별개다.","scope":"공통"},{"slide":84,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"branch_and_bound_depth","value":"8","meaning":"단계 수 / 빠른 correlative 탐색의 다중 해상도 깊이. 사전 계산 격자와 후보 가지치기에 영향이 있다.","scope":"3D"},{"slide":84,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"full_resolution_depth","value":"3","meaning":"단계 수 / 3D 탐색에서 최고 해상도 비교를 적용할 깊이. 탐색 비용과 정합 판정을 바꾼다.","scope":"3D"},{"slide":84,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"min_rotational_score","value":"0.77","meaning":"점수 / 3D 회전 히스토그램 비교를 통과할 하한. 높이면 방향 후보가 더 적게 남는다.","scope":"3D"},{"slide":85,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"min_low_resolution_score","value":"0.55","meaning":"점수 / 3D 저해상도 정합의 통과 하한. 상세 정합 전에 후보를 거르는 기준이다.","scope":"3D"},{"slide":85,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"linear_xy_search_window","value":"5.","meaning":"m / 3D 제약 탐색에서 수평 병진 검색 범위. 늘리면 후보 수와 탐색 비용이 증가한다.","scope":"3D"},{"slide":85,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"linear_z_search_window","value":"1.","meaning":"m / 3D 제약 탐색에서 높이 검색 범위. 실제 높이 변화와 IMU 중력 정렬을 확인한다.","scope":"3D"},{"slide":86,"group":"POSE_GRAPH.constraint_builder.fast_correlative_scan_matcher_3d","name":"angular_search_window","value":"15° 0.2618 rad","meaning":"rad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.","scope":"3D"},{"slide":87,"group":"POSE_GRAPH.constraint_builder.ceres_scan_matcher_3d","name":"occupied_space_weight_0", tion_weight","value":"1.6e4","meaning":"상대 가중치 / 3D 전역 최적화에서 IMU 각운동 관련 잔차의 가중치. 로컬 scan matcher의 prior 항과 다르다.","scope":"공통"},{"slide":91,"group":"POSE_GRAPH.optimization_problem","name":"local_slam_pose_translation_weight","value":"1e5","meaning":"상대 가중치 / 연속 로컬 SLAM 자세의 상대 병진을 전역 최적화에서 유지하려는 가중치다.","scope":"공통"},{"slide":91,"group":"POSE_GRAPH.optimization_problem","name":"local_slam_pose_rotation_weight","value":"1e5","meaning":"상대 가중치 / 연속 로컬 SLAM 자세의 상대 회전을 전역 최적화에서 유지하려는 가중치다.","scope":"공통"},{"slide":91,"group":"POSE_GRAPH.optimization_problem","name":"odometry_translation_weight","value":"1e5","meaning":"상대 가중치 / odometry의 상대 병진 제약을 얼마나 따를지 결정한다. 바퀴 미끄러짐의 영향을 비교한다.","scope":"공통"},{"slide":92,"group":"POSE_GRAPH.optimization_problem","name":"odometry_rotation_weight","value":"1e5","meaning":"상대 가중치 / odometry의 상대 회전 제약을 얼마나 따를지 결정한다. 회전 odom 불확실성이 크면 신뢰도를 낮춘다.","scope":"공통"},{"slide":92,"group":"POSE_GRAPH.optimization_problem","name":"fixed_frame_pose_translation_weight","value":"1e1","meaning":"상대 가중치 / 위성 위치 등 고정 기준 위치 제약의 병진 가중치. 실내 비사용 시 직접 효과가 없다.","scope":"공통"},{"slide":92,"group":"POSE_GRAPH.optimization_problem","name":"fixed_frame_pose_rotation_weight","value":"1e2","meaning":"상대 가중치 / 고정 기준 자세 제약의 회전 가중치. 해당 입력과 추정 가능한 방향 정보가 필요하다.","scope":"공통"},{"slide":93,"group":"POSE_GRAPH.optimization_problem","name":"fixed_frame_pose_use_tolerant_loss","value":"false","meaning":"bool / 고정 기준 위치 제약에 tolerant loss를 적용한다. 허용 오차 안의 잔차 취급을 바꾼다.","scope":"공통"},{"slide":93,"group":"POSE_GRAPH.optimization_problem","name":"fixed_frame_pose_tolerant_loss_param_a","value":"1","meaning":"잔차 척도 / tolerant loss의 허용 구간 위치를 조절한다. 거리 m 자체와 혼동하지 않는다.","scope":"공통"},{"slide":93,"group":"POSE_GRAPH.optimization_problem","name":"fixed_frame_pose_tolerant_loss_param_b","value":"1","meaning":"잔차 척도 / tolerant loss의 전환 부드러움을 조절한다. a와 함께 손실 형태를 바꾼다.","scope":"공통"},{"slide":94,"group":"POSE_GRAPH.optimization_problem","name":"log_solver_summary","value":"false","meaning":"bool / 전역 ILDER_3D.low_resolution_adaptive_voxel_filter","name":"max_range","value":"60.","meaning":"m / 이 적응형 필터에 포함할 점의 거리 상한. 로컬 필터와 루프용 필터는 별도 경로다.","scope":"3D"},{"slide":102,"group":"TRAJECTORY_BUILDER_3D.real_time_correlative_scan_matcher","name":"linear_search_window","value":"0.15","meaning":"m / 기준 자세 주변의 병진 탐색 폭. 범위를 늘리면 후보와 계산량이 증가한다.","scope":"3D"},{"slide":102,"group":"TRAJECTORY_BUILDER_3D.real_time_correlative_scan_matcher","name":"angular_search_window","value":"1° 0.017453 rad","meaning":"rad / 기준 자세 주변의 회전 탐색 폭. math.rad로 도를 변환하고 정합 범위를 구분한다.","scope":"3D"},{"slide":102,"group":"TRAJECTORY_BUILDER_3D.real_time_correlative_scan_matcher","name":"translation_delta_cost_weight","value":"1e-1","meaning":"상대 가중치 / correlative 탐색에서 기준 병진 자세에서 멀어지는 후보에 주는 벌점이다.","scope":"3D"},{"slide":103,"group":"TRAJECTORY_BUILDER_3D.real_time_correlative_scan_matcher","name":"rotation_delta_cost_weight","value":"1e-1","meaning":"상대 가중치 / correlative 탐색에서 기준 회전 자세에서 멀어지는 후보에 주는 벌점이다.","scope":"3D"},{"slide":104,"group":"TRAJECTORY_BUILDER_3D.ceres_scan_matcher","name":"occupied_space_weight_0","value":"1.","meaning":"상대 가중치 / 3D의 첫 번째, 고해상도 격자 정합 항을 강조한다. 저해상도 항과 함께 조정한다.","scope":"3D"},{"slide":104,"group":"TRAJECTORY_BUILDER_3D.ceres_scan_matcher","name":"occupied_space_weight_1","value":"6.","meaning":"상대 가중치 / 3D의 두 번째, 저해상도 격자 정합 항을 강조한다. 넓은 구조 정합에 관여한다.","scope":"3D"},{"slide":104,"group":"TRAJECTORY_BUILDER_3D.ceres_scan_matcher","name":"translation_weight","value":"5.","meaning":"상대 가중치 / Ceres 정합에서 초기 병진 추정치를 유지하려는 항. 높이면 점 정합보다 prior를 더 따른다.","scope":"3D"},{"slide":105,"group":"TRAJECTORY_BUILDER_3D.ceres_scan_matcher","name":"rotation_weight","value":"4e2","meaning":"상대 가중치 / Ceres 정합에서 초기 회전 추정치를 유지하려는 항. 높이면 회전 보정이 더 보수적이다.","scope":"3D"},{"slide":105,"group":"TRAJECTORY_BUILDER_3D.ceres_scan_matcher","name":"only_optimize_yaw","value":"false","meaning":"bool / 3D 정합의 회전 자유도를 yaw로 제한한다. 병진까지 2D로 제한하는 설정은 아니다.","scope":"3D"},{"slide":106,"group":"TRAJECTORY_BUILDER_3D _BUILDER_3D.pose_extrapolator.constant_velocity","name":"imu_gravity_time_constant","value":"10.","meaning":"s / IMU 가속도에서 중력 방향을 추정하는 시간상수. 큰 값은 더 완만하게 반응한다.","scope":"3D"},{"slide":110,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.constant_velocity","name":"pose_queue_duration","value":"0.001","meaning":"s / 외삽기가 유지할 자세 이력의 시간 폭. 응답성과 이력 정보의 균형을 바꾼다.","scope":"3D"},{"slide":111,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"pose_queue_duration","value":"5.","meaning":"s / 외삽기가 유지할 자세 이력의 시간 폭. 응답성과 이력 정보의 균형을 바꾼다.","scope":"3D"},{"slide":111,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"gravity_constant","value":"9.806","meaning":"m/s² / IMU 외삽기의 중력 가속도 크기. 센서 단위를 확인하고 임의 튜닝값처럼 바꾸지 않는다.","scope":"3D"},{"slide":111,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"pose_translation_weight","value":"1.","meaning":"상대 가중치 / IMU 기반 외삽기에서 SLAM 병진 자세 관측의 영향이다.","scope":"3D"},{"slide":112,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"pose_rotation_weight","value":"1.","meaning":"상대 가중치 / IMU 기반 외삽기에서 SLAM 회전 자세 관측의 영향이다.","scope":"3D"},{"slide":112,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"imu_acceleration_weight","value":"1.","meaning":"상대 가중치 / IMU 기반 외삽기에서 가속도 관측의 영향이다. 바이어스·진동·단위를 먼저 확인한다.","scope":"3D"},{"slide":112,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"imu_rotation_weight","value":"1.","meaning":"상대 가중치 / IMU 기반 외삽기에서 각운동 관측의 영향이다. 축과 타임스탬프를 먼저 확인한다.","scope":"3D"},{"slide":113,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"odometry_translation_weight","value":"1.","meaning":"상대 가중치 / odometry의 상대 병진 제약을 얼마나 따를지 결정한다. 바퀴 미끄러짐의 영향을 비교한다.","scope":"3D"},{"slide":113,"group":"TRAJECTORY_BUILDER_3D.pose_extrapolator.imu_based","name":"odometry_rotation_weight","value":"1.","meaning":"상대 가중치 / odometry의 상대 회전 제약을 얼마나 따를지 결정한다. 회전 odom 불확실성이 크면 신뢰도를 낮춘다.","scope":"3D"},{"slide":114,"group":"TRAJECTORY_BUILDER_3D
