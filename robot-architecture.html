me":"터틀봇 베이스 · 바퀴 ×2","kind":"hardware","layer":"물리 HW","inputs":"바퀴 지령","outputs":"odometry·fault","host":"미정 · 로봇/연산 호스트","rate":"미정 · 측정 후 결정","failure":"미정 · 실패 정책 필요","source":"처음 도식"},{"id":"safety","name":"safety supervisor","kind":"safety","layer":"후속 보완","inputs":"e-stop·fault·watchdog","outputs":"정지 요청","host":"미정 · 로봇/연산 호스트","rate":"미정 · 측정 후 결정","failure":"미정 · 실패 정책 필요","source":"후속 보완"}],"edges":[{"id":"a","from":"gripper","to":"perception","label":"영상","type":"topic","contract":"sensor_msgs/msg/Image","style":"command","source":"처음 도식"},{"id":"b","from":"pole","to":"perception","label":"영상 + depth","type":"topic","contract":"Image + CameraInfo; depth encoding 확인","style":"command","source":"처음 도식"},{"id":"c","from":"pole","to":"scan","label":"depth","type":"topic","contract":"sensor_msgs/msg/Image","style":"command","source":"처음 도식"},{"id":"d","from":"human","to":"vla","label":"테이블 위 컵 가져다줘","type":"human","contract":"원본: 사람의 자연어 입력. ROS 서비스로 확정하지 않음","style":"command","source":"처음 도식"},{"id":"e","from":"perception","to":"vla","label":"/tracked_objects","type":"topic","contract":"custom · 미정","style":"command","source":"처음 도식"},{"id":"f","from":"scan","to":"controller","label":"/scan","type":"topic","contract":"sensor_msgs/msg/LaserScan · 보완안에서는 costmap 경유","style":"command","source":"처음 도식"},{"id":"g","from":"vla","to":"coord","label":"/sub_goals","type":"topic","contract":"custom · 미정","style":"command","source":"처음 도식"},{"id":"h","from":"coord","to":"move","label":"pick/place","type":"action","contract":"원본 업무 표현. 실제 adapter 필요","style":"command","source":"처음 도식"},{"id":"i","from":"coord","to":"bt","label":"NavigateToPose","type":"action","contract":"nav2_msgs/action/NavigateToPose","style":"command","source":"처음 도식"},{"id":"j","from":"perception","to":"grasp","label":"/tracked_objects","type":"topic","contract":"custom · 미정","style":"command","source":"처음 도식"},{"id":"k","from":"grasp","to":"coord","label":"/grasp_scored","type":"topic","contract":"custom · 미정","style":"command","source":"처음 도식"},{"id":"l","from":"tuner","to":"controller","label":"/tuning_gains","type":"topic","contract":"custom · 설정 adapter 필요","style":"command","source":"처음 도식"},{"id":"m","from":"move","to":"armrl","label":"FollowJointTrajectory","type":"action","contract":"control_msgs/action/FollowJointTrajectory · 원본 보정 경로","style":"command","source":"처음 도식"},{"id":"n","from":"bt","to":"planner","label":"ComputePathToPose","type":"action","contract":"nav2_msgs/action/ComputePathToPose","style":"command","source":"처음 도식"},{"id":"o","from":"bt","to":"controller","label":"FollowPath","type":"action","contract":"nav2_msgs/action/FollowPath","style":"command","source":"처음 도식"},{"id":"q","from":"controller","to":"navrl","label":"/cmd_vel_nav","type":"topic","contract":"geometry_msgs/msg/Twist (원본); 배포 타입 확인","style":"command","source":"처음 도식"},{"id":"r","from":"armrl","to":"cm","label":"/joint_cmd_final","type":"topic","contract":"std_msgs/msg/Float64MultiArray (원본)","style":"command","source":"처음 도식"},{"id":"s","from":"navrl","to":"cm","label":"/cmd_vel_final","type":"topic","contract":"geometry_msgs/msg/Twist (원본)","style":"command","source":"처음 도식"},{"id":"t","from":"cm","to":"arm","label":"관절 지령","type":"device","contract":"시리얼 / USB / CAN · 장치별 확인","style":"command","source":"처음 도식"},{"id":"u","from":"cm","to":"base","label":"바퀴 지령","type":"device","contract":"시리얼 / USB / network · 장치별 확인","style":"command","source":"처음 도식"},{"id":"failure","from":"coord","to":"vla","label":"/failure_report","type":"topic","contract":"custom · 원본 실패 보고","style":"feedback","source":"처음 도식"},{"id":"v","from":"arm","to":"armrl","label":"/joint_states","type":"topic","contract":"sensor_msgs/msg/JointState","style":"feedback","source":"후속 보완"},{"id":"w","from":"base","to":"controller","label":"/odom","type":"topic","contract":"nav_msgs/msg/Odometry","style":"feedback","source":"후속 보완"},{"id":"x","from":"safety","to":"cm","label":"정지 요청","type":"safety","contract":"소프트웨어 stop 경로","style":"safety","source":"후속 보완"},{"id":"y","from":"safety","to":"navrl","label":"명령 차단","type":"safety","contract":"독립 watchdog·명령 gate 검토","style":"safety","source":"후속 보완"}]},"originalDocuments":[{"id":"00","file":"docs/original/00-baseline-and-scope.md","title":"00. Project Baseline and Scope","markdown":"# 00. Project Baseline and Scope\n\nStatus: Draft\n\n## Scope\n\n이 프로젝트는 카메라 입력, 인지, VLM task planning, navigation, manipulation, RL correction, ros2_control, 실제 하드웨어 연결을 다룹니다.\n\n법률, 인증, 라이선스 문서는 이 문서 세트에서 제외합니다.\n\n## Current baseline\n\n- Mac: Docker Desktop on Apple Silicon\n- ROS 2: Lyrical\n- Robot runtime: Ubuntu or Linux controller\n- GUI: RViz2 and browser-based container desktop\n- Architecture board: robot-architecture.html\n\n## Open decisions\n\n- Robot model and hardware interface\n- Ubuntu controller ROS distribution\n- Arm and base controller separation\n- RL correction rate and limits\n- Safety supervisor location\n\n","intro":"Status: Draft","sections":[["Scope","이 프로젝트는 카메라 입력, 인지, VLM task planning, navigation, manipulation, RL correction, ros2_control, 실제 하드웨어 연결을 다룹니다.\n\n법률, 인증, 라이선스 문서는 이 문서 세트에서 제외합니다."],["Current baseline","- Mac: Docker Desktop on Apple Silicon\n- ROS 2: Lyrical\n- Robot runtime: Ubuntu or Linux controller\n- GUI: RViz2 and browser-based container desktop\n- Architecture board: robot-architecture.html"],["Open decisions","- Robot model and hardware interface\n- Ubuntu controller ROS distribution\n- Arm and base controller separation\n- RL correction rate and limits\n- Safety supervisor location"]]},{"id":"01","file":"docs/original/01-requirements.md","title":"01. Requirements","markdown":"# 01. Requirements\n\nStatus: Draft\n\n## Purpose\n\n로봇이 해야 할 일을 측정 가능한 문장으로 정의합니다.\n\n## Initial requirements\n\n### REQ-001 Task input\n\nThe system shall accept a task request from an operator.\n\nAcceptance:\n\n- The request becomes a task goal.\n- The goal has an identifier.\n- An invalid request produces an error.\n\n### REQ-002 Object perception\n\nThe system shall detect and track a target object.\n\nAcceptance:\n\n- The target has a stable identifier.\n- The target pose has a frame identifier.\n- Stale data is reported.\n\n### REQ-003 Navigation\n\nThe system shall move the base to a target pose.\n\nAcceptance:\n\n- The system creates a path.\n- The base stops when the path is invalid.\n- The result is success, failure, or cancellation.\n\n### REQ-004 Manipulation\n\nThe system shall execute a pick or place action.\n\nAcceptance:\n\n- The action provides feedback and a result.\n- The arm stops when a safety condition is active.\n\n### REQ-005 Recovery\n\nThe system shall recover from a recoverable failure.\n\nAcceptance:\n\n- The failure has a category.\n- The system selects retry, replan, operator input, or stop.\n\n","intro":"Status: Draft","sections":[["Purpose","로봇이 해야 할 일을 측정 가능한 문장으로 정의합니다."],["Initial requirements","### REQ-001 Task input\n\nThe system shall accept a task request from an operator.\n\nAcceptance:\n\n- The request becomes a task goal.\n- The goal has an identifier.\n- An invalid request produces an error.\n\n### REQ-002 Object perception\n\nThe system shall detect and track a target object.\n\nAcceptance:\n\n- The target has a stable identifier.\n- The target pose has a frame identifier.\n- Stale data is reported.\n\n### REQ-003 Navigation\n\nThe system shall move the base to a target pose.\n\nAcceptance:\n\n- The system creates a path.\n- The base stops when the path is invalid.\n- The result is success, failure, or cancellation.\n\n### REQ-004 Manipulation\n\nThe system shall execute a pick or place action.\n\nAcceptance:\n\n- The action provides feedback and a result.\n- The arm stops when a safety condition is active.\n\n### REQ-005 Recovery\n\nThe system shall recover from a recoverable failure.\n\nAcceptance:\n\n- The failure has a category.\n- The system selects retry, replan, operator input, or stop."]]},{"id":"02","file":"docs/original/02-conops-and-scenarios.md","title":"02. Concept of Operations and Scenarios","markdown":"# 02. Concept of Operations and Scenarios\n\nStatus: Draft\n\n## Normal operation\n\n1. The operator sends a task.\n2. The planner creates sub-goals.\n3. Perception supplies object and scene data.\n4. The coordinator selects navigation or manipulation.\n5. Nav2 or MoveIt executes the action.\n6. RL correction adjusts the command within safe limits.\n7. ros2_control sends the command to hardware.\n8. The system reports the result.\n\n## Required scenarios\n\n| Scenario | Start condition | Expected result |\n|---|---|---|\n| Ready | Nodes and hardware are healthy | System waits for a task |\n| Pick | Target object is visible | Grasp completes or reports failure |\n| Navigate | Target pose is valid | Base reaches the pose or stops |\n| Recovery | Recoverable failure occurs | System retries or replans |\n| Emergency stop | E-stop or critical fault occurs | All motion stops and remains latched |\n\n","intro":"Status: Draft","sections":[["Normal operation","1. The operator sends a task.\n2. The planner creates sub-goals.\n3. Perception supplies object and scene data.\n4. The coordinator selects navigation or manipulation.\n5. Nav2 or MoveIt executes the action.\n6. RL correction adjusts the command within safe limits.\n7. ros2_control sends the command to hardware.\n8. The system reports the result."],["Required scenarios","| Scenario | Start condition | Expected result |\n|---|---|---|\n| Ready | Nodes and hardware are healthy | System waits for a task |\n| Pick | Target object is visible | Grasp completes or reports failure |\n| Navigate | Target pose is valid | Base reaches the pose or stops |\n| Recovery | Recoverable failure occurs | System retries or replans |\n| Emergency stop | E-stop or critical fault occurs | All motion stops and remains latched |"]]},{"id":"03","file":"docs/original/03-system-architecture.md","title":"03. System Architecture","markdown":"# 03. System Architecture\n\nStatus: Review\n\n## Functional layers\n\n| Layer | Responsibility | Examples |\n|---|---|---|\n| Hardware | Sensors and actuators | cameras, arm, gripper, base |\n| Perception | Detect and track objects | perception fusion |\n| Reasoning | Create task goals | VLM task planner |\n| Mission | Select and monitor actions | coordinator |\n| Planning | Create paths and trajectories | Nav2, MoveIt |\n| Correction | Apply bounded RL correction | arm and navigation correction |\n| Control | Run controllers and hardware interfaces | ros2_control |\n| Safety | Stop or limit motion | safety supervisor |\n\n## Deployment\n\n| Host | Responsibility |\n|---|---|\n| Mac Docker | Development, simulation, RViz2, teleoperation |\n| Ubuntu/Linux controller | Hardware drivers, ros2_control, safety, robot runtime |\n\n## Rules\n\n- High-level nodes do not bypass the coordinator.\n- RL nodes do not bypass safety limits.\n- Hardware drivers report state and fault.\n- Every action has feedback and result handling.\n- Every command path has a timeout or watchdog.\n\n","intro":"Status: Review","sections":[["Functional layers","| Layer | Responsibility | Examples |\n|---|---|---|\n| Hardware | Sensors and actuators | cameras, arm, gripper, base |\n| Perception | Detect and track objects | perception fusion |\n| Reasoning | Create task goals | VLM task planner |\n| Mission | Select and monitor actions | coordinator |\n| Planning | Create paths and trajectories | Nav2, MoveIt |\n| Correction | Apply bounded RL correction | arm and navigation correction |\n| Control | Run controllers and hardware interfaces | ros2_control |\n| Safety | Stop or limit motion | safety supervisor |"],["Deployment","| Host | Responsibility |\n|---|---|\n| Mac Docker | Development, simulation, RViz2, teleoperation |\n| Ubuntu/Linux controller | Hardware drivers, ros2_control, safety, robot runtime |"],["Rules","- High-level nodes do not bypass the coordinator.\n- RL nodes do not bypass safety limits.\n- Hardware drivers report state and fault.\n- Every action has feedback and result handling.\n- Every command path has a timeout or watchdog."]]},{"id":"04","file":"docs/original/04-interface-control.md","title":"04. Interface Control","markdown":"# 04. Interface Control\n\nStatus: Draft\n\n## Required fields\n\nEvery interface record must include:\n\n- Name\n- Kind: topic, action, service, or parameter\n- ROS type\n- Direction\n- Rate\n- QoS\n- Frame\n- Timeout\n- Failure behavior\n\n## Initial register\n\n| Name | Kind | Expected type | Status |\n|---|---|---|---|\n| /tracked_objects | topic | custom message | Define |\n| /sub_goals | topic | custom message | Define |\n| pick/place | action | custom action | Define |\n| NavigateToPose | action | Nav2 action | Review |\n| FollowJointTrajectory | action | trajectory action | Review |\n| /cmd_vel_final | topic | Twist | Define |\n| /joint_cmd_final | topic | control command | Review |\n| /joint_states | topic | JointState | Review |\n| /odom | topic | Odometry | Review |\n| /scan | topic | LaserScan | Review |\n\n## Gate\n\nDo not connect a new node to the physical robot until its interface record is complete.\n\n","intro":"Status: Draft","sections":[["Required fields","Every interface record must include:\n\n- Name\n- Kind: topic, action, service, or parameter\n- ROS type\n- Direction\n- Rate\n- QoS\n- Frame\n- Timeout\n- Failure behavior"],["Initial register","| Name | Kind | Expected type | Status |\n|---|---|---|---|\n| /tracked_objects | topic | custom message | Define |\n| /sub_goals | topic | custom message | Define |\n| pick/place | action | custom action | Define |\n| NavigateToPose | action | Nav2 action | Review |\n| FollowJointTrajectory | action | trajectory action | Review |\n| /cmd_vel_final | topic | Twist | Define |\n| /joint_cmd_final | topic | control command | Review |\n| /joint_states | topic | JointState | Review |\n| /odom | topic | Odometry | Review |\n| /scan | topic | LaserScan | Review |"],["Gate","Do not connect a new node to the physical robot until its interface record is complete."]]},{"id":"05","file":"docs/original/05-hardware-and-software-integration.md","title":"05. Hardware and Software Integration","markdown":"# 05. Hardware and Software Integration\n\nStatus: Draft\n\n## Hardware record\n\nFor each device, record:\n\n- Physical connection\n- Linux device path\n- Driver node\n- ROS inputs and outputs\n- Update rate\n- Calibration\n- Startup check\n- Shutdown behavior\n- Fault behavior\n\n## Initial hardware register\n\n| Device | Connection | Driver | Output | Status |\n|---|---|---|---|---|\n| gripper camera | USB or network | camera driver | image | Define |\n| pole camera | USB or network | camera driver | image and depth | Define |\n| manipulator | serial or CAN | hardware interface | joint state | Define |\n| gripper | serial or CAN | hardware interface | gripper state | Define |\n| mobile base | serial or network | base driver | odometry | Define |\n\n## Integration order\n\n1. Check power and emergency stop.\n2. Start drivers without motor power.\n3. Check state topics.\n4. Check command limits.\n5. Test at low speed.\n6. Test the stop path.\n\n","intro":"Status: Draft","sections":[["Hardware record","For each device, record:\n\n- Physical connection\n- Linux device path\n- Driver node\n- ROS inputs and outputs\n- Update rate\n- Calibration\n- Startup check\n- Shutdown behavior\n- Fault behavior"],["Initial hardware register","| Device | Connection | Driver | Output | Status |\n|---|---|---|---|---|\n| gripper camera | USB or network | camera driver | image | Define |\n| pole camera | USB or network | camera driver | image and depth | Define |\n| manipulator | serial or CAN | hardware interface | joint state | Define |\n| gripper | serial or CAN | hardware interface | gripper state | Define |\n| mobile base | serial or network | base driver | odometry | Define |"],["Integration order","1. Check power and emergency stop.\n2. Start drivers without motor power.\n3. Check state topics.\n4. Check command limits.\n5. Test at low speed.\n6. Test the stop path."]]},{"id":"06","file":"docs/original/06-behavior-and-state.md","title":"06. Behavior and State","markdown":"# 06. Behavior and State\n\nStatus: Draft\n\n## State model\n\nBOOT → SELF_TEST → READY → EXECUTING → COMPLETED\n\nEXECUTING → WAITING_FOR_PERCEPTION → RECOVERING → STOPPED → FAULT\n\n## State table\n\n| State | Entry condition | Exit condition | Allowed motion |\n|---|---|---|---|\n| BOOT | Process starts | Environment loaded | No |\n| SELF_TEST | Nodes are running | Checks pass | No |\n| READY | Checks pass | Task received | No |\n| EXECUTING | Valid action starts | Result received | Yes, bounded |\n| RECOVERING | Recoverable failure | Retry or stop decision | No or low speed |\n| STOPPED | Stop condition | Operator clears fault | No |\n| FAULT | Critical fault | Maintenance reset | No |\n\n## Scenario trace\n\nFor each scenario, record trigger, active nodes, active interfaces, feedback, success condition, failure condition, and recovery action.\n\n","intro":"Status: Draft","sections":[["State model","BOOT → SELF_TEST → READY → EXECUTING → COMPLETED\n\nEXECUTING → WAITING_FOR_PERCEPTION → RECOVERING → STOPPED → FAULT"],["State table","| State | Entry condition | Exit condition | Allowed motion |\n|---|---|---|---|\n| BOOT | Process starts | Environment loaded | No |\n| SELF_TEST | Nodes are running | Checks pass | No |\n| READY | Checks pass | Task received | No |\n| EXECUTING | Valid action starts | Result received | Yes, bounded |\n| RECOVERING | Recoverable failure | Retry or stop decision | No or low speed |\n| STOPPED | Stop condition | Operator clears fault | No |\n| FAULT | Critical fault | Maintenance reset | No |"],["Scenario trace","For each scenario, record trigger, active nodes, active interfaces, feedback, success condition, failure condition, and recovery action."]]},{"id":"07","file":"docs/original/07-safety-and-faults.md","title":"07. Safety and Fault Management","markdown":"# 07. Safety and Fault Management\n\nStatus: Draft\n\n## Stop conditions\n\nThe system shall stop motion when:\n\n- Emergency stop is active.\n- A hardware fault is active.\n- A command is older than its timeout.\n- A joint or velocity limit is exceeded.\n- Required feedback is stale.\n- The safety heartbeat is missing.\n- Required perception data is invalid.\n\n## Stop levels\n\n| Level | Response |\n|---|---|\n| Warning | Log and notify |\n| Limit | Clamp the command |\n| Stop | Send a stop command |\n| Latch | Require operator action |\n\n## Fault record\n\nEach fault includes fault ID, source, time, severity, active state, stop action, recovery action, and evidence log.\n\n","intro":"Status: Draft","sections":[["Stop conditions","The system shall stop motion when:\n\n- Emergency stop is active.\n- A hardware fault is active.\n- A command is older than its timeout.\n- A joint or velocity limit is exceeded.\n- Required feedback is stale.\n- The safety heartbeat is missing.\n- Required perception data is invalid."],["Stop levels","| Level | Response |\n|---|---|\n| Warning | Log and notify |\n| Limit | Clamp the command |\n| Stop | Send a stop command |\n| Latch | Require operator action |"],["Fault record","Each fault includes fault ID, source, time, severity, active state, stop action, recovery action, and evidence log."]]},{"id":"08","file":"docs/original/08-verification-and-testing.md","title":"08. Verification and Testing","markdown":"# 08. Verification and Testing\n\nStatus: Draft\n\n## Test levels\n\n| Level | Target | Example |\n|---|---|---|\n| Unit | Function or node logic | grasp score |\n| Integration | Connected ROS nodes | perception to planner |\n| Simulation | Full software stack | navigation simulation |\n| Hardware-in-the-loop | Controller boundary | CAN or serial driver |\n| Robot test | Physical motion | low-speed pick |\n| Fault test | Failure handling | stale scan or e-stop |\n\n## Test record\n\nRecord test ID, requirement, precondition, command, expected result, actual result, evidence, and status.\n\n## Release gate\n\n- All Must requirements pass.\n- No critical fault is unresolved.\n- The stop path passes.\n- Logs identify the active task and action.\n- The tested configuration is recorded.\n\n","intro":"Status: Draft","sections":[["Test levels","| Level | Target | Example |\n|---|---|---|\n| Unit | Function or node logic | grasp score |\n| Integration | Connected ROS nodes | perception to planner |\n| Simulation | Full software stack | navigation simulation |\n| Hardware-in-the-loop | Controller boundary | CAN or serial driver |\n| Robot test | Physical motion | low-speed pick |\n| Fault test | Failure handling | stale scan or e-stop |"],["Test record","Record test ID, requirement, precondition, command, expected result, actual result, evidence, and status."],["Release gate","- All Must requirements pass.\n- No critical fault is unresolved.\n- The stop path passes.\n- Logs identify the active task and action.\n- The tested configuration is recorded."]]},{"id":"09","file":"docs/original/09-deployment-operations-troubleshooting.md","title":"09. Deployment, Operations, and Troubleshooting","markdown":"# 09. Deployment, Operations, and Troubleshooting\n\nStatus: Draft\n\n## Mac start\n\n    cd /Users/june/ros2-lyrical-docker\n    docker compose up -d\n    docker compose exec ros2 bash\n\nOpen the GUI at http://localhost:6080/vnc.html.\n\n## Robot start checks\n\n- Check the emergency stop.\n- Check robot power.\n- Check controller IP.\n- Check ROS domain ID.\n- Check hardware state topics.\n- Check the stop path.\n\n## Diagnostic order\n\n1. Check power.\n2. Check the emergency stop.\n3. Check the Docker container.\n4. Check ROS_DISTRO.\n5. Check ROS_DOMAIN_ID.\n6. Check the node process.\n7. Check the topic or action.\n8. Check timestamps and frames.\n9. Check the hardware driver.\n10. Check the fault log.\n\n## Common commands\n\n    docker compose ps\n    docker compose logs --tail=100 ros2\n    ros2 node list\n    ros2 topic list\n    ros2 topic echo /joint_states\n    ros2 topic echo /odom\n    ros2 doctor --report\n\n","intro":"Status: Draft","sections":[["Mac start","cd /Users/june/ros2-lyrical-docker\n    docker compose up -d\n    docker compose exec ros2 bash\n\nOpen the GUI at http://localhost:6080/vnc.html."],["Robot start checks","- Check the emergency stop.\n- Check robot power.\n- Check controller IP.\n- Check ROS domain ID.\n- Check hardware state topics.\n- Check the stop path."],["Diagnostic order","1. Check power.\n2. Check the emergency stop.\n3. Check the Docker container.\n4. Check ROS_DISTRO.\n5. Check ROS_DOMAIN_ID.\n6. Check the node process.\n7. Check the topic or action.\n8. Check timestamps and frames.\n9. Check the hardware driver.\n10. Check the fault log."],["Common commands","docker compose ps\n    docker compose logs --tail=100 ros2\n    ros2 node list\n    ros2 topic list\n    ros2 topic echo /joint_states\n    ros2 topic echo /odom\n    ros2 doctor --report"]]},{"id":"10","file":"docs/original/10-change-management.md","title":"10. Change Management","markdown":"# 10. Change Management\n\nStatus: Draft\n\n## Change record\n\nRecord change ID, date, author, changed component, reason, expected behavior, risk, tests, rollback, and status.\n\n## Configuration baseline\n\nStore these values with each tested version:\n\n- Docker image digest\n- ROS distribution\n- Git commit\n- Package versions\n- Robot firmware version\n- Calibration version\n- ROS domain ID\n- Parameters\n- Test evidence\n\n## Review gate\n\nDo not use a changed controller, RL model, or safety parameter on the physical robot until the change record, simulation tests, stop test, and rollback procedure are complete.\n\n","intro":"Status: Draft","sections":[["Change record","Record change ID, date, author, changed component, reason, expected behavior, risk, tests, rollback, and status."],["Configuration baseline","Store these values with each tested version:\n\n- Docker image digest\n- ROS distribution\n- Git commit\n- Package versions\n- Robot firmware version\n- Calibration version\n- ROS domain ID\n- Parameters\n- Test evidence"],["Review gate","Do not use a changed controller, RL model, or safety parameter on the physical robot until the change record, simulation tests, stop test, and rollback procedure are complete."]]},{"id":"12","file":"docs/original/12-agile-0-to-1-roadmap.md","title":"Agile 0-to-1 Roadmap","markdown":"# Agile 0-to-1 Roadmap\n\nStatus: Draft\n\n이 문서는 혼자 로봇 시스템을 0에서 1까지 만드는 작업 순서입니다.\n\n각 task는 다음 조건을 만족해야 합니다.\n\n- 한 번의 작업으로 끝낼 수 있습니다.\n- 실행 결과를 확인할 수 있습니다.\n- 실패하면 다음 task로 넘어가지 않습니다.\n- task가 끝나면 기록을 남깁니다.\n\n## Workflow\n\n각 task는 다음 순서로 진행합니다.\n\n1. Define: 목표와 완료 조건을 쓴다.\n2. Build: 가장 작은 구현을 만든다.\n3. Run: 실제 명령을 실행한다.\n4. Check: 결과를 확인한다.\n5. Record: 로그, 화면, 명령, 문제를 기록한다.\n6. Review: 다음 task로 갈지 결정한다.\n\n## Sprint 0. Workspace and decision baseline\n\n### T0-01 Create the project workspace\n\nGoal: 코드, Docker, 문서를 한 workspace에서 관리한다.\n\nDone when:\n\n- ros2-lyrical-docker directory exists.\n- Dockerfile and Compose files are stored.\n- docs directory exists.\n- architecture board opens.\n\nCheck:\n\n- Open the workspace in Finder or VS Code.\n- Open robot-architecture.html.\n\n### T0-02 Record the platform baseline\n\nGoal: Mac and Linux controller의 실행 조건을 기록한다.\n\nDone when:\n\n- CPU architecture is recorded.\n- Docker Desktop version is recorded.\n- ROS 2 distribution is recorded.\n- Linux controller OS and ROS distribution are recorded.\n\nBlocker:\n\n- Do not connect a robot until the Linux controller baseline is known.\n\n## Sprint 1. ROS 2 container\n\n### T1-01 Start Docker Desktop\n\nDone when:\n\n- Docker context is desktop-linux.\n- docker info returns a server.\n\n### T1-02 Build the ROS image\n\nDone when:\n\n- The image build finishes.\n- ROS_DISTRO is lyrical.\n- ros2 and colcon commands exist.\n\n### T1-03 Run the local smoke test\n\nDone when:\n\n- demo talker publishes.\n- demo listener receives.\n- ros2 doctor returns no action.\n\n### T1-04 Verify the GUI\n\nDone when:\n\n- noVNC returns HTTP 200.\n- RViz2 starts.\n- The browser can display the container desktop.\n\n## Sprint 2. First ROS package\n\n### T2-01 Create a minimal Python node\n\nGoal: prove that the workspace can contain project code.\n\nDone when:\n\n- The package builds with colcon.\n- The node starts with ros2 run.\n- The node publishes one known message.\n\n### T2-02 Create a minimal C++ node\n\nDone when:\n\n- The package builds.\n- The node starts.\n- The node publishes one known message.\n\n### T2-03 Add launch files\n\nDone when:\n\n- One launch command starts the required nodes.\n- The launch output identifies every process.\n\n## Sprint 3. Simulation\n\n### T3-01 Define the robot-neutral simulation model\n\nDone when:\n\n- base_link exists.\n- sensor frames exist.\n- joint names are recorded.\n- command and state interfaces are listed.\n\n### T3-02 Publish TF\n\nDone when:\n\n- map, odom, base_link, sensor frames are visible.\n- RViz shows the expected frame tree.\n\n### T3-03 Add a simulated sensor\n\nDone when:\n\n- a scan or image topic is published.\n- the timestamp is valid.\n- the frame is valid.\n\n### T3-04 Test teleoperation\n\nDone when:\n\n- a command reaches the simulated base.\n- the simulated base produces odometry.\n- the command stops on timeout.\n\n## Sprint 4. Perception\n\n### T4-01 Connect camera input\n\nDone when:\n\n- image topic is published.\n- image encoding is recorded.\n- camera frame is recorded.\n\n### T4-02 Detect one target\n\nDone when:\n\n- one target is detected.\n- the result contains an identifier.\n- invalid detection is reported.\n\n### T4-03 Track the target\n\nDone when:\n\n- the identifier remains stable.\n- stale data is detected.\n- tracking loss is reported.\n\n## Sprint 5. Task planning\n\n### T5-01 Define task goal message\n\nDone when:\n\n- goal fields are documented.\n- goal validation exists.\n- invalid goals are rejected.\n\n### T5-02 Implement planner stub\n\nDone when:\n\n- one task produces one sub-goal.\n- the sub-goal has a trace ID.\n- planner failure is published.\n\n### T5-03 Implement coordinator\n\nDone when:\n\n- coordinator selects navigation or manipulation.\n- coordinator monitors the action.\n- coordinator cancels on failure.\n\n## Sprint 6. Navigation\n\n### T6-01 Start Nav2 with simulation\n\nDone when:\n\n- Nav2 nodes start.\n- lifecycle states become active.\n- planner and controller are available.\n\n### T6-02 Navigate to one pose\n\nDone when:\n\n- NavigateToPose succeeds in simulation.\n- the base stops at the target.\n- navigation failure is reported.\n\n### T6-03 Add scan and costmap checks\n\nDone when:\n\n- scan reaches the expected costmap.\n- obstacle avoidance is visible.\n- stale scan causes a safe stop.\n\n## Sprint 7. Manipulation\n\n### T7-01 Start MoveIt with a mock robot\n\nDone when:\n\n- joint state is published.\n- the robot model is visible.\n- a trajectory can be planned.\n\n### T7-02 Execute one trajectory\n\nDone when:\n\n- FollowJointTrajectory returns feedback.\n- the trajectory returns a result.\n- timeout cancels the action.\n\n### T7-03 Add grasp scoring\n\nDone when:\n\n- grasp score input is defined.\n- score output is defined.\n- low score selects a safe alternative.\n\n## Sprint 8. RL correction\n\n### T8-01 Define the RL boundary\n\nDone when:\n\n- RL inputs are listed.\n- RL outputs are listed.\n- output limits are listed.\n- fallback behavior is listed.\n\n### T8-02 Run RL in observation mode\n\nDone when:\n\n- RL produces a prediction.\n- RL does not change robot commands.\n- prediction latency is recorded.\n\n### T8-03 Enable bounded correction\n\nDone when:\n\n- correction is limited.\n- correction can be disabled.\n- nominal control works without RL.\n\n## Sprint 9. Linux hardware controller\n\n### T9-01 Verify the controller network\n\nDone when:\n\n- Mac can reach the Linux controller.\n- ROS_DOMAIN_ID is equal.\n- DDS discovery is visible.\n\n### T9-02 Verify hardware state only\n\nDone when:\n\n- joint state is visible.\n- odometry is visible.\n- hardware fault is visible.\n- no motor command is enabled.\n\n### T9-03 Enable low-speed command\n\nDone when:\n\n- command limit is active.\n- watchdog is active.\n- emergency stop is tested.\n\n## Sprint 10. End-to-end task\n\n### T10-01 Run simulated pick\n\nDone when:\n\n- task input reaches the planner.\n- perception returns the target.\n- coordinator starts pick.\n- result is recorded.\n\n### T10-02 Run simulated navigation\n\nDone when:\n\n- goal reaches Nav2.\n- path and velocity are visible.\n- arrival or failure is recorded.\n\n### T10-03 Run physical low-risk task\n\nDone when:\n\n- task runs at low speed.\n- operator can stop motion.\n- logs contain every major event.\n\n## Definition of Done\n\nDo not mark a task complete only because the process starts.\n\nA task is complete when:\n\n- The expected behavior occurs.\n- The failure behavior is tested.\n- The command is recorded.\n- The result is recorded.\n- The relevant document is updated.\n- The next task has no hidden dependency.\n\n## Daily task board\n\nUse these columns:\n\n- Backlog\n- Ready\n- In progress\n- Blocked\n- Review\n- Done\n\nEach card must contain:\n\n- Task ID\n- Goal\n- Input\n- Command\n- Expected result\n- Actual result\n- Evidence\n- Next task\n\n","intro":"Status: Draft\n\n이 문서는 혼자 로봇 시스템을 0에서 1까지 만드는 작업 순서입니다.\n\n각 task는 다음 조건을 만족해야 합니다.\n\n- 한 번의 작업으로 끝낼 수 있습니다.\n- 실행 결과를 확인할 수 있습니다.\n- 실패하면 다음 task로 넘어가지 않습니다.\n- task가 끝나면 기록을 남깁니다.","sections":[["Workflow","각 task는 다음 순서로 진행합니다.\n\n1. Define: 목표와 완료 조건을 쓴다.\n2. Build: 가장 작은 구현을 만든다.\n3. Run: 실제 명령을 실행한다.\n4. Check: 결과를 확인한다.\n5. Record: 로그, 화면, 명령, 문제를 기록한다.\n6. Review: 다음 task로 갈지 결정한다."],["Sprint 0. Workspace and decision baseline","### T0-01 Create the project workspace\n\nGoal: 코드, Docker, 문서를 한 workspace에서 관리한다.\n\nDone when:\n\n- ros2-lyrical- xpected frame tree.\n\n### T3-03 Add a simulated sensor\n\nDone when:\n\n- a scan or image topic is published.\n- the timestamp is valid.\n- the frame is valid.\n\n### T3-04 Test teleoperation\n\nDone when:\n\n- a command reaches the simulated base.\n- the simulated base produces odometry.\n- the command stops on timeout."],["Sprint 4. Perception","### T4-01 Connect camera input\n\nDone when:\n\n- image topic is published.\n- image encoding is recorded.\n- camera frame is recorded.\n\n### T4-02 Detect one target\n\nDone when:\n\n- one target is detected.\n- the result contains an identifier.\n- invalid detection is reported.\n\n### T4-03 Track the target\n\nDone when:\n\n- the identifier remains stable.\n- stale data is detected.\n- tracking loss is reported."],["Sprint 5. Task planning","### T5-01 Define task goal message\n\nDone when:\n\n- goal fields are documented.\n- goal validation exists.\n- invalid goals are rejected.\n\n### T5-02 Implement planner stub\n\nDone when:\n\n- one task produces one sub-goal.\n- the sub-goal has a trace ID.\n- planner failure is published.\n\n### T5-03 Implement coordinator\n\nDone when:\n\n- coordinator selects navigation or manipulation.\n- coordinator monitors the action.\n- coordinator cancels on failure."],["Sprint 6. Navigation","### T6-01 Start Nav2 with simulation\n\nDone when:\n\n- Nav2 nodes start.\n- lifecycle states become active.\n- planner and controller are available.\n\n### T6-02 Navigate to one pose\n\nDone when:\n\n- NavigateToPose succeeds in simulation.\n- the base stops at the target.\n- navigation failure is reported.\n\n### T6-03 Add scan and costmap checks\n\nDone when:\n\n- scan reaches the expected costmap.\n- obstacle avoidance is visible.\n- stale scan causes a safe stop."],["Sprint 7. Manipulation","### T7-01 Start MoveIt with a mock robot\n\nDone when:\n\n- joint state is published.\n- the robot model is visible.\n- a trajectory can be planned.\n\n### T7-02 Execute one trajectory\n\nDone when:\n\n- FollowJointTrajectory returns feedback.\n- the trajectory returns a result.\n- timeout cancels the action.\n\n### T7-03 Add grasp scoring\n\nDone when:\n\n- grasp score input is defined.\n- score output is defined.\n- low score selects a safe alternative."],["Sprint 8. RL correction","### T8-01 Define the RL boundary\n\nDone when:\n\n- RL inputs are listed.\n- RL outputs are listed.\n- output limits are listed.\n- fallback behavior is listed.\n\n### T8-02 Run RL in observation mode\n\nDone when:\n\n- RL produces a prediction.\n- RL does not change robot commands.\n- prediction latency is recorded.\n\n### T8-03 Enable bounded correction\n\nDone when:\n\n- correction is limited.\n- correction can be disabled.\n- nominal control works without RL."],["Sprint 9. Linux hardware controller","### T9-01 Verify the controller network\n\nDone when:\n\n- Mac can reach the Linux controller.\n- ROS_DOMAIN_ID is equal.\n- DDS discovery is visible.\n\n### T9-02 Verify hardware state only\n\nDone when:\n\n- joint state is visible.\n- odometry is visible.\n- hardware fault is visible.\n- no motor command is enabled.\n\n### T9-03 Enable low-speed command\n\nDone when:\n\n- command limit is active.\n- watchdog is active.\n- emergency stop is tested."],["Sprint 10. End-to-end task","### T10-01 Run simulated pick\n\nDone when:\n\n- task input reaches the planner.\n- perception returns the target.\n- coordinator starts pick.\n- result is recorded.\n\n### T10-02 Run simulated navigation\n\nDone when:\n\n- goal reaches Nav2.\n- path and velocity are visible.\n- arrival or failure is recorded.\n\n### T10-03 Run physical low-risk task\n\nDone when:\n\n- task runs at low speed.\n- operator can stop motion.\n- logs contain every major event."],["Definition of Done","Do not mark a task complete only because the process starts.\n\nA task is complete when:\n\n- The expected behavior occurs.\n- The failure behavior is tested.\n- The command is recorded.\n- The result is recorded.\n- The relevant document is updated.\n- The next task has no hidden dependency."],["Daily task board","Use these columns:\n\n- Backlog\n- Ready\n- In progress\n- Blocked\n- Review\n- Done\n\nEach card must contain:\n\n- Task ID\n- Goal\n- Input\n- Command\n- Expected result\n- Actual result\n- Evidence\n- Next task"]]},{"id":"13","file":"docs/original/13-interface-register.md","title":"Interface Register","markdown":"# Interface Register\n\nStatus: Draft\n\nRecord one row for every important connection.\n\n| Name | Kind | Type | Direction | Rate | Frame | Timeout | Failure action | Status |\n|---|---|---|---|---|---|---|---|---|\n| /tracked_objects | topic | Define | perception to planner | Define | Define | Define | stop dependent action | Open |\n| /sub_goals | topic | Define | planner to coordinator | event | n/a | Define | request operator input | Open |\n| pick/place | action | Define | coordinator to MoveIt | event | Define | Define | cancel | Open |\n| NavigateToPose | action | Nav2 action | coordinator to Nav2 | event | map | Define | cancel | Review |\n| /cmd_vel_final | topic | Twist | correction to controller | 50 Hz | base_link | Define | zero velocity | Open |\n| /joint_cmd_final | topic | Define | correction to controller | 100 Hz | joint | Define | hold position | Open |\n| /joint_states | topic | JointState | hardware to control | 100 Hz | joint | Define | stop | Review |\n| /odom | topic | Odometry | base to Nav2 | 50 Hz | odom | Define | stop base | Review |\n| /scan | topic | LaserScan | scan to costmap | 15 Hz | laser | Define | stop navigation | Review |\n\n","intro":"Status: Draft\n\nRecord one row for every important connection.\n\n| Name | Kind | Type | Direction | Rate | Frame | Timeout | Failure action | Status |\n|---|---|---|---|---|---|---|---|---|\n| /tracked_objects | topic | Define | perception to planner | Define | Define | Define | stop dependent action | Open |\n| /sub_goals | topic | Define | planner to coordinator | event | n/a | Define | request operator input | Open |\n| pick/place | action | Define | coordinator to MoveIt | event | Define | Define | cancel | Open |\n| NavigateToPose | action | Nav2 action | coordinator to Nav2 | event | map | Define | cancel | Review |\n| /cmd_vel_final | topic | Twist | correction to controller | 50 Hz | base_link | Define | zero velocity | Open |\n| /joint_cmd_final | topic | Define | correction to controller | 100 Hz | joint | Define | hold position | Open |\n| /joint_states | topic | JointState | hardware to control | 100 Hz | joint | Define | stop | Review |\n| /odom | topic | Odometry | base to Nav2 | 50 Hz | odom | Define | stop base | Review |\n| /scan | topic | LaserScan | scan to costmap | 15 Hz | laser | Define | stop navigation | Review |","sections":[]},{"id":"14","file":"docs/original/14-safety-and-test-matrix.md","title":"Safety and Test Matrix","markdown":"# Safety and Test Matrix\n\nStatus: Draft\n\n| Risk or failure | Detection | Required response | Test level |\n|---|---|---|---|\n| Emergency stop | safety input | latch stop | robot test |\n| Stale command | watchdog | zero command | integration |\n| Stale scan | timestamp check | stop navigation | simulation |\n| Joint limit | controller limit | hold or stop arm | hardware-in-loop |\n| Invalid grasp | score or perception state | retry or ask operator | simulation |\n| Navigation failure | action result | stop and replan | simulation |\n| Hardware fault | driver status | latch stop | robot test |\n| RL output out of range | clamp | use bounded value | unit and integration |\n\n## Evidence required\n\n- command used\n- configuration\n- log file\n- screen capture or bag\n- expected result\n- actual result\n- pass or fail decision\n\n","intro":"Status: Draft\n\n| Risk or failure | Detection | Required response | Test level |\n|---|---|---|---|\n| Emergency stop | safety input | latch stop | robot test |\n| Stale command | watchdog | zero command | integration |\n| Stale scan | timestamp check | stop navigation | simulation |\n| Joint limit | controller limit | hold or stop arm | hardware-in-loop |\n| Invalid grasp | score or perception state | retry or ask operator | simulation |\n| Navigation failure | action result | stop and replan | simulation |\n| Hardware fault | driver status | latch stop | robot test |\n| RL output out of range | clamp | use bounded value | unit and integration |","sections":[["Evidence required","- command used\n- configuration\n- log file\n- screen capture or bag\n- expected result\n- actual result\n- pass or fail decision"]]}],"originalTasks":[{"id":"T0-01","title":"Create the project workspace"},{"id":"T0-02","title":"Record the platform baseline"},{"id":"T1-01","title":"Start Docker Desktop"},{"id":"T1-02","title":"Build the ROS image"},{"id":"T1-03","title":"Run the local smoke test"},{"id":"T1-04","title":"Verify the GUI"},{"id":"T2-01","title":"Create a minimal Python node"},{"id":"T2-02","title":"Create a minimal C++ node"},{"id":"T2-03","title":"Add launch files"},{"id":"T3-01","title":"Define the robot-neutral simulation model"},{"id":"T3-02","title":"Publish TF"},{"id":"T3-03","title":"Add a simulated sensor"},{"id":"T3-04","title":"Test teleoperation"},{"id":"T4-01","title":"Connect camera input"},{"id":"T4-02","title":"Detect one target"},{"id":"T4-03","title":"Track the target"},{"id":"T5-01","title":"Define task goal message"},{"id":"T5-02","title":"Implement planner stub"},{"id":"T5-03","title":"Implement coordinator"},{"id":"T6-01","title":"Start Nav2 with simulation"},{"id":"T6-02","title":"Navigate to one pose"},{"id":"T6-03","title":"Add scan and costmap checks"},{"id":"T7-01","title":"Start MoveIt with a mock robot"},{"id":"T7-02","title":"Execute one trajectory"},{"id":"T7-03","title":"Add grasp scoring"},{"id":"T8-01","title":"Define the RL boundary"},{"id":"T8-02","title":"Run RL in observation mode"},{"id":"T8-03","title":"Enable bounded correction"},{"id":"T9-01","title":"Verify the controller network"},{"id":"T9-02", ","motion":"정적 가정","publisher":"URDF fixed joint","explain":"그리퍼 관절·finger 링크는 실제 모델에서 추가","status":"참조 제안"},{"id":"gripper_camera_link","parent":"gripper_link","meaning":"그리퍼 카메라","motion":"정적 장착","publisher":"URDF fixed joint / hand-eye calibration","explain":"장착 TF는 정적이지만 base에서 카메라까지 전체 경로는 팔 운동으로 동적","status":"참조 제안"},{"id":"gripper_camera_optical_frame","parent":"gripper_camera_link","meaning":"그리퍼 영상 기준","motion":"정적","publisher":"URDF / camera driver","explain":"object pose를 이 frame으로 받으면 해당 timestamp의 TF로 변환","status":"REP 103 관례"},{"id":"imu_link","parent":"base_link","meaning":"IMU 장착점","motion":"정적","publisher":"URDF fixed joint","explain":"IMU가 있을 때만 채택. 장착 축과 측정 covariance 확인","status":"선택 센서"},{"id":"laser_frame","parent":"base_link","meaning":"라이다 장착점","motion":"정적","publisher":"URDF fixed joint","explain":"물리 라이다가 있는 경우. depth 가상 scan은 실제 message frame을 사용","status":"선택 센서"}],"course":{"indexed":"2026-10-13","sourceRoot":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI","modules":[{"name":"모듈 ① 임베디드 제어 기초","first":1,"last":8,"hours":30,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초 ad37bcf74d938398980b81e39839a375.md"},{"name":"모듈 ② 로봇 기구학 및 동역학","first":9,"last":15,"hours":27,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학 ca47bcf74d9383adba5e0178c8cbb215.md"},{"name":"모듈 ③ 컴퓨터 비전 + 카메라 모델","first":16,"last":22,"hours":27,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델 2367bcf74d938227ad668147fb47976d.md"},{"name":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","first":23,"last":31,"hours":30,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI 6777bcf74d93824aa3e10134a660f5ac.md"},{"name":"모듈 ⑥ SLAM 및 Nav2 자율주행","first":37,"last":45,"hours":42,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑥ SLAM 및 Nav2 자율주행 23d7bcf74d938397aa6e01e8740810aa.md"},{"name":"모듈 ⑦ 로봇 모방학습 및 정책 최적화","first":46,"last":54,"hours":42,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑦ 로봇 모방학습 및 정책 최적화 7427bcf74d9382f88060017783d52668.md"},{"name":"모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션","first":55,"last":62,"hours":36,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑧ Sim2Real 및 가상 물리 시뮬레이션 ebd7bcf74d93821f8a6e81ef5be383c3.md"},{"name":"모듈 ⑨ 에지 컴퓨팅 및 실시간 배포","first":63,"last":69,"hours":34,"source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ⑨ 에지 컴퓨팅 및 실시간 배포 39e7bcf74d938331ac2501b9d9d5c58e.md"}],"lessons":[{"number":1,"title":"1강. 제어 개요와 시스템 응답 (개루프/폐루프·전달함수·1·2차 시간응답)","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/1강 제어 개요와 시스템 응답 (개루프 폐루프·전달함수·1·2차 시간응답) 1277bcf74d9383689a5d81bf84be40ce.md","goals":["개루프 제어와 폐루프(피드백) 제어의 차이와 각각의 장단점을 설명할 수 있습니다.","시스템을 전달함수로 표현하는 이유와, 입력–출력 관계라는 관점을 이해합니다.","1차 시스템의 시간응답을 시정수로, 2차 시스템의 시간응답을 오버슈트·정착시간으로 읽을 수 있습니다."],"essential":"아래 세 가지는 이번 강의를 마칠 때 모든 수강생이 할 수 있어야 하는 최소 기준입니다. 나머지 내용은 여기에 살을 붙이는 이야기이니, 진도가 벅차게 느껴지면 이 세 가지부터 확실히 잡으세요.\n\n- 필수 ① 개루프와 폐루프를 그림으로 구분하고, 폐루프가 필요한 이유(외란·모델 오차)를 예를 들어 설명한다.\n- 필수 ② 1차 계단 응답 그래프에서 시정수 τ를 찾고, \"τ에서 63%, 5τ면 사실상 도달\"을 말할 수 있다.\n- 필수 ③ 2차 계단 응답 그래프에서 오버슈트·정착시간·정상상태 오차가 각각 어디를 가리키는지 짚을 수 있다.\n\n여유가 되면(심화): 라플라스 변환으로 전달함수를 유도하는 과정, 감쇠비 $\\zeta$ 와 극점 위치의 관계. 지금 이해되지 않아도 2·3강 진행에는 지장이 없습니다.","headings":["들어가며","1. 개루프 제어 vs 폐루프 제어","2. 시스템을 수학으로 — 전달함수","3. 1차 시스템 — 시정수 τ","4. 2차 시스템 — 오버슈트와 정착시간","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":2,"title":"2강. 피드백 안정성 (극점 위치와 응답)","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/2강 피드백 안정성 (극점 위치와 응답) 84c7bcf74d938224aa6c81d0c364c1a9.md","goals":["안정성(stability)의 정의 — 유한한 입력에 유한한 출력 — 를 설명할 수 있습니다.","전달함수의 극점(pole) 이 무엇이고, s-평면 위 극점의 위치가 시간응답의 모양(수렴·진동·발산)을 어떻게 결정하는지 설명할 수 있습니다.","피드백이 극점을 이동시킨다는 관점으로, 이득을 키울 때 시스템이 불안정해질 수 있는 이유를 설명할 수 있습니다."],"essential":"이번 강의는 \"왜 로봇이 발진하는가\"를 다룹니다. 아래 세 가지만 확실하면 3강의 튜닝을 안전하게 시작할 수 있습니다.\n\n- 필수 ① 안정·한계 안정·불안정 세 가지 계단 응답을 그래프만 보고 구분한다.\n- 필수 ② \"모든 극점이 s-평면 왼쪽에 있으면 안정\" 이라는 판별 규칙을 말하고, 지도에서 위치를 찍을 수 있다.\n- 필수 ③ 이득을 키우면 왜 빨라지다가 결국 발진하는지를 지연의 관점(샤워기 비유)으로 설명한다.\n\n여유가 되면(심화): 극점 실수부와 정착시간의 관계($t_s \\approx 4/\\sigma$), 특성방정식 $1 + K_pG(s)=0$ 을 직접 푸는 것. 계산까지 못 해도 됩니다 — 위치와 운명의 대응만 잡으세요.","headings":["들어가며","1. 안정성이란 무엇인가","2. 극점 — 시스템의 운명을 정하는 뿌리","3. s-평면 지도 읽기","4. 피드백은 극점을 옮긴다","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":3,"title":"3강. PID 제어와 튜닝 (P·I·D·Ziegler–Nichols·anti-windup)","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/3강 PID 제어와 튜닝 (P·I·D·Ziegler–Nichols·anti-windup) 72b7bcf74d9383429b7d01d16737740e.md","goals":["PID 제어기의 P·I·D 각 항의 역할과, 정상상태 오차·응답속도·진동에 미치는 영향을 설명할 수 있습니다.","PID 튜닝 절차(Ziegler–Nichols 등)를 설명하고 초기 게인을 정할 수 있습니다.","적분 와인드업(integral windup)이 왜 생기는지, anti-windup 대책을 어떻게 넣는지 설명할 수 있습니다."],"essential":"이번 강의의 결과물은 7강에서 여러분이 직접 돌릴 제어기입니다. 아래 세 가지가 그 실습의 최소 준비물입니다.\n\n- 필수 ① P·I·D 세 항이 각각 무엇을 보고(현재·과거·미래) 무엇을 고치는지 한 문장씩 말한다.\n- 필수 ② 정상상태 오차를 0으로 만드는 것은 I 항뿐이라는 사실과 그 이유를 에어컨 예로 설명한다.\n- 필수 ③ 수동 튜닝 순서($K_p$ → $K_i$ → $K_d$)를 따라, 응답 그래프를 보고 다음에 어느 게인을 손댈지 판단한다.\n\n여유가 되면(심화): Ziegler–Nichols 계수표의 유래, 미분 필터·측정값 미분 같은 실무 변형, back-calculation 방식의 anti-windup. 다만 와인드업이 무엇이고 대책이 필요하다는 사실은 심화가 아니라 필수입니다.","headings":["들어가며","1. PID의 구조 — 과거·현재·미래","2. 이산화 — MCU 위의 PID","3. 튜닝 — Ziegler–Nichols와 실무 절차","4. 적분 와인드업과 대책","미니 퀴즈","실습","정리","용어 사전"],"environment":["이번 강의의 결과물은 7강에서 여러분이 직접 돌릴 제어기입니다. 아래 세 가지가 그 실습의 최소 준비물입니다."],"deliverables":"","hasPractice":true},{"number":4,"title":"4강. MCU와 주변장치 (Cortex-M·GPIO·인터럽트·타이머·PWM)","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/4강 MCU와 주변장치 (Cortex-M·GPIO·인터럽트·타이머·PWM) 95d7bcf74d9382b1aa6481336e13e1d9.md","goals":["MCU(Cortex-M)의 구조·메모리맵·툴체인을 이해하고, MCU가 실시간 제어에 적합한 이유를 설명할 수 있습니다.","GPIO·인터럽트·타이머·PWM의 동작 원리를 설명할 수 있습니다.","5~8강 실습에서 사용할 STM32 개발 흐름(CubeIDE·HAL)의 큰 그림을 잡습니다."],"essential":"이번 강의는 5~8강 실습에서 손이 기억해야 할 하드웨어 지도를 그립니다. 용어가 많지만 반드시 붙잡을 것은 셋입니다.\n\n- 필수 ① MCU에서 \"주변장치를 다룬다 = 정해진 주소의 레지스터에 값을 쓴다\"는 구조를 설명한다.\n- 필수 ② 폴링과 인터럽트의 차이를 말하고, 제어 루프를 왜 타이머 인터럽트로 돌리는지 설명한다.\n- 필수 ③ PWM의 듀티 사이클이 모터가 느끼는 평균 전압을 정한다는 것과, 서보는 듀티가 아니라 펄스 폭으로 명령한다는 차이를 구분한다.\n\n여유가 되면(심화): 메모리맵의 세부 주소, 인터럽트 우선순위(NVIC)와 지연 예산, 타이머의 여러 모드. 5강에서 CubeMX가 대부분 자동으로 잡아 주므로 지금은 개념의 이름만 알아 두면 충분합니다.","headings":["들어가며","1. Cortex-M MCU의 구조와 메모리맵","2. GPIO — 디지털 손발","3. 인터럽트 — 폴링 대신 반사신경","4. 타이머 — 심장박동과 만능 계측기","5. PWM — 디지털로 아날로그 힘내기","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":5,"title":"5강. [실습] GPIO·타이머·PWM 액추에이터 구동 (DC/서보)","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/5강 [실습] GPIO·타이머·PWM 액추에이터 구동 (DC 서보) 6a87bcf74d9383d085fd0134e1a77b9f.md","goals":["STM32CubeIDE로 프로젝트를 생성·빌드·플래시하는 개발 사이클을 수행할 수 있습니다.","GPIO 출력·입력(인터럽트)으로 LED와 버튼을 다룰 수 있습니다.","타이머 PWM으로 서보 모터의 각도와 DC 모터의 속도를 제어할 수 있습니다."],"essential":"실습 강의의 기준은 \"코드를 외웠는가\"가 아니라 \"내 손으로 움직였는가\" 입니다. 아래 세 가지를 끝내면 오늘의 목표는 달성입니다.\n\n- 필수 ① CubeIDE로 프로젝트를 만들어 빌드 → 플래시 → 관찰 사이클을 한 바퀴 돌린다(LED 점멸 성공).\n- 필수 ② 버튼 입력을 폴링과 인터럽트 두 방식으로 각각 처리해 보고, 코드에서 차이를 지목한다.\n- 필수 ③ 타이머 PWM으로 서보 각도와 DC 모터 듀티를 바꿔 실제 움직임을 확인한다.\n\n여유가 되면(심화): 채터링 제거 방식 비교, 데드존 측정, 모터 전원 분리·역기전력 대책. 배선이 막힐 때는 혼자 오래 붐들지 말고 준비된 배선 그림과 질문 폼을 활용하세요.","headings":["들어가며","1. 개발 환경과 첫 프로젝트","2. GPIO 입력 — 버튼과 인터럽트","3. 타이머 PWM — 서보 모터 각도 제어","4. PWM + 방향 핀 — DC 모터 구동","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: Nucleo-F446RE(또는 유사 Nucleo 보드) · USB 케이블 · SG90 서보 모터 · DC 모터 + 모터 드라이버(DRV8871 또는 L298N) · 외부 전원(건전지 4개 홀더 등) · 점퍼선, 브레드보드"],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 펌웨어 소스 | `lab05_gpio_pwm` 프로젝트 전체 (Git 저장소, USER CODE 구간 확인) |\n| 데모 영상 | ① 버튼 인터럽트+디바운싱으로 LED 토글 ② 서보 0→90→180° 순회 ③ DC 모터 정/역/속도 3단계 (각 10초 내외) |\n| 측정 로그 | 듀티 스윕 기록표(데드존 듀티 포함), 채터링 관찰 메모 |\n\n체크리스트\n\n- [ ]  빌드 경고 0건, USER CODE 구간 밖에 코드 없음\n- [ ]  버튼 1회 누름 = LED 1회 토글 (디바운싱 동작)\n- [ ]  `servo_write_deg(90)` 이 실측 약 1.5ms 펄스를 냄 (가능하면 로직 애널라이저/오실로스코프 캡처 첨부)\n- [ ]  `motor_write()` 가 방향·크기를 모두 처리하고 ±1.0에서 포화됨\n\n---","hasPractice":true},{"number":6,"title":"6강. [실습] ADC·엔코더 센서 인터페이스","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/6강 [실습] ADC·엔코더 센서 인터페이스 6097bcf74d938347849e01c054cd2e3a.md","goals":["ADC로 아날로그 센서(가변저항·조도 등)를 읽고 물리 단위로 변환할 수 있습니다.","타이머 엔코더 모드로 쿼드러처 엔코더를 읽어 모터의 위치·속도를 계산할 수 있습니다.","측정 노이즈를 이동평균/저역통과 필터로 다듬고, UART로 데이터를 로깅할 수 있습니다."],"essential":"5강이 \"손\"이었다면 오늘은 \"눈\"입니다. 7강 PID는 오늘 만든 측정값 위에서만 동작하므로, 아래 세 가지는 반드시 통과해야 합니다.\n\n- 필수 ① ADC 값(0~4095)을 전압으로 환산하고, 양자화가 무엇인지 그림으로 설명한다.\n- 필수 ② 엔코더 카운트에서 속도(RPM) 를 계산하는 과정을 식과 코드로 연결한다.\n- 필수 ③ 필터를 걸수록 신호가 깨끗해지지만 늦어진다는 트레이드오프를 로그 그래프로 확인한다.\n\n여유가 되면(심화): M법·T법 속도 측정의 차이, 이동평균과 EMA의 주파수 특성. 저속에서 속도가 튀는 이유가 궁금해지면 그때 심화 토글을 펴 보세요.","headings":["들어가며","1. ADC — 아날로그를 숫자로","2. UART 로깅 — 측정을 눈으로","3. 필터 — 떨리는 값 다듬기","4. 쿼드러처 엔코더 — 회전을 세다","5. 통합 — 오늘의 결과물","6. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 5강 세트 + 가변저항(10kΩ) · 쿼드러처 엔코더 부착 DC 기어드모터(예: JGA25-371 엔코더 사양) · (선택) USB-UART는 Nucleo 내장 ST-LINK의 가상 COM 포트를 사용"],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 펌웨어 소스 | `lab06_adc_encoder` 프로젝트 (Git) |\n| 데모 영상 | 가변저항으로 모터 속도 조절 + 터미널 로그가 함께 보이는 화면 (20초 내외) |\n| 측정 로그 | ① 듀티 계단 응답 CSV와 그래프(시정수 τ 추정치 표기) ② 필터 전/후 비교 그래프 ③ 손으로 부하를 준 구간이 표시된 개루프 로그 |\n\n체크리스트\n\n- [ ]  ADC 값→전압 변환식이 코드에 명시되어 있음\n- [ ]  `printf` 가 ISR이 아닌 메인 루프에서만 호출됨\n- [ ]  엔코더 카운트가 정/역회전에서 부호가 바뀜, CPR 근거(슬릿×기어비×4) 주석 존재\n- [ ]  계단 응답 그래프에서 τ를 읽어 기록함 (7강 튜닝에서 사용)\n\n---","hasPractice":true},{"number":7,"title":"7강. [실습] PID 펌웨어 목표값 추종 (속도/위치)","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/7강 [실습] PID 펌웨어 목표값 추종 (속도 위치) d937bcf74d9382bcaf4a817d0a41ea4a.md","goals":["타이머 인터럽트 기반의 고정 주기 제어 루프를 펌웨어로 구성할 수 있습니다.","이산 PID(anti-windup 포함)를 C로 구현하여 모터 속도/위치 목표값 추종을 수행할 수 있습니다.","계단 응답 로그에서 오버슈트·정착시간·정상상태 오차를 측정하며 게인을 튜닝할 수 있습니다."],"essential":"모듈 ①의 결승선입니다. 아래 세 가지는 제출물의 채점 기준이자 최소 이해 기준입니다.\n\n- 필수 ① 제어 루프를 일정한 주기(타이머 인터럽트) 로 돌려야 하는 이유를 설명하고, 실제로 1kHz ISR에서 PID를 호출한다.\n- 필수 ② $K_p \\to K_i \\to K_d$ 순서로 튜닝하며, 각 단계의 계단 응답 로그에서 오버슈트·정착시간·정상상태 오차를 계산한다.\n- 필수 ③ 외란(손으로 축 잡기) 시험에서 개루프와 PID의 차이를 로그 그래프로 제시한다.\n\n여유가 되면(심화): 위치 제어로의 확장, 미분 필터 계수 조정, 캐스케이드(속도-위치 이중 루프) 구조. 게인 값 자체는 정답이 없습니다 — 왜 그 게인을 골랐는지 근거를 로그로 설명할 수 있으면 충분합니다.","headings":["들어가며","1. 제어 루프의 뼈대 — 1kHz 타이머 인터럽트","2. PID 모듈 구현","3. 속도 제어 튜닝 — 계단 응답으로 증명하기","4. 위치 제어로 확장","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 6강 하드웨어 그대로 (엔코더 기어드모터 + 드라이버 + 가변저항). 새 배선 없음 — 오늘은 순수하게 소프트웨어 실습입니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 펌웨어 소스 | `lab07_pid` 프로젝트 (Git). `pid.c/h` 분리, anti-windup·미분 필터 포함 |\n| 데모 영상 | ① 계단 추종 (터미널/그래프 화면 포함) ② 외란(손 부하) 복구 ③ 위치 왕복 (각 15초 내외) |\n| 측정 로그 | 튜닝 이력 표(게인 조합별 오버슈트·정착시간·오차) + 최종 게인의 계단 응답 CSV·그래프 + 와인드업 on/off 비교 그래프 |\n\n체크리스트\n\n- [ ]  제어 계산이 전부 TIM7 ISR에서, 로깅은 전부 메인 루프에서 수행됨\n- [ ]  공유 변수에 `volatile` 선언\n- [ ]  속도 계단 응답: 오버슈트 ≤ 10%, 정착 ≤ 0.5s, 정상상태 오차 ≈ 0 (그래프에 수치 주석)\n- [ ]  외란 복구 그래프에서 duty가 스스로 증가하는 구간을 표시\n- [ ]  위치 제어에서 P·I·D 각 항의 필요성을 로그로 설명\n\n---","hasPractice":true},{"number":8,"title":"8강. [실습] micro-ROS ROS2 네트워크 연동","module":"모듈 ① 임베디드 제어 기초","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ① 임베디드 제어 기초/8강 [실습] micro-ROS ROS2 네트워크 연동 6157bcf74d938282b4618168ee7b4585.md","goals":["micro-ROS의 구조(클라이언트–에이전트)와 존재 이유를 설명할 수 있습니다.","MCU 펌웨어에 micro-ROS 노드를 올려 엔코더 상태를 퍼블리시하고 목표값을 구독할 수 있습니다.","PC의 ROS2 도구(`ros2 topic`·`rqt_plot`)로 임베디드 제어기를 조작·관찰하며, 모듈 ① 전체를 하나의 시스템으로 완성합니다."],"essential":"모듈 ①의 마지막 조각은 \"MCU를 ROS2 세계에 편입시키기\"입니다. 아래 세 가지가 최소 기준입니다.\n\n- 필수 ① micro-ROS의 클라이언트–에이전트 구조를 그림으로 설명한다(왜 MCU가 DDS를 직접 못 쓰는지 포함).\n- 필수 ② PC에서 `ros2 topic pub` 으로 목표 속도를 보내 모터를 움직이고, `ros2 topic echo` 로 상태를 확인한다.\n- 필수 ③ ROS2 개념(노드·토픽·발행·구독)이 이름 그대로 재사용된다는 점을 확인하고, Lv.1에서 배운 것과 대응시킨다.\n\n여유가 되면(심화): QoS 설정, executor의 동작 방식, 정적 메모리 할당과 실시간성. 연결이 자꾸 끊긴다면 대부분 Agent 실행·포트·전원 문제이니 순서대로 점검하세요.","headings":["들어가며","1. micro-ROS의 구조 — 클라이언트와 에이전트","2. 펌웨어에 micro-ROS 올리기","3. 연결과 조작 — PC에서 모터 다루기","4. 제출물 — 모듈 ① 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 7강 하드웨어 + ROS2 Humble이 설치된 Ubuntu 22.04 PC (Lv.1 실습 환경). USB 케이블이 곧 통신선입니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 펌웨어 소스 | `lab08_microros` 프로젝트 (Git). 7강 PID + micro-ROS 통합 |\n| 데모 영상 | ① `ros2 topic pub` → 모터 반응 + rqt_plot ② 외란 복구 ③ Agent 단절/복구 (합계 1분 내외) |\n| 측정 로그 | 계단 응답 rosbag + `ros2 topic hz` 캡처 + (심화 수행 시) QoS 비교·failsafe 데모 |\n\n체크리스트\n\n- [ ]  `ros2 node list` 에 MCU 노드가 보임\n- [ ]  상태 50Hz 발행이 `ros2 topic hz` 로 확인됨\n- [ ]  목표 지령이 토픽으로만 이루어짐 (가변저항 코드는 제거 또는 비활성)\n- [ ]  Agent 단절 시에도 제어 ISR이 지터 없이 유지됨 (설명 포함)\n- [ ]  실험이 rosbag으로 기록되어 재생 가능\n\n---","hasPractice":true},{"number":9,"title":"9강. 순기구학 (D-H 파라미터·동차변환·Forward Kinematics)","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/9강 순기구학 (D-H 파라미터·동차변환·Forward Kinematics) cd37bcf74d938263913601bfc6fb721b.md","goals":["로봇팔을 링크와 조인트의 사슬로 모델링하고, 각 링크에 좌표계를 붙이는 이유를 설명할 수 있습니다.","D-H(Denavit–Hartenberg) 파라미터 4개로 이웃 링크 사이의 변환을 기술할 수 있습니다.","동차변환 행렬의 곱으로 엔드이펙터의 위치·자세를 구하는 Forward Kinematics(순기구학) 를 설명할 수 있습니다."],"essential":"로봇팔 수학의 첫날입니다. 행렬이 여러 개 나오지만, 오늘 반드시 남겨야 할 것은 셋뿐입니다.\n\n- 필수 ① 링크·조인트·자유도·엔드이펙터라는 어휘로 로봇팔의 구조를 설명한다.\n- 필수 ② \"이웃 변환을 곱하면 베이스→손끕\" 이라는 FK의 원리를 말하고, 2링크 팔의 $x, y$ 식을 직접 쓴다.\n- 필수 ③ 완성된 $T^0_n$ 에서 위치(마지막 열) 와 자세(왼쪽 위 3×3) 를 구분해 읽는다.\n\n여유가 되면(심화): D-H 규약의 두 종류(standard/modified) 차이, D-H의 한계와 현대 대안. D-H 표를 직접 만드는 것은 심화입니다 — 남이 준 표를 공식에 넣어 곱할 수 있으면 필수 기준은 통과입니다.","headings":["들어가며","1. 로봇팔의 어휘 — 링크, 조인트, 자유도","2. 왜 링크마다 좌표계를 붙이는가","3. D-H 파라미터 — 좌표계 붙이기의 표준 규약","4. FK의 출력 읽기 — 위치와 자세","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":10,"title":"10강. 역기구학 (해석적·수치적 IK: Newton-Raphson·Jacobian Pseudo-Inverse)","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/10강 역기구학 (해석적·수치적 IK Newton-Raphson·Jacobian Pseud 48d7bcf74d93838eab6f014a8aad2c84.md","goals":["역기구학(IK) 문제가 순기구학과 달리 해가 없거나·여러 개거나·무한히 많을 수 있는 이유를 설명할 수 있습니다.","2링크 팔의 IK를 기하학적(해석적)으로 풀 수 있습니다.","수치적 IK — Newton-Raphson 반복과 Jacobian Pseudo-Inverse — 의 원리와 해석적 방법과의 트레이드오프를 설명할 수 있습니다."],"essential":"오늘은 \"답이 하나가 아닐 수 있는\" 문제를 처음 만납니다. 아래 세 가지가 최소 기준입니다.\n\n- 필수 ① IK의 해가 없거나·여러 개거나·무한히 많을 수 있다는 것을 그림과 예로 설명한다.\n- 필수 ② 2링크 팔의 해석적 IK를 코사인 법칙으로 풀고, $\\pm$ 부호가 elbow-up/down임을 안다.\n- 필수 ③ 수치적 IK의 반복 구조(추측 → 오차 → $J$ 로 수정)를 말로 설명한다.\n\n여유가 되면(심화): 유사역행렬의 최소 노름 성질, damped least squares, 초기 추측 관리 전략. $J^+$ 를 손으로 계산할 필요는 없습니다 — 왜 필요한지와 언제 위험한지만 알면 됩니다.","headings":["들어가며","1. IK는 왜 어려운가 — 해의 세 가지 운명","2. 해석적 IK — 2링크 팔을 닫힌 식으로","3. 수치적 IK — 반복해서 다가가기","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":11,"title":"11강. Jacobian과 특이점 (조인트↔엔드이펙터 속도·Singularity)","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/11강 Jacobian과 특이점 (조인트↔엔드이펙터 속도·Singularity) 8527bcf74d9382b2b8bc81902fd6fadd.md","goals":["Jacobian 행렬의 정의 — 관절 속도를 엔드이펙터 속도로 보내는 선형 사상 — 를 설명할 수 있습니다.","2링크 팔의 Jacobian을 유도하고, 관절 속도↔손끝 속도 변환을 계산할 수 있습니다.","특이점(singularity) 이 무엇이고, 왜 그 근처에서 로봇이 위험해지는지 rank·행렬식과 연결해 설명할 수 있습니다."],"essential":"오늘의 주인공 Jacobian은 Lv.2 전체에서 가장 자주 재등장하는 행렬입니다. 아래 세 가지가 최소 기준입니다.\n\n- 필수 ① $\\dot{x} = J\\dot{\\theta}$ 를 \"관절 속도를 손끕 속도로 바꾸는 환율\" 이라는 말로 설명한다.\n- 필수 ② Jacobian의 각 열이 \"그 관절만 돌릴 때 손끕이 가는 방향\"임을 그림에서 지목한다.\n- 필수 ③ 특이점이 무엇이고 왜 위험한지($J^{-1}$ 폭주 / 못 가는 방향 발생)를 2링크 팔의 $\\theta_2 = 0$ 예로 설명한다.\n\n여유가 되면(심화): 조작성·조건수·최소 특이값의 차이, damped least squares의 원리, 힘–토크 이중성 $\\tau = J^\\mathsf{T}F$. 지표를 손으로 계산할 필요는 없습니다 — 14강에서 코드가 대신 계산해 줍니다.","headings":["들어가며","1. Jacobian의 정의와 유도","2. 특이점 — Jacobian이 계급을 잃는 곳","3. 힘의 세계 — $\\tau = J^\\mathsf{T} F$","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":12,"title":"12강. 동역학·제어 개요 (Lagrange/Newton-Euler·PID 튜닝)","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/12강 동역학·제어 개요 (Lagrange Newton-Euler·PID 튜닝) 3257bcf74d93834b9f12819032a634d1.md","goals":["기구학과 동역학의 차이를 설명하고, 로봇 동역학 방정식의 표준형과 각 항(관성·코리올리·중력)의 의미를 설명할 수 있습니다.","동역학을 세우는 두 방법 — Lagrange와 Newton-Euler — 의 아이디어와 쓰임새 차이를 설명할 수 있습니다.","관절 PID 제어(모듈 ①)가 로봇팔에서 어떻게 쓰이고 어디서 한계를 만나는지, 중력 보상이 왜 필요한지 설명할 수 있습니다."],"essential":"오늘은 \"왜 움직이는가\"를 다룹니다. 식이 길어 보이지만 요구되는 것은 항별 해석입니다.\n\n- 필수 ① $M\\ddot\\theta + C\\dot\\theta + g = \\tau$ 의 세 항이 각각 무엇인지 말로 설명한다(관성·코리올리·중력).\n- 필수 ② 로봇 관절 제어가 모듈 ①의 단일 모터 제어와 다른 이유 — 플랜트가 자세에 따라 변한다 — 를 설명한다.\n- 필수 ③ 중력 보상(피드포워드) 이 무엇이고 왜 효과적인지 설명한다.\n\n여유가 되면(심화): Lagrange 유도, 계산 토크 제어, 관성 행렬의 성질. 손으로 동역학을 유도하는 것은 이 과정의 요구 수준이 아닙니다 — 식을 읽고 어느 항이 지배적인지 판단할 수 있으면 충분합니다.","headings":["들어가며","1. 로봇 동역학의 표준형","2. 두 가지 유도법 — Lagrange vs Newton-Euler","3. 그래서 제어는 — 관절 독립 PID와 그 한계","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":13,"title":"13강. [실습] 2~3DOF FK 동차변환 체인","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/13강 [실습] 2~3DOF FK 동차변환 체인 4927bcf74d93821497480199801516b5.md","goals":["D-H 표를 받아 동차변환 체인을 곱하는 FK 함수를 NumPy로 구현할 수 있습니다.","9강의 손 계산 검산표를 pytest 테스트로 옮겨 구현을 검증할 수 있습니다.","Matplotlib으로 팔의 자세와 작업 공간을 3D 시각화할 수 있습니다."],"essential":"9강의 이론을 코드로 굳히는 시간입니다. 아래 세 가지가 제출 기준이자 최소 이해 기준입니다.\n\n- 필수 ① 동차변환 유픸(`rot_z`, `trans_x`, `dh_transform`)을 만들고, 곱의 순서가 무엇을 뜻하는지 설명한다.\n- 필수 ② 링크 길이 목록만 바꾸면 2DOF·3DOF 모두 도는 FK 함수를 구현한다.\n- 필수 ③ 손으로 검산 가능한 자세(0°, 90° 등)로 pytest를 통과시킨다.\n\n여유가 되면(심화): 작업 공간 시각화, 3DOF 자세(orientation)까지 다루기, 애니메이션. 코드가 막힐 때는 먼저 손 검산표를 만들고 그 값을 맞추는 방향으로 진행하세요.","headings":["들어가며","1. 기본 변환 블록 만들기","2. FK 체인 — 로봇을 데이터로 표현하기","3. pytest로 잠그기 — 9강 검산표의 자동화","4. 시각화 — 팔 그리기와 작업 공간","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: Lv.1 실습 환경(venv + JupyterLab). `pip install numpy matplotlib pytest`. 실습 저장소의 `모듈2` 템플릿(노트북 `13_fk.ipynb` + `src/` + `tests/`)을 받아 시작합니다."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 노트북 | `13_fk.ipynb` — 구현 과정·시각화·설명 (Restart & Run All 통과) |\n| 모듈 | `src/transforms.py`, `src/fk_chain.py` |\n| 테스트 | `tests/test_fk.py` — pytest 전부 통과 캡처 포함 |\n| 그림 | 자세 오버레이 · 작업 공간(관절 한계 유/무) · 3D 팔 각 1장 이상 |\n\n체크리스트\n\n- [ ]  `dh_transform` 이 9강 D-H 정의(곱 순서 포함)와 일치\n- [ ]  검산표 5개 + 3DOF 일반식 테스트 통과\n- [ ]  작업 공간 그림에서 안/바깥 반지름이 이론값과 일치함을 주석으로 표기\n- [ ]  노트북은 무대, 함수는 `src/` — 노트북 안에 복붙된 함수 정의가 없음\n\n---","hasPractice":true},{"number":14,"title":"14강. [실습] Jacobian 속도 변환·특이점 탐지","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/14강 [실습] Jacobian 속도 변환·특이점 탐지 1757bcf74d9382be90b201c80df0ea82.md","goals":["해석적 Jacobian과 수치 미분 Jacobian을 구현하고 서로 검증할 수 있습니다.","관절 속도↔손끝 속도 변환과 속도 IK(pseudo-inverse)를 코드로 수행할 수 있습니다.","조작성·최소 특이값으로 특이점 접근을 탐지하고, damped least squares의 효과를 실험으로 비교할 수 있습니다."],"essential":"11강의 이론을 눈에 보이는 그림과 숫자로 바꿉니다. 아래 세 가지가 최소 기준입니다.\n\n- 필수 ① 해석적 Jacobian을 구현하고, 수치 미분과 비교해 일치함을 확인한다.\n- 필수 ② 손끕 속도 목표를 관절 속도로 변환(`pinv`)하고, 결과를 FK로 되돌려 검증한다.\n- 필수 ③ 특이점 근처에서 관절 속도가 폭주하는 현상을 그래프로 재현하고, 지표($\\sigma_{\\min}$ 등)로 경보를 만든다.\n\n여유가 되면(심화): DLS와 pinv 비교, 조작성 히트맵 해석, 감쇠 계수 $\\lambda$ 조정. 지표 세 가지를 다 이해하지 못해도, 하나($\\sigma_{\\min}$)로 경보를 만들 수 있으면 통과입니다.","headings":["들어가며","1. Jacobian 두 가지로 만들기","2. 속도 변환 — 정방향과 역방향","3. 특이점 탐지 — 지표를 코드로","4. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 13강 산출물(`src/fk_chain.py`, `tests/`) 위에서 진행합니다. 노트북 `14_jacobian.ipynb`."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 노트북 | `14_jacobian.ipynb` (Restart & Run All 통과) |\n| 모듈 | `src/jacobian.py` (해석·수치·metrics·DLS) |\n| 테스트 | `tests/test_jacobian.py` — 교차 검증 3자세 이상 + 특이 자세에서 $\\sigma_{\\min}\\approx 0$ 확인 |\n| 그림 | 조작성 히트맵 · 속도 타원 · 원 그리기 · pinv vs DLS 비교 각 1장 이상 |\n\n체크리스트\n\n- [ ]  해석 Jacobian이 수치 미분과 atol=1e-6 이내로 일치\n- [ ]  속도 IK 원 그리기 반경 오차가 1% 이내 (드리프트 관찰 기록 포함)\n- [ ]  $\\sigma_{\\min}$ 임계값 경보가 특이점 접근 시 실제로 발화\n- [ ]  DLS 구간에서 관절 속도 상한과 추종 오차 증가를 수치로 보고\n\n---","hasPractice":true},{"number":15,"title":"15강. [실습] Quintic 궤적 생성 + PID 튜닝","module":"모듈 ② 로봇 기구학 및 동역학","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ② 로봇 기구학 및 동역학/15강 [실습] Quintic 궤적 생성 + PID 튜닝 bac7bcf74d938228975201c3d554619b.md","goals":["5차 다항식(Quintic) 궤적으로 위치·속도·가속도가 연속인 관절 궤적을 생성할 수 있습니다.","2링크 동역학 시뮬레이터에서 PID(+중력 보상)로 궤적을 추종하고, 추종 오차로 성능을 평가할 수 있습니다.","계단 명령과 궤적 명령의 차이를 실험으로 보이고, 자세(관성) 변화가 튜닝에 미치는 영향을 분석할 수 있습니다."],"essential":"모듈 ②의 결승선입니다. 굶적을 만들고, 시뮬레이터에서 따라가게 하고, 성능을 숫자로 제시합니다.\n\n- 필수 ① 계단 명령 대신 부드러운 굶적이 필요한 이유를 속도·가속도 프로파일로 설명한다.\n- 필수 ② Quintic 굶적을 구현해 위치·속도·가속도 세 곡선을 그린다.\n- 필수 ③ 계단 vs Quintic, PID vs PID+중력 보상 네 조합의 추종 오차(RMS) 를 표로 비교한다.\n\n여유가 되면(심화): 속도·가속도 한계로부터 $T$ 역산, 경유점 연결, 자세별 게인 스케줄링. 게인 값에 정답은 없습니다 — 비교 실험의 설계와 해석이 채점 대상입니다.","headings":["들어가며","1. 왜 5차인가 — 경계 조건 6개","2. 시뮬레이터 — 12강 동역학을 코드로","3. 추종 실험 — 계단 vs Quintic, PID vs PID+중력 보상","4. 제출물 — 모듈 ② 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 13·14강 산출물 위에서 진행. 노트북 `15_trajectory.ipynb`."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 노트북 | `15_trajectory.ipynb` (Restart & Run All 통과) |\n| 모듈 | `src/trajectory.py`, `src/arm_dynamics.py` |\n| 테스트 | 궤적 경계조건(양끝 pos/vel/acc) + 시뮬레이터 물리 검증 pytest |\n| 그림·표 | Quintic 프로파일 · 계단 vs 궤적 · 중력 보상 비교 · 자세별 튜닝 표 (지표 4종 수치 포함) |\n\n체크리스트\n\n- [ ]  `quintic` 양끝 조건 6개가 테스트로 확인됨, T 역산(속도 한계) 예제 포함\n- [ ]  시뮬레이터 에너지 보존·평형점 테스트 통과\n- [ ]  실험 A·B·C 각각 그래프+수치 표로 결론 한 줄씩\n- [ ]  최종 게인과 튜닝 근거(최악 자세) 기록\n\n---","hasPractice":true},{"number":16,"title":"16강. OpenCV 기초 (입출력·HSV·필터링·모폴로지)","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/16강 OpenCV 기초 (입출력·HSV·필터링·모폴로지) b117bcf74d938387be2d81733ea49d19.md","goals":["디지털 이미지가 NumPy 배열이라는 사실과 OpenCV의 기본 규약(BGR·좌표계·dtype)을 이해합니다.","색공간(BGR·HSV)의 차이와, 색 기반 검출에 HSV를 쓰는 이유를 설명할 수 있습니다.","필터링(블러)·이진화·모폴로지 연산의 역할을 설명하고 처리 파이프라인을 구성할 수 있습니다."],"essential":"비전 모듈의 출발점입니다. 함수 이름을 외우는 것보다 아래 세 가지 감각이 중요합니다.\n\n- 필수 ① 이미지가 `(H, W, 3)` NumPy 배열이며 인덱싱이 `img[y, x]`, 채널 순서가 BGR임을 안다.\n- 필수 ② 색 검출에 HSV를 쓰는 이유(조명이 주로 V만 흔든다)를 설명한다.\n- 필수 ③ 블러 → `inRange` → 모폴로지로 이어지는 마스크 청소 순서를 말하고 그대로 실행한다.\n\n여유가 되면(심화): 필터별 특성 비교, 모폴로지 커널 크기 설계, uint8 오버플로 처리. 19강 실습에서 값을 직접 만져 보며 익히면 되니, 오늘은 왜 이 순서인가에 집중하세요.","headings":["들어가며","1. 이미지 = NumPy 배열","2. 색공간 — 왜 HSV인가","3. 필터링 — 노이즈를 눌러야 마스크가 깨끗하다","4. 이진화와 모폴로지 — 마스크 청소","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":17,"title":"17강. 핀홀 카메라 모델과 렌즈 왜곡 (내부파라미터 K·방사/접선)","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/17강 핀홀 카메라 모델과 렌즈 왜곡 (내부파라미터 K·방사 접선) 46c7bcf74d9383b6838301b601a03d66.md","goals":["핀홀 카메라 모델의 투영 수식과 내부파라미터 행렬 K(초점거리·주점)의 의미를 설명할 수 있습니다.","3D 점이 픽셀이 되기까지의 좌표 변환 사슬(월드→카메라→정규화→픽셀)을 쓸 수 있습니다.","렌즈 왜곡(방사·접선)의 원인과 왜곡 계수의 역할, 보정 방법을 설명할 수 있습니다."],"essential":"카메라를 \"수식으로 다루는\" 첫날입니다. 아래 세 가지가 모듈 ③④⑤ 전체의 기반입니다.\n\n- 필수 ① 핀홀 투영식 $x = fX/Z$ 를 닮은꼴 삼각형으로 설명하고, \"Z로 나눈다\"가 원근의 정체임을 안다.\n- 필수 ② 내부파라미터 $K$ 의 네 숫자($f_x, f_y, c_x, c_y$)가 각각 무엇인지 말한다.\n- 필수 ③ 렌즈 왜곡이 무엇이고, 기하를 재는 작업에서는 반드시 보정해야 하는 이유를 설명한다.\n\n여유가 되면(심화): 왜곡 다항식의 계수 의미, 시야각(FOV)과 $f$ 의 관계, 어안 모델. $K$ 를 손으로 유도할 필요는 없습니다 — 20강에서 측정해서 얻는 값입니다.","headings":["들어가며","1. 핀홀 모델 — 닮은꼴 삼각형 하나","2. 내부파라미터 K — 상을 픽셀로","3. 렌즈 왜곡 — 이상적 핀홀과 현실의 차이","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":18,"title":"18강. PnP 포즈 추정과 단안 거리 모호성","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/18강 PnP 포즈 추정과 단안 거리 모호성 46e7bcf74d93837ebacc8163e0619d7d.md","goals":["PnP(Perspective-n-Point) 문제 — 2D-3D 대응으로 카메라·물체의 상대 포즈를 구하는 것 — 를 설명할 수 있습니다.","PnP에 필요한 재료(대응점·K·왜곡 계수)와 출력(rvec·tvec)의 의미, 재투영 오차로 검증하는 방법을 설명할 수 있습니다.","단안 카메라의 거리 모호성이 왜 생기고, 실제 크기·깊이 카메라·바닥 평면 세 가지 해결책이 각각 어떤 가정을 쓰는지 설명할 수 있습니다."],"essential":"\"사진 한 장으로 물체가 어디 있는지 안다\"의 원리와 한계를 동시에 배웁니다.\n\n- 필수 ① PnP가 무엇을 주면 무엇을 주는지(3D 점 + 픽셀 + $K$ → $R, t$)를 말한다.\n- 필수 ② 재투영 오차로 포즈의 신뢰도를 판정하는 습관을 갖는다(\"풀었다\"가 아니라 \"몇 px\").\n- 필수 ③ 단안 카메라의 거리 모호성을 설명하고, 세 가지 해결책(아는 크기·깊이 센서·바닥 평면)을 구분한다.\n\n여유가 되면(심화): P3P의 다중해, Levenberg-Marquardt 반복, ArUco의 인코딩 방식. solvePnP 내부 알고리즘은 심화입니다 — 입력·출력·검증만 확실하면 됩니다.","headings":["들어가며","1. PnP 문제의 정의","2. 단안 거리 모호성 — 한 눈의 근본 한계","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":19,"title":"19강. [실습] HSV 마스킹·컨투어 색상 객체 검출","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/19강 [실습] HSV 마스킹·컨투어 색상 객체 검출 8fc7bcf74d9382debd2501313794b77e.md","goals":["16강의 전처리 파이프라인에 컨투어 분석을 더해 색상 객체 검출기를 완성할 수 있습니다.","면적·형상 필터로 오검출을 걸러내고, 중심 좌표·바운딩 박스를 안정적으로 출력할 수 있습니다.","검출기를 함수/클래스로 모듈화하고, 프레임률(FPS)을 측정할 수 있습니다."],"essential":"첫 번째 \"실제로 도는 검출기\"를 만듭니다. 아래 세 가지가 최소 기준입니다.\n\n- 필수 ① 트랙바로 HSV 범위를 찾아 대상 물체의 깨끗한 마스크를 만든다.\n- 필수 ② 컨투어에서 면적·형상 필터로 오검출을 걸러내고 중심 좌표를 얻는다.\n- 필수 ③ 실시간 루프에서 FPS를 측정하고, 조명을 바꿔 가며 검출 성공률을 관찰한다.\n\n여유가 되면(심화): 모폴로지 커널 튜닝, 다중 객체 추적, 조명 자동 적응. HSV 값에 정답은 없습니다 — 여러분의 환경에서 찾은 값과 그 근거가 결과물입니다.","headings":["들어가며","1. 전처리 — 16강의 복습을 코드로","2. 컨투어 — 덩어리를 찾고 재기","3. 통합 루프와 성능 측정","4. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: USB 웹캠(노트북 내장 가능), 단색 물체(색종이 공, 테니스공 등 2~3색). venv에 `pip install opencv-python numpy`."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | `src/color_detector.py`(모듈) + `scripts/run_detector.py`  • 색 설정 JSON |\n| 결과 이미지 | 파이프라인 단계별 이미지(원본→마스크→필터 후→최종 오버레이) 1세트, 2색 이상 검출 캡처 |\n| 성능 기록 | FPS(단계별 프로파일 포함), 5×3 검출률 표, 실패 원인 분류 |\n\n체크리스트\n\n- [ ]  HSV 범위가 설정 파일로 분리되어 있고, 빨강은 두 범위 OR 처리\n- [ ]  면적+형상 필터로 오검출 제거 (필터 근거를 주석으로)\n- [ ]  중심 좌표에 EMA 적용, 미검출 프레임은 None 처리(마지막 값 유지 아님 — 이유 생각해 보기)\n- [ ]  640×480에서 25FPS 이상, 시험 매트릭스 평균 검출률 90% 이상\n\n---","hasPractice":true},{"number":20,"title":"20강. [실습] 체커보드 카메라 캘리브레이션 (intrinsic/distortion)","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/20강 [실습] 체커보드 카메라 캘리브레이션 (intrinsic distortion) 9157bcf74d938307af5281368a5cd795.md","goals":["체커보드 이미지들로 카메라의 K와 왜곡 계수를 추정(`cv2.calibrateCamera`)할 수 있습니다.","재투영 오차로 캘리브레이션 품질을 판정하고, 나쁜 결과의 원인을 진단할 수 있습니다.","보정 결과를 파일로 저장하고 `undistort` 로 적용하는, 이후 전 과정이 쓸 표준 산출물을 만들 수 있습니다."],"essential":"오늘 만든 `camera_params.npz` 는 남은 Lv.2 전체에서 계속 불러 쓰는 자산입니다.\n\n- 필수 ① 체커보드를 다양한 각도·위치로 15~20장 찍어 캘리브레이션을 실행한다.\n- 필수 ② 결과를 세 관문(RMS 재투영 오차 · 값의 상식 검사 · undistort 눈 검사)으로 검증한다.\n- 필수 ③ $K$ 와 왜곡 계수를 파일로 저장하고, 다른 스크립트에서 불러와 보정에 쓴다.\n\n여유가 되면(심화): 오차 진단표로 원인 추적, 장별 오차 분석, 해상도 변경 시의 $K$ 스케일링. RMS가 1px을 넘으면 다시 찍는 것이 정답입니다 — 계산을 의심하기 전에 사진을 의심하세요.","headings":["들어가며","1. 원리 — 왜 체커보드 여러 장인가","2. 코너 검출과 캘리브레이션 실행","3. 결과 읽기 — 숫자를 검증하는 세 관문","4. 적용 — 저장·불러오기·즉시 활용","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 체커보드 패턴(9×6 내부 코너, A4 인쇄 — 실습 저장소 PDF). 평평한 판에 부착(들뜨면 치수가 무너집니다). 한 칸의 실제 크기를 자로 실측해 기록(인쇄 배율 오차!)."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 캘리브레이션 파일 | `camera_params.npz` (K·dist·rms·image_size) |\n| 코드 | `scripts/calibrate.py`, 촬영 가이드 준수 여부를 확인하는 촬영 목록 |\n| 결과 이미지 | 코너 검출 오버레이 3장, 보정 전/후 비교 1쌍, 장별 오차 막대 |\n| 검증 기록 | 3관문 결과 (RMS·상식 검사·FOV 교차 검증), PnP 개선 비교표 |\n\n체크리스트\n\n- [ ]  15장 이상, 기울임·구석·거리 다양성 충족 (촬영 목록으로 증빙)\n- [ ]  `cornerSubPix` 적용, 코너 실패/고오차 장 처리 내역 기록\n- [ ]  RMS \u003c 1.0px, $f$ 의 FOV 교차 검증 5% 이내\n- [ ]  오토포커스 고정 상태로 촬영·사용 (설정 방법 기록)\n\n---","hasPractice":true},{"number":21,"title":"21강. [실습] cv_bridge ROS2 이미지 토픽 연동","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/21강 [실습] cv_bridge ROS2 이미지 토픽 연동 8147bcf74d93820098f301fb4cfdd710.md","goals":["ROS2 이미지 파이프라인의 표준 구성(usb_cam·sensor_msgs/Image·CameraInfo)을 이해합니다.","cv_bridge로 Image 메시지↔OpenCV 배열을 변환하는 구독·처리·발행 노드를 작성할 수 있습니다.","이미지 토픽의 대역폭·지연을 측정하고, QoS·압축 선택의 근거를 댅 수 있습니다."],"essential":"지금까지의 OpenCV 코드를 ROS2 노드로 옆깁니다. 아래 세 가지가 최소 기준입니다.\n\n- 필수 ① 카메라 → 처리 → 결과 발행으로 이어지는 이미지 파이프라인 구조를 그린다.\n- 필수 ② `cv_bridge` 로 `sensor_msgs/Image` ↔ OpenCV 배열을 변환해 노드를 동작시킨다.\n- 필수 ③ 이미지 토픽의 대역폭·지연을 측정하고, 센서 데이터에 best-effort QoS를 쓰는 이유를 설명한다.\n\n여유가 되면(심화): 압축 전송(image_transport), 타임스탬프 동기화, 노드 컴포지션. 화면이 안 뜨면 대부분 QoS 불일치이니 발행/구독 양쪽 설정을 먼저 맞춰 보세요.","headings":["들어가며","1. 이미지 파이프라인의 표준 구조","2. cv_bridge — 번역기 한 줄","3. 실행과 확인","4. 어른의 사정 — 대역폭·지연·QoS","5. 제출물","미니 퀴즈","정리","용어 사전"],"environment":["준비물: Ubuntu 22.04 + ROS2 Humble(Lv.1 환경), USB 웹캠. `sudo apt install ros-humble-usb-cam ros-humble-cv-bridge ros-humble-image-transport-plugins`"],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 코드 | `color_detector_node.py`  • 패키지([setup.py](http://setup.py)·package.xml — Lv.1 15강 형식) |\n| 실행 증빙 | `ros2 node list`/`topic list` 캡처, rqt_image_view 오버레이 화면 |\n| 측정 기록 | `topic bw/delay/hz` 결과표 (raw vs compressed, QoS 두 설정 비교) |\n| rosbag | `/image_raw /camera_info /detection` 30초 이상 (22강 입력) |\n\n체크리스트\n\n- [ ]  19강 모듈을 수정 없이 import (비전 로직과 배관의 분리 유지)\n- [ ]  `/detection` 의 header가 원본 프레임 스탬프를 계승\n- [ ]  센서 QoS(best-effort·depth1) 적용, 비교 측정으로 근거 제시\n- [ ]  CameraInfo가 20강 캘리브레이션 값으로 발행됨\n\n---","hasPractice":true},{"number":22,"title":"22강. [실습] 검출→포즈추정 비전 파이프라인 통합","module":"모듈 ③ 컴퓨터 비전 + 카메라 모델","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ③ 컴퓨터 비전 + 카메라 모델/22강 [실습] 검출→포즈추정 비전 파이프라인 통합 6d57bcf74d93833c8c0f815a5f193f2d.md","goals":["검출(19강)·캘리브레이션(20강)·ROS2 배관(21강)·PnP(18강)를 하나의 파이프라인으로 통합할 수 있습니다.","검출 결과를 3D 포즈로 승격해 토픽으로 발행하고, RViz2 마커로 시각화할 수 있습니다.","rosbag 재생 기반의 파이프라인 검증(정확도·지연·처리율)을 수행할 수 있습니다."],"essential":"모듈 ③의 결승선 — 16~21강의 조각을 하나의 ROS2 파이프라인으로 잇습니다.\n\n- 필수 ① 마커 검출 → PnP → `PoseStamped` 발행까지 경로 A를 동작시킨다.\n- 필수 ② 색 검출 → 아는 크기 기반 거리 추정으로 경로 B를 동작시킨다.\n- 필수 ③ 결과를 RViz2에 띄우고, 줄자 실측과 비교해 오차를 표로 제시한다.\n\n여유가 되면(심화): rosbag 회귀 테스트, 두 경로의 정확도 비교 분석, 좌표계 확장. 정확도가 완벽하지 않아도 됩니다 — 오차를 측정하고 원인을 설명하면 통과입니다.","headings":["들어가며","1. 파이프라인 설계","2. 경로 A — ArUco → PnP → PoseStamped","3. 경로 B — 색 검출 → 거리 추정","4. RViz2 시각화 — 3D로 보는 첫 순간","5. 검증 — rosbag과 줄자","6. 제출물 — 모듈 ③ 최종","미니 퀴즈","정리","용어 사전"],"environment":["준비물: 21강 환경 + 인쇄한 ArUco 마커(실측 치수), 크기를 아는 색 물체(테니스공 지름 6.7cm 등), 줄자. 21강에서 기록한 rosbag."],"deliverables":"| 항목 | 내용 |\n| --- | --- |\n| 패키지 | `vision_pipeline` — aruco_pose_node·color_point_node·공용 모듈, launch 파일(카메라+두 노드 동시 기동, Lv.1 15강) |\n| 결과 이미지 | 축 오버레이 캡처, RViz 3D 화면, 파이프라인 그래프(`rqt_graph`) |\n| 검증 기록 | 줄자 시험표, 교차 검증 산점도, bag 재생 hz/delay |\n| rosbag | 시험 장면 기록 (모듈 ⑤ 재사용) |\n\n체크리스트\n\n- [ ]  K는 하드코딩 없이 `/camera_info` 에서 수신\n- [ ]  재투영 오차 품질 게이트 동작 (문턱 초과 시 미발행 + 경고 로그)\n- [ ]  포즈의 frame_id·타임스탬프가 규약대로 (camera_link, 원본 스탬프)\n- [ ]  거리 오차 5% 이내, bag 회귀 시험 절차가 README에 기록됨\n\n---","hasPractice":true},{"number":23,"title":"23강. 카메라 좌표계 변환 심화 (World/Camera/Image/Pixel·Extrinsic/Intrinsic)","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/23강 카메라 좌표계 변환 심화 (World Camera Image Pixel·Extrin b757bcf74d9382df8531812101ff0c6a.md","goals":["World→Camera→Image→Pixel 네 좌표계와 각 단계의 변환을 수식으로 쓰고 구분할 수 있습니다.","Extrinsic $[R|t]$ 의 의미(두 가지 읽기)와 역변환, 카메라-로봇 좌표 연결(TF)을 설명할 수 있습니다.","픽셀→3D 역방향의 조건(깊이 필요)을 명확히 하고, 전체 사슬을 코드로 왕복 검증할 수 있습니다."],"essential":"좌표계 혼동은 비전 로봇 프로젝트에서 가장 자주, 가장 조용히 발생하는 사고입니다.\n\n- 필수 ① World → Camera → Image → Pixel 네 좌표계와 그 사이 변환을 순서대로 말한다.\n- 필수 ② `solvePnP` 의 출력이 \"물체가 카메라 기준 어디\"이며, 카메라 위치는 $-R^\\mathsf{T}t$ 로 뒤집어야 함을 안다.\n- 필수 ③ $T^{base}_{obj} = T^{base}_{cam} T^{cam}_{obj}$ 처럼 위첨자·아래첨자가 맞물리는지로 변환 체인을 검산한다.\n\n여유가 되면(심화): hand-eye 캘리브레이션, 좌표계 규약(OpenCV vs ROS)의 차이. 값이 이상할 때는 계산을 의심하기 전에 어느 좌표계 기준인지부터 확인하세요.","headings":["들어가며","1. 네 개의 좌표계 — 여권 만들기","2. Extrinsic 깊이 읽기 — $[R|t]$ 의 두 얼굴","3. 사슬 왕복 — 코드로 검증","4. 역방향의 세 형태 — 무엇을 알면 3D가 되나","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":24,"title":"24강. PnP 심화 (EPnP·P3P)","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/24강 PnP 심화 (EPnP·P3P) 6377bcf74d938324986801bac506f2fc.md","goals":["P3P의 최소해 기하(해 4개까지)와 RANSAC과의 결합 이유를 설명할 수 있습니다.","EPnP의 아이디어(제어점 4개로 선형화)와 반복법 대비 장점을 설명할 수 있습니다.","`solvePnP` 계열 플래그·`solvePnPRansac` 을 상황에 맞게 선택하고, 이상치가 있는 대응에서 강건하게 포즈를 구할 수 있습니다."],"essential":"18강의 PnP를 \"현장에서 버티는 형태\"로 끓어올립니다.\n\n- 필수 ① P3P·EPnP·ITERATIVE의 자리(언제 무엇을 쓰는가) 를 표로 설명한다.\n- 필수 ② 이상치(outlier) 가 최소제곱을 어떻게 망치는지, RANSAC이 왜 해결책인지 설명한다.\n- 필수 ③ `solvePnPRansac` 을 쓰고 인라이어 수와 재투영 오차를 함께 보고한다.\n\n여유가 되면(심화): P3P의 4차 방정식 기하, EPnP의 제어점 아이디어, RANSAC 반복 횟수 공식. 알고리즘 내부 유도는 심화입니다 — 선택 기준과 품질 보고가 필수입니다.","headings":["들어가며","1. P3P — 최소 3점의 기하학","2. EPnP — 다점을 한 번에, 선형으로","3. 이상치의 세계 — RANSAC","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":25,"title":"25강. YOLO 계열 객체 검출 파이프라인","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/25강 YOLO 계열 객체 검출 파이프라인 29d7bcf74d9382238d57015320520e66.md","goals":["학습 기반 객체 검출이 색 기반 검출(19강)의 어떤 한계를 넘는지, 그 대가는 무엇인지 설명할 수 있습니다.","YOLO의 기본 구조 — 격자 기반 단일 패스 예측, 백본/넥/헤드 — 와 출력(박스·클래스·신뢰도)의 의미를 설명할 수 있습니다.","전처리→추론→후처리(NMS)의 전체 파이프라인과 평가 지표(IoU·mAP), 커스텀 학습의 절차를 설명할 수 있습니다."],"essential":"규칙 기반 검출(19강)에서 학습 기반 검출로 넘어갑니다. 신경망 내부를 몰라도 아래 세 가지는 반드시 잡으세요.\n\n- 필수 ① 색 기반 검출과 학습 기반 검출의 적용 한계를 비교해 설명한다.\n- 필수 ② YOLO의 출력(박스·클래스·신뢰도)과 후처리 NMS·IoU의 역할을 설명한다.\n- 필수 ③ `conf` 와 `iou` 문턱을 조절하며 오검출과 미검출의 트레이드오프를 관찰한다.\n\n여유가 되면(심화): 백본·넥·헤드 구조, mAP50-95의 의미, 커스텀 학습 절차. 모델 내부 구조는 심화입니다 — 오늘은 \"쓰는 법과 평가하는 법\"이 필수입니다.","headings":["들어가며","1. 왜 학습 기반인가 — 19강과의 정면 비교","2. YOLO의 구조 — 격자가 곧 검출기","3. 사용과 평가","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":26,"title":"26강. Point Cloud 표현·처리 (PCL/Open3D·필터·세그멘테이션)","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/26강 Point Cloud 표현·처리 (PCL Open3D·필터·세그멘테이션) 4967bcf74d9383a2afa581eda60ba72f.md","goals":["포인트클라우드의 표현(N×3 배열·구조화 여부·색/법선 속성)과 생성 원천(LiDAR·RGBD·스테레오)을 설명할 수 있습니다.","다운샘플링(Voxel)·이상치 제거(SOR) 필터의 원리와 파라미터의 의미를 설명할 수 있습니다.","평면 추출(RANSAC)과 클러스터링(유클리드/DBSCAN)으로 \"바닥 위 물체들\"을 분리하는 표준 절차를 설명할 수 있습니다."],"essential":"2D 이미지에서 3D 점의 세계로 넘어갑니다. 파이프라인의 순서와 이유가 오늘의 핵심입니다.\n\n- 필수 ① 포인트 클라우드가 순서 없는 점들의 집합이며 이미지와 성질이 어떻게 다른지 설명한다.\n- 필수 ② Voxel 다운샘플 → SOR → 평면 제거 → 클러스터링의 파이프라인 순서와 각 단계의 목적을 말한다.\n- 필수 ③ 각 단계의 주요 파라미터(voxel 크기, 거리 문턱, eps)를 무엇을 기준으로 정하는지 설명한다.\n\n여유가 되면(심화): 법선 추정과 PCA, DBSCAN의 밀도 개념, ICP 정합. 파라미터에 정답은 없습니다 — 대상 물체의 크기와 센서 노이즈 수준이 기준입니다.","headings":["들어가며","1. 표현 — 순서 없는 점들의 집합","2. 필터 ① Voxel 다운샘플 — 점을 줄여야 시작된다","3. 필터 ② SOR — 통계로 이상치 걷어내기","4. 평면 추출 — RANSAC의 재등판","5. 클러스터링 — 덩어리를 개체로","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":27,"title":"27강. Stereo·Depth·RGBD와 6D Pose Estimation","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/27강 Stereo·Depth·RGBD와 6D Pose Estimation f317bcf74d9382c4a19e810bac401ff1.md","goals":["스테레오 비전의 시차→깊이 원리와 베이스라인·매칭의 역할을 설명할 수 있습니다.","깊이 센서 3계열(스테레오·구조광·ToF)의 원리와 장단점을 비교하고 RGBD 카메라의 구성(정렬 문제 포함)을 설명할 수 있습니다.","6D Pose Estimation의 문제 정의와 대표 흐름(대응 기반·정합 기반·직접 회귀), 물체 후보 추출에서 정밀 포즈까지의 파이프라인을 설명할 수 있습니다."],"essential":"18강에서 \"단안은 스케일을 모른다\"고 했습니다. 오늘은 그 깊이를 실제로 얻는 장치들을 봅니다.\n\n- 필수 ① 스테레오의 원리 $Z = fb/d$ 를 삼각측량으로 설명하고, 멀수록 부정확해지는 이유를 말한다.\n- 필수 ② 깊이 센서 3계열(수동 스테레오·능동 스테레오/구조광·ToF)의 강점과 약점을 구분한다.\n- 필수 ③ 6D Pose Estimation이 무엇이며, 왜 \"집으려면\" 위치만으로 부족한지 설명한다.\n\n여유가 되면(심화): ICP의 반복 구조, 대칭 물체의 포즈 모호성, RGBD 정렬의 내부 계산. 센서를 직접 고르는 감각은 31강 실측 실습에서 완성됩니다.","headings":["들어가며","1. 스테레오 — 두 눈의 삼각측량","2. 깊이 센서 3계열과 RGBD","3. 6D Pose Estimation — \"집을 수 있는\" 인지","미니 퀴즈","실습","정리","용어 사전"],"environment":[],"deliverables":"","hasPractice":true},{"number":28,"title":"28강. [실습] cv2.solvePnP 2D-3D 포즈 추정","module":"모듈 ④ 2D / 3D 공간 인지 및 비전 AI","source":"/Users/june/Desktop/개인 페이지 & 공유된 페이지/[CH 2] Physical AI/모듈 ④ 2D 3D 공간 인지 및 비전 AI/28강 [실습] cv2 solvePnP 2D-3D 포즈 추정 3ee7bcf74d9383429a9081fc45c5041d.md","goals":["합성 데이터로 PnP 솔버들의 정확도·속도·강건성을 정량 비교하는 실험을 설계할 수 있습니다.","solvePnPRansac으로 이상치 섞인 대응에서 포즈를 추정하고 인라이어 품질 게이트를 구현할 수 있습니다.","상자(육면체) 포즈 추정기를 만들어 실측 검증하고, 23강 사슬로 월드 좌표까지 연결할 수 있습니다."],"essential":"24
