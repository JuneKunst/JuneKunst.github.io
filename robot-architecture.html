 계산량","scope":"Costmap·운영","name":"update_frequency","value":"Hz","meaning":"Costmap 갱신. 센서 주기와 처리 부하를 함께 본다."},{"slide":77,"topic":"주기와 계산량","scope":"Costmap·운영","name":"publish_frequency","value":"Hz","meaning":"Costmap 표시·전송 주기. 내부 갱신 주기와 구분한다."},{"slide":79,"topic":"증상별 점검","scope":"Costmap·운영","name":"벽에 너무 붙음","value":"Footprint / Inflation","meaning":"그다음 Planner 비용과 Controller 장애물 항을 본다."},{"slide":79,"topic":"증상별 점검","scope":"Costmap·운영","name":"코너에서 진동","value":"위치·경로·후보 궤적","meaning":"속도·회전 한계와 경로/목표 Critic 간 충돌을 점검한다."},{"slide":79,"topic":"증상별 점검","scope":"Costmap·운영","name":"명령은 있는데 정지","value":"cmd_vel 타입·토픽·상태","meaning":"TwistStamped 연결, Lifecycle active, 감시 정지 조건을 확인한다."},{"slide":85,"topic":"실습용 속도 제한","scope":"실습","name":"MPPI","value":"vx_max=0.1 / wz_max=0.2","meaning":"m/s / rad/s. Waffle README의 시작값이며 최적값은 아니다."},{"slide":85,"topic":"실습용 속도 제한","scope":"실습","name":"Velocity Smoother","value":"max_velocity=[0.1,0,0.2]","meaning":"Controller 출력 제한과 맞춘다. 후진·가속 한계도 확인한다."},{"slide":85,"topic":"실습용 속도 제한","scope":"실습","name":"Stamped 명령","value":"enable_stamped_cmd_vel=true","meaning":"연결된 노드와 Gazebo 입력의 타입·토픽을 모두 일치시킨다."},{"slide":87,"topic":"비교 실험 기록","scope":"실습","name":"고정 조건","value":"지도·출발·목표·속도","meaning":"조건을 바꾸면서 알고리즘 효과를 비교하지 않는다."},{"slide":87,"topic":"비교 실험 기록","scope":"실습","name":"기록 항목","value":"성공·시간·거리·진동","meaning":"최소 장애물 간격, 재계획·복구 횟수도 기록한다."},{"slide":87,"topic":"비교 실험 기록","scope":"실습","name":"실험 순서","value":"한 항목씩 반복","meaning":"NavFn Dijkstra ↔ A*, 이후 Controller만 교체한다."},{"slide":89,"topic":"Waffle 선택 기준","scope":"실습","name":"첫 비교","value":"NavFn + MPPI","meaning":"기존 Lyrical 참고 설정에 가까운 출발점. 연결·주기부터 확인한다."},{"slide":89,"topic":"Waffle 선택 기준","scope":"실습","name":"대안 실험","value":"Smac 2D / DWB / RPP","meaning":"같은 조건에서 계획 품질·추종·CPU 부담을 비교한다."},{"slide":89,"topic":"Waffle 선택 기준","scope":"실습","name":"확장","value":"Hybrid·Lattice·Theta*","meaning":"운동 제약·가시선·경로 품질 요구가 있을 때 추가 검토한다."},{"slide":91,"topic":"참고자료","scope":"구조·개요","name":"Nav2 공식 문서","value":"Configuration / Tuning","meaning":"각 슬라이드 발표자 노트에 해당 문서 링크를 수록했다."},{"slide":91,"topic":"참고자료","scope":"구조·개요","name":"설치본 기준","value":"NVIDIA Lyrical Nav2 1.5.0","meaning":"2026-10-13 확보 YAML. Rolling 문서와 지원 항이 다를 수 있다."},{"slide":91,"topic":"참고자료","scope":"구조·개요","name":"실습 저장소","value":"waffle-lyrical-slam","meaning":"README의 저장 지도·Nav2 실행 절차를 함께 참고한다."}],"summary":"# Nav2·AMCL 수업 정리\n\n2026-10-15 · KANT 교안 91쪽 · 전날 Cartographer 수업과 연결\n\n이 자료는 교안의 Waffle / ROS 2 Lyrical / 설치본 Nav2 1.5.0 설명을 바탕으로 한다. 표의 숫자는 교안 참고값 또는 명시된 예제값이다. Mac이나 실제 로봇에서 목표 도달을 검증한 기록이 아니다. 교안도 이번 제작에서 Nav2 목표 도달을 새로 검증하지 않았다고 밝힌다. [4, 85, 91쪽]\n\n## 1. 어제 만든 지도로 오늘 무엇을 할까?\n\n어제는 Cartographer가 센서와 odom을 이용해 지도와 위치를 함께 추정했다. 오늘은 저장한 지도 위에서 현재 위치를 찾고 목표까지 주행한다. 이때 지도 만들기, 위치 찾기, 경로 만들기, 바퀴를 움직일 속도 만들기를 나눠 이해한다. [6–10, 13–15쪽]\n\n| 질문 | 담당 | 입력 → 출력 | 이전 학습과 연결 |\n| --- | --- | --- | --- |\n| 여기는 어떤 공간인가? | Cartographer SLAM | scan·odom·TF → 지도와 자세 | 37강, 어제의 submap·loop closure |\n| 직전 위치에서 얼마나 움직였나? | odometry / 상태 추정 | 바퀴·선택한 센서 → 연속 상대 이동 | 38강, odom 누적 오차 |\n| 저장 지도에서 나는 어디인가? | AMCL | 저장 지도·scan·odom 기반 TF → 위치 가설과 전역 보정 | 38·39강, particle filter와 map→odom |\n| 목표까지 어디로 갈까? | Planner | 현재 위치·목표·global costmap → 경로 | 40강, 탐색과 비용 |\n| 지금 어떤 속도를 낼까? | Controller | 위치·속도·경로·local costmap → 속도 명령 | 44강, 추종과 충돌 평가 |\n| 언제 계획·제어·복구를 호출할까? | BT Navigator | 목표·각 작업의 결과 → 실행 흐름 | 40·43강, action·상태 전이 |\n\n경로가 나왔다고 로봇이 움직인 것은 아니다. 속도 명령이 나왔다고 목표 도달이 확인된 것도 아니다. 경로·명령·실제 움직임·도착 결과를 나눠 확인한다.\n\n## 2. 저장 파일과 TF부터 연결하기\n\nCartographer의 PGM/YAML은 2D 점유 지도이고 pbstream은 SLAM 상태다. 오늘 AMCL 실습의 map_server에는 저장 지도 YAML을 제공한다. 어제의 pbstream을 map YAML 대신 넣지 않는다. Cartographer의 고정 지도 위치 추정과 AMCL은 서로 다른 위치 추정 구성이다. [4, 6, 82–83쪽 · 전날 29–30쪽]\n\n저장 지도 주행의 좌표계:\n\n```text\nmap\n └─ odom                 AMCL: 전역 위치 보정\n     └─ base_footprint   Gazebo/odometry: 연속 상대 이동\n         └─ sensor      URDF: 장착 위치·방향\n```\n\nAMCL을 시작하기 전에 Cartographer·cuVSLAM의 map→odom 발행을 중지한다. 같은 변을 둘이 발행하면 전역 위치가 흔들릴 수 있다. Gazebo·Nav2·RViz의 clock과 use_sim_time도 맞춘다. [10–11쪽]\n\n회전을 무시한 1차원 예: odom 기준 몸체가 x=2.3 m이고 AMCL이 지도 기준 x=2.0 m로 추정하면, map→odom 보정은 −0.3 m다. (−0.3)+2.3=2.0이다. 실제 TF는 회전까지 포함한 변환 합성이다. map→odom이 보정돼도 odom→base의 연속 이동 역할은 유지한다.\n\n## 3. AMCL 입자는 무엇인가?\n\n입자 하나는 “로봇이 이 위치·방향에 있을지도 모른다”는 가설 하나다. 실제 AMCL의 상태는 (x, y, θ)다. 여러 가설에 관측 적합도에 따른 가중치를 부여하고 새 집합을 만든다. [13–16쪽]\n\n1. 예측: odometry 이동량에 잡음을 더해 가설들을 움직인다. 이동이 불확실하면 가설이 더 퍼질 수 있다.\n2. 관측 갱신: 각 가설에서 레이저가 지도와 얼마나 맞는지 비교해 가중치를 바꾼다.\n3. 재표본화: 가중치가 큰 가설에서 다음 입자를 더 많이 뽑는다. 새로운 독립 센서 측정을 만들어내는 과정은 아니다.\n4. 적응: 실제 AMCL은 불확실성에 따라 입자 수를 조절한다. 브라우저 예제는 설명을 위해 정한 입자 수로 한 번의 갱신만 보여준다.\n\nRViz의 2D Pose Estimate는 초기 위치·방향과 불확실성을 주는 단계다. 입자 구름이 좁아졌다는 것은 필터의 가설이 집중됐다는 뜻이지 정답 보장이 아니다. 반복 복도, 지도 불일치, 틀린 센서 TF 때문에 오수렴할 수도 있다. [16쪽]\n\n## 4. 어제의 스캔 정합·칼만 필터와 무엇이 다를까?\n\n| 개념 | 표현과 처리 | 이번 수업에서 기억할 차이 |\n| --- | --- | --- |\n| Cartographer scan matching | 점·submap과 운동 예측 사이 정합 | 지도 작성의 로컬 자세와 연결된다. AMCL 재표본화와 같은 연산이 아니다. |\n| KF / EKF | 평균·공분산, 모델과 관측 결합 | EKF는 추정점 근처에서 선형화한 단봉 표현을 쓴다. 이전 38강의 1D 보정 예제를 참고한다. |\n| AMCL | 지도 위 여러 위치·방향 가설 | 여러 후보 위치를 입자로 표현하고 관측으로 가중치를 바꾼다. |\n\n모두 불확실한 입력을 다루지만 같은 입력·출력·상태를 가진 대체품은 아니다. EKF가 odom→base를, AMCL이 map→odom을 맡는 구성에서는 서로 다른 책임으로 협력한다. 실제 sensor fusion과 TF 발행 책임은 사용하는 시스템에 맞춰 확인한다.\n\n## 5. AMCL 파라미터를 네 묶음으로 읽기\n\n| 묶음 | 교안 값·항목 | 쉽게 읽는 방법 |\n| --- | --- | --- |\n| frame·입력 | global=map, odom=odom, base=base_footprint, scan_topic | 같은 센서를 같은 시간·좌표계로 해석하는지 먼저 확인 |\n| 가설 수 | min_particles=500, max_particles=2000, pf_err=0.05, pf_z=0.99 | 가설 수·계산량과 적응 설정. 입자 수로 틀린 지도를 해결하지 못함 |\n| 이동 모델 | DifferentialMotionModel, alpha1–4 | 실제 odom의 직진·회전 오차를 반영하는 모델 |\n| 관측·갱신 | likelihood_field, sigma_hit=0.2 m, update_min_d=0.25 m, update_min_a=0.2 rad | 관측 일치의 폭과 필터 갱신 조건을 구분 |\n\nWaffle은 차동 구동이므로 횡이동이 안 된다. nav2_amcl::DifferentialMotionModel을 사용하며 Omni 모델용 alpha5를 차동 모델의 핵심 튜닝 항으로 외우지 않는다. [17–23쪽]\n\nalpha1은 회전 때문에 발생하는 회전 잡음, alpha2는 이동 때문에 발생하는 회전 잡음, alpha3는 이동 때문에 발생하는 이동 잡음, alpha4는 회전 때문에 발생하는 이동 잡음이다. 계수를 크게 하면 “더 정확함”이 아니라 해당 운동을 더 불확실하게 모델링하는 것이다. 직진·회전 실험으로 오차 경향을 먼저 본다. [20–21쪽]\n\nlikelihood_field는 레이저 끝점과 지도 장애물 간 거리를 이용한다. sigma_hit는 그 거리 오차 모델의 폭이다. 좁게 두면 작은 불일치에 민감해질 수 있다. z_hit/z_rand=0.5/0.5는 교안의 관측 혼합 가중치다. beam 모델과 사용 항이 다르므로 z_short·z_max를 모든 모델에 똑같이 적용하지 않는다. [22쪽]\n\nupdate_min_a=0.2 rad는 약 11.46°다. 어제 Cartographer의 motion_filter 예시 0.1°와 단위도 역할도 다르다. max_beams=60은 평가할 광선 수, resample_interval=1은 필터 갱신마다 재표본화하는 설정이다. transform_tolerance=1.0 s는 TF의 시간 여유이며 통신 지연 자체를 고치는 값이 아니다. [23–24쪽]\n\n## 6. Planner: 경로를 만드는 방법\n\n경로(Path)는 지나갈 위치·방향의 열이다. 시간에 따른 속도까지 반드시 포함하지 않는다. Controller가 운동 제약과 주변 장애물을 보며 추종한다. [8–9쪽]\n\n| 방식 | 후보를 고르는 원리 | 선택·비교 시 확인 |\n| --- | --- | --- |\n| Dijkstra | 출발점부터 누적 비용 g 최소 | 음수가 아닌 비용 그래프에서 최소 비용 경로. 넓게 탐색할 수 있음 |\n| A* | f=g+h, 목표까지의 예상 비용 포함 | 휴리스틱·구현 조건에 따라 최적성 결정. 항상 더 짧거나 빠른 것은 아님 |\n| Smac 2D | 비용을 고려하는 2D A* | 제자리 방향 전환이 가능한 로봇에서 비교 |\n| Theta* | 가시선을 이용하는 any-angle 탐색 | 격자 방향 제약 완화와 실제 회전 가능성은 별개 |\n| Hybrid-A* | 위치·방향 SE(2)와 운동 모델 | 최소 회전 반경과 전후진 조건을 실제 구동계에 맞춤 |\n| State Lattice | 가능한 움직임 프리미티브 연결 | 프리미티브·격자를 로봇에 맞춤 |\n\nWaffle은 제자리 회전이 가능하고 횡이동은 불가하다. 차량용 회전 반경 제약을 이유 없이 추가하지 않는다. RRT·PRM은 확장 계획 기법이며 Nav2 기본 플러그인 선택 목록과 구분한다. [5, 28–40쪽]\n\nNavFn에서 use_astar=false/true로 Dijkstra/A*를 바꾼다. allow_unknown=false는 미탐색 셀 통과를 허용하지 않는 예다. Unknown을 빈 공간으로 단정하지 않는다. 같은 지도·출발·목표·비용에서 비교해야 알고리즘 차이를 읽을 수 있다. [30–32, 40쪽]\n\nNavFn tolerance는 정확한 목표가 막혔을 때 근처에서 경로 끝점을 찾는 범위다. xy_goal_tolerance는 실제 주행의 목표 도착 판정 범위다. 단위가 m로 같아도 같은 설정이 아니다. [32, 75쪽]\n\n## 7. Controller: 경로에서 다음 속도로\n\nWaffle은 vx와 wz를 사용하고 vy=0이다. Controller는 현재 위치·속도·경로·local costmap을 받아 다음 속도를 만든다. 새 장애물의 반영과 필요 시 전역 재계획도 함께 동작해야 한다. [42쪽]\n\n| Controller | 핵심 과정 | 먼저 관찰할 것 |\n| --- | --- | --- |\n| DWB | 속도 후보 → 짧은 궤적 → Critic 비용 → 유효 후보 선택 | 후보 수, 진동, 충돌 검사, 경로·목표 비용의 균형 |\n| MPPI | 제어 시퀀스 샘플 → 미래 궤적 비용 → 가중 갱신 | 계산 시간, 시간 지평, 활성 Critic과 모델 |\n| RPP | 앞쪽 lookahead 지점 추종과 속도 규제 | 코너 추종 오차·속도·충돌 검사 |\n| Graceful | 매끄러운 접근·경로 추종 | lookahead와 제어 이득·운동·장애물 제약 |\n| Rotation Shim | 본 Controller 앞의 방향 정렬 | 시작 각도·회전 속도·primary_controller |\n\nDWB를 ROS 1 DWA와 완전히 동일하게 설명하지 않는다. StandardTrajectoryGenerator와 LimitedAccelGenerator는 후보 생성 방식이 다르다. Critic의 충돌 유효성 검사를 단순히 작은 가중치로 대신하지 않는다. [43–48쪽]\n\nMPPI는 첫 제어만 적용하고 다음 주기에 새 상태로 다시 계산한다. NVIDIA GPU 필수 알고리즘이 아니다. 교안 예측 길이 56×0.05=2.8 s, batch_size=2000, iteration_count=1은 설치본 참고값이다. 20 Hz라면 한 주기 예산은 50 ms다. 후보·단계를 늘리기 전에 실제 주기 초과를 측정한다. 2.8 s 동안 0.1 m/s로 일정하게 직진하면 0.28 m지만 실제 궤적은 속도 변화와 회전·관측 범위에 따라 달라진다. [49–55, 77쪽]\n\n교안 설치본 MPPI는 motion_model: diff_drive와 mppi::DiffDriveMotionModel 플러그인을 사용한다. 옛 DiffDrive 문자열이나 다른 버전 예제를 그대로 복사하지 않는다. MPPI temperature=0.3은 비용 가중 민감도, gamma=0.015는 제어 에너지 관련 정규화이며 Critic의 cost_weight와 역할이 다르다. [54–58쪽]\n\nRPP lookahead_dist가 작으면 민감하고 크면 코너를 크게 돌 수 있다. RPP는 복잡한 우회 계획을 대신하지 않는다. 교안의 DWPP는 Rolling 확장 소개이며 설치본에서 검증한 기본 기능이 아니다. RPP 최대 선속도 파라미터 이름도 설치본에서 확인한다. [59–65쪽]\n\n## 8. Costmap: 벽과 가까운 경로가 왜 더 비쌀까?\n\n점유 지도는 점유·자유·미지 상태를 나타내고 Costmap은 주행 위험을 비용으로 표현한다. Global은 map 기준의 경로 계획, Local은 보통 odom 기준 rolling window에서 주변 충돌·제어 평가를 담당한다. Static·Obstacle·Voxel·Inflation 레이어는 plugins 목록에 포함돼야 활성화된다. [27, 67쪽]\n\n- Footprint/robot_radius: 실제 외곽과 부착물을 반영한다. 통로를 지나게 하려고 작게 속이지 않는다.\n- Inflation radius: 장애물 주변에 비용을 퍼뜨리는 범위다. 실제 몸체 반경과 다르다.\n- Cost scaling factor: 같은 반경에서 클수록 비용이 더 빨리 감소한다. 숫자가 크다고 위험 영역이 더 넓어지는 것이 아니다.\n- Resolution: 셀 한 변 길이다. 같은 면적에서 한 변을 절반으로 하면 셀 수는 약 4배다. 정확도가 자동 4배 향상되는 것은 아니다.\n- Marking/clearing: 장애물 등록·제거다. 유령 장애물은 range뿐 아니라 센서·TF·시간을 확인한다.\n\n이는 어제의 submap 내부 해상도, 출력 지도 해상도와 구분하는 세 번째 맥락이다. 모두 m/cell로 읽을 수 있지만 적용 단계가 다르다. [68–70쪽 · 전날 21쪽]\n\n## 9. 경로 뒤에도 확인할 계층이 있다\n\nSmoother는 꺾임을 줄여도 충돌·운동 제약을 자동 보장하지 않는다. BT에서 SmoothPath가 호출돼야 적용된다. 전후진 전환점과 최소 회전 반경, 장애물 통과 여부를 다시 검사한다. [71–74쪽]\n\nGoal Checker는 위치·방향 도달을, Progress Checker는 시간 안의 진행을 평가한다. 지나치게 작은 yaw 허용 오차는 목표에서 회전을 지속하게 할 수 있다. [75쪽]\n\nVelocity Smoother는 속도·가감속 명령을 다루고 Collision Monitor는 센서 기반 감속·정지 감시를 추가한다. Behavior Server는 회전·후진·대기 등의 복구 동작을 제공한다. Controller와 구동계의 제한·명령 타입·토픽·활성 상태를 함께 맞춘다. [76–79쪽]\n\n## 10. 내 환경에 맞춘 실습 실행 순서\n\nHTML의 “환경·명령어”에서 실행 위치, 배포판, setup·workspace 경로, 토픽·frame과 package/launch를 지정한다. 아래는 Linux/WSL·컨테이너·원격 Linux의 Bash 변수형 예제다. 네이티브 Windows PowerShell은 별도 안내를 사용한다. 지도·설정 파일과 패키지가 실제로 있어야 하며 교안의 Ubuntu/Lyrical/Waffle 조합을 모든 환경의 호환성 보장으로 확대하지 않는다. [4, 82–85쪽]\n\n먼저 Cartographer·cuVSLAM의 map→odom 발행과 키보드 텔레옵을 중지한다. Gazebo 자체는 주행 시뮬레이션에 필요하므로 함께 종료하지 않는다.\n\n```bash\n# 먼저 ROS_DISTRO, NAV_MAP_YAML, SCAN_TOPIC, ODOM_FRAME, BASE_FRAME 지정\nsource \"/opt/ros/${ROS_DISTRO:?배포판을 지정하세요}/setup.bash\"\nMAP_YAML=\"${NAV_MAP_YAML:?실제 저장 지도 YAML 경로를 지정하세요}\"\nls \"$MAP_YAML\"\nros2 topic list -t\n# 시뮬레이션 모드일 때만 clock을 확인\nros2 topic hz \"${CLOCK_TOPIC:?실제 clock 토픽을 지정하세요}\"\nros2 topic hz \"${SCAN_TOPIC:?실제 scan 토픽을 지정하세요}\"\nros2 run tf2_ros tf2_echo \"${ODOM_FRAME:?odom frame 지정}\" \"${BASE_FRAME:?몸체 frame 지정}\"\n```\n\n모든 터미널의 ROS_DOMAIN_ID를 통신 상대와 맞춘다. 관찰 명령은 각각 확인 후 Ctrl+C로 종료한다. 설치 경로가 다르면 실제 setup 파일을 사용한다. 다음 launch 인자 이름은 흔한 예이며 실제 --show-args 출력에 있는 항목만 사용한다. YAML도 선택한 로봇·배포판·Nav2 버전용으로 준비한다.\n\n```bash\nros2 pkg prefix \"${NAV_PACKAGE:?Nav2 실행 패키지 지정}\"\nros2 launch \"$NAV_PACKAGE\" \"${NAV_LAUNCH:?launch 파일명 지정}\" --show-args\n# 아래 map/params_file/use_sim_time 지원을 확인한 설치본에서만 사용\nros2 launch \"$NAV_PACKAGE\" \"$NAV_LAUNCH\" \\\n  map:=\"$MAP_YAML\" \\\n  params_file:=\"${NAV_PARAMS_YAML:?로봇·설치본에 맞는 YAML 경로 지정}\" \\\n  use_sim_time:=\"${USE_SIM_TIME:?시뮬레이션 true 또는 실기기 false 지정}\"\n```\n\n별도 같은 ROS 환경의 터미널에서 RViz 실행 설정을 확인하고 초기 위치·활성 상태·명령 타입을 점검한다. 네임스페이스가 있으면 해당 이름을 사용한다.\n\n```bash\n# RViz launch 이름·인자는 설치본에서 확인\nros2 launch \"$NAV_PACKAGE\" \"${RVIZ_LAUNCH:?RViz launch 파일명 지정}\" --show-args\nros2 node list\n# 위 목록의 실제 노드 이름으로 조회\nros2 lifecycle get \"${AMCL_NODE:?실제 AMCL 노드 이름 지정}\"\nros2 lifecycle get \"${CONTROLLER_NODE:?실제 Controller 노드 이름 지정}\"\nros2 topic info \"${CMD_VEL_TOPIC:?실제 명령 토픽 지정}\" -v\n```\n\nRViz 2D Pose Estimate → 지도 벽과 scan 정렬 → 자유 공간의 가까운 Nav2 Goal 순서다. 교안의 MPPI vx_max=0.1 m/s, wz_max=0.2 rad/s와 Velocity Smoother max_velocity=[0.1,0,0.2]는 보수적인 시뮬레이션 시작값이다. 후진·가감속 제한과 enable_stamped_cmd_vel, 연결 노드의 TwistStamped 타입까지 확인한다. [84–85쪽]\n\n## 11. 증상을 보고 어느 단계부터 확인할까?\n\n| 증상 | 먼저 확인 | 그다음 비교 |\n| --- | --- | --- |\n| 지도는 맞는데 로봇 위치가 틀림 | 초기 위치·scan 정렬·TF·시간·odom·지도 | AMCL 모델·관측·입자 설정 |\n| 벽에 너무 붙음 | 실제 Footprint·Inflation | Planner 비용·Controller 장애물 비용 |\n| 코너에서 진동 | 위치 추정·경로·후보 궤적 | 속도·각속도·Critic 균형 |\n| 경로는 있지만 움직이지 않음 | lifecycle active·cmd_vel 타입/토픽·정지 감시 | Controller 유효 후보·구동계 연결 |\n| 제어 주기를 넘김 | 실제 계산 시간·센서/Costmap 주기 | MPPI 단계·후보 수, DWB 샘플, 활성 Critic |\n\n조정 순서는 지도·TF·시간·센서·odom·AMCL → Footprint·Costmap·속도·가속 → Planner → Controller → 도착·진행 판정이다. [25, 78–79쪽]\n\n## 12. 비교 실험과 복습\n\n같은 지도·출발·목표·속도에서 NavFn Dijkstra↔A*를 비교한다. 그다음 Controller만 교체한다. 실험별 YAML을 복사하고 plugin과 해당 파라미터 묶음을 함께 바꾼 뒤 재시작·노드 상태·토픽을 확인한다. [86–89쪽]\n\n기록 양식: 지도/YAML 버전 / 시작·목표 / 알고리즘 / 변경 한 항목 / 예상 / 도달 성공·실패 / 시간·거리 / 최소 장애물 간격 / 진동·재계획·복구 / CPU·주기 초과 / 다음 실험.\n\n복습 질문:\n\n1. AMCL을 켤 때 Cartographer의 map→odom 발행을 중지하는 이유는? 같은 TF 변의 발행 책임이 중복되기 때문이다.\n2. AMCL 입자가 모였는데도 틀릴 수 있나? 반복 구조·잘못된 모델·지도·TF로 오수렴할 수 있다.\n3. A* 경로가 있어도 왜 정지할까? 경로는 명령이나 구동 결과가 아니며 Controller·타입·상태·감시·구동계를 확인해야 한다.\n4. Inflation radius와 robot_radius는 같은가? 비용 범위와 실제 몸체 외곽은 다르다.\n5. MPPI batch_size를 두 배로 하기 전에 무엇을 재나? 제어 주기 안의 처리 시간과 실제 주기 초과를 측정한다.\n6. NavFn tolerance를 키우면 Goal Checker 허용 오차도 바뀌나? 별도 역할과 설정이므로 그렇지 않다.\n\n관련 기존 강의: 37강 SLAM → 38강 상태 추정 → 39강 데이터 흐름 → 40강 Nav2 구조 → 43강 Waypoint → 44강 튜닝 → 45강 성능 측정. 41·42강의 cuVSLAM/nvblox는 오늘 기본 AMCL/Gazebo 실습과 구분한다.\n"},"isaacClass":{"title":"NVIDIA Isaac 생태계 · 시뮬레이션과 강화학습","date":"2026-10-19","checked":"2026-10-20","source":"/Users/june/Downloads/NVIDIA_Isaac_생태계_강화학습_설치_KANT_v1.pdf","slideCount":64,"sections":[{"id":"hardware","title":"어디에서 무엇을 계산할까?","pages":"4–8쪽","html":"\u003cp>개발 PC, RTX PC, Jetson은 서로 다른 역할을 맡습니다. 한 PC가 여러 역할을 겸할 수는 있지만, \u003cstrong>설치·학습·현장 실행이라는 역할은 구분\u003c/strong>해야 합니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">장치\u003c/th>\u003cth scope=\"col\">수업에서의 역할\u003c/th>\u003cth scope=\"col\">창고 로봇 적용 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ubuntu 호스트 PC\u003c/td>\u003ctd>Jetson OS 설치와 개발 준비\u003c/td>\u003ctd>로봇에 들어갈 컴퓨터 초기 설정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RTX PC\u003c/td>\u003ctd>시뮬레이션 실행과 정책 학습\u003c/td>\u003ctd>가상 창고에서 여러 주행 실험\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jetson\u003c/td>\u003ctd>센서 처리와 모델 추론\u003c/td>\u003ctd>실제 영상으로 현재 상태와 행동 계산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모터 제어기\u003c/td>\u003ctd>모터 구동과 하위 제어\u003c/td>\u003ctd>바퀴가 목표 속도를 따르도록 제어\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>CPU · GPU · CUDA\u003c/h3>\u003cp>CPU는 순서와 분기가 많은 처리, 통신, 파일, 작업 관리를 맡습니다. GPU는 영상·행렬·신경망처럼 비슷한 계산을 대량으로 수행할 때 유리합니다. CUDA는 NVIDIA GPU의 병렬 계산 기능을 활용하는 플랫폼입니다.\u003c/p>\u003cp>cuDNN은 신경망 연산에 쓰이는 라이브러리이며, TensorRT는 학습한 모델의 추론 실행을 최적화하는 도구입니다. \u003cstrong>모델을 학습하는 일과 학습한 모델을 실행하는 일은 다릅니다.\u003c/strong>\u003c/p>\u003cp>RTX GPU의 VRAM에는 모델, 텍스처, 센서 출력 등이 들어갑니다. Jetson에서는 CPU와 GPU가 시스템 메모리를 공유하므로 모델과 ROS 노드, 센서가 함께 쓰는 메모리 양을 고려해야 합니다.\u003c/p>\u003ch3>빠른 GPU가 곧 빠른 로봇일까?\u003c/h3>\u003cp>전체 반응 시간에는 영상 획득, 대기, 전처리, 추론, 통신, 제어 전달이 포함됩니다. 초당 처리량과 입력부터 출력까지의 지연을 함께 확인해야 합니다.\u003c/p>\u003cdiv class=\"example\">\u003cspan class=\"label\">추가 예시 · 가정한 수치\u003c/span>\u003cp>영상 획득·대기 30ms + 전처리 10ms + 추론 5ms + 통신·전달 15ms = 순차 처리 시 총 60ms. 추론을 2ms로 줄여도 총 57ms입니다. 영상 대기열이 쌓인다면 빠른 모델도 오래된 장면을 보고 움직일 수 있습니다.\u003c/p>\u003c/div>","lessons":[65,66,68],"recall":["앞 수업에서 센서 데이터의 시간과 단위가 왜 중요했나요?","추론이 빨라도 오래된 영상이나 잘못된 단위로 제어하면 원하는 반응을 얻을 수 없습니다."],"check":["추론만 빨라졌는데 로봇 반응이 거의 같다면?","영상 대기·전처리·메모리 전달·통신·제어 지연을 포함한 전체 경로를 측정합니다."]},{"id":"sim","title":"로봇을 시험할 가상 세계","pages":"9–13쪽","html":"\u003cp>Isaac Sim은 \u003cstrong>로봇, 물리 법칙, 가상 센서가 있는 환경을 구성하고 시험하는 도구\u003c/strong>입니다. 창고의 선반·바닥·장애물과 로봇을 만들고, 제어 명령에 따른 움직임을 확인할 수 있습니다.\u003c/p>\u003cp>겉모습만 그럴듯해서는 부족합니다. 질량, 관성, 바퀴 마찰, 충돌체, 관절 한계와 센서 위치를 맞춰야 합니다. 마찰이 다르면 미끄러지고 관성이 다르면 가속·회전 반응이 달라집니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">개념\u003c/th>\u003cth scope=\"col\">의미\u003c/th>\u003cth scope=\"col\">확인할 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>URDF\u003c/td>\u003ctd>링크와 관절, 시각·충돌 형상, 관성 등 로봇 구조 기술\u003c/td>\u003ctd>관절 방향, 충돌체, 질량·관성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OpenUSD\u003c/td>\u003ctd>장면과 여러 자산을 계층적으로 조합·관리하는 기반\u003c/td>\u003ctd>자산 배치, 계층과 물리 속성\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>가상 센서와 합성 데이터\u003c/h3>\u003cp>RGB는 색 영상, 깊이는 표면까지의 거리, 분할은 픽셀이 속한 물체나 종류를 나타냅니다. 가상 세계는 물체의 위치와 종류를 알기 때문에 정답 라벨을 자동으로 만들 수 있습니다.\u003c/p>\u003cdiv class=\"example\">\u003cspan class=\"label\">추가 적용 예시\u003c/span>\u003cp>상자 인식기를 만들 때 상자의 색, 조명, 카메라 각도를 바꿔 정답이 붙은 영상을 생성합니다. 다만 현실의 반사·먼지·흐림이 충분히 반영되는지 실제 데이터로도 검증해야 합니다.\u003c/p>\u003c/div>","lessons":[55,59],"recall":["Nav2에서 로봇 몸체와 장애물을 어떻게 표현했나요?","통행 가능성은 로봇 크기와 장애물 표현에 영향을 받습니다. 가상 로봇도 충돌 형상과 물리 설정이 필요합니다."],"check":["가상 로봇의 겉모습이 정확하면 물리도 맞을까요?","아닙니다. 질량·관성·충돌체·마찰과 관절·센서 설정을 따로 확인합니다."]},{"id":"lab","title":"그 세계에서 행동을 학습하기","pages":"14–16쪽","html":"\u003cp>Isaac Lab은 \u003cstrong>로봇 학습 과제를 구성하고 실험하는 프레임워크\u003c/strong>입니다. 가상 세계를 마련한 다음, 무엇을 관측하고 어떤 행동을 선택하며 결과를 어떻게 평가할지 정의합니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">구성\u003c/th>\u003cth scope=\"col\">핵심 질문\u003c/th>\u003cth scope=\"col\">이동 로봇 예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>관측\u003c/td>\u003ctd>어떤 정보를 줄까?\u003c/td>\u003ctd>목표 방향·거리, 현재 속도, 장애물 거리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>행동\u003c/td>\u003ctd>무엇을 조절할까?\u003c/td>\u003ctd>전진 속도·회전 속도 목표\u003c/td>\u003c/tr>\u003ctr>\u003ctd>보상\u003c/td>\u003ctd>어떤 결과가 좋을까?\u003c/td>\u003ctd>목표 접근·도착, 충돌 벌점\u003c/td>\u003c/tr>\u003ctr>\u003ctd>종료\u003c/td>\u003ctd>언제 한 시도를 끝낼까?\u003c/td>\u003ctd>도착·충돌·시간 초과\u003c/td>\u003c/tr>\u003ctr>\u003ctd>초기화\u003c/td>\u003ctd>다음 시도는 어디에서 시작할까?\u003c/td>\u003ctd>시작점·목표·장애물 배치 변경\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>병렬 환경 16개는 무엇을 뜻할까?\u003c/h3>\u003cp>보통 하나의 정책이 여러 환경에서 동시에 경험을 모읍니다. 환경마다 시작점과 상태를 달리할 수 있습니다. 환경이 16개라고 독립적인 정책 16개를 반드시 학습하는 것은 아닙니다.\u003c/p>\u003cp>환경 수가 늘면 경험을 더 많이 모을 수 있지만 물리 상태와 센서 데이터를 위한 메모리도 증가합니다. 실행 속도가 환경 수에 비례해서 증가한다고 보장할 수는 없습니다.\u003c/p>\u003caside class=\"note\">\u003cstrong>교안의 실행 경로\u003c/strong>\u003cp>본 실습 52–53쪽은 Newton 물리와 Newton 화면을 사용합니다. 부록 57쪽의 Isaac Sim PhysX·Kit 경로와 구분하세요. Lab을 항상 Isaac Sim 위에서만 실행하는 것으로 이해하면 이 실습 흐름을 놓치게 됩니다.\u003c/p>\u003c/aside>","lessons":[55,60],"recall":["시뮬레이터에서 명령을 주면 무엇이 바뀌나요?","물리 상태와 센서 출력이 바뀝니다. 학습은 여기에 관측·행동·보상·종료의 정의를 더합니다."],"check":["병렬 환경 16개는 독립 정책 16개를 뜻할까요?","보통 하나의 정책이 여러 환경에서 경험을 모읍니다. 환경 수와 정책 수는 다릅니다."]},{"id":"ros","title":"프로그램을 연결하는 ROS 2","pages":"17–18쪽","html":"\u003cp>카메라, 위치 추정기, 주행 프로그램, 모터 드라이버는 별도의 프로그램으로 동작할 수 있습니다. ROS 2는 이들이 메시지를 주고받으며 협력하도록 돕습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">용어\u003c/th>\u003cth scope=\"col\">뜻\u003c/th>\u003cth scope=\"col\">예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Node\u003c/td>\u003ctd>기능을 수행하는 실행 단위\u003c/td>\u003ctd>카메라 드라이버, 위치 추정기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topic\u003c/td>\u003ctd>데이터를 발행하고 구독하는 통로\u003c/td>\u003ctd>영상, 위치, 속도 명령\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Message\u003c/td>\u003ctd>주고받는 데이터 형식\u003c/td>\u003ctd>문자열, 이미지, 속도 데이터\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF\u003c/td>\u003ctd>좌표계 사이의 위치·방향 관계\u003c/td>\u003ctd>카메라·로봇·지도 좌표계\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시간\u003c/td>\u003ctd>측정과 처리의 시각\u003c/td>\u003ctd>카메라와 IMU 데이터 정렬\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"flow\" aria-label=\"ROS 처리 흐름\">\u003cspan>카메라 노드\u003cbr>\u003csmall>영상 발행\u003c/small>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>위치 추정 노드\u003cbr>\u003csmall>위치 발행\u003c/small>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>주행 노드\u003cbr>\u003csmall>속도 명령\u003c/small>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>모터 드라이버\u003cbr>\u003csmall>구동\u003c/small>\u003c/span>\u003c/div>\u003cp>토픽 이름으로 \u003ccode>/camera/image_raw\u003c/code>, \u003ccode>/odom\u003c/code>, \u003ccode>/cmd_vel\u003c/code> 등을 볼 수 있지만, 이름과 타입은 프로젝트 설정에 따라 달라집니다.\u003c/p>\u003ch3>TF와 시간이 틀리면?\u003c/h3>\u003cp>카메라가 로봇 중심보다 앞에 달려 있다면 “카메라에서 1m 앞”은 “로봇 중심에서 1m 앞”과 다릅니다. TF를 잘못 설정하면 장애물 위치를 엉뚱하게 해석할 수 있습니다. 서로 다른 시점의 영상과 IMU 데이터를 합치면 회전 중의 상태를 잘못 추정할 수도 있습니다.\u003c/p>\u003cp>Isaac ROS는 ROS 2에서 사용할 NVIDIA 가속 패키지와 개발 도구입니다. \u003cstrong>ROS 2 설치와 cuVSLAM 등 Isaac ROS 기능 실행은 별도의 단계\u003c/strong>입니다.\u003c/p>","lessons":[37,39],"recall":["TF는 메시지를 전달하는 통로인가요?","토픽은 메시지 통로이고 TF는 좌표계 관계입니다. 카메라와 로봇 기준이 다른 이유를 떠올려 보세요."],"check":["카메라 좌표를 로봇 좌표로 바로 써도 될까요?","장착 위치·방향과 관측 시각의 TF를 적용해야 합니다."]},{"id":"vision","title":"위치를 알고, 장면을 이해하고, 행동하기","pages":"19–23쪽","html":"\u003cp>VSLAM, VLM, VLA는 입력이 일부 비슷해도 해결하는 문제와 출력이 다릅니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">개념\u003c/th>\u003cth scope=\"col\">답하려는 질문\u003c/th>\u003cth scope=\"col\">입력 → 출력\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>VSLAM\u003c/td>\u003ctd>나는 어디에 있고 공간은 어떻게 생겼나?\u003c/td>\u003ctd>연속 영상·센서 → 위치와 기하학적 지도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VLM\u003c/td>\u003ctd>이 장면은 무슨 의미인가?\u003c/td>\u003ctd>영상·언어 → 장면 설명·질의 응답\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VLA\u003c/td>\u003ctd>이 장면과 지시를 보고 어떻게 움직일까?\u003c/td>\u003ctd>영상·지시·로봇 상태 → 행동 또는 행동 토큰\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>VSLAM은 연속 영상에서 특징의 변화 등을 이용해 움직임과 공간 구조를 추정합니다. 어둠, 무늬 없는 벽, 흔들린 영상, 잘못된 보정과 시각 정렬이 문제를 만들 수 있습니다. cuVSLAM은 NVIDIA의 가속 시각 위치 추정 기술입니다.\u003c/p>\u003cp>\u003cstrong>위치 추정용 지도와 주행용 지도는 같은 형태가 아닐 수 있습니다.\u003c/strong> 특징점 지도만으로 로봇의 통행 가능 영역이 바로 정해지지는 않습니다. 주행에는 장애물 정보, 점유 지도, 비용지도 등이 추가로 필요할 수 있습니다.\u003c/p>\u003cp>Nav2는 위치와 환경 정보를 이용해 경로와 주행 명령을 구성하는 내비게이션 체계입니다. 카메라 영상만 넣으면 모든 주행 준비가 자동으로 끝나는 도구로 이해하면 안 됩니다.\u003c/p>\u003cdiv class=\"example\">\u003cspan class=\"label\">추가 적용 예시 · 빨간 상자\u003c/span>\u003cp>VLM은 “통로에 빨간 상자가 있다”라고 설명할 수 있습니다. VLA는 “빨간 상자를 집어라”라는 지시와 영상을 보고 행동을 생성할 수 있습니다. 행동이 관절 목표인지 말단 이동량인지에 따라 실제 로봇 제어기와 연결하는 방법은 달라집니다.\u003c/p>\u003c/div>\u003cp>GR00T는 로봇 행동 모델과 개발 도구의 맥락에서 이해하세요. 모델 출력과 실제 로봇의 관측·제어 규격을 맞추는 작업이 필요합니다.\u003c/p>","lessons":[41,42],"recall":["SLAM과 AMCL은 어떤 조건에서 위치를 추정했나요?","SLAM은 지도 작성과 위치 추정을 연결하고 AMCL은 저장된 지도에서 위치를 추정합니다."],"check":["VLM이 상자를 설명하면 바로 모터를 제어할 수 있나요?","장면 설명과 행동 출력은 다릅니다. 행동 생성과 로봇별 변환·제어기가 필요합니다."]},{"id":"rl","title":"강화학습과 Cartpole","pages":"25–27쪽","html":"\u003cp>강화학습은 환경과 상호작용하며 결과에 대한 평가를 받아 행동을 개선합니다. 목표는 당장의 점수 하나보다 \u003cstrong>장기적으로 좋은 결과를 내는 정책\u003c/strong>을 학습하는 것입니다.\u003c/p>\u003cdiv class=\"flow\">\u003cspan>관측\u003cbr>\u003csmall>현재 정보를 읽음\u003c/small>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>정책과 행동\u003cbr>\u003csmall>행동을 선택\u003c/small>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>환경\u003cbr>\u003csmall>상태가 변함\u003c/small>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>새 관측·보상\u003cbr>\u003csmall>경험을 수집\u003c/small>\u003c/span>\u003c/div>\u003cp>수집한 경험으로 정책을 갱신한 뒤 이 과정을 반복합니다. 학습된 정책을 추론할 때는 매 행동마다 파라미터를 갱신할 필요가 없습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">용어\u003c/th>\u003cth scope=\"col\">Cartpole에서의 의미\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Agent\u003c/td>\u003ctd>환경과 상호작용하는 학습 주체\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Policy · 정책\u003c/td>\u003ctd>관측을 받아 행동을 고르는 규칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Environment\u003c/td>\u003ctd>카트와 막대의 움직임을 계산하는 환경\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Observation\u003c/td>\u003ctd>카트 위치·속도, 막대 각도·각속도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Action\u003c/td>\u003ctd>카트에 가하는 힘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reward\u003c/td>\u003ctd>균형 유지 등에 대한 평가 신호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Episode\u003c/td>\u003ctd>초기화부터 실패 또는 시간 종료까지 한 번의 시도\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"formula\">a\u003csub>t\u003c/sub> = π\u003csub>θ\u003c/sub>(o\u003csub>t\u003c/sub>)\u003c/p>\u003cp>현재 관측 \u003ccode>oₜ\u003c/code>를 정책에 넣어 행동 \u003ccode>aₜ\u003c/code>를 얻는 표현입니다. \u003ccode>θ\u003c/code>는 학습으로 바뀌는 파라미터입니다. 확률적 정책은 행동의 확률분포를 출력하기도 합니다.\u003c/p>\u003cdiv class=\"example\">\u003cspan class=\"label\">왜 각속도도 관측할까?\u003c/span>\u003cp>막대가 오른쪽으로 5도 기울어져 있어도, 더 빠르게 넘어지는 중인지 중앙으로 돌아오는 중인지에 따라 필요한 힘이 다릅니다. 자세뿐 아니라 변화 속도를 알아야 다음 움직임을 더 잘 판단할 수 있습니다.\u003c/p>\u003c/div>","lessons":[55],"recall":["이전 상태 추정에서 위치만으로 다음 이동을 판단할 수 있었나요?","속도·각속도처럼 시간에 따른 변화도 중요합니다. Cartpole의 관측을 이 질문에 연결합니다."],"check":["막대 각도가 같아도 행동이 달라질 수 있는 이유는?","넘어지는 중인지 돌아오는 중인지 각속도 등 동적 상태가 다르기 때문입니다."]},{"id":"reward","title":"관측·행동·보상을 설계하기","pages":"28–29쪽","html":"\u003cp>이동 로봇에게 “목표까지 3m, 왼쪽 20도, 속도 0.2m/s, 정면 장애물까지 0.8m”라는 관측을 주고 전진·회전 속도를 출력하게 할 수 있습니다.\u003c/p>\u003cp>\u003cstrong>관측은 실제 로봇에서도 얻을 수 있어야 합니다.\u003c/strong> 시뮬레이터의 완벽한 정보를 사용했다면, 실제 배포에서도 해당 정보를 어떻게 제공할지 설계해야 합니다. 속도 목표를 출력하는 경우에는 이를 바퀴 움직임으로 바꾸는 하위 제어기가 필요합니다.\u003c/p>\u003ch3>교안의 보상 예시를 계산해보기\u003c/h3>\u003cp class=\"formula\">r\u003csub>t\u003c/sub> = 2(d\u003csub>t\u003c/sub> − d\u003csub>t+1\u003c/sub>) − 0.01Δt\u003cbr>\u003csmall>도착 시 +10 · 충돌 시 −20\u003c/small>\u003c/p>\u003cp>\u003ccode>dₜ − dₜ₊₁\u003c/code>은 목표에 가까워진 거리, \u003ccode>Δt\u003c/code>는 한 스텝에 경과한 시간입니다. 계수와 단위는 원리를 설명하는 예시이며 실제 최적값이 아닙니다.\u003c/p>\u003cdiv class=\"calculator\">\u003cspan class=\"label\">직접 바꿔보기 · 한 스텝의 보상\u003c/span>\u003cdiv class=\"fields\">\u003clabel>접근 거리 (m)\u003cinput id=\"isaacDistance\" type=\"number\" step=\"0.1\" value=\"0.2\">\u003c/label>\u003clabel>스텝 시간 (초)\u003cinput id=\"isaacElapsed\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0.1\">\u003c/label>\u003c/div>\u003cp class=\"muted\">멀어졌다면 접근 거리에 음수를 입력하세요.\u003c/p>\u003cdiv class=\"checks\">\u003clabel>\u003cinput id=\"isaacArrival\" type=\"checkbox\"> 도착 +10\u003c/label>\u003clabel>\u003cinput id=\"isaacCollision\" type=\"checkbox\"> 충돌 −20\u003c/label>\u003c/div>\u003coutput id=\"isaacRewardValue\" aria-live=\"polite\">0.399\u003c/output>\u003cp id=\"isaacRewardExplanation\">2 × 0.2 − 0.01 × 0.1 = 0.399\u003c/p>\u003c/div>\u003cp>교안의 “경과 시간”을 누적 시간으로 쓸지, 스텝 시간으로 쓸지 명확히 정의해야 합니다. 스텝별 고정 벌점은 제어 주기가 달라지면 초당 벌점도 달라집니다.\u003c/p>\u003cp>도착 보상을 여러 번 받을 수 있으면 목표 주변에서 반복 행동을 할 수 있고, 충돌 벌점이 약하면 위험한 지름길을 선호할 수 있습니다. 보상 항목의 크기뿐 아니라 도착·충돌 판정과 초기화 시점도 살펴봐야 합니다.\u003c/p>","lessons":[55,59],"recall":["Nav2의 속도 제한과 도착 판정은 왜 필요했나요?","행동이 실행 가능한 범위인지, 실제로 도착했는지 정의해야 합니다. 보상 설계에도 같은 경계가 필요합니다."],"check":["도착 보상을 반복 지급하면 어떤 문제가 생길까요?","목표 주변 반복 행동으로 점수를 얻을 수 있습니다. 도착·종료·초기화 조건을 함께 설계합니다."]},{"id":"ppo","title":"정책을 개선하고 성능을 평가하기","pages":"30–32쪽","html":"\u003cp>\u003cstrong>Lab은 환경을 구성하고, 연결된 학습 라이브러리는 PPO 같은 알고리즘으로 정책을 최적화합니다.\u003c/strong>\u003c/p>\u003cp>PPO는 좋은 결과와 연결된 행동은 더 선택하고 나쁜 결과와 연결된 행동은 덜 선택하되, 한 번의 갱신으로 정책이 과도하게 바뀌지 않도록 유도합니다. 가치 추정은 앞으로의 보상을 예상하고, 어드밴티지는 결과가 해당 상황의 예상보다 얼마나 좋았는지 판단하는 데 쓰입니다.\u003c/p>\u003cp>PPO-Clip은 정책을 크게 바꾸는 데서 얻는 추가 이득을 제한합니다. 정책 변화나 성능 개선을 절대 보장하는 장치는 아닙니다. \u003ca href=\"https://spinningup.openai.com/en/latest/algorithms/ppo.html\">PPO 공식 설명 ↗\u003c/a>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">단계\u003c/th>\u003cth scope=\"col\">하는 일\u003c/th>\u003cth scope=\"col\">확인할 결과\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>학습\u003c/td>\u003ctd>경험 수집 후 정책 파라미터 갱신\u003c/td>\u003ctd>보상·손실·체크포인트\u003c/td>\u003c/tr>\u003ctr>\u003ctd>추론\u003c/td>\u003ctd>학습한 정책으로 행동 생성\u003c/td>\u003ctd>행동·실행 시간\u003c/td>\u003c/tr>\u003ctr>\u003ctd>평가\u003c/td>\u003ctd>정해진 새 조건에서 반복 시험\u003c/td>\u003ctd>성공률·충돌률·실패 유형\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003ccode>random_agent\u003c/code>는 행동을 무작위로 선택하는 기준 실험입니다. 학습 전 신경망 정책의 실행 방식과 정확히 같다고 단정할 수는 없습니다.\u003c/p>\u003ch3>모방학습과 강화학습\u003c/h3>\u003cp>모방학습은 사람이 보여준 관측·행동 관계를 배웁니다. 예를 들어 사람이 원격 조작으로 상자를 집은 시연을 학습합니다. 강화학습은 상호작용과 보상으로 행동을 개선합니다. 시연으로 초기 행동을 배운 뒤 강화학습으로 개선하는 조합도 가능합니다.\u003c/p>\u003caside class=\"note\">\u003cstrong>보상과 성공률을 함께 확인\u003c/strong>\u003cp>보상이 증가해도 충돌이 증가할 수 있습니다. 새 배치 100회에서의 도착률, 충돌률, 도착 시간과 실패 유형을 함께 측정하세요.\u003c/p>\u003c/aside>","lessons":[46,47,53],"recall":["학습 데이터에서 잘한 것과 새 조건에서 잘한 것은 같나요?","새 조건의 반복 평가가 필요합니다. 보상 그래프와 실제 성공률을 함께 확인합니다."],"check":["보상은 증가했는데 충돌도 늘었다면?","보상 항목별 크기와 판정, 행동 제한을 확인하고 독립적인 성공·충돌 지표로 평가합니다."]},{"id":"real","title":"시뮬레이션에서 실제 로봇으로","pages":"33쪽","html":"\u003cp>실제 바닥의 마찰, 질량과 무게중심, 모터 응답, 센서 잡음과 통신 지연은 시뮬레이션과 다릅니다. 이 차이가 학습한 행동의 성능을 떨어뜨릴 수 있습니다.\u003c/p>\u003cp>\u003cstrong>도메인 랜덤화\u003c/strong>는 마찰·탑재 무게·센서 잡음·제어 지연 등을 일정 범위에서 바꾸며 다양한 경험을 제공하는 방법입니다. 특정한 가상 조건에만 맞는 행동을 줄이려는 것입니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">배포 항목\u003c/th>\u003cth scope=\"col\">잘못 연결한 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>관측 순서\u003c/td>\u003ctd>각도와 각속도 위치를 뒤바꿈\u003c/td>\u003c/tr>\u003ctr>\u003ctd>단위\u003c/td>\u003ctd>라디안 대신 도를 입력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>정규화\u003c/td>\u003ctd>학습 때의 입력 변환을 누락\u003c/td>\u003c/tr>\u003ctr>\u003ctd>행동 스케일\u003c/td>\u003ctd>−1~1 출력을 실제 속도로 잘못 변환\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제어 주기\u003c/td>\u003ctd>학습 때보다 훨씬 느리게 실행\u003c/td>\u003c/tr>\u003ctr>\u003ctd>좌표·부호\u003c/td>\u003ctd>왼쪽·오른쪽 회전을 반대로 연결\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"example\">\u003cspan class=\"label\">배포의 의미\u003c/span>\u003cp>체크포인트를 불러오는 것에 더해 관측 생성, 전처리, 행동 변환, 하위 제어기를 맞춰야 합니다. 이후 작은 동작부터 실제 성능을 검증합니다.\u003c/p>\u003c/div>","lessons":[56,57,61],"recall":["TF와 단위가 맞지 않으면 실제 제어에 어떤 일이 생기나요?","맞는 정책도 잘못된 관측·행동 변환으로 오동작할 수 있습니다."],"check":["학습 체크포인트 외에 배포에 필요한 것은?","관측 생성·순서·정규화, 단위, 행동 변환, 제어 주기와 하위 제어 연결입니다."]},{"id":"install","title":"설치 명령을 목적과 연결하기","pages":"34–53쪽 · 부록 55–62쪽","html":"\u003cp>설치는 Jetson 준비, ROS 통신, RTX PC의 시뮬레이션·학습으로 나뉩니다. 각 단계의 성공이 무엇을 증명하는지 구분해야 합니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">흐름\u003c/th>\u003cth scope=\"col\">주요 작업\u003c/th>\u003cth scope=\"col\">확인한 범위\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Jetson 준비\u003c/td>\u003ctd>복구 모드, OS 플래시, 첫 부팅\u003c/td>\u003ctd>목표 장치·저장장치에서 OS 부팅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ROS 준비\u003c/td>\u003ctd>저장소·패키지 설치, 환경 설정, pub/echo\u003c/td>\u003ctd>기본 ROS 실행과 메시지 통신\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RTX PC 실습\u003c/td>\u003ctd>Sim과 Lab 과제 실행·학습·재생\u003c/td>\u003ctd>해당 가상 환경과 정책 실행\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>복구 모드는 Jetson에 시스템을 기록하기 위한 상태입니다. 교안 37쪽의 J14 연결은 공식 Orin Nano 개발 키트 기준이며 다른 보드는 제조사 절차를 따라야 합니다. 플래시는 선택한 저장장치의 기존 데이터를 지우므로 대상을 확인해야 합니다.\u003c/p>\u003ch3>명령어의 역할\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">명령·도구\u003c/th>\u003cth scope=\"col\">왜 필요한가?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>저장소와 서명 키\u003c/td>\u003ctd>패키지 공급 위치와 서명 검증 설정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>apt update\u003c/td>\u003ctd>패키지 목록 갱신\u003c/td>\u003c/tr>\u003ctr>\u003ctd>apt-cache policy\u003c/td>\u003ctd>설치 가능한 후보 버전 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>source …/setup.bash\u003c/td>\u003ctd>현재 셸에 ROS 환경 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rosdep\u003c/td>\u003ctd>프로젝트 외부 의존성 설치 지원\u003c/td>\u003c/tr>\u003ctr>\u003ctd>colcon\u003c/td>\u003ctd>ROS 패키지 빌드\u003c/td>\u003c/tr>\u003ctr>\u003ctd>venv · uv · lockfile\u003c/td>\u003ctd>Python 환경 분리와 의존성 재현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>고정 커밋\u003c/td>\u003ctd>교안이 사용한 코드 상태 재현\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>48쪽 · 두 터미널 통신\u003c/h3>\u003cp class=\"label\">터미널 1 — 발행\u003c/p>\u003cpre>\u003ccode>source /opt/ros/lyrical/setup.bash\nros2 topic pub --rate 1 /test_topic   std_msgs/msg/String \"{data: 'hello'}\"\u003c/code>\u003c/pre>\u003cp class=\"label\">터미널 2 — 구독\u003c/p>\u003cpre>\u003ccode>source /opt/ros/lyrical/setup.bash\nros2 topic echo /test_topic\u003c/code>\u003c/pre>\u003cp>\u003ccode>data: hello\u003c/code>가 반복되면 기본 메시지 통신이 동작합니다. 카메라 처리, 다른 장치와의 네트워크 통신, 실제 모터 제어까지 검증된 것은 아닙니다. 종료는 각 터미널에서 \u003ccode>Ctrl+C\u003c/code>를 누릅니다.\u003c/p>\u003ch3>52–53쪽 · Lab 실행을 읽는 법\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">명령\u003c/th>\u003cth scope=\"col\">목적\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>random_agent\u003c/td>\u003ctd>환경·행동 연결과 무작위 행동 결과 관찰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>train\u003c/td>\u003ctd>경험 수집·정책 갱신·체크포인트 저장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>play\u003c/td>\u003ctd>저장한 정책의 행동 확인\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003ccode>--task\u003c/code>는 과제, \u003ccode>--num_envs 16\u003c/code>은 병렬 환경 수, \u003ccode>physics=newton_mjwarp\u003c/code>는 물리 백엔드, \u003ccode>--viz newton_gl\u003c/code>은 화면 경로입니다. \u003ccode>--checkpoint latest\u003c/code>는 최근 체크포인트를 선택하는 교안 예시입니다.\u003c/p>\u003cp>정책 재생이 실패하면 task, 체크포인트, 관측·행동 규격과 백엔드를 먼저 확인합니다. 실행이 느리면 환경 수와 메모리 사용량을 확인하고 작은 설정으로 동작부터 검증합니다.\u003c/p>","lessons":[41,59],"recall":["두 터미널에서 hello를 주고받으면 모터까지 검증된 걸까요?","기본 ROS 메시지 통신만 확인한 것입니다. 장치·센서·하위 제어는 별도 검증입니다."],"check":["이번 Jetson 기본 실습의 완료 범위는?","OS 부팅 확인, ROS 설치와 두 터미널 문자열 통신입니다. 전체 Isaac ROS나 실물 정책 배포 완료와 구분합니다."]},{"id":"compatibility","title":"교안과 비교해서 기억할 경계","pages":"56–61쪽 · 공식 자료 교차 확인","html":"\u003cp>아래 내용은 앞선 설명에서 확인한 설치 조건과 미확인 사항을 함께 옮긴 것입니다. \u003cstrong>확인 기준일은 2026년 10월 20일\u003c/strong>이며, 설치 재현이나 하드웨어 실행 시험을 완료했다는 뜻은 아닙니다.\u003c/p>\u003cdiv class=\"note\">\u003cstrong>ROS 통신과 Sim Bridge는 별도\u003c/strong>\u003cp>교안은 Jetson의 Lyrical 통신과 RTX PC의 Lab 시연을 독립 실행합니다. 56쪽은 Sim 6.2·Ubuntu 24.04의 ROS Bridge에 Jazzy를 권장하는 조건을 별도로 다룹니다. 두 실습 성공만으로 실제 로봇 연결이 완성되지는 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">항목\u003c/th>\u003cth scope=\"col\">교안 표기와 비교\u003c/th>\u003cth scope=\"col\">근거\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Isaac Sim 6.2\u003c/td>\u003ctd>Python 3.12 · torch 2.11.0 · cu130 조합 확인\u003c/td>\u003ctd>\u003ca href=\"https://docs.isaacsim.omniverse.nvidia.com/6.2.0/installation/install_python.html\">공식 Python 설치 문서 ↗\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isaac Lab 3.0 + Sim 6.2\u003c/td>\u003ctd>확인한 release/3.0.0 README는 Sim 6.1 대상 표기. 교안 고정 커밋의 요구사항 별도 확인 필요\u003c/td>\u003ctd>\u003ca href=\"https://github.com/isaac-sim/IsaacLab/tree/release/3.0.0\">상류 브랜치 ↗\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>JetPack\u003c/td>\u003ctd>Orin Nano · JP 7.2 · Ubuntu 24.04 확인. 정확한 7.2.1 / R39.2.1 패치 표기는 이번 공식 자료 조사에서 미확인\u003c/td>\u003ctd>\u003ca href=\"https://developer.nvidia.com/embedded/jetpack/downloads/archive-7.2\">공식 JetPack 자료 ↗\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isaac ROS 5.0\u003c/td>\u003ctd>Lyrical 전환과 Noble Buildfarm 확인. NVMe 조건은 교안에 명시되어 있으나 이번 조사에서 지원표 직접 검증은 미완료\u003c/td>\u003ctd>\u003ca href=\"https://nvidia-isaac-ros.github.io/v/release-5.0/releases/index.html\">공식 릴리스 노트 ↗\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>교안의 설치 명령을 다른 버전의 명령과 섞기보다, 고정 커밋과 lockfile 및 해당 버전의 지원표를 한 세트로 확인하세요.\u003c/p>","lessons":[55,65],"recall":["같은 ROS 이름이면 모든 OS에서 설치 방법이 같을까요?","호스트·아키텍처·배포판·백엔드와 버전의 지원 조합을 확인해야 합니다."],"check":["Sim과 Lab 명령을 서로 다른 버전에서 섞어도 될까요?","교안 고정 커밋·lockfile과 해당 버전 공식 지원표를 한 세트로 확인해야 합니다."]},{"id":"review","title":"확인 문제와 프로젝트 적용","pages":"54쪽 · 63쪽","html":"\u003cp>먼저 답을 생각해본 뒤 펼쳐보세요.\u003c/p>\u003cdetails>\u003csummary>카메라 위치 시험, 정책 학습, 실제 영상 가속에는 각각 무엇을 쓸까?\u003c/summary>\u003cp>가상 카메라 위치·출력 시험은 Isaac Sim, 학습 과제 구성과 정책 평가는 Isaac Lab, ROS 2에서의 가속 영상 처리는 해당 Isaac ROS 패키지를 선택합니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>보상이 증가했는데 충돌도 늘었다면?\u003c/summary>\u003cp>보상 항목별 크기, 충돌 판정, 도착 판정, 종료·초기화, 행동 제한, 학습·평가 조건을 확인합니다. 목표 접근 보상이 충돌 벌점보다 과하게 유리한지, 충돌 이후 보상이 계속 누적되는지도 살펴봅니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>SD 카드 Orin Nano에서 이번 기본 실습은 어디까지일까?\u003c/summary>\u003cp>교안상 목표는 OS 부팅 확인, ROS 2 설치, 두 터미널의 문자열 통신입니다. Isaac ROS 전체 기능 실행이나 실제 모터에 강화학습 정책을 배포하는 단계는 별도입니다.\u003c/p>\u003c/details>\u003ch3>나의 로봇 프로젝트로 연결하기\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">설계 질문\u003c/th>\u003cth scope=\"col\">창고 이동 로봇 예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>어떤 작업을 하는가?\u003c/td>\u003ctd>주어진 목적지까지 장애물을 피해 이동\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무엇을 관측하는가?\u003c/td>\u003ctd>목표 방향·거리, 현재 속도, 장애물 거리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무엇을 출력하는가?\u003c/td>\u003ctd>전진·회전 속도 목표\u003c/td>\u003c/tr>\u003ctr>\u003ctd>학습이 필요한가?\u003c/td>\u003ctd>기존 Nav2·제어 방식과 학습 기반 접근의 필요성 비교\u003c/td>\u003c/tr>\u003ctr>\u003ctd>어떤 도구를 선택하는가?\u003c/td>\u003ctd>Sim에서 시험, 필요하면 Lab에서 학습, ROS로 연결, Jetson에서 실행\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무엇으로 성공을 판단하는가?\u003c/td>\u003ctd>새 환경에서의 도착률·충돌률·소요 시간\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>입력, 출력, 성공 지표를 먼저 적고 나면 각 도구가 필요한 이유를 설명할 수 있습니다. 모든 프로젝트에 VLA나 강화학습이 필요한 것은 아니므로 목표 작업에 맞춰 선택하세요.\u003c/p>","lessons":[45,53],"recall":["이전 Nav2 실습에서 어떤 지표로 주행을 평가했나요?","도착률·충돌률·소요 시간과 실패 유형을 함께 보았습니다. 학습 정책에도 연결합니다."],"check":["강화학습이 꼭 필요한 프로젝트인지 어떻게 판단할까요?","목표 작업과 센서·입출력·성공 지표를 정하고 일반 제어·Nav2 등 기존 접근과 필요성을 비교합니다."]}],"slides":[{"slide":1,"text":"Physical AI 01 Isaac\nKANT\n001\nNVIDIA Isaac 생태계\n시뮬레이션과 강화학습\nJetson Orin Nano / ROS 2 Lyrical\n입문자 90분 과정 / 2026.10.19\n"},{"slide":2,"text":"Physical AI 01 Isaac\nKANT\n002\n오늘의 학습 목표\n도구 선택\nIsaac Sim, Lab, ROS가 맡는 일을 구분한다.\n로봇 학습\n관측, 행동, 보상을 간단한 예제로 설명한다.\n직접 실행\nROS 메시지를 주고받고 학습 전후의 움직임을 비교한다.\n"},{"slide":3,"text":"Physical AI 01 Isaac\nKANT\n003\n90분 강의 구성\n시간\n내용\n학습 활동\n0–15분\nNVIDIA와 CUDA\n컴퓨터와 로봇의 역할 구분\n15–40분\nIsaac와 VSLAM, VLM, VLA\n입력과 결과물 비교\n40–55분\n강화학습과 실제 로봇 적용\n관측과 보상 설계\n55–75분\nJetson 설치와 ROS 2\nSD 선택, 두 터미널 통신\n75–90분\nSim과 Lab 시연, 확인 문제\n정책 학습과 재생 비교\n다운로드, 플래시와 첫 실행 준비는 수업 전에 끝낸다.\n"},{"slide":4,"text":"Physical AI 01 Isaac\nKANT\n004\n개발 PC와 Jetson의 역할\nUbuntu 노트북\nUSB로 Jetson의 OS를 설치\nRTX PC\nIsaac Sim 실행과 Lab 학습\nJetson과 제어기\n센서 처리와 실제 로봇 구동\nJetson Orin Nano 공식 개발 키트\n"},{"slide":5,"text":"Physical AI 01 Isaac\nKANT\n005\nNVIDIA 로봇 생태계\nGPU 하드웨어\nRTX, Jetson, DGX\n계산과 모델 실행\nCUDA, cuDNN, TensorRT\n가상 환경과 로봇 개발\nOmniverse, Isaac, GR00T\nNVIDIA 디지털 트윈 예시\n"},{"slide":6,"text":"Physical AI 01 Isaac\nKANT\n006\nCUDA와 GPU 계산\nCUDA\nNVIDIA GPU의 병렬 계산 플랫폼\n로봇에서 쓰는 계산\n영상 처리, 신경망, 병렬 환경\n성능 확인\nGPU 연산과 전체 지연을 함께 측정\nNVIDIA CUDA 공식 소개 이미지\n"},{"slide":7,"text":"Physical AI 01 Isaac\nKANT\n007\nCPU, GPU와 메모리\n구분\n주요 역할\n예시\nCPU\n순서와 분기가 많은 처리\nROS 노드, 파일, 작업 관리\nGPU\n비슷한 연산을 대량으로 처리\n영상, 행렬, 물리 계산\nVRAM\nGPU가 사용하는 메모리\n모델, 텍스처, 센서 출력\nJetson 메모리\nCPU와 GPU가 시스템 메모리 공유\n모델과 ROS 노드가 함께 사용\nTensorRT\n학습한 모델의 추론 최적화\n지원 장치에서 모델 실행\n"},{"slide":8,"text":"Physical AI 01 Isaac\nKANT\n008\n계산 속도와 로봇 반응 속도\n전체 처리 흐름\n카메라 입력, 전처리, 연산, 발행\n느린 단계 찾기\n메모리 복사와 CPU 처리도 관찰\n측정 지표\n초당 처리량과 끝까지 걸리는 지연\nNVIDIA Nsight 개발 도구 예시\n"},{"slide":9,"text":"Physical AI 01 Isaac\nKANT\n009\nIsaac Sim, Lab, ROS 비교\n도구\n담당하는 작업\n대표 결과물\nIsaac Sim\n가상 로봇과 센서를 시험\n장면, 센서 데이터, 시험 기록\nIsaac Lab\n학습 실험과 정책 평가\n정책 체크포인트, 실험 로그\nIsaac ROS\nROS 2에서 가속 기능 실행\n인식, 위치, 지도 등의 메시지\n한 프로젝트에서 필요한 도구를 골라 연결한다.\n"},{"slide":10,"text":"Physical AI 01 Isaac\nKANT\n010\nIsaac Sim\n가상 환경\n로봇과 물리 법칙, 센서를 구성\n시험\n제어 명령에 따른 움직임을 확인\n활용\n주행 검증과 학습용 데이터 생성\nIsaac Sim의 가상 창고와 센서 출력 예시\n"},{"slide":11,"text":"Physical AI 01 Isaac\nKANT\n011\n가상 로봇의 구성\n형상과 관절\nURDF 또는 USD 자산 준비\n물리 설정\n질량, 충돌, 마찰, 관절 한계\n센서와 제어\n카메라와 제어 명령을 연결\nIsaac Sim 로봇 팔 예시\n"},{"slide":12,"text":"Physical AI 01 Isaac\nKANT\n012\nOpenUSD와 장면 구성\nOpenUSD\n장면과 여러 자산을 조합하는 기반\n로봇 가져오기\n모델을 연 뒤 물리 속성 확인\n시연\n카메라 위치를 바꾸고 출력 비교\nIsaac Sim의 장면 구성 예시\n"},{"slide":13,"text":"Physical AI 01 Isaac\nKANT\n013\n가상 센서와 합성 데이터\n센서 출력\nRGB, 깊이, 분할 등의 데이터\n정답 라벨\n가상 환경의 상태를 활용\n활용 범위\n실제 수집과 라벨링을 보완\nIsaac Sim 합성 데이터 생성 예시\n"},{"slide":14,"text":"Physical AI 01 Isaac\nKANT\n014\nIsaac Lab\n학습 실험\n관측, 행동, 보상과 종료 정의\n학습과 평가\n강화학습과 모방학습에 활용\n실행 경로\n3.0 계열은 여러 백엔드 지원\nIsaac Lab 병렬 로봇 환경 예시\n"},{"slide":15,"text":"Physical AI 01 Isaac\nKANT\n015\n병렬 환경에서 경험 수집\n같은 과제를 여러 번\n각 환경의 상태와 시작점은 다름\n환경 수 증가\n더 많은 경험과 더 큰 메모리 사용\n강의 실습\n16개 환경으로 동작부터 확인\nIsaac Lab의 병렬 학습 예시\n"},{"slide":16,"text":"Physical AI 01 Isaac\nKANT\n016\nIsaac Lab의 학습 흐름\n환경과 관측·행동을 구성하고, 학습 라이브러리와 연결한다.\n정책과 로그를 저장한 뒤 새로운 조건에서 평가한다.\nIsaac Sim을 사용하는 Lab 구성 예시. Lab 3.0에는 Newton 경로도 있다.\n"},{"slide":17,"text":"Physical AI 01 Isaac\nKANT\n017\nROS 2와 Isaac ROS\nROS 2\n로봇 프로그램을 메시지로 연결\nIsaac ROS\nNVIDIA 가속 기능과 개발 도구\n사용 예\ncuVSLAM, AprilTag, DNN 추론\ncuVSLAM 퀵스타트의 RViz 화면\n"},{"slide":18,"text":"Physical AI 01 Isaac\nKANT\n018\nROS 2의 기본 단위\n용어\n뜻\n로봇 예시\nNode\n기능을 수행하는 프로그램 단위\n카메라 드라이버, 위치 추정기\nTopic\n연속 메시지를 주고받는 통로\n이미지, odometry, 속도 명령\nTF\n좌표계 사이의 관계\n카메라와 로봇 기준의 변환\n시간\n측정과 처리의 시각\n영상과 IMU의 시각 정렬\nIsaac ROS 5.0의 버퍼 API와 예전 NITROS 설치법을 구분한다.\n"},{"slide":19,"text":"Physical AI 01 Isaac\nKANT\n019\nVSLAM과 위치 추정\nVSLAM\n카메라로 지도와 위치를 함께 추정\ncuVSLAM\nNVIDIA의 가속 시각 위치 추정 기술\nNav2\n위치와 지도, 장애물로 주행 계획\n가상 이동 환경 예시\n"},{"slide":20,"text":"Physical AI 01 Isaac\nKANT\n020\n위치 추정에 필요한 조건\n보정과 좌표\n카메라 보정값과 TF가 맞는가\n영상과 시각\n특징이 보이고 측정 시각이 맞는가\n결과 확인\n위치 추정과 주행용 지도를 구분\ncuVSLAM 문서의 좌표축 예시\n"},{"slide":21,"text":"Physical AI 01 Isaac\nKANT\n021\nVSLAM, VLM, VLA\n용어\n주요 입력\n출력\nVSLAM\n연속 영상과 센서 정보\n기하학적 지도와 위치 추정\nVLM\n영상과 언어\n장면 설명과 질의 응답\nVLA\n영상, 지시, 로봇 상태\n로봇 행동 또는 행동 토큰\n“지도와 로봇 위치”, “장면 설명”, “행동 생성”은 서로 다른 결과이다.\n"},{"slide":22,"text":"Physical AI 01 Isaac\nKANT\n022\nVLA의 입력과 행동 출력\n영상, 언어 지시와 로봇 상태를 행동 생성에 연결한다.\n출력 규격에 맞춘 로봇별 변환과 제어기가 필요하다.\nNVIDIA GR00T 구조 예시\n"},{"slide":23,"text":"Physical AI 01 Isaac\nKANT\n023\n로봇 행동 모델과 실제 장치\nGR00T\n로봇 행동 모델과 개발 도구\n행동 표현\n관절 목표 또는 말단 이동량 등\n실행 준비\n로봇의 관측과 제어 규격에 연결\nNVIDIA GR00T 로봇 개발 소개 이미지\n"},{"slide":24,"text":"Physical AI 01 Isaac\nKANT\n024\nIsaac을 사용하는 프로젝트\n자율주행: Sim에서 시험하고 ROS 2와 Nav2로 주행을 연결한다.\n로봇 학습: Lab에서 정책을 학습하고 실제 제어기에 연결한다.\nNVIDIA의 데이터 수집, 학습, 평가, 배포 흐름\n"},{"slide":25,"text":"Physical AI 01 Isaac\nKANT\n025\n강화학습의 기본 구조\n정책이 관측으로 행동을 고르고, 환경이 결과와 보상을 돌려준다.\n경험을 이용해 장기적으로 좋은 결과를 내는 정책을 학습한다.\nOpenAI Spinning Up의 에이전트와 환경 구조\n"},{"slide":26,"text":"Physical AI 01 Isaac\nKANT\n026\nCartpole 예제\n관측\n카트 위치·속도, 막대 각도·각속도\n행동\n카트를 밀어 주는 힘\n목표\n막대가 넘어지지 않게 균형 유지\nIsaac Lab Cartpole 과제\n"},{"slide":27,"text":"Physical AI 01 Isaac\nKANT\n027\n강화학습 용어\n용어\n뜻\nCartpole 예시\nAgent / Policy\n행동을 고르는 주체와 규칙\n카트를 제어하는 신경망\nEnvironment\n행동의 결과가 생기는 환경\n카트와 막대 물리 계산\nObservation\n정책이 읽는 정보\n위치, 속도, 각도\nAction / Reward\n제어 입력과 평가 신호\n힘 입력과 균형 유지 보상\nEpisode\n초기화부터 종료까지 한 시도\n시작 후 실패 또는 시간 종료\n"},{"slide":28,"text":"Physical AI 01 Isaac\nKANT\n028\n이동 로봇의 학습 과제 설계\n항목\n교육용 예시\n점검할 질문\n관측\n목표 방향, 거리, 속도, 장애물 거리\n실제 로봇에서도 얻을 수 있나?\n행동\n전진 속도와 회전 속도 목표\n속도와 가속 한계 안에 있나?\n보상\n목표 접근, 도착, 충돌\n점수만 얻는 편법은 없나?\n종료와 초기화\n도착, 충돌, 시간 종료 / 시작점 변경\n새 조건에도 성공하는가?\n"},{"slide":29,"text":"Physical AI 01 Isaac\nKANT\n029\n보상 설계 예시\n한 스텝의 보상\n2 × 목표 접근 거리 − 0.01 × 경과 시간\n추가 보상\n도착 시 +10 / 충돌 시 −20\n관찰할 행동\n목표 근처 진동, 시간 끌기, 센서 오차 이용\n수치는 원리를 설명하는 예시이다. 실제 최적값을 뜻하지 않는다.\n"},{"slide":30,"text":"Physical AI 01 Isaac\nKANT\n030\n학습, 추론과 평가\n단계\n하는 일\n저장하거나 측정할 것\n학습\n경험 수집 후 정책 파라미터 갱신\n보상, 손실, 체크포인트\n추론\n고정된 정책으로 행동 생성\n행동과 실행 시간\n평가\n새 조건에서 반복 시험\n성공률, 충돌, 실패 유형\n보상 곡선과 실제 성공률을 함께 확인한다.\n"},{"slide":31,"text":"Physical AI 01 Isaac\nKANT\n031\nPPO와 정책 개선\n경험 수집\n관측, 행동과 보상을 기록\n정책 갱신\n수집한 경험으로 조금씩 개선\n역할 구분\nLab은 환경, 학습 라이브러리는 최적화\nIsaac Lab 손 조작 학습 사례\n"},{"slide":32,"text":"Physical AI 01 Isaac\nKANT\n032\n모방학습과 시연 데이터\n모방학습\n시연의 관측과 행동 관계를 학습\n강화학습\n상호작용과 보상으로 행동 개선\n조합\n시연으로 시작한 뒤 추가 학습 가능\nIsaac Teleop을 이용한 시연 수집 예시\n"},{"slide":33,"text":"Physical AI 01 Isaac\nKANT\n033\nSim to Real\n차이가 생기는 곳\n마찰, 질량, 모터 응답, 센서와 지연\n도메인 랜덤화\n조건을 바꾸어 다양한 경험 제공\n배포 확인\n단위, 순서, 행동 스케일, 제어 주기\n변형 물체를 다루는 Isaac Lab 사례\n"},{"slide":34,"text":"Physical AI 01 Isaac\nKANT\n034\n설치 환경과 버전\n실행 장치\n강의 기준 조합\n진행 범위\nJetson + \nmicroSD\nJetPack 7.2.1 / Ubuntu 24.04 / Lyrical\nUSB 플래시와 ROS 통신\nRTX PC\nIsaac Sim 6.2 / Python 3.12\n가상 로봇 실행\nRTX PC 학습\nLab 3.0 계열의 고정 커밋\nCartpole 학습과 재생\nIsaac ROS 확장\n5.0 / 공식 Jetson 표: JP 7.2 + NVMe\nSD 기본 실습 이후 선택\n2026.10.19 기준. Sim ROS Bridge의 권장 배포판은 별도로 확인한다.\n"},{"slide":35,"text":"Physical AI 01 Isaac\nKANT\n035\nJetson 설치 준비물\n장치\n공식 Orin Nano 개발 키트와 DC 전원\n저장장치\nmicroSD 64GB 이상, 강의용 128GB \n권장\n호스트\nUbuntu 24.04 x86_64와 데이터 USB\nmicroSD 카드 예시\n플래시 대상 SD의 기존 데이터는 지워진다.\n"},{"slide":36,"text":"Physical AI 01 Isaac\nKANT\n036\nSDK Manager 설치와 로그인\n다운로드\nUbuntu x86_64용 deb 파일\n설치\nsudo apt install \n./sdkmanager_*_amd64.deb\n실행\nsdkmanager 실행 후 NVIDIA 로그인\nSDK Manager 로그인 화면 예시\n"},{"slide":37,"text":"Physical AI 01 Isaac\nKANT\n037\nUSB 연결과 복구 모드\n전원을 끄고 SD와 USB를 연결한다. J14의 9번과 10번을 점퍼로 연결한다.\nDC 전원을 켠 뒤 장치가 인식되면 점퍼를 제거한다. 노트북에서 lsusb 확인.\n40핀 GPIO 번호와 구분한다. 다른 캐리어 보드는 해당 제조사 절차를 따른다.\n공식 Orin Nano의 J14 위치와 복구 연결 예시\n"},{"slide":38,"text":"Physical AI 01 Isaac\nKANT\n038\nJetson 대상 선택\n제품군\nJetson\n대상 하드웨어\n실제 장비와 일치하는 Orin Nano\nSDK 버전\nOrin Nano용 JetPack 7.2.1 지원 항목\nSDK Manager의 Orin Nano 선택 예시\n"},{"slide":39,"text":"Physical AI 01 Isaac\nKANT\n039\nDirect Flash와 설치 구성\n설치 방식\nDirect Flash 선택\n기본 실습\nJetson Linux를 우선 설치\n추가 구성\nCUDA와 TensorRT는 필요할 때 추가\nDirect Flash 공식 화면 예시. 캡처의 장치명은 선택 기준과 다를 수 있다.\n"},{"slide":40,"text":"Physical AI 01 Isaac\nKANT\n040\n플래시 전 대상 확인\n복구 진입\nManual Setup 선택\n인식 확인\n연결한 Jetson을 확인\n다음 단계\n대상 저장장치와 초기 계정 설정\nOrin Nano의 플래시 준비 화면 예시\n"},{"slide":41,"text":"Physical AI 01 Isaac\nKANT\n041\nSD Card 플래시\nOEM Configuration\nRuntime: 첫 부팅에서 계정 설정\nStorage Device\nSD Card 선택\nFlash\n완료까지 USB와 DC 전원 유지\nSD Card를 선택한 공식 화면 예시\n저장장치가 SD Card인지 확인한 뒤 Flash를 시작한다.\n"},{"slide":42,"text":"Physical AI 01 Isaac\nKANT\n042\n설치 완료와 첫 부팅\n플래시 완료\n성공 결과와 대상 장치 확인\n정상 부팅\n복구 점퍼 제거 확인\n초기 설정\n언어, 계정, 네트워크 설정\nSDK Manager 플래시 완료 화면 예시\n"},{"slide":43,"text":"Physical AI 01 Isaac\nKANT\n043\nJetson 첫 부팅 확인\n. /etc/os-release\necho \"$PRETTY_NAME\"\ndpkg --print-architecture\ncat /etc/nv_tegra_release\nfindmnt -no SOURCE /\ndf -h /\nJetson 터미널에서 실행한다.\nUbuntu 24.04, arm64, R39 / REVISION 2.1을 확인한다.\n루트 장치가 SD의 /dev/mmcblk… 파티션인지 확인한다.\n"},{"slide":44,"text":"Physical AI 01 Isaac\nKANT\n044\nLyrical 저장소 준비\nsudo apt update\nsudo apt install -y curl gnupg ca-certificates \\\n  software-properties-common\nsudo add-apt-repository -y universe\nexport LANG=C.UTF-8\nJetson에서 네트워크와 Ubuntu Noble 환경을 확인한다.\nNVIDIA는 Ubuntu 24.04용 Lyrical 패키지를 Buildfarm에서 제공한다.\n"},{"slide":45,"text":"Physical AI 01 Isaac\nKANT\n045\nNVIDIA 패키지 키와 저장소\nrepo=https://isaac.download.nvidia.com/isaac-ros\nkeyring=/usr/share/keyrings/nvidia-isaac-ros.gpg\narch=$(dpkg --print-architecture)\ncurl -fsSL \"$repo/repos.key\" | \\\n  sudo gpg --dearmor --yes -o \"$keyring\"\necho \"deb [arch=$arch signed-by=$keyring] $repo/ubuntu/main noble main\" | \\\n  sudo tee /etc/apt/sources.list.d/nvidia-isaac-ros-buildfarm.list\n이 명령은 새로 설치한 Jetson을 기준으로 한다.\n저장소 경로의 noble과 아키텍처 arm64를 확인한다.\n"},{"slide":46,"text":"Physical AI 01 Isaac\nKANT\n046\n개발 도구용 ROS 저장소\nros_src=https://github.com/ros-infrastructure/ros-apt-source\ncurl -fL \"$ros_src/releases/download/1.2.0/ros2-apt-source_1.2.0.noble_all.deb\" \\\n  -o /tmp/ros2-apt-source.deb\nsudo dpkg -i /tmp/ros2-apt-source.deb\nsudo apt update\napt-cache policy ros-lyrical-ros-base\nCandidate에 설치 가능한 ros-lyrical-ros-base 버전이 보여야 한다.\n(none)이면 키, 저장소, 네트워크를 먼저 확인한다.\n"},{"slide":47,"text":"Physical AI 01 Isaac\nKANT\n047\nROS 2 설치와 환경 설정\nsudo apt install -y ros-lyrical-ros-base \\\n  python3-colcon-common-extensions python3-rosdep\ngrep -qxF 'source /opt/ros/lyrical/setup.bash' ~/.bashrc || \\\n  echo 'source /opt/ros/lyrical/setup.bash' >> ~/.bashrc\nsource /opt/ros/lyrical/setup.bash\nsudo rosdep init\nrosdep update\necho \"$ROS_DISTRO\"\npython3 -c \"import rclpy; print('rclpy OK')\"\nROS_DISTRO는 lyrical, Python 출력은 rclpy OK인지 확인한다.\nrosdep이 이미 초기화되어 있으면 rosdep update부터 실행한다.\n"},{"slide":48,"text":"Physical AI 01 Isaac\nKANT\n048\n두 터미널의 ROS 2 통신\n터미널 1: 발행\n터미널 2: 구독\nsource /opt/ros/lyrical/setup.bash\nros2 topic pub --rate 1 /test_topic \\\n  std_msgs/msg/String \"{data: 'hello'}\"\nsource /opt/ros/lyrical/setup.bash\nros2 topic echo /test_topic\ndata: hello가 반복되면 성공. 문자열을 바꿔 보고 Ctrl+C로 종료한다.\n"},{"slide":49,"text":"Physical AI 01 Isaac\nKANT\n049\nIsaac Sim 실행 화면\nPC 요구 사항\n지원 RTX GPU와 드라이버\n공식 최소 예시\nRAM 32GB / VRAM 16GB / SSD \n50GB\n첫 실행\n확장과 셰이더 준비 시간을 확보\nIsaac Sim 기본 화면 예시\nOrin Nano는 이번 강의의 Isaac Sim 실행 장치가 아니다.\n"},{"slide":50,"text":"Physical AI 01 Isaac\nKANT\n050\nIsaac Sim 6.2 설치\nnvidia-smi\nsudo apt update\nsudo apt install -y python3.12-venv\npython3.12 -m venv ~/env_isaacsim62\nsource ~/env_isaacsim62/bin/activate\npython -m pip install --upgrade pip\npython -m pip install torch==2.11.0 \\\n  --index-url https://download.pytorch.org/whl/cu130\npython -m pip install \"isaacsim[all,extscache]==6.2.0.0\" \\\n  --extra-index-url https://pypi.nvidia.com\nisaacsim\nUbuntu 24.04 x86_64의 RTX PC에서 실행한다.\n첫 실행 전에 공식 GPU와 드라이버 호환 조건을 확인한다.\n"},{"slide":51,"text":"Physical AI 01 Isaac\nKANT\n051\nIsaac Lab 환경 준비\nsudo apt install -y git curl\ncurl -LsSf https://astral.sh/uv/install.sh | sh\nexport PATH=\"$HOME/.local/bin:$PATH\"\ngit clone --branch release/3.0.0 \\\n  https://github.com/isaac-sim/IsaacLab.git ~/IsaacLab-course\ncd ~/IsaacLab-course\ngit checkout 0c114a24a3b9e854d299d3527ada507139fc4e40\nuv sync --frozen --extra isaacsim\nuv run --frozen --extra isaacsim isaaclab list_envs --show_presets\n고정 커밋과 uv.lock을 함께 사용한다. Python 요구 사항은 3.12이다.\n3.0 계열은 개발 중인 경로이므로 강의 장비에서 사전 실행한다.\n"},{"slide":52,"text":"Physical AI 01 Isaac\nKANT\n052\nCartpole의 무작위 행동\ncd ~/IsaacLab-course\nuv run --frozen --extra isaacsim isaaclab random_agent \\\n  --task Isaac-Cartpole --num_envs 16 \\\n  physics=newton_mjwarp --viz newton_gl\n앞에서 받은 IsaacLab-course 폴더에서 실행한다.\n16개 환경의 움직임과 막대가 넘어지는 모습을 관찰한다.\n이 명령의 물리와 화면은 Newton 경로이다.\n"},{"slide":53,"text":"Physical AI 01 Isaac\nKANT\n053\nCartpole 학습과 정책 재생\n학습 실행\n체크포인트 재생\nuv run --frozen --extra isaacsim \\\n  isaaclab train --task Isaac-Cartpole \\\n  --num_envs 16 physics=newton_mjwarp \\\n  --viz newton_gl\nuv run --frozen --extra isaacsim \\\n  isaaclab play --task Isaac-Cartpole \\\n  --num_envs 16 --checkpoint latest \\\n  physics=newton_mjwarp --viz newton_gl\n학습 종료 시간은 보장되지 않는다. 강사는 미리 저장한 정책을 준비한다.\n"},{"slide":54,"text":"Physical AI 01 Isaac\nKANT\n054\n확인 문제\n도구 선택\n카메라 위치 시험, 정책 학습, 실제 영상 가속에 각각 무엇을 쓰는가?\n결과 비교\n보상은 증가했는데 충돌이 늘었다면 무엇을 확인할까?\n설치 범위\nSD 카드 Orin Nano에서 이번 실습은 어디까지 완료했는가?\n"},{"slide":55,"text":"Physical AI 01 Isaac\nKANT\n055\n설치 실습 부록\n환경별 명령어와 문제 해결\n수업 전 준비와 확장 실습\n아래 슬라이드는 필요할 때 참고\n"},{"slide":56,"text":"Physical AI 01 Isaac\nKANT\n056\n설치 조합의 호환 경계\n대상\n확인할 조건\n이번 강의의 처리\nSim ROS Bridge\nSim 6.2 / Ubuntu 24.04는 Jazzy 권장\nLyrical 통신과 Lab 시연을 독립 실행\nIsaac Lab\nmain의 2.x와 develop의 3.0 명령 차이\nrelease/3.0.0의 커밋 고정\nIsaac ROS 5.0\n공식 Jetson 표의 JP 7.2와 NVMe 조건\nSD 전용 실습에서는 개념만 설명\n"},{"slide":57,"text":"Physical AI 01 Isaac\nKANT\n057\nIsaac Sim 백엔드로 Cartpole 실행\nuv run --frozen --extra isaacsim isaaclab random_agent \\\n  --task Isaac-Cartpole --num_envs 16 \\\n  physics=isaacsim_physx --viz kit\nIsaac Sim 물리와 Kit 화면을 사용하는 예시이다.\nNewton 경로와 설치·실행 조건을 구분한다.\n학습 정책은 같은 과제와 관측·행동 규격으로 평가한다.\n"},{"slide":58,"text":"Physical AI 01 Isaac\nKANT\n058\nIsaac ROS 확장 실습\n단계\n준비와 실행\n확인 결과\n환경 준비\n공식 하드웨어, JetPack, NVMe 조건 확인\n지원 표와 일치\n개발 환경\n공식 저장소, CLI와 컨테이너 구성\n컨테이너 안에서 ROS 실행\n기능 선택\nAprilTag 또는 cuVSLAM 퀵스타트\n기록 데이터로 출력 확인\n실센서 적용\n카메라 드라이버, 보정, TF와 시간\n실제 센서의 결과 검증\n"},{"slide":59,"text":"Physical AI 01 Isaac\nKANT\n059\nIsaac ROS CLI 흐름\nsudo apt install isaac-ros-cli\nsudo isaac-ros init docker\nisaac-ros activate\n공식 Isaac ROS 저장소와 호스트 준비를 마친 환경에서 실행한다.\n앞의 ROS Buildfarm 저장소 추가만으로 전체 준비가 끝나지는 않는다.\n컨테이너를 연 뒤 해당 기능의 패키지와 예제 데이터를 추가한다.\n"},{"slide":60,"text":"Physical AI 01 Isaac\nKANT\n060\nJetson과 ROS 문제 해결\n증상\n먼저 확인\n다음 행동\nJetson 탐지 실패\n데이터 USB, DC 전원, 복구 모드\n전원을 끄고 연결 순서 재확인\nSD 플래시 실패\n보드 모델, JetPack, SD 인식\n대상 설정과 오류 로그 확인\nLyrical 후보 없음\ function markdown(text){
const lines=text.split('\n'),out=[];let i=0;
while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}
if(line.startsWith('```')){let code=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))code.push(lines[i++]);if(i<lines.length)i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}
if(/^#{1,2} /.test(line)){const heading=line.replace(/^#{1,2} /,'');out.push('<h3>'+esc(heading)+'</h3>');i++;continue}
if(line.startsWith('|')&&i+1<lines.length&&/^\|[- :|]+\|$/.test(lines[i+1])){let rows=[];rows.push(line);i+=2;while(i<lines.length&&lines[i].startsWith('|'))rows.push(lines[i++]);out.push('<div class="table-wrap"><table>'+rows.map((r,ri)=>'<tr>'+r.slice(1,-1).split('|').map(c=>'<'+(ri?'td':'th')+'>'+esc(c.trim())+'</'+(ri?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>');continue}
if(line.startsWith('### ')){out.push('<h4>'+esc(line.slice(4))+'</h4>');i++;continue}
if(line.startsWith('- ')){let items=[];while(i<lines.length&&lines[i].startsWith('- '))items.push('<li>'+esc(lines[i++].slice(2))+'</li>');out.push('<ul>'+items.join('')+'</ul>');continue}
let block=[];while(i<lines.length&&lines[i].trim()&&!/^#{1,3} /.test(lines[i])&&!lines[i].startsWith('```'))block.push(lines[i++]);out.push('<p>'+esc(block.join('\n'))+'</p>')}
return out.join('')}

const graphKinds={standard:'ROS 표준',custom:'custom ROS 노드',ai:'LLM / VLM / VLA',rl:'RL',hardware:'하드웨어',human:'사람',safety:'후속 안전 보완'};
function restorePreservedRecord(a){
 if(a.originalGraph){
  const g=a.originalGraph;if(!Array.isArray(g.nodes)||!Array.isArray(g.edges))throw Error('원본 도식 형식 오류');
  const ids=new Set();for(const n of g.nodes){if(typeof n.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(n.id)||ids.has(n.id)||!graphKinds[n.kind]||typeof n.name!=='string')throw Error('원본 노드 형식 오류');ids.add(n.id)}
  const edges=new Set();for(const e of g.edges){if(typeof e.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(e.id)||edges.has(e.id)||!ids.has(e.from)||!ids.has(e.to)||typeof e.label!=='string')throw Error('원본 연결 형식 오류');edges.add(e.id)}
 }
 for(const [id,r] of Object.entries(a.tfEdits||{})){if(!D.tfFrames.some(f=>f.id===id)||typeof r.publisher!=='string'||typeof r.note!=='string')throw Error('TF 기록 형식 오류')}
 for(const [id,status] of Object.entries(a.legacyTasks||{})){if(!D.originalTasks.some(t=>t.id===id)||!statuses.includes(status))throw Error('이전 작업 기록 형식 오류')}
 if(a.originalGraph){graphCheckpoint();graph=clone(a.originalGraph);graphSave()}
 if(a.tfEdits){tfEdits={...tfEdits,...a.tfEdits};localStorage.setItem('robotTfEditsV1',JSON.stringify(tfEdits))}
 if(a.legacyTasks){legacyTasks={...legacyTasks,...a.legacyTasks};localStorage.setItem('robotTaskState',JSON.stringify(legacyTasks))}
 if(a.legacyDocs){legacyDocs={...legacyDocs,...a.legacyDocs};localStorage.setItem('robotDocState',JSON.stringify(legacyDocs))}
}

function wrapLabel(value,size=23){const words=String(value).split(' ');let lines=[''];for(const word of words){const last=lines.length-1;if((lines[last]+' '+word).length>size&&lines[last])lines.push(word);else lines[last]+=(lines[last]?' ':'')+word;}return lines.flatMap(l=>l.length>size?[l.slice(0,size),l.slice(size)]:[l]).slice(0,3)}

const w=1370,h=Math.max(1620,graph.nodes.length>19?(graph.nodes.length-19)*170+240:0);

rows.forEach(([name,y])=>out+='<text x="14" y="'+y+'" fill="#59697b">'+name+'</text><line x1="14" x2="1350" y1="'+(y+12)+'" y2="'+(y+12)+'" stroke="#e4e9ee"/>');
const visibleNodes=graph.nodes.filter(graphVisible),ids=new Set(visibleNodes.map(n=>n.id));
graph.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)).forEach(e=>{
 const a=graphPosition(graph.nodes.find(n=>n.id===e.from)),b=graphPosition(graph.nodes.find(n=>n.id===e.to));
 let ax=a[0]+110,ay=a[1]+100,bx=b[0]+110,by=b[1];
 if(a[1]===b[1]){ax=a[0]+(b[0]>a[0]?220:0);ay=a[1]+50;bx=b[0]+(b[0]>a[0]?0:220);by=b[1]+50;}
 const mid=(ay+by)/2;let path;
 if(by<ay-120){const routeX=Math.max(a[0],b[0])+258;path='M'+(a[0]+220)+' '+(a[1]+50)+' H'+routeX+' V'+(b[1]+50)+' H'+(b[0]+220);}
 else path='M'+ax+' '+ay+' C'+ax+' '+mid+' '+bx+' '+mid+' '+bx+' '+by;

 out+='<path d="'+path+'" class="g-edge '+esc(e.style)+' '+(selected||related?'active':'')+'" marker-end="url(#originalArrow)"/><path d="'+path+'" class="edge-hit" data-original-edge="'+esc(e.id)+'"><title>'+esc(e.label)+' · '+esc(e.contract)+'</title></path>';
});
visibleNodes.forEach(n=>{

 let shape;
 if(n.kind==='hardware')shape='<polygon points="'+x+','+(y+50)+' '+(x+20)+','+y+' '+(x+200)+','+y+' '+(x+220)+','+(y+50)+' '+(x+200)+','+(y+100)+' '+(x+20)+','+(y+100)+'"';
 else if(n.kind==='human')shape='<ellipse cx="'+(x+110)+'" cy="'+(y+50)+'" rx="110" ry="50"';
 else shape='<rect x="'+x+'" y="'+y+'" width="220" height="100" rx="9"';
 out+='<g class="g-node" data-original-node="'+esc(n.id)+'" role="button" tabindex="0" aria-label="'+esc(n.name)+'">'+shape+' fill="'+(sel?'#e9f5f1':'white')+'" stroke="'+color+'" stroke-width="'+(sel?3:1.6)+'"/>';
 if(n.kind==='human')out+='<ellipse cx="'+(x+110)+'" cy="'+(y+50)+'" rx="103" ry="43" fill="none" stroke="'+color+'"/>';
 out+='<text x="'+(x+110)+'" y="'+(y+20)+'" text-anchor="middle" style="font-size:10px;fill:#59697b">'+esc(graphKinds[n.kind])+'</text>';
 wrapLabel(n.name).forEach((l,j)=>out+='<text x="'+(x+110)+'" y="'+(y+43+j*16)+'" text-anchor="middle" style="font-weight:600">'+esc(l)+'</text>');
 out+='<text x="'+(x+110)+'" y="'+(y+88)+'" text-anchor="middle" style="font-size:10px;fill:#59697b">'+esc(n.layer)+'</text><title>'+esc(n.name+' · 입력: '+n.inputs+' · 출력: '+n.outputs+' · 실패: '+n.failure)+'</title></g>';
});return out+'</svg>'}

function kalmanLesson(){
return '<article class="card prose section-title"><span class="tag">38강 보조 예제 · 1차원 위치 측정</span><h2 class="section-title">예측과 센서가 다르게 말하면 무엇을 믿을까요?</h2><p>모델은 위치가 10 m라고 예상하고 센서는 11 m라고 측정했습니다. 두 값을 평균내기 전에, 각각 얼마나 불확실한지 함께 봅니다.</p><p>이 예제는 이미 계산된 예측 평균 μ⁻와 분산 P⁻를 받아 측정 하나로 보정하는 단계입니다. 시간에 따른 전체 KF나 실제 로봇 위치 추정기를 실행하는 화면은 아닙니다.</p><h3>먼저 예상해 보세요</h3><p>다른 값은 그대로 두고 센서 분산 R을 키우면 추정 위치는 10 m와 11 m 중 어느 쪽에 가까워질까요?</p><div class="flex controls">'+button('측정이 불확실','data-kalman-preset="sensor"')+button('예측이 불확실','data-kalman-preset="model"')+button('불확실성이 같음','data-kalman-preset="equal"')+'</div><div class="grid"><label class="field">예측 위치 μ⁻ [m]<input id="kfMu" type="number" step="0.1" value="10"></label><label class="field">측정 위치 z [m]<input id="kfZ" type="number" step="0.1" value="11"></label><label class="field">예측 분산 P⁻ [m²]<input id="kfP" type="number" min="0.001" step="0.1" value="1"></label><label class="field">측정 분산 R [m²]<input id="kfR" type="number" min="0.001" step="0.1" value="4"></label></div><div id="kalmanResult" aria-live="polite"></div><h3>수식이 답하는 질문</h3><pre>K = P⁻ / (P⁻ + R)\nμ = μ⁻ + K × (z − μ⁻)\nP = (1 − K) × P⁻</pre><p>z − μ⁻는 예상과 측정의 차이입니다. K는 이 차이를 얼마나 반영할지 정합니다. 이 식은 상태와 측정이 모두 같은 1차원 위치이고 H=1이며 측정 잡음과 예측 오차가 독립인 경우입니다.</p><p>여기서는 양의 분산일 때 K가 0과 1 사이입니다. 일반적인 다변수 칼만 이득은 행렬이므로 모든 원소를 “0–1 비율”로 해석하면 안 됩니다. Q는 예측 단계에서 P⁻에 영향을 주는 모델 잡음이며 이 보정 예제의 별도 입력은 아닙니다.</p><h3>쉽게 설명할 때도 유지해야 할 조건</h3><p>교안의 “예측하면 넓어짐”은 등속 이동·잡음 누적 예제의 직관입니다. 일반 KF의 예측 공분산은 FPFᵀ + Q이므로 모델과 방향에 따라 항상 커진다고 단정할 수 없습니다. 보정 분산은 추정된 불확실성이며 실제 오차 감소를 보증하지 않습니다. EKF는 다봉 가설을 직접 표현하지 못하지만 외부 초기화·전역 추정과 결합한 복구까지 불가능한 것은 아닙니다.</p><h3>로봇으로 연결하면</h3><p>상태 추정기는 encoder·IMU 등 선택한 관측을 모델과 결합합니다. 결과가 robot_localization에서 나온다면 odom→base_link의 발행 책임을 맞춥니다. map→odom의 전역 보정은 localization/SLAM의 별도 역할입니다.</p><h3>이해 점검 · 답을 열기 전에 설명하세요</h3><details><summary>① 센서 분산 R이 커지면 왜 측정 반영이 줄어드나요?</summary><p>같은 P⁻에서 분모가 커져 K가 작아집니다. 센서 측정이 덜 확실하다고 모델링했기 때문에 innovation을 덜 반영합니다. 분산을 크게 썼다는 사실 자체가 실제 센서 오류를 고쳐 주지는 않습니다.</p></details><details><summary>② 센서가 끊기면 추정이 바로 사라지나요?</summary><p>정의된 움직임 모델로 예측을 이어갈 수 있지만 관측 보정이 없어 불확실성이 커지거나 관측되지 않는 방향으로 누적될 수 있습니다. 이 단일 보정 화면은 시간 진행·측정 두절을 계산하지 않습니다.</p></details><details><summary>③ EKF와 AMCL은 같은 역할인가요?</summary><p>EKF는 현재 추정점에서 비선형 모델을 선형화해 단봉 가우시안으로 추정합니다. AMCL은 지도 위에서 여러 위치 가설을 파티클로 표현합니다. 상태·센서·초기화·복구 조건에 따라 역할을 정하고, 어느 하나가 모든 상황을 자동 해결한다고 가정하지 않습니다.</p></details><div class="notice">교안 정합 메모: 38강은 42강 AMCL 사용을 예고하지만 현재 42강 본문은 cuVSLAM 재위치 추정입니다. AMCL 개념과 현재 실습 도구를 구분해서 읽으세요.</div></article>';
}
function updateKalman(){
const mu=Number($('kfMu').value),z=Number($('kfZ').value),p=Number($('kfP').value),r=Number($('kfR').value);
if(![mu,z,p,r].every(Number.isFinite)||p<=0||r<=0||!$('kfMu').value||!$('kfZ').value){$('kalmanResult').innerHTML='<p role="alert">유한한 위치값과 0보다 큰 분산을 입력하세요.</p>';return}
const k=p/(p+r),post=mu+k*(z-mu),variance=(1-k)*p;
const sd=Math.max(Math.sqrt(p),Math.sqrt(r)),lo=Math.min(mu,z,post)-sd*1.4,hi=Math.max(mu,z,post)+sd*1.4;
const px=v=>50+(v-lo)/(hi-lo)*500;
const rows=[['예측',mu,p,'#7c8da0'],['측정',z,r,'#a97431'],['보정',post,variance,'#146b64']];
const svg='<svg viewBox="0 0 600 220" style="width:100%;height:auto" role="img" aria-label="위치 평균과 각 분산의 1표준편차 범위">'+rows.map(([name,v,vr,color],i)=>{const y=45+i*65;return '<text x="8" y="'+(y-12)+'" style="font-size:12px">'+name+'</text><line x1="'+px(v-Math.sqrt(vr))+'" x2="'+px(v+Math.sqrt(vr))+'" y1="'+y+'" y2="'+y+'" stroke="'+color+'" stroke-width="5"/><circle cx="'+px(v)+'" cy="'+y+'" r="6" fill="'+color+'"/><text x="'+px(v)+'" y="'+(y+23)+'" text-anchor="middle" style="font-size:12px">'+v.toFixed(3)+' m</text>'}).join('')+'</svg>';
$('kalmanResult').innerHTML='<div class="card" style="margin:14px 0"><b id="kfValue">K = '+k.toFixed(3)+' · 보정 위치 = '+post.toFixed(3)+' m · 보정 분산 = '+variance.toFixed(3)+' m²</b><p>예측에서 측정 방향으로 '+(k*100).toFixed(1)+'% 이동합니다. 선은 각 값의 ±1 표준편차 범위이며 실제 오차를 보증하는 선이 아닙니다.</p>'+svg+'</div>';
}

function updateMotionExample(){
const angle=Number($('motionAngle').value),limit=Number($('motionLimit').value);
if(!$('motionAngle').value||!$('motionLimit').value||![angle,limit].every(Number.isFinite)||angle<0||limit<0){$('motionResult').innerHTML='<p role="alert">0 이상의 유한한 각도를 입력하세요.</p>';return;}
const other=$('motionOther').value==='exceeds',skip=!other&&angle<=limit;
$('motionResult').textContent=(skip?'삽입 생략 조건에 해당합니다.':'새 삽입을 허용할 수 있습니다.')+' 회전 변화 '+angle.toFixed(3)+'° = '+(angle*Math.PI/180).toFixed(6)+' rad, 기준 '+limit.toFixed(3)+'° = '+(limit*Math.PI/180).toFixed(6)+' rad. '+(other?'시간 또는 거리 조건이 이미 기준을 초과했습니다.':angle>limit?'각도 조건이 기준을 초과했습니다.':'시간·거리·각도 모두 기준 이하입니다.');
}
function restoreStudy(a){
if(!a.study)return;
for(const [id,r] of Object.entries(a.study)){if(!D.course.lessons.some(l=>String(l.number)===id)||!studyStates.includes(r.status)||typeof r.explanation!=='string'||typeof r.observation!=='string'||typeof r.question!=='string')throw Error('학습 기록 형식 오류')}
study={...study,...a.study};studySave();
}

function cgSvg(title,body,viewBox='0 0 640 440'){

function cgGrid(){let s='';for(let x=60;x<=580;x+=80)s+='<line x1="'+x+'" y1="40" x2="'+x+'" y2="380" stroke="#e6ebef"/>';for(let y=60;y<=380;y+=80)s+='<line x1="60" y1="'+y+'" x2="580" y2="'+y+'" stroke="#e6ebef"/>';return s;}

const cgWalls=[[0,0],[6,0],[6,4],[0,4],[0,0]];
const cgTruePose=[3,2];
const cgScanPoints=[];
for(let i=0;i<=24;i++){let x=i*0.25;cgScanPoints.push([x,0],[x,4]);}
for(let i=1;i<16;i++){let y=i*0.25;cgScanPoints.push([0,y],[6,y]);}
// Internal wall provides a distinct shape, so heading changes are visible.
for(let i=0;i<=8;i++)cgScanPoints.push([4,1+i*0.25]);
function cgScanModel(dx,dy,yaw,maxRange,voxel){
const rad=yaw*Math.PI/180,c=Math.cos(rad),s=Math.sin(rad),cells=new Set(),points=[];

for(const target of cgScanPoints){const x=target[0]-cgTruePose[0],y=target[1]-cgTruePose[1];if(Math.hypot(x,y)>maxRange)continue;eligible++;const cell=Math.floor(x/voxel)+','+Math.floor(y/voxel);if(cells.has(cell))continue;cells.add(cell);const observed=[cgTruePose[0]+dx+c*x-s*y,cgTruePose[1]+dy+s*x+c*y];points.push(observed);totalError+=(observed[0]-target[0])**2+(observed[1]-target[1])**2;}

function cgLoopModel(count,drift,n,score,threshold,amount){

function updateCgLoop(){

'<section class="card section-title cg-lab"><h2>③ 입자 필터를 한 단계씩 실행하기</h2><p>6 m 복도 오른쪽 벽까지 거리를 측정합니다. “내 위치가 x라면 벽까지 얼마나 남을까?”를 각 가설에서 비교해 보세요.</p><div class="cg-experiment"><div><div id="n2PFDiagram"></div><div class="cg-legend"><span class="cg-orange">● 주황: 위치 가설</span><span class="cg-teal">━ 녹청: 가중 평균</span><span>┄ 점선: 관측이 지지하는 위치</span></div><p class="source-note">위치는 x축 한 차원만 추정합니다. 점의 여러 행은 겹침 방지용이며 y 위치가 아닙니다. 실제 AMCL은 (x,y,θ)와 지도·여러 레이저 끝점을 사용합니다.</p></div><div class="cg-controls"><div class="flex">'+['초기 가설','예측','관측 갱신','재표본화'].map((s,i)=>button((i+1)+'. '+s,'data-n2-pf="'+i+'" aria-pressed="false"')).join('')+'</div>'+cgRange('n2ParticleCount','학습용 입자 수',40,200,40,80)+cgRange('n2Motion','odom 이동량 [m]',-1,1,0.1,0.3)+cgRange('n2Observation','관측한 오른쪽 벽 거리 [m]',0.5,5.5,0.1,2)+cgRange('n2Sigma','거리 오차 모델 폭 σ [m]',0.05,1,0.05,0.2)+'<div id="n2PFResult" class="cg-result" aria-live="polite"></div></div></div><details><summary>무엇을 계산하고 무엇을 생략했나요?</summary><p>초기에는 복도에 가설을 고르게 놓습니다. 예측은 odom 이동량과 고정된 작은 합성 흔들림을 더합니다. 관측 가중치는 0.5×exp(−거리오차²/(2σ²))+0.5/6을 정규화한 학습용 점수입니다. 실제 Nav2 likelihood_field 구현의 다중 광선 집계·KLD 적응·가중치 공식 전체를 재현하지 않습니다.</p><p>재표본화는 이 가중치에서 고정 간격으로 뽑는 systematic 예제이며 입자 수는 고정입니다. σ를 좁히면 불일치에 민감해지지만 틀린 지도·TF를 고치는 것은 아닙니다. 관측이 맞다는 보장이 없으므로 입자 집중이 정답을 보장하지 않습니다. 교안 13–25쪽, 이전 38강 칼만 예제와 비교하세요.</p></details></section>'+
'<section class="card section-title cg-lab"><h2>④ Dijkstra·A*와 Costmap을 함께 보기</h2><p>같은 출발·목표·비용에서 탐색 방식을 바꿔 보세요. 그림의 자유 셀을 누르면 목표를 옮길 수 있습니다.</p><div class="cg-experiment"><div><div id="n2PlanDiagram"></div><div class="cg-legend"><span>■ 회색: 장애물</span><span>■ 주황 농도: 주행 비용</span><span>· 파랑: 탐색한 셀</span><span class="cg-teal">━ 녹청: 최종 경로</span></div><p class="source-note">4방향 격자와 원형 몸체의 학습용 탐색입니다. 방향·시간·가속·동적 장애물·실제 NavFn 구현을 포함하지 않습니다. 지도 셀 한 변은 0.25 m입니다.</p></div><div class="cg-controls"><label class="field">탐색 방식<select id="n2Algorithm"><option value="astar">A* · f = g + h</option><option value="dijkstra">Dijkstra · g</option></select></label>'+cgRange('n2Inflation','비용 확산 반경 [m]',0.25,1.25,0.05,0.75)+cgRange('n2Decay','비용 감쇠 계수',0.5,5,0.5,2)+cgRange('n2Footprint','합성 원형 몸체 반경 [m]',0.1,0.45,0.05,0.15)+'<div class="n2-goal"><label class="field">목표 열 x [셀]<input id="n2GoalX" type="number" min="1" max="18" step="1" value="16"></label><label class="field">목표 행 y [셀]<input id="n2GoalY" type="number" min="1" max="12" step="1" value="3"></label></div><p class="source-note">열은 오른쪽, 행은 아래로 증가합니다. 키보드로도 목표를 변경할 수 있습니다.</p><div class="flex">'+button('탐색 재생','id="n2PlanPlay" class="primary"')+button('한 셀 더 보기','id="n2PlanStep"')+button('전체 결과','id="n2PlanAll"')+'</div>'+cgRange('n2PlanProgress','표시할 탐색 셀 수',0,1,1,0)+'<div id="n2PlanResult" class="cg-result" aria-live="polite"></div></div></div><details><summary>비용과 충돌 조건을 구분해서 읽기</summary><p>회색 셀과 몸체가 겹치면 통과 불가입니다. 그 밖의 비용은 장애물까지의 여유 거리에서 지수적으로 감소시키는 단순 예제입니다. 같은 확산 반경에서 감쇠 계수가 클수록 비용이 빠르게 줄어듭니다. 실제 InflationLayer의 정수 비용·inscribed radius 처리와 같은 계산은 아닙니다.</p><p>A*는 셀 간 최소 이동 비용 1에 대한 Manhattan 휴리스틱을 씁니다. 같은 그래프에서는 두 방식이 같은 최소 비용을 찾도록 구성했지만 경로 모양과 탐색 순서는 달라질 수 있습니다. 셀 수는 브라우저 예제의 기록이며 Nav2 실행 시간 비교가 아닙니다. Footprint는 실제 장치를 측정해서 설정하며 통로를 통과시키려고 줄이지 않습니다. 교안 27–40, 67–70쪽.</p></details></section>'+

$('n2TFResult').textContent=owner+'가 map→odom 담당. '+v.correction.toFixed(2)+' m + '+o.toFixed(2)+' m = '+v.composed.toFixed(2)+' m. '+(mode==='localization'?'Cartographer·cuVSLAM의 같은 TF 발행은 중지합니다.':'저장 지도 주행으로 전환할 때 AMCL로 역할을 넘깁니다.');}
function n2ParticleModel(count,delta,z,sigma,stage){
const initial=Array.from({length:count},(_,i)=>0.3+5.4*(i+0.5)/count);
const predicted=initial.map((x,i)=>Math.max(0,Math.min(6,x+delta+0.12*Math.sin(i*2.39996))));
let xs=stage===0?initial:predicted,weights=xs.map(()=>1/count);
if(stage>=2){weights=xs.map(x=>0.5*Math.exp(-((6-x-z)**2)/(2*sigma*sigma))+0.5/6);const sum=weights.reduce((a,b)=>a+b,0);weights=weights.map(w=>w/sum);}
const mean=xs.reduce((a,x,i)=>a+x*weights[i],0),ess=1/weights.reduce((a,w)=>a+w*w,0);
if(stage===3){let j=0,cdf=weights[0];xs=Array.from({length:count},(_,i)=>{const u=(i+0.5)/count;while(u>cdf&&j<count-1)cdf+=weights[++j];return predicted[j];});weights=xs.map(()=>1/count);}
return {xs,weights,mean,ess};
}

let body='<path d="M60 240 H570 V80" stroke="#8793a0" stroke-width="4" fill="none"/><text x="445" y="65">오른쪽 벽 x=6 m</text><line x1="'+scale(obsX)+'" x2="'+scale(obsX)+'" y1="90" y2="240" stroke="#8793a0" stroke-dasharray="6 5"/>';
for(let i=0;i<m.xs.length;i++){const x=scale(m.xs[i]),h=m.weights[i]/max;body+='<line x1="'+x+'" x2="'+x+'" y1="170" y2="'+(170-65*h)+'" stroke="#a25a17" opacity="0.3"/><circle cx="'+x+'" cy="'+(185+i%5*9)+'" r="'+(2+2*h)+'" fill="#a25a17"/>';}

const n2W=20,n2H=14,n2Cell=0.25,n2Start=[3,10];let n2Goal=[16,3];
function n2IsObstacle(x,y){return x===0||y===0||x===n2W-1||y===n2H-1||(x===9&&y<12&&![4,5,6,11].includes(y))||(x>=12&&x<=14&&y>=5&&y<=7);}
function n2Clearance(x,y){let d=Infinity;for(let oy=0;oy<n2H;oy++)for(let ox=0;ox<n2W;ox++)if(n2IsObstacle(ox,oy)){const dx=Math.max(Math.abs(x-ox)-0.5,0)*n2Cell,dy=Math.max(Math.abs(y-oy)-0.5,0)*n2Cell;d=Math.min(d,Math.hypot(dx,dy));}return d;}
function n2SearchModel(algorithm,radius,decay,bodyRadius,goal){
const costs=Array.from({length:n2W*n2H},(_,id)=>{const x=id%n2W,y=Math.floor(id/n2W),d=n2Clearance(x,y);return d<=bodyRadius?Infinity:d<=radius?1+4*Math.exp(-decay*(d-bodyRadius)):1;});
const start=n2Start[1]*n2W+n2Start[0],target=goal[1]*n2W+goal[0],g=Array(n2W*n2H).fill(Infinity),parents=Array(n2W*n2H).fill(-1),visited=[],closed=new Set();
if(!Number.isFinite(costs[start])||!Number.isFinite(costs[target]))return {costs,visited,path:[],cost:Infinity};
g[start]=0;const queue=[start],heuristic=id=>algorithm==='astar'?Math.abs(id%n2W-goal[0])+Math.abs(Math.floor(id/n2W)-goal[1]):0;
while(queue.length){queue.sort((a,b)=>(g[a]+heuristic(a))-(g[b]+heuristic(b))||a-b);const id=queue.shift();if(closed.has(id))continue;closed.add(id);visited.push(id);if(id===target)break;const x=id%n2W,y=Math.floor(id/n2W);
for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){if(nx<0||nx>=n2W||ny<0||ny>=n2H)continue;const next=ny*n2W+nx;if(closed.has(next)||!Number.isFinite(costs[next]))continue;const value=g[id]+costs[next];if(value<g[next]){g[next]=value;parents[next]=id;queue.push(next);}}}
const path=[];if(Number.isFinite(g[target])){let at=target;while(at!==-1){path.unshift(at);at=parents[at];}}
return {costs,visited,path,cost:g[target]};}

function normalizeReviewRecords(records){
if(!records||typeof records!=='object'||Array.isArray(records))throw Error('복습 기록 형식 오류');const result={};
for(const [id,r] of Object.entries(records)){
if(!reviewConcepts.some(c=>c.id===id)||!r||!['again','partial','explained'].includes(r.rating)||typeof r.explanation!=='string'||r.explanation.length>3000||(r.rating==='explained'&&!r.explanation.trim())||!Number.isInteger(r.level)||r.level<0||r.level>3||!Number.isInteger(r.count)||r.count<1||typeof r.reviewedAt!=='string'||typeof r.dueAt!=='string'||!Number.isFinite(Date.parse(r.reviewedAt))||!Number.isFinite(Date.parse(r.dueAt)))throw Error('복습 항목 형식 오류');
result[id]={rating:r.rating,explanation:r.explanation,level:r.level,count:r.count,reviewedAt:r.reviewedAt,dueAt:r.dueAt};
}return result;
}

function reviewQueue(records,context='all',now=Date.now(),practice=false){
const ids=(reviewContexts[context]||reviewContexts.all).ids;
return ids.filter(id=>practice||!records[id]||Date.parse(records[id].dueAt)<=now).sort((a,b)=>{
const ra=records[a],rb=records[b];if(ra&&!rb)return -1;if(!ra&&rb)return 1;if(ra&&rb)return Date.parse(ra.dueAt)-Date.parse(rb.dueAt);return ids.indexOf(a)-ids.indexOf(b);
}).slice(0,3);
}
function reviewNextRecord(previous,rating,explanation,now=Date.now()){
if(!['again','partial','explained'].includes(rating))throw Error('복습 평가를 선택하세요.');
if(rating==='explained'&&!explanation.trim())throw Error('설명 예시를 본 뒤에도 좋습니다. 내 말로 한 문장을 먼저 적어주세요.');
const level=rating==='explained'?Math.min(3,(previous?.rating==='explained'?previous.level:0)+1):0;
const minutes=rating==='again'?10:rating==='partial'?1440:[0,1440,4320,10080][level];
return {rating,explanation:explanation.trim(),level,count:(previous?.count||0)+1,reviewedAt:new Date(now).toISOString(),dueAt:new Date(now+minutes*60000).toISOString()};
