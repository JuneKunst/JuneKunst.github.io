,"ESTOP_LATCHED","팔은 중력·브레이크 특성 포함"],["coord","nav2","진행 goal 취소","cancel","ESTOP_LATCHED","소프트웨어 정리는 보조 경로"],["robot","safety","정지·fault 상태","feedback","ESTOP_LATCHED","실측 정지시간과 거리 기록"],["operator","safety","원인 확인·수동 재인가","request","ESTOP_LATCHED → SELF_TEST","물리 해제만으로 움직이지 않음"],["safety","coord","self-test 성공","result","SELF_TEST → READY","기존 goal 자동 재실행 금지"]]},{"id":"rl","name":"RL 관측·대체 경로","trigger":"기본 제어 기준 시험 완료 후 실험 활성화","pre":"nominal 경로·출력 경계·fallback·동일 bag 기준 확보","success":"nominal 대비 지표 개선, 제한 위반 0건","failure":"추론 지연 / NaN / 범위 초과 / 모델 버전 불일치","recovery":"RL 후보 폐기 → nominal 사용, 기본 경로 불건전 시 정지","steps":[["state","rl","관측 입력","data","SHADOW","출력은 기록만 하고 로봇 지령에 영향 없음"],["rl","gate","제한된 후보","data","BOUNDED","검증 후에만 correction 경로 허용"],["gate","basecontroller","nominal 또는 승인 후보","command","BOUNDED","명령 소유자는 한 곳"],["rl","gate","NaN / deadline 초과","fault","BOUNDED → FALLBACK","모델을 더 기다리지 않음"],["gate","basecontroller","nominal 복귀","command","FALLBACK","nominal이 stale이면 정지"],["coord","operator","실험 결과 보고","result","FALLBACK → REVIEW","모델 hash·latency·위반 기록"]]}],"requirements":[{"id":"REQ-01","title":"목표 처리","behavior":"유효한 작업만 실행하고 task_id로 전체 흐름 추적","interfaceId":"IF-04","scenario":"navigate","acceptance":"중복 goal·없는 frame·허용범위 밖 목표 각각 거절","test":"TST-01","status":"제안"},{"id":"REQ-02","title":"상태 유효성","behavior":"TF·관측이 오래되면 의존 작업을 중단","interfaceId":"IF-02","scenario":"fault","acceptance":"센서 중단을 주입하고 감지·정지시간을 기록","test":"TST-02","status":"제안"},{"id":"REQ-03","title":"집기 검증","behavior":"궤적 성공과 실제 집기 성공을 별도 판정","interfaceId":"IF-06","scenario":"pick","acceptance":"빈 그리퍼·미끄러짐 사례에서 성공 오판 0건 (제안)","test":"TST-03","status":"제안"},{"id":"REQ-04","title":"정지와 재개","behavior":"비상 정지 해제만으로 기존 목표를 재실행하지 않음","interfaceId":"IF-12","scenario":"estop","acceptance":"해제 뒤 새 목표 전송 전 구동 없음","test":"TST-04","status":"제안"},{"id":"REQ-05","title":"RL 격리","behavior":"RL 비활성·오류 시 기본 제어가 정의대로 동작","interfaceId":"IF-11","scenario":"rl","acceptance":"NaN·timeout·모델 부재를 주입해 fallback 확인","test":"TST-05","status":"제안"},{"id":"REQ-06","title":"재현성","behavior":"시험 결과와 이미지·설정·모델 버전을 함께 기록","interfaceId":"IF-09","scenario":"navigate","acceptance":"동일 버전 재실행 후 결과 비교와 차이 기록","test":"TST-06","status":"제안"}],"documents":[{"id":"00","file":"docs/00-baseline-and-scope.md","title":"시작점과 범위","framework":"arc42 1–3 · Context","intro":"이 문서는 무엇을 만들고 어디까지 검증했는지 고정합니다. «환경 실행»과 «로봇 기능 구현»을 구분해야 일정과 시험을 판단할 수 있습니다.","sections":[["현재 증거의 해석","Docker·ROS CLI·RViz 실행은 과거 세션 기록에 있습니다. 이번 문서 갱신에서 하드웨어 동작을 재검증한 것은 아닙니다. 실제 Nav2, MoveIt, 센서, RL 구현은 아직 확인되지 않았습니다. 작업 상태의 Done 표시는 사용자 기록이며 시험 합격 증거와 다릅니다."],["제품 목표","Mac에서 개발·가상 시험을 수행하고 네트워크 제어 인터페이스를 가진 로봇을 연결합니다. 첫 전달물은 «구조화된 목표 하나 → 일반 제어 → 결과와 취소 확인»입니다. 자연어·RL·복수 로봇은 후속 증분으로 둡니다."],["범위와 선택 사항","기본 범위: 단일 로봇의 navigation 또는 manipulation 한 경로, 관측, 취소, 로그, 배포 재현. 선택: VLM, RL, 두 대 베이스, sensor fusion. 원본 그림의 TurtleBot ×2가 두 로봇인지 두 바퀴인지 미정이므로 기본 설계에 복수 로봇을 확정하지 않습니다."],["환경 계약","Mac arm64와 Ubuntu PC amd64는 소스를 공유할 수 있지만 build/install 바이너리를 공유하지 않습니다. 플랫폼별 이미지 digest와 빌드 결과를 기록합니다. Ubuntu 24.04 호스트에서 다른 Ubuntu user space 컨테이너 사용은 가능하되 kernel·device 호환은 따로 확인합니다. Lyrical 대상 이미지의 실제 OS와 패키지 버전으로 baseline을 고정합니다."],["시작 전 결정 목록","대상 로봇·센서 / 목표와 작업 공간 / controller 입력 타입 / 정지 방식 / 로봇 호스트 IP / 책임자 / 시험 장소를 Open decision으로 기록합니다. 해당 정보가 없어도 mock 개발은 진행하되 물리 통합 gate는 통과하지 않습니다."]],"markdown":"# 시작점과 범위\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: arc42 1–3 · Context\n\n이 문서는 무엇을 만들고 어디까지 검증했는지 고정합니다. «환경 실행»과 «로봇 기능 구현»을 구분해야 일정과 시험을 판단할 수 있습니다.\n\n## 현재 증거의 해석\n\nDocker·ROS CLI·RViz 실행은 과거 세션 기록에 있습니다. 이번 문서 갱신에서 하드웨어 동작을 재검증한 것은 아닙니다. 실제 Nav2, MoveIt, 센서, RL 구현은 아직 확인되지 않았습니다. 작업 상태의 Done 표시는 사용자 기록이며 시험 합격 증거와 다릅니다.\n\n## 제품 목표\n\nMac에서 개발·가상 시험을 수행하고 네트워크 제어 인터페이스를 가진 로봇을 연결합니다. 첫 전달물은 «구조화된 목표 하나 → 일반 제어 → 결과와 취소 확인»입니다. 자연어·RL·복수 로봇은 후속 증분으로 둡니다.\n\n## 범위와 선택 사항\n\n기본 범위: 단일 로봇의 navigation 또는 manipulation 한 경로, 관측, 취소, 로그, 배포 재현. 선택: VLM, RL, 두 대 베이스, sensor fusion. 원본 그림의 TurtleBot ×2가 두 로봇인지 두 바퀴인지 미정이므로 기본 설계에 복수 로봇을 확정하지 않습니다.\n\n## 환경 계약\n\nMac arm64와 Ubuntu PC amd64는 소스를 공유할 수 있지만 build/install 바이너리를 공유하지 않습니다. 플랫폼별 이미지 digest와 빌드 결과를 기록합니다. Ubuntu 24.04 호스트에서 다른 Ubuntu user space 컨테이너 사용은 가능하되 kernel·device 호환은 따로 확인합니다. Lyrical 대상 이미지의 실제 OS와 패키지 버전으로 baseline을 고정합니다.\n\n## 시작 전 결정 목록\n\n대상 로봇·센서 / 목표와 작업 공간 / controller 입력 타입 / 정지 방식 / 로봇 호스트 IP / 책임자 / 시험 장소를 Open decision으로 기록합니다. 해당 정보가 없어도 mock 개발은 진행하되 물리 통합 gate는 통과하지 않습니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"01","file":"docs/01-requirements.md","title":"요구사항과 합격 기준","framework":"arc42 1·10 · Quality scenarios","intro":"요구사항은 «도구 설치»가 아니라 사용자가 얻을 결과입니다. 시험으로 참과 거짓을 구분할 수 있어야 합니다.","sections":[["요구사항 표","REQ-01 · 목표 처리\n- 기대 행동: 유효한 작업만 실행하고 task_id로 전체 흐름 추적\n- 합격 판단: 중복 goal·없는 frame·허용범위 밖 목표 각각 거절\n- 연결: IF-04 → TST-01 · 상태: 제안\n\nREQ-02 · 상태 유효성\n- 기대 행동: TF·관측이 오래되면 의존 작업을 중단\n- 합격 판단: 센서 중단을 주입하고 감지·정지시간을 기록\n- 연결: IF-02 → TST-02 · 상태: 제안\n\nREQ-03 · 집기 검증\n- 기대 행동: 궤적 성공과 실제 집기 성공을 별도 판정\n- 합격 판단: 빈 그리퍼·미끄러짐 사례에서 성공 오판 0건 (제안)\n- 연결: IF-06 → TST-03 · 상태: 제안\n\nREQ-04 · 정지와 재개\n- 기대 행동: 비상 정지 해제만으로 기존 목표를 재실행하지 않음\n- 합격 판단: 해제 뒤 새 목표 전송 전 구동 없음\n- 연결: IF-12 → TST-04 · 상태: 제안\n\nREQ-05 · RL 격리\n- 기대 행동: RL 비활성·오류 시 기본 제어가 정의대로 동작\n- 합격 판단: NaN·timeout·모델 부재를 주입해 fallback 확인\n- 연결: IF-11 → TST-05 · 상태: 제안\n\nREQ-06 · 재현성\n- 기대 행동: 시험 결과와 이미지·설정·모델 버전을 함께 기록\n- 합격 판단: 동일 버전 재실행 후 결과 비교와 차이 기록\n- 연결: IF-09 → TST-06 · 상태: 제안"],["품질 시나리오 템플릿","환경: 어떤 구성에서 / 자극: 어떤 사건이 발생하면 / 응답: 시스템이 어떻게 행동하고 / 측정: 어떤 값으로 판정한다. 예: 실행 중 scan을 중단하면 stale detector와 base watchdog가 정지시키고 감지시간·명령차단시간·실제 정지시간을 각각 기록한다."],["수치가 필요한 항목","goal deadline, command TTL, 센서 age, 목표 오차, 정지시간·거리, 최대속도, CPU 사용량, 추론 p95 latency는 TBD입니다. 하드웨어·시험 근거 없이 20 Hz나 100 Hz를 승인값으로 사용하지 않습니다. 숫자를 제안하면 제안자·측정 조건·승인자를 함께 적습니다."],["변경 방법","각 요구사항에 owner, 우선순위, 관련 위험, 시험 ID, 변경 사유를 추가합니다. 요구사항 변경 시 인터페이스·시나리오·시험 영향도 함께 검토합니다. 현재 전체 요구사항은 설계 제안 상태입니다."]],"markdown":"# 요구사항과 합격 기준\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: arc42 1·10 · Quality scenarios\n\n요구사항은 «도구 설치»가 아니라 사용자가 얻을 결과입니다. 시험으로 참과 거짓을 구분할 수 있어야 합니다.\n\n## 요구사항 표\n\nREQ-01 · 목표 처리\n- 기대 행동: 유효한 작업만 실행하고 task_id로 전체 흐름 추적\n- 합격 판단: 중복 goal·없는 frame·허용범위 밖 목표 각각 거절\n- 연결: IF-04 → TST-01 · 상태: 제안\n\nREQ-02 · 상태 유효성\n- 기대 행동: TF·관측이 오래되면 의존 작업을 중단\n- 합격 판단: 센서 중단을 주입하고 감지·정지시간을 기록\n- 연결: IF-02 → TST-02 · 상태: 제안\n\nREQ-03 · 집기 검증\n- 기대 행동: 궤적 성공과 실제 집기 성공을 별도 판정\n- 합격 판단: 빈 그리퍼·미끄러짐 사례에서 성공 오판 0건 (제안)\n- 연결: IF-06 → TST-03 · 상태: 제안\n\nREQ-04 · 정지와 재개\n- 기대 행동: 비상 정지 해제만으로 기존 목표를 재실행하지 않음\n- 합격 판단: 해제 뒤 새 목표 전송 전 구동 없음\n- 연결: IF-12 → TST-04 · 상태: 제안\n\nREQ-05 · RL 격리\n- 기대 행동: RL 비활성·오류 시 기본 제어가 정의대로 동작\n- 합격 판단: NaN·timeout·모델 부재를 주입해 fallback 확인\n- 연결: IF-11 → TST-05 · 상태: 제안\n\nREQ-06 · 재현성\n- 기대 행동: 시험 결과와 이미지·설정·모델 버전을 함께 기록\n- 합격 판단: 동일 버전 재실행 후 결과 비교와 차이 기록\n- 연결: IF-09 → TST-06 · 상태: 제안\n\n## 품질 시나리오 템플릿\n\n환경: 어떤 구성에서 / 자극: 어떤 사건이 발생하면 / 응답: 시스템이 어떻게 행동하고 / 측정: 어떤 값으로 판정한다. 예: 실행 중 scan을 중단하면 stale detector와 base watchdog가 정지시키고 감지시간·명령차단시간·실제 정지시간을 각각 기록한다.\n\n## 수치가 필요한 항목\n\ngoal deadline, command TTL, 센서 age, 목표 오차, 정지시간·거리, 최대속도, CPU 사용량, 추론 p95 latency는 TBD입니다. 하드웨어·시험 근거 없이 20 Hz나 100 Hz를 승인값으로 사용하지 않습니다. 숫자를 제안하면 제안자·측정 조건·승인자를 함께 적습니다.\n\n## 변경 방법\n\n각 요구사항에 owner, 우선순위, 관련 위험, 시험 ID, 변경 사유를 추가합니다. 요구사항 변경 시 인터페이스·시나리오·시험 영향도 함께 검토합니다. 현재 전체 요구사항은 설계 제안 상태입니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"02","file":"docs/02-conops-and-scenarios.md","title":"운용 시나리오","framework":"arc42 6 · Runtime view","intro":"시나리오는 실제 사용자가 겪는 사건을 시간순으로 설명합니다. 구성도는 누가 있는지를, 시퀀스는 누가 언제 누구에게 요청하는지를 보여줍니다.","sections":[["기동·대기","시작: 운영자가 선택한 profile을 기동\n\n전제: 구성 버전·장치 연결·clock·정지 경로 지정\n\n성공: 필수 진단 통과, motion disabled 상태로 READY\n\n실패: 필수 node·TF·상태 누락 또는 controller activation 실패\n\n복구: 원인 수정 후 self-test 재실행. 초기화 중 명령 허용 금지\n\n1. operator → coord: profile 기동 [request]\n   상태: BOOT → SELF_TEST. 실제 launch 파일은 구현 task에서 고정\n2. robot → cm: 장치 상태 읽기 [feedback]\n   상태: SELF_TEST. driver 연결 성공과 구동 enable을 구분\n3. state → coord: TF·clock·odom 진단 [data]\n   상태: SELF_TEST. 필수 frame과 timestamp 검사\n4. safety → coord: 정지 경로 준비 [result]\n   상태: SELF_TEST. e-stop 해제만으로 자동 실행하지 않음\n5. coord → operator: READY 보고 [result]\n   상태: SELF_TEST → READY. 목표 입력 대기, motion disabled 유지"],["목표까지 이동","시작: 운영자가 유효한 map 좌표 목표를 전송\n\n전제: TF·odom·costmap 정상, 안전 허가, 단일 명령 소유자\n\n성공: action SUCCEEDED와 목표 오차·실제 정지 확인\n\n실패: 목표 거절 / TF 단절 / obstacle / deadline\n\n복구: 현재 action 취소 완료 후 재계획. 재시도 상한은 ADR로 결정\n\n1. operator → coord: 목표 제출 [request]\n   상태: READY → VALIDATING. 목표 frame·범위·중복 task 검사\n2. coord → nav2: NavigateToPose Goal [goal]\n   상태: VALIDATING → EXECUTING. 서버가 goal을 수락해야 실행 시작\n3. costmap → nav2: 관측·비용 지도 갱신 [data]\n   상태: EXECUTING. scan이 controller에 바로 들어가는 것이 아님\n4. nav2 → gate: 속도 명령 [command]\n   상태: EXECUTING. timestamp와 명령 소유자 검사\n5. gate → basecontroller: 제한된 속도 [command]\n   상태: EXECUTING. 실제 controller 타입과 timeout 맞춤\n6. state → nav2: odom / TF [feedback]\n   상태: EXECUTING. 실제 이동을 관측하고 추정 갱신\n7. nav2 → coord: Feedback → Result [result]\n   상태: EXECUTING → COMPLETED. SUCCEEDED와 물리 정지는 별도 관측\n8. coord → operator: 완료 보고 [result]\n   상태: COMPLETED → READY. task_id와 증거 위치 기록"],["물체 집기","시작: 운영자가 대상 물체와 목적 위치 지정\n\n전제: 목표 유효·TF 연결·관절 상태 정상·MoveIt scene 최신\n\n성공: 궤적 성공 + gripper 상태 / 관측으로 집기 확인\n\n실패: 물체 사라짐 / IK·충돌 실패 / tolerance 위반 / grasp 실패\n\n복구: 안전한 hold 또는 정지 확인 후 재관측. goal 무한 재전송 금지\n\n1. operator → coord: 집기 작업 요청 [request]\n   상태: READY → VALIDATING. 최초에는 구조화된 목표 사용\n2. perception → coord: 객체 pose + TTL [data]\n   상태: VALIDATING. stale pose·낮은 신뢰도 배제\n3. coord → moveit: PickPlace adapter goal [goal]\n   상태: VALIDATING → PLANNING. custom 업무 adapter의 계약 필요\n4. moveit → jtc: FollowJointTrajectory Goal [goal]\n   상태: PLANNING → EXECUTING. joint 순서·시간·limit·collision 검사\n5. jtc → cm: controller command interfaces [command]\n   상태: EXECUTING. action을 Float64MultiArray로 무조건 바꾸지 않음\n6. robot → cm: 실제 joint state [feedback]\n   상태: EXECUTING. read-update-write feedback\n7. jtc → moveit: Feedback / Result [result]\n   상태: EXECUTING → VERIFYING. trajectory 성공만으로 grasp 성공 아님\n8. moveit → coord: 집기 관측 결과 [result]\n   상태: VERIFYING → COMPLETED / RECOVERING. 그리퍼 상태 또는 재관측이 필요"],["센서 단절·작업 취소","시작: 필수 센서 TTL 초과 또는 사용자 취소\n\n전제: 실행 중 task_id와 goal_id 추적 가능\n\n성공: cancel 결과와 실제 정지 확인, 원인 기록\n\n실패: cancel 거절 / 통신 단절 / 정지 확인 지연\n\n복구: 상위 stop 정책으로 escalation; 통신 복구만으로 재개하지 않음\n\n1. camera → coord: 필수 관측 stale [fault]\n   상태: EXECUTING → STOPPING. 감지 threshold는 센서 주기 측정으로 결정\n2. coord → nav2: CancelGoal [cancel]\n   상태: STOPPING. 취소 요청 수락과 취소 완료를 구분\n3. gate → basecontroller: 속도 차단 [command]\n   상태: STOPPING. 응답 없는 상위 노드와 무관하게 watchdog\n4. nav2 → coord: CANCELED / ABORTED [result]\n   상태: STOPPING. 결과를 기다리는 상한 시간 정의\n5. state → coord: 실제 정지 관측 [feedback]\n   상태: STOPPING → STOPPED. zero 명령만으로 정지 판정하지 않음\n6. coord → operator: 원인·재시작 조건 [result]\n   상태: STOPPED. 확인 후 새 goal로 시작"],["비상 정지·재가동","시작: 물리 e-stop 또는 정의된 중대 고장\n\n전제: 장치별 정지 방식과 검증 책임자 지정\n\n성공: 정지시간·거리·래치 동작이 승인된 한계 내\n\n실패: 소프트웨어 정지만 성공 / 팔 처짐 / 차단 지연\n\n복구: 원인 제거 → 물리 해제 → self-test → 수동 재인가 → 새 goal\n\n1. operator → safety: 물리 e-stop [fault]\n   상태: ANY → ESTOP_LATCHED. ROS 네트워크와 독립된 경로\n2. safety → robot: 구동 차단 / 장치 정지 [command]\n   상태: ESTOP_LATCHED. 팔은 중력·브레이크 특성 포함\n3. coord → nav2: 진행 goal 취소 [cancel]\n   상태: ESTOP_LATCHED. 소프트웨어 정리는 보조 경로\n4. robot → safety: 정지·fault 상태 [feedback]\n   상태: ESTOP_LATCHED. 실측 정지시간과 거리 기록\n5. operator → safety: 원인 확인·수동 재인가 [request]\n   상태: ESTOP_LATCHED → SELF_TEST. 물리 해제만으로 움직이지 않음\n6. safety → coord: self-test 성공 [result]\n   상태: SELF_TEST → READY. 기존 goal 자동 재실행 금지"],["RL 관측·대체 경로","시작: 기본 제어 기준 시험 완료 후 실험 활성화\n\n전제: nominal 경로·출력 경계·fallback·동일 bag 기준 확보\n\n성공: nominal 대비 지표 개선, 제한 위반 0건\n\n실패: 추론 지연 / NaN / 범위 초과 / 모델 버전 불일치\n\n복구: RL 후보 폐기 → nominal 사용, 기본 경로 불건전 시 정지\n\n1. state → rl: 관측 입력 [data]\n   상태: SHADOW. 출력은 기록만 하고 로봇 지령에 영향 없음\n2. rl → gate: 제한된 후보 [data]\n   상태: BOUNDED. 검증 후에만 correction 경로 허용\n3. gate → basecontroller: nominal 또는 승인 후보 [command]\n   상태: BOUNDED. 명령 소유자는 한 곳\n4. rl → gate: NaN / deadline 초과 [fault]\n   상태: BOUNDED → FALLBACK. 모델을 더 기다리지 않음\n5. gate → basecontroller: nominal 복귀 [command]\n   상태: FALLBACK. nominal이 stale이면 정지\n6. coord → operator: 실험 결과 보고 [result]\n   상태: FALLBACK → REVIEW. 모델 hash·latency·위반 기록"]],"markdown":"# 운용 시나리오\n\n상태: Draft · 참조 설계\n\n시나리오는 실제 사용자가 겪는 사건을 시간순으로 설명합니다. 구성도는 누가 있는지를, 시퀀스는 누가 언제 누구에게 요청하는지를 보여줍니다.\n\n## 기동·대기\n\n시작: 운영자가 선택한 profile을 기동\n\n전제: 구성 버전·장치 연결·clock·정지 경로 지정\n\n성공: 필수 진단 통과, motion disabled 상태로 READY\n\n실패: 필수 node·TF·상태 누락 또는 controller activation 실패\n\n복구: 원인 수정 후 self-test 재실행. 초기화 중 명령 허용 금지\n\n1. operator → coord: profile 기동 [request]\n   상태: BOOT → SELF_TEST. 실제 launch 파일은 구현 task에서 고정\n2. robot → cm: 장치 상태 읽기 [feedback]\n   상태: SELF_TEST. driver 연결 성공과 구동 enable을 구분\n3. state → coord: TF·clock·odom 진단 [data]\n   상태: SELF_TEST. 필수 frame과 timestamp 검사\n4. safety → coord: 정지 경로 준비 [result]\n   상태: SELF_TEST. e-stop 해제만으로 자동 실행하지 않음\n5. coord → operator: READY 보고 [result]\n   상태: SELF_TEST → READY. 목표 입력 대기, motion disabled 유지\n\n## 목표까지 이동\n\n시작: 운영자가 유효한 map 좌표 목표를 전송\n\n전제: TF·odom·costmap 정상, 안전 허가, 단일 명령 소유자\n\n성공: action SUCCEEDED와 목표 오차·실제 정지 확인\n\n실패: 목표 거절 / TF 단절 / obstacle / deadline\n\n복구: 현재 action 취소 완료 후 재계획. 재시도 상한은 ADR로 결정\n\n1. operator → coord: 목표 제출 [request]\n   상태: READY → VALIDATING. 목표 frame·범위·중복 task 검사\n2. coord → nav2: NavigateToPose Goal [goal]\n   상태: VALIDATING → EXECUTING. 서버가 goal을 수락해야 실행 시작\n3. costmap → nav2: 관측·비용 지도 갱신 [data]\n   상태: EXECUTING. scan이 controller에 바로 들어가는 것이 아님\n4. nav2 → gate: 속도 명령 [command]\n   상태: EXECUTING. timestamp와 명령 소유자 검사\n5. gate → basecontroller: 제한된 속도 [command]\n   상태: EXECUTING. 실제 controller 타입과 timeout 맞춤\n6. state → nav2: odom / TF [feedback]\n   상태: EXECUTING. 실제 이동을 관측하고 추정 갱신\n7. nav2 → coord: Feedback → Result [result]\n   상태: EXECUTING → COMPLETED. SUCCEEDED와 물리 정지는 별도 관측\n8. coord → operator: 완료 보고 [result]\n   상태: COMPLETED → READY. task_id와 증거 위치 기록\n\n## 물체 집기\n\n시작: 운영자가 대상 물체와 목적 위치 지정\n\n전제: 목표 유효·TF 연결·관절 상태 정상·MoveIt scene 최신\n\n성공: 궤적 성공 + gripper 상태 / 관측으로 집기 확인\n\n실패: 물체 사라짐 / IK·충돌 실패 / tolerance 위반 / grasp 실패\n\n복구: 안전한 hold 또는 정지 확인 후 재관측. goal 무한 재전송 금지\n\n1. operator → coord: 집기 작업 요청 [request]\n   상태: READY → VALIDATING. 최초에는 구조화된 목표 사용\n2. perception → coord: 객체 pose + TTL [data]\n   상태: VALIDATING. stale pose·낮은 신뢰도 배제\n3. coord → moveit: PickPlace adapter goal [goal]\n   상태: VALIDATING → PLANNING. custom 업무 adapter의 계약 필요\n4. moveit → jtc: FollowJointTrajectory Goal [goal]\n   상태: PLANNING → EXECUTING. joint 순서·시간·limit·collision 검사\n5. jtc → cm: controller command interfaces [command]\n   상태: EXECUTING. action을 Float64MultiArray로 무조건 바꾸지 않음\n6. robot → cm: 실제 joint state [feedback]\n   상태: EXECUTING. read-update-write feedback\n7. jtc → moveit: Feedback / Result [result]\n   상태: EXECUTING → VERIFYING. trajectory 성공만으로 grasp 성공 아님\n8. moveit → coord: 집기 관측 결과 [result]\n   상태: VERIFYING → COMPLETED / RECOVERING. 그리퍼 상태 또는 재관측이 필요\n\n## 센서 단절·작업 취소\n\n시작: 필수 센서 TTL 초과 또는 사용자 취소\n\n전제: 실행 중 task_id와 goal_id 추적 가능\n\n성공: cancel 결과와 실제 정지 확인, 원인 기록\n\n실패: cancel 거절 / 통신 단절 / 정지 확인 지연\n\n복구: 상위 stop 정책으로 escalation; 통신 복구만으로 재개하지 않음\n\n1. camera → coord: 필수 관측 stale [fault]\n   상태: EXECUTING → STOPPING. 감지 threshold는 센서 주기 측정으로 결정\n2. coord → nav2: CancelGoal [cancel]\n   상태: STOPPING. 취소 요청 수락과 취소 완료를 구분\n3. gate → basecontroller: 속도 차단 [command]\n   상태: STOPPING. 응답 없는 상위 노드와 무관하게 watchdog\n4. nav2 → coord: CANCELED / ABORTED [result]\n   상태: STOPPING. 결과를 기다리는 상한 시간 정의\n5. state → coord: 실제 정지 관측 [feedback]\n   상태: STOPPING → STOPPED. zero 명령만으로 정지 판정하지 않음\n6. coord → operator: 원인·재시작 조건 [result]\n   상태: STOPPED. 확인 후 새 goal로 시작\n\n## 비상 정지·재가동\n\n시작: 물리 e-stop 또는 정의된 중대 고장\n\n전제: 장치별 정지 방식과 검증 책임자 지정\n\n성공: 정지시간·거리·래치 동작이 승인된 한계 내\n\n실패: 소프트웨어 정지만 성공 / 팔 처짐 / 차단 지연\n\n복구: 원인 제거 → 물리 해제 → self-test → 수동 재인가 → 새 goal\n\n1. operator → safety: 물리 e-stop [fault]\n   상태: ANY → ESTOP_LATCHED. ROS 네트워크와 독립된 경로\n2. safety → robot: 구동 차단 / 장치 정지 [command]\n   상태: ESTOP_LATCHED. 팔은 중력·브레이크 특성 포함\n3. coord → nav2: 진행 goal 취소 [cancel]\n   상태: ESTOP_LATCHED. 소프트웨어 정리는 보조 경로\n4. robot → safety: 정지·fault 상태 [feedback]\n   상태: ESTOP_LATCHED. 실측 정지시간과 거리 기록\n5. operator → safety: 원인 확인·수동 재인가 [request]\n   상태: ESTOP_LATCHED → SELF_TEST. 물리 해제만으로 움직이지 않음\n6. safety → coord: self-test 성공 [result]\n   상태: SELF_TEST → READY. 기존 goal 자동 재실행 금지\n\n## RL 관측·대체 경로\n\n시작: 기본 제어 기준 시험 완료 후 실험 활성화\n\n전제: nominal 경로·출력 경계·fallback·동일 bag 기준 확보\n\n성공: nominal 대비 지표 개선, 제한 위반 0건\n\n실패: 추론 지연 / NaN / 범위 초과 / 모델 버전 불일치\n\n복구: RL 후보 폐기 → nominal 사용, 기본 경로 불건전 시 정지\n\n1. state → rl: 관측 입력 [data]\n   상태: SHADOW. 출력은 기록만 하고 로봇 지령에 영향 없음\n2. rl → gate: 제한된 후보 [data]\n   상태: BOUNDED. 검증 후에만 correction 경로 허용\n3. gate → basecontroller: nominal 또는 승인 후보 [command]\n   상태: BOUNDED. 명령 소유자는 한 곳\n4. rl → gate: NaN / deadline 초과 [fault]\n   상태: BOUNDED → FALLBACK. 모델을 더 기다리지 않음\n5. gate → basecontroller: nominal 복귀 [command]\n   상태: FALLBACK. nominal이 stale이면 정지\n6. coord → operator: 실험 결과 보고 [result]\n   상태: FALLBACK → REVIEW. 모델 hash·latency·위반 기록\n"},{"id":"03","file":"docs/03-system-architecture.md","title":"참조 아키텍처","framework":"C4 관점 · arc42 3·5·7","intro":"공식 스택을 재사용하되, 표준 패키지와 프로젝트가 새로 구현할 adapter를 구분합니다. 이 구조는 구현된 시스템의 자동 추출 결과가 아니라 검토용 참조안입니다.","sections":[["Context: 시스템 경계","운영자 → 작업 API → 로봇 제어 시스템 → 센서와 구동장치. Mac·로봇 연산 호스트·물리 장치를 분리합니다. C4의 container는 실행 단위라는 뜻이며 Docker container와 반드시 같지 않습니다."],["Component: 이동 경로","coordinator → NavigateToPose → bt_navigator → ComputePathToPose / FollowPath → planner_server / controller_server. scan·pointcloud → costmap, odom·TF → Nav2. controller 출력 → 명령 중재·제한 → base driver 또는 diff_drive_controller → hardware plugin → 바퀴. costmap과 TF는 부가 장식이 아니라 입력 계약입니다."],["Component: 팔 경로","custom PickPlace adapter → MoveIt 계획 / 실행 → joint_trajectory_controller의 FollowJointTrajectory → ros2_control command interfaces → hardware plugin → 관절. controller_manager가 임의 /joint_cmd_final topic을 직접 받는 식으로 그리지 않습니다. action은 goal, feedback, result, cancel을 유지합니다."],["상태와 좌표","map → odom: localization 또는 SLAM. odom → base_link: odometry 추정기. base_link → sensor / arm frames: URDF·robot_state_publisher·정적 보정. TF 한 변의 publisher는 하나로 정합니다. EKF는 encoder·IMU 등 실제 센서가 있을 때 선택하고 covariance·상관성·시간동기화 시험이 필요합니다."],["RL 경계","RL은 처음부터 하위 action을 가로채는 필수 제어기로 두지 않습니다. 먼저 shadow 모드에서 후보를 기록합니다. bounded 모드에서는 arm 후보를 궤적 실행 전에 재검증하거나 지원되는 controller extension으로 구현합니다. base 후보는 한 command gate에서 소유권·수명·제한을 검증합니다."],["Deployment","Mac: 편집·빌드·가상 시험·관측 UI. 로봇 호스트: driver·controller·watchdog. 연산 호스트: perception / VLM 후보. 같은 물리 PC에 여러 역할을 둘 수도 있습니다. 네트워크 단절이 구동 정지 능력을 없애지 않도록 로봇 측 timeout을 둡니다. Docker Desktop host networking 활성화만으로 LAN DDS 연결이 증명되지 않습니다."],["확장: 여러 로봇","복수 로봇을 채택하면 /robot_1, /robot_2 namespace, 각 TF frame prefix, goal 소유자, localization, controller manager instance, 충돌·임무 중재를 결정합니다. 공용 /cmd_vel과 중복 TF를 사용하지 않습니다. 이 선택은 현재 미정입니다."]],"markdown":"# 참조 아키텍처\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: C4 관점 · arc42 3·5·7\n\n공식 스택을 재사용하되, 표준 패키지와 프로젝트가 새로 구현할 adapter를 구분합니다. 이 구조는 구현된 시스템의 자동 추출 결과가 아니라 검토용 참조안입니다.\n\n## Context: 시스템 경계\n\n운영자 → 작업 API → 로봇 제어 시스템 → 센서와 구동장치. Mac·로봇 연산 호스트·물리 장치를 분리합니다. C4의 container는 실행 단위라는 뜻이며 Docker container와 반드시 같지 않습니다.\n\n## Component: 이동 경로\n\ncoordinator → NavigateToPose → bt_navigator → ComputePathToPose / FollowPath → planner_server / controller_server. scan·pointcloud → costmap, odom·TF → Nav2. controller 출력 → 명령 중재·제한 → base driver 또는 diff_drive_controller → hardware plugin → 바퀴. costmap과 TF는 부가 장식이 아니라 입력 계약입니다.\n\n## Component: 팔 경로\n\ncustom PickPlace adapter → MoveIt 계획 / 실행 → joint_trajectory_controller의 FollowJointTrajectory → ros2_control command interfaces → hardware plugin → 관절. controller_manager가 임의 /joint_cmd_final topic을 직접 받는 식으로 그리지 않습니다. action은 goal, feedback, result, cancel을 유지합니다.\n\n## 상태와 좌표\n\nmap → odom: localization 또는 SLAM. odom → base_link: odometry 추정기. base_link → sensor / arm frames: URDF·robot_state_publisher·정적 보정. TF 한 변의 publisher는 하나로 정합니다. EKF는 encoder·IMU 등 실제 센서가 있을 때 선택하고 covariance·상관성·시간동기화 시험이 필요합니다.\n\n## RL 경계\n\nRL은 처음부터 하위 action을 가로채는 필수 제어기로 두지 않습니다. 먼저 shadow 모드에서 후보를 기록합니다. bounded 모드에서는 arm 후보를 궤적 실행 전에 재검증하거나 지원되는 controller extension으로 구현합니다. base 후보는 한 command gate에서 소유권·수명·제한을 검증합니다.\n\n## Deployment\n\nMac: 편집·빌드·가상 시험·관측 UI. 로봇 호스트: driver·controller·watchdog. 연산 호스트: perception / VLM 후보. 같은 물리 PC에 여러 역할을 둘 수도 있습니다. 네트워크 단절이 구동 정지 능력을 없애지 않도록 로봇 측 timeout을 둡니다. Docker Desktop host networking 활성화만으로 LAN DDS 연결이 증명되지 않습니다.\n\n## 확장: 여러 로봇\n\n복수 로봇을 채택하면 /robot_1, /robot_2 namespace, 각 TF frame prefix, goal 소유자, localization, controller manager instance, 충돌·임무 중재를 결정합니다. 공용 /cmd_vel과 중복 TF를 사용하지 않습니다. 이 선택은 현재 미정입니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"04","file":"docs/04-interface-control.md","title":"인터페이스 계약서","framework":"ICD · ROS 2 표준 타입","intro":"인터페이스 계약은 두 개발자가 따로 구현해도 연결되게 하는 약속입니다. 이름만 맞고 단위·좌표·시간이 다르면 연결은 되어도 동작은 틀립니다.","sections":[["계약 템플릿","ID / producer / consumer / topic·action·service·hardware / 정확한 타입 / 단위 / frame / timestamp clock / QoS / rate·TTL / validation / reject 이유 / timeout·fallback / version / 시험 ID / owner를 기록합니다."],["표준과 custom","NavigateToPose는 nav2_msgs/action/NavigateToPose, 궤적은 control_msgs/action/FollowJointTrajectory, joint state는 sensor_msgs/msg/JointState입니다. custom_msgs는 예시 namespace이며 아직 패키지가 없습니다. PickPlace는 프로젝트 업무 adapter이지 move_group의 단순 표준 action 이름이 아닙니다."],["속도 타입 결정","Twist와 TwistStamped를 모든 버전에 동일하다고 가정하지 않습니다. 배포한 Nav2·driver 설정과 ros2 topic type으로 실제 타입을 확인하고 adapter 필요 여부를 기록합니다. producer와 consumer가 다르면 launch remap만으로 해결되지 않습니다."],["행동 계약","action goal 수락은 완료가 아닙니다. Feedback은 진행 관측, Result는 SUCCEEDED/ABORTED/CANCELED 같은 종료 판정에 사용합니다. cancel 요청 응답과 CANCELED Result를 별도 처리합니다. 물리 정지는 feedback로 추가 확인합니다."],["ROS에서 확인","ros2 topic list -t\nros2 topic info /scan --verbose\nros2 topic type /cmd_vel\nros2 action list -t\nros2 interface show control_msgs/action/FollowJointTrajectory\n\n위 명령은 ROS 환경을 source한 컨테이너 안에서 실행합니다. 노드가 아직 없으면 빈 목록은 기능 완료를 의미하지 않습니다."]],"markdown":"# 인터페이스 계약서\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: ICD · ROS 2 표준 타입\n\n인터페이스 계약은 두 개발자가 따로 구현해도 연결되게 하는 약속입니다. 이름만 맞고 단위·좌표·시간이 다르면 연결은 되어도 동작은 틀립니다.\n\n## 계약 템플릿\n\nID / producer / consumer / topic·action·service·hardware / 정확한 타입 / 단위 / frame / timestamp clock / QoS / rate·TTL / validation / reject 이유 / timeout·fallback / version / 시험 ID / owner를 기록합니다.\n\n## 표준과 custom\n\nNavigateToPose는 nav2_msgs/action/NavigateToPose, 궤적은 control_msgs/action/FollowJointTrajectory, joint state는 sensor_msgs/msg/JointState입니다. custom_msgs는 예시 namespace이며 아직 패키지가 없습니다. PickPlace는 프로젝트 업무 adapter이지 move_group의 단순 표준 action 이름이 아닙니다.\n\n## 속도 타입 결정\n\nTwist와 TwistStamped를 모든 버전에 동일하다고 가정하지 않습니다. 배포한 Nav2·driver 설정과 ros2 topic type으로 실제 타입을 확인하고 adapter 필요 여부를 기록합니다. producer와 consumer가 다르면 launch remap만으로 해결되지 않습니다.\n\n## 행동 계약\n\naction goal 수락은 완료가 아닙니다. Feedback은 진행 관측, Result는 SUCCEEDED/ABORTED/CANCELED 같은 종료 판정에 사용합니다. cancel 요청 응답과 CANCELED Result를 별도 처리합니다. 물리 정지는 feedback로 추가 확인합니다.\n\n## ROS에서 확인\n\nros2 topic list -t\nros2 topic info /scan --verbose\nros2 topic type /cmd_vel\nros2 action list -t\nros2 interface show control_msgs/action/FollowJointTrajectory\n\n위 명령은 ROS 환경을 source한 컨테이너 안에서 실행합니다. 노드가 아직 없으면 빈 목록은 기능 완료를 의미하지 않습니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"05","file":"docs/05-hardware-and-software-integration.md","title":"장치 통합과 보정","framework":"Integration plan · calibration record","intro":"모터를 움직이기 전에 장치가 어떤 상태를 보고하는지 먼저 확인합니다. 통신 성공, 값의 정확성, 움직임 안전성은 서로 다른 시험입니다.","sections":[["장치별 기록","제조사·모델·serial / firmware / protocol / Linux device path·udev 규칙 / 전원 / controller mapping / joint 이름·단위·부호 / calibration 파일 hash / 정지 특성 / 연결 사진 / 담당자."],["카메라","Image와 CameraInfo의 frame·timestamp·해상도·intrinsics를 확인합니다. gripper camera는 이동하는 frame이므로 로봇 관절 상태와 TF 시간 정합이 필요합니다. 두 영상의 시각·좌표·노출 차이를 고려하지 않은 fusion은 승인하지 않습니다."],["팔과 이동 베이스","관절 순서·라디안/도·position/velocity/effort interface를 확정합니다. 팔의 stop/hold는 브레이크·중력·전원 차단 특성에 맞게 결정합니다. 베이스는 wheel radius·separation·encoder 부호·odom covariance를 검증합니다."],["통합 순서","1. 제품 문서와 배선·전원·정지 경로 확인.\n2. 구동 disabled 상태에서 연결·state read.\n3. 단위·부호·시간·fault injection 확인.\n4. 시뮬레이션과 mock에서 명령 계약 시험.\n5. 승인된 작은 범위·낮은 속도로 제한된 구동.\n6. timeout·정지·수동 재개 시험.\n7. 결과와 설정 버전을 baseline으로 저장."],["가상과 실제의 차이","simulation clock / 실제 clock, acceleration·latency, friction, joint limit, device error는 다릅니다. sim에서 성공했다는 사실은 실제 장치 시험을 대신하지 않습니다. 동일한 업무 API를 유지하고 hardware plugin 또는 driver profile만 전환합니다."]],"markdown":"# 장치 통합과 보정\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: Integration plan · calibration record\n\n모터를 움직이기 전에 장치가 어떤 상태를 보고하는지 먼저 확인합니다. 통신 성공, 값의 정확성, 움직임 안전성은 서로 다른 시험입니다.\n\n## 장치별 기록\n\n제조사·모델·serial / firmware / protocol / Linux device path·udev 규칙 / 전원 / controller mapping / joint 이름·단위·부호 / calibration 파일 hash / 정지 특성 / 연결 사진 / 담당자.\n\n## 카메라\n\nImage와 CameraInfo의 frame·timestamp·해상도·intrinsics를 확인합니다. gripper camera는 이동하는 frame이므로 로봇 관절 상태와 TF 시간 정합이 필요합니다. 두 영상의 시각·좌표·노출 차이를 고려하지 않은 fusion은 승인하지 않습니다.\n\n## 팔과 이동 베이스\n\n관절 순서·라디안/도·position/velocity/effort interface를 확정합니다. 팔의 stop/hold는 브레이크·중력·전원 차단 특성에 맞게 결정합니다. 베이스는 wheel radius·separation·encoder 부호·odom covariance를 검증합니다.\n\n## 통합 순서\n\n1. 제품 문서와 배선·전원·정지 경로 확인.\n2. 구동 disabled 상태에서 연결·state read.\n3. 단위·부호·시간·fault injection 확인.\n4. 시뮬레이션과 mock에서 명령 계약 시험.\n5. 승인된 작은 범위·낮은 속도로 제한된 구동.\n6. timeout·정지·수동 재개 시험.\n7. 결과와 설정 버전을 baseline으로 저장.\n\n## 가상과 실제의 차이\n\nsimulation clock / 실제 clock, acceleration·latency, friction, joint limit, device error는 다릅니다. sim에서 성공했다는 사실은 실제 장치 시험을 대신하지 않습니다. 동일한 업무 API를 유지하고 hardware plugin 또는 driver profile만 전환합니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"06","file":"docs/06-behavior-and-state.md","title":"상태와 전이 규칙","framework":"State machine · action lifecycle","intro":"상태는 UI의 색상이 아니라 무엇을 허용할지 정하는 규칙입니다. 모든 사건에 대해 다음 상태와 명령 처리 책임자를 정합니다.","sections":[["정상 전이","BOOT → SELF_TEST → READY → VALIDATING → PLANNING → EXECUTING → VERIFYING → COMPLETED → READY. 각 단계 실패는 RECOVERING 또는 STOPPING으로 전이합니다. 모든 상태에서 중대 사건은 ESTOP_LATCHED로 전이할 수 있습니다."],["전이 표","| 현재 | 사건 | 조건 | 다음 | 수행 |\n|---|---|---|---|---|\n| SELF_TEST | checks pass | 필수 입력 정상 | READY | motion disabled 유지 |\n| READY | new goal | 안전 허가 | VALIDATING | task_id 생성 |\n| EXECUTING | cancel / stale | 활성 goal 존재 | STOPPING | cancel + watchdog |\n| STOPPING | result + motion stopped | 둘 다 확인 | STOPPED | 원인 기록 |\n| RECOVERING | retry | 상한 이내·입력 복구 | VALIDATING | 새 goal_id |\n| ANY | e-stop | 항상 | ESTOP_LATCHED | 물리·장치 stop |\n| ESTOP_LATCHED | re-enable | 원인 제거·수동 확인 | SELF_TEST | 기존 goal 폐기 |"],["불변 조건","활성 motion command owner는 경로당 하나입니다. STOPPED 상태에서는 새로운 실행을 직접 허용하지 않습니다. action result가 성공이어도 grasp 확인 실패는 업무 실패입니다. 센서 복구가 자동 재시작 사건이 되지 않도록 합니다."],["이벤트 기록","event_id, task_id, goal_id, robot_id, previous_state, next_state, cause, monotonic time / ROS stamp, config hash를 남깁니다. 분산 호스트의 wall time과 sim time을 섞어 지연을 계산하지 않습니다."]],"markdown":"# 상태와 전이 규칙\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: State machine · action lifecycle\n\n상태는 UI의 색상이 아니라 무엇을 허용할지 정하는 규칙입니다. 모든 사건에 대해 다음 상태와 명령 처리 책임자를 정합니다.\n\n## 정상 전이\n\nBOOT → SELF_TEST → READY → VALIDATING → PLANNING → EXECUTING → VERIFYING → COMPLETED → READY. 각 단계 실패는 RECOVERING 또는 STOPPING으로 전이합니다. 모든 상태에서 중대 사건은 ESTOP_LATCHED로 전이할 수 있습니다.\n\n## 전이 표\n\n| 현재 | 사건 | 조건 | 다음 | 수행 |\n|---|---|---|---|---|\n| SELF_TEST | checks pass | 필수 입력 정상 | READY | motion disabled 유지 |\n| READY | new goal | 안전 허가 | VALIDATING | task_id 생성 |\n| EXECUTING | cancel / stale | 활성 goal 존재 | STOPPING | cancel + watchdog |\n| STOPPING | result + motion stopped | 둘 다 확인 | STOPPED | 원인 기록 |\n| RECOVERING | retry | 상한 이내·입력 복구 | VALIDATING | 새 goal_id |\n| ANY | e-stop | 항상 | ESTOP_LATCHED | 물리·장치 stop |\n| ESTOP_LATCHED | re-enable | 원인 제거·수동 확인 | SELF_TEST | 기존 goal 폐기 |\n\n## 불변 조건\n\n활성 motion command owner는 경로당 하나입니다. STOPPED 상태에서는 새로운 실행을 직접 허용하지 않습니다. action result가 성공이어도 grasp 확인 실패는 업무 실패입니다. 센서 복구가 자동 재시작 사건이 되지 않도록 합니다.\n\n## 이벤트 기록\n\nevent_id, task_id, goal_id, robot_id, previous_state, next_state, cause, monotonic time / ROS stamp, config hash를 남깁니다. 분산 호스트의 wall time과 sim time을 섞어 지연을 계산하지 않습니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"07","file":"docs/07-safety-and-faults.md","title":"위험 분석과 정지 설계","framework":"FMEA 형식 · fault response","intro":"위험 분석은 «어떤 고장이 어떤 피해로 이어지고 무엇으로 감지·제한하는가»를 검토합니다. 현재 표는 설계 검토용이며 장치 안전 승인을 뜻하지 않습니다.","sections":[["위험 표","| ID | 실패·원인 | 영향 | 감지 | 대응 | 시험 |\n|---|---|---|---|---|---|\n| HAZ-01 | base cmd stale | 이전 속도 지속 | 로봇 측 watchdog | 명령 차단·실제 정지 확인 | TST-02 |\n| HAZ-02 | arm 전원 차단 | 중력 낙하 | brake / state 확인 | 제품 stop 정책 설계 | TST-04 |\n| HAZ-03 | 잘못된 frame | 틀린 위치로 이동 | TF·workspace 검증 | goal reject | TST-01 |\n| HAZ-04 | RL NaN·과대 출력 | 급격한 지령 | finite·bounds·deadline | nominal / stop | TST-05 |\n| HAZ-05 | 중복 command owner | 지령 경합 | gate ownership | 한 소유자 허가 | TST-02 |"],["소프트웨어와 물리 경로","zero velocity topic은 구동 차단 보증이 아닙니다. physical e-stop 회로, device stop, controller watchdog, task cancel을 구분해 기록합니다. 각 경로의 검출시간·전달시간·실제 정지시간·거리를 시험합니다."],["복구 조건","원인 제거 → 센서·장치 정상 → 물리 stop 해제 → SELF_TEST → 운영자 재인가 → 새 task. e-stop 해제와 task 재시작을 동일 버튼이나 자동 사건으로 묶지 않습니다."],["수치 결정","최대속도·가속도·jerk·joint bounds·watchdog·정지거리·회복 조건은 제품 매뉴얼과 실측으로 결정합니다. 현재 미정값은 위험 owner가 지정되고 시험 계획이 생기기 전까지 승인하지 않습니다."]],"markdown":"# 위험 분석과 정지 설계\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: FMEA 형식 · fault response\n\n위험 분석은 «어떤 고장이 어떤 피해로 이어지고 무엇으로 감지·제한하는가»를 검토합니다. 현재 표는 설계 검토용이며 장치 안전 승인을 뜻하지 않습니다.\n\n## 위험 표\n\n| ID | 실패·원인 | 영향 | 감지 | 대응 | 시험 |\n|---|---|---|---|---|---|\n| HAZ-01 | base cmd stale | 이전 속도 지속 | 로봇 측 watchdog | 명령 차단·실제 정지 확인 | TST-02 |\n| HAZ-02 | arm 전원 차단 | 중력 낙하 | brake / state 확인 | 제품 stop 정책 설계 | TST-04 |\n| HAZ-03 | 잘못된 frame | 틀린 위치로 이동 | TF·workspace 검증 | goal reject | TST-01 |\n| HAZ-04 | RL NaN·과대 출력 | 급격한 지령 | finite·bounds·deadline | nominal / stop | TST-05 |\n| HAZ-05 | 중복 command owner | 지령 경합 | gate ownership | 한 소유자 허가 | TST-02 |\n\n## 소프트웨어와 물리 경로\n\nzero velocity topic은 구동 차단 보증이 아닙니다. physical e-stop 회로, device stop, controller watchdog, task cancel을 구분해 기록합니다. 각 경로의 검출시간·전달시간·실제 정지시간·거리를 시험합니다.\n\n## 복구 조건\n\n원인 제거 → 센서·장치 정상 → 물리 stop 해제 → SELF_TEST → 운영자 재인가 → 새 task. e-stop 해제와 task 재시작을 동일 버튼이나 자동 사건으로 묶지 않습니다.\n\n## 수치 결정\n\n최대속도·가속도·jerk·joint bounds·watchdog·정지거리·회복 조건은 제품 매뉴얼과 실측으로 결정합니다. 현재 미정값은 위험 owner가 지정되고 시험 계획이 생기기 전까지 승인하지 않습니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"08","file":"docs/08-verification-and-testing.md","title":"시험 계획과 추적성","framework":"V&V · requirements traceability","intro":"Verification은 명세대로 만들었는지를, Validation은 실제 작업에 쓸 수 있는지를 확인합니다. 실행된 프로세스 수로 완료를 판정하지 않습니다.","sections":[["시험 계층","unit: goal validation·bounds·state transitions. integration: ROS 타입·QoS·cancel·TF. simulation: 업무 한 경로 end-to-end. HIL: 실제 controller·device 경계. physical: 제한된 작업과 정지. regression: 버전 변경 뒤 같은 자료로 재시험."],["추적성","REQ-01 → IF-04 → TST-01 → evidence/TST-01/\nREQ-02 → IF-02 → TST-02 → evidence/TST-02/\nREQ-03 → IF-06 → TST-03 → evidence/TST-03/\nREQ-04 → IF-12 → TST-04 → evidence/TST-04/\nREQ-05 → IF-11 → TST-05 → evidence/TST-05/\nREQ-06 → IF-09 → TST-06 → evidence/TST-06/"],["TST-02 예시 절차","전제: simulation base, motion allowed, config hash 기록.\n1. 알려진 목표를 전송하고 steady motion을 확인.\n2. 필수 scan publisher를 중단.\n3. stale event, cancel result, 마지막 command, 실제 velocity를 기록.\n4. 승인된 detection·stop threshold와 비교.\n5. 센서 복구 후 goal 없이 이동하지 않음을 확인.\nthreshold가 TBD이면 결과는 Pass가 아니라 Blocked입니다."],["시험 기록 템플릿","test_id / requirement IDs / image digest / Git commit / firmware / params hash / model hash / hardware serial / 날짜·담당자 / 조건 / 입력 / 실행 명령 / 예상 / 실제 / bag·log·capture / Pass·Fail·Blocked / 결함 ID."],["릴리스 gate","Must 요구사항 시험 완료, 중대 결함 미해결 0건, 물리 stop·복구 시험 증거, 재현 환경 식별, 이전 버전 복원 절차. HTML Done 선택만으로 gate를 통과시키지 않습니다."]],"markdown":"# 시험 계획과 추적성\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: V&V · requirements traceability\n\nVerification은 명세대로 만들었는지를, Validation은 실제 작업에 쓸 수 있는지를 확인합니다. 실행된 프로세스 수로 완료를 판정하지 않습니다.\n\n## 시험 계층\n\nunit: goal validation·bounds·state transitions. integration: ROS 타입·QoS·cancel·TF. simulation: 업무 한 경로 end-to-end. HIL: 실제 controller·device 경계. physical: 제한된 작업과 정지. regression: 버전 변경 뒤 같은 자료로 재시험.\n\n## 추적성\n\nREQ-01 → IF-04 → TST-01 → evidence/TST-01/\nREQ-02 → IF-02 → TST-02 → evidence/TST-02/\nREQ-03 → IF-06 → TST-03 → evidence/TST-03/\nREQ-04 → IF-12 → TST-04 → evidence/TST-04/\nREQ-05 → IF-11 → TST-05 → evidence/TST-05/\nREQ-06 → IF-09 → TST-06 → evidence/TST-06/\n\n## TST-02 예시 절차\n\n전제: simulation base, motion allowed, config hash 기록.\n1. 알려진 목표를 전송하고 steady motion을 확인.\n2. 필수 scan publisher를 중단.\n3. stale event, cancel result, 마지막 command, 실제 velocity를 기록.\n4. 승인된 detection·stop threshold와 비교.\n5. 센서 복구 후 goal 없이 이동하지 않음을 확인.\nthreshold가 TBD이면 결과는 Pass가 아니라 Blocked입니다.\n\n## 시험 기록 템플릿\n\ntest_id / requirement IDs / image digest / Git commit / firmware / params hash / model hash / hardware serial / 날짜·담당자 / 조건 / 입력 / 실행 명령 / 예상 / 실제 / bag·log·capture / Pass·Fail·Blocked / 결함 ID.\n\n## 릴리스 gate\n\nMust 요구사항 시험 완료, 중대 결함 미해결 0건, 물리 stop·복구 시험 증거, 재현 환경 식별, 이전 버전 복원 절차. HTML Done 선택만으로 gate를 통과시키지 않습니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"09","file":"docs/09-deployment-operations-troubleshooting.md","title":"시작·중지·운영 runbook","framework":"Runbook · deployment view","intro":"runbook은 담당자가 바뀌어도 같은 결과를 낼 수 있게 하는 실행 절차입니다. 모든 명령의 실행 위치와 성공 조건을 적습니다.","sections":[["Mac 환경 시작","Mac terminal:\ncd /Users/june/ros2-lyrical-docker\ndocker desktop start\ndocker context show\ndocker info\ndocker compose up -d\ndocker compose exec ros2 bash\n\nContainer terminal:\nsource /opt/ros/lyrical/setup.bash\nprintenv ROS_DISTRO\nros2 --help\n\n성공: daemon 응답 + 컨테이너 실행 + CLI 실행. 이것은 로봇 기능 검증과 별도입니다."],["분산 통신","Docker Desktop host networking은 opt-in이며 Linux host NIC 직접 접근과 다릅니다. ROS_DOMAIN_ID 일치만으로 통신을 보증하지 않습니다. 양방향 talker/listener, type, QoS, discovery, firewall, clock, advertised address를 시험합니다. 실패 시 explicit peers 또는 router/bridge를 별도 ADR로 선택합니다. ROBOT_HOST 환경변수 설정만으로 DDS가 연결되는 구현은 현재 없습니다."],["운영 시작","robot profile 구성·device 확인 → state-only driver → TF·clock·joint/odom 정상 → controller lifecycle 확인 → watchdog·stop 준비 → 승인된 범위로 enable → 새 goal. 실제 IP·driver·robot launch는 아직 미정입니다."],["중지와 장애","active goal cancel → 결과와 실제 정지 확인 → controller 정지 정책 → driver 종료 → 제품 절차에 따른 전원 처리. 통신 단절 시 Mac의 명령 전송 성공 여부와 무관하게 로봇 측 watchdog가 동작해야 합니다."],["로그와 복구","task_id 기준으로 사건을 연결합니다. fault 시 재시작 전에 state·topic·params·image 버전을 확보합니다. ros2 topic list -t, ros2 action list -t, ros2 lifecycle nodes, docker compose logs --tail=100 ros2를 사용합니다. Gazebo·Nav2·MoveIt은 기존 이미지에서 설치·실행이 확인되지 않았으므로 패키지 존재와 profile launch부터 검증합니다."]],"markdown":"# 시작·중지·운영 runbook\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: Runbook · deployment view\n\nrunbook은 담당자가 바뀌어도 같은 결과를 낼 수 있게 하는 실행 절차입니다. 모든 명령의 실행 위치와 성공 조건을 적습니다.\n\n## Mac 환경 시작\n\nMac terminal:\ncd /Users/june/ros2-lyrical-docker\ndocker desktop start\ndocker context show\ndocker info\ndocker compose up -d\ndocker compose exec ros2 bash\n\nContainer terminal:\nsource /opt/ros/lyrical/setup.bash\nprintenv ROS_DISTRO\nros2 --help\n\n성공: daemon 응답 + 컨테이너 실행 + CLI 실행. 이것은 로봇 기능 검증과 별도입니다.\n\n## 분산 통신\n\nDocker Desktop host networking은 opt-in이며 Linux host NIC 직접 접근과 다릅니다. ROS_DOMAIN_ID 일치만으로 통신을 보증하지 않습니다. 양방향 talker/listener, type, QoS, discovery, firewall, clock, advertised address를 시험합니다. 실패 시 explicit peers 또는 router/bridge를 별도 ADR로 선택합니다. ROBOT_HOST 환경변수 설정만으로 DDS가 연결되는 구현은 현재 없습니다.\n\n## 운영 시작\n\nrobot profile 구성·device 확인 → state-only driver → TF·clock·joint/odom 정상 → controller lifecycle 확인 → watchdog·stop 준비 → 승인된 범위로 enable → 새 goal. 실제 IP·driver·robot launch는 아직 미정입니다.\n\n## 중지와 장애\n\nactive goal cancel → 결과와 실제 정지 확인 → controller 정지 정책 → driver 종료 → 제품 절차에 따른 전원 처리. 통신 단절 시 Mac의 명령 전송 성공 여부와 무관하게 로봇 측 watchdog가 동작해야 합니다.\n\n## 로그와 복구\n\ntask_id 기준으로 사건을 연결합니다. fault 시 재시작 전에 state·topic·params·image 버전을 확보합니다. ros2 topic list -t, ros2 action list -t, ros2 lifecycle nodes, docker compose logs --tail=100 ros2를 사용합니다. Gazebo·Nav2·MoveIt은 기존 이미지에서 설치·실행이 확인되지 않았으므로 패키지 존재와 profile launch부터 검증합니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"10","file":"docs/10-change-management.md","title":"설계 결정과 변경 관리","framework":"ADR · configuration baseline","intro":"결정은 코드보다 오래 남습니다. 무엇을 선택했는지뿐 아니라 어떤 대안을 왜 버렸는지 적어 다음 사람이 같은 논의를 반복하지 않게 합니다.","sections":[["ADR 템플릿","ID / 제목 / 상태(Proposed·Accepted·Superseded) / 상황과 제약 / 결정 driver / 대안 2개 이상 / 선택 / 결과·비용 / 검증 계획 / 되돌리기 / 관련 요구사항·task·source / 날짜·결정자."],["ADR-001 · 기본 제어 먼저","상태: Proposed. 선택: 구조화된 목표와 일반 Nav2/MoveIt 경로를 먼저 증명하고 VLM·RL을 후속 실험으로 추가. 대안: 최초부터 RL 필수 경로. 이유: 실패 원인 분리와 nominal 비교 기준 확보. 비용: 연구 기능의 가시성이 늦어짐. 검증: RL 없이 동일 업무·취소·정지 통과."],["ADR-002 · 로봇 실행 경계","상태: Proposed. 선택: device driver·watchdog를 로봇 가까운 실행 호스트에 배치하고 Mac은 개발·조작 역할. 대안: 네트워크 로봇 컨트롤러가 제공하는 vendor API로 직접 연결. 장치 계약에 따라 재결정. Mac/Ubuntu 고정 역할은 모든 로봇에 강제하지 않습니다."],["변경 영향","controller params·interface·TF·calibration·모델·firmware 변경은 관련 REQ / IF / TST를 따라 회귀시험 대상을 찾습니다. 기록: before/after hash, 이유, 시험 결과, rollback 대상. 공유 Git·릴리스 체계는 아직 미설정입니다."],["미결정 장부","OPEN-01 로봇 수와 namespace, OPEN-02 target driver·속도 타입, OPEN-03 physical stop, OPEN-04 timing thresholds, OPEN-05 sim package versions. 각 항목에 owner·due gate·결정 근거를 붙입니다."]],"markdown":"# 설계 결정과 변경 관리\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: ADR · configuration baseline\n\n결정은 코드보다 오래 남습니다. 무엇을 선택했는지뿐 아니라 어떤 대안을 왜 버렸는지 적어 다음 사람이 같은 논의를 반복하지 않게 합니다.\n\n## ADR 템플릿\n\nID / 제목 / 상태(Proposed·Accepted·Superseded) / 상황과 제약 / 결정 driver / 대안 2개 이상 / 선택 / 결과·비용 / 검증 계획 / 되돌리기 / 관련 요구사항·task·source / 날짜·결정자.\n\n## ADR-001 · 기본 제어 먼저\n\n상태: Proposed. 선택: 구조화된 목표와 일반 Nav2/MoveIt 경로를 먼저 증명하고 VLM·RL을 후속 실험으로 추가. 대안: 최초부터 RL 필수 경로. 이유: 실패 원인 분리와 nominal 비교 기준 확보. 비용: 연구 기능의 가시성이 늦어짐. 검증: RL 없이 동일 업무·취소·정지 통과.\n\n## ADR-002 · 로봇 실행 경계\n\n상태: Proposed. 선택: device driver·watchdog를 로봇 가까운 실행 호스트에 배치하고 Mac은 개발·조작 역할. 대안: 네트워크 로봇 컨트롤러가 제공하는 vendor API로 직접 연결. 장치 계약에 따라 재결정. Mac/Ubuntu 고정 역할은 모든 로봇에 강제하지 않습니다.\n\n## 변경 영향\n\ncontroller params·interface·TF·calibration·모델·firmware 변경은 관련 REQ / IF / TST를 따라 회귀시험 대상을 찾습니다. 기록: before/after hash, 이유, 시험 결과, rollback 대상. 공유 Git·릴리스 체계는 아직 미설정입니다.\n\n## 미결정 장부\n\nOPEN-01 로봇 수와 namespace, OPEN-02 target driver·속도 타입, OPEN-03 physical stop, OPEN-04 timing thresholds, OPEN-05 sim package versions. 각 항목에 owner·due gate·결정 근거를 붙입니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"11","file":"docs/11-glossary-and-learning.md","title":"쉬운 설명과 용어","framework":"Plain Language · 학습 안내","intro":"입력·출력·책임을 연결해서 도구를 이해합니다.","sections":[["node / topic / service / action","node는 일을 수행하는 실행 단위입니다. topic은 계속 흘러오는 소식, service는 짧은 요청과 응답, action은 목표·진행·결과·취소를 가진 업무 계약입니다. 연결 성공과 업무 성공은 다릅니다."],["TF / frame / costmap","frame은 위치를 표현하는 기준입니다. TF는 기준 사이의 변환과 시간 정보를 연결합니다. costmap은 로봇이 지나가기 어려운 영역을 비용으로 표현한 지도입니다. planner는 경로를 만들고 controller는 실제 상태로 경로를 따라갑니다."],["칼만 필터 / EKF","움직임 모델의 예측과 센서 측정을 불확실성에 따라 결합합니다. EKF는 비선형 함수를 현재 추정점에서 선형화합니다. 로봇 위치 추정과 물체 추적은 상태와 모델이 다르므로 별도로 설계합니다. timestamp·covariance·상관된 측정·TF를 검증합니다. robot_localization은 후보이며 현재 설치된 것으로 가정하지 않습니다."],["ros2_control","controller_manager는 controller를 관리합니다. hardware plugin은 상태를 읽고 명령을 씁니다. joint_trajectory_controller는 FollowJointTrajectory action을 실행합니다. 임의 topic을 manager에 연결한다고 장치가 자동으로 움직이지 않습니다."],["shadow / bounded / fallback","shadow는 RL 후보를 기록만 합니다. bounded는 승인된 범위에서 후보를 적용합니다. fallback은 지연·오류 시 기본 제어로 복귀합니다. 기본 제어도 유효하지 않으면 정지 정책을 사용합니다."],["Done / Pass / Approved","Done은 작업 완료 기록, Pass는 시험 기준 충족, Approved는 문서 리뷰 승인입니다. 서로 다른 상태입니다. 보드는 기록을 돕지만 하드웨어 시험을 자동 승인하지 않습니다."],["처음 읽는 순서","00 범위 → 03 구조 → 02 시나리오 → 04 계약 → 12 작업 하나 선택 → 08 시험 기록."]],"markdown":"# 쉬운 설명과 용어\n\n상태: Draft\n\n입력·출력·책임을 연결해서 도구를 이해합니다.\n\n## node / topic / service / action\n\nnode는 일을 수행하는 실행 단위입니다. topic은 계속 흘러오는 소식, service는 짧은 요청과 응답, action은 목표·진행·결과·취소를 가진 업무 계약입니다. 연결 성공과 업무 성공은 다릅니다.\n\n## TF / frame / costmap\n\nframe은 위치를 표현하는 기준입니다. TF는 기준 사이의 변환과 시간 정보를 연결합니다. costmap은 로봇이 지나가기 어려운 영역을 비용으로 표현한 지도입니다. planner는 경로를 만들고 controller는 실제 상태로 경로를 따라갑니다.\n\n## 칼만 필터 / EKF\n\n움직임 모델의 예측과 센서 측정을 불확실성에 따라 결합합니다. EKF는 비선형 함수를 현재 추정점에서 선형화합니다. 로봇 위치 추정과 물체 추적은 상태와 모델이 다르므로 별도로 설계합니다. timestamp·covariance·상관된 측정·TF를 검증합니다. robot_localization은 후보이며 현재 설치된 것으로 가정하지 않습니다.\n\n## ros2_control\n\ncontroller_manager는 controller를 관리합니다. hardware plugin은 상태를 읽고 명령을 씁니다. joint_trajectory_controller는 FollowJointTrajectory action을 실행합니다. 임의 topic을 manager에 연결한다고 장치가 자동으로 움직이지 않습니다.\n\n## shadow / bounded / fallback\n\nshadow는 RL 후보를 기록만 합니다. bounded는 승인된 범위에서 후보를 적용합니다. fallback은 지연·오류 시 기본 제어로 복귀합니다. 기본 제어도 유효하지 않으면 정지 정책을 사용합니다.\n\n## Done / Pass / Approved\n\nDone은 작업 완료 기록, Pass는 시험 기준 충족, Approved는 문서 리뷰 승인입니다. 서로 다른 상태입니다. 보드는 기록을 돕지만 하드웨어 시험을 자동 승인하지 않습니다.\n\n## 처음 읽는 순서\n\n00 범위 → 03 구조 → 02 시나리오 → 04 계약 → 12 작업 하나 선택 → 08 시험 기록.\n"},{"id":"12","file":"docs/12-agile-0-to-1-roadmap.md","title":"0 → 1 실행 로드맵","framework":"수직 증분 · Kanban · Definition of Done","intro":"Milestone은 기능 gate이며 고정 기간 sprint가 아닙니다. 매주 사용 가능한 작은 결과를 시연합니다. WIP는 기본 1개로 제안합니다.","sections":[["M0 · 기준과 첫 재현","개발 환경을 재현하고 미결정 사항을 드러냅니다.\n\n### T0-01 · 범위와 결정 장부 작성\n\n왜: 환경과 제품 목표를 섞지 않기\n\n선행: 없음\n\n방법: 목표·로봇 수·driver·담당자를 00 문서에 기록\n\n확인 명령 / 산출물:\ndocs/00-baseline-and-scope.md\n\n합격: 미정값마다 결정 owner와 gate가 있음\n\n연결: REQ-06 · 문서 00 · 시나리오 ready\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T0-02 · 환경 smoke 재검증\n\n왜: 실행 가능한 명령과 현재 증거 확보\n\n선행: T0-01\n\n방법: Mac: docker info → docker compose up -d → Container: source /opt/ros/lyrical/setup.bash; ros2 --help\n\n확인 명령 / 산출물:\ndocker version; docker compose ps\n\n합격: daemon·CLI·GUI 결과와 날짜 저장\n\n연결: REQ-06 · 문서 09 · 시나리오 ready\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T1-01 · 첫 pub/sub 왕복\n\n왜: ROS 통신과 시험 도구 익히기\n\n선행: T0-02\n\n방법: demo talker/listener를 서로 다른 terminal에서 실행. publisher 종료·재시작 관측\n\n확인 명령 / 산출물:\nros2 run demo_nodes_cpp talker / listener\n\n합격: 수신 내용·타입·종료 뒤 timeout 관측\n\n연결: REQ-06 · 문서 08 · 시나리오 ready\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked."],["M1 · 가짜 장치로 업무 한 경로","먼저 목표·결과·취소를 끝까지 연결합니다.\n\n### T2-01 · 단일 패키지와 launch\n\n왜: 언어 둘을 동시에 만들 필요 없이 한 경로 시작\n\n선행: T1-01\n\n방법: Python 또는 C++ 하나 선택. fake task action server와 client 구현\n\n확인 명령 / 산출물:\ncolcon build --symlink-install; colcon test\n\n합격: 성공·거절·취소 3경로 실행 증거\n\n연결: REQ-01 · 문서 03 · 시나리오 navigate\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T2-02 · goal validator와 상태기계\n\n왜: 잘못된 목표를 실행 전에 거절\n\n선행: T2-01\n\n방법: task_id·frame·workspace 검증. 상태 전이를 로그에 기록\n\n확인 명령 / 산출물:\nunit tests + event log\n\n합격: invalid frame·중복 goal·cancel-after-complete 시험\n\n연결: REQ-01 · 문서 06 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T2-03 · 증거 기록과 replay\n\n왜: 실패를 다시 볼 수 있게 만들기\n\n선행: T2-02\n\n방법: task_id로 log와 bag 연결. config hash 기록\n\n확인 명령 / 산출물:\nros2 bag record /task_status (custom 구현 후)\n\n합격: 다른 terminal에서 같은 입력 재실행 가능\n\n연결: REQ-06 · 문서 08 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked."],["M2 · 가상 로봇 기준 동작","TF·센서·일반 제어를 먼저 증명합니다.\n\n### T3-01 · URDF·TF·sim clock\n\n왜: 좌표와 시간이 틀리면 계획도 틀림\n\n선행: T2-03\n\n방법: 선정 simulator/robot 버전 고정. map→odom→base_link 소유자 기록\n\n확인 명령 / 산출물:\nros2 run tf2_ros tf2_echo odom base_link\n\n합격: TF lookup·joint names·clock 단일 기준\n\n연결: REQ-02 · 문서 05 · 시나리오 navigate\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T3-02 · 기본 이동과 watchdog\n\n왜: 명령 중단 뒤 실제 속도도 중단\n\n선행: T3-01\n\n방법: mock/sim controller 입력 타입 확인. 제한속도·TTL 제안 측정\n\n확인 명령 / 산출물:\nros2 topic type /cmd_vel; ros2 topic info /cmd_vel --verbose\n\n합격: publisher 중단 후 stop latency 기록; bound 승인 필요\n\n연결: REQ-02 · 문서 07 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T6-01 · Nav2 한 목표\n\n왜: 이동 업무의 첫 완성 경로\n\n선행: T3-02\n\n방법: Nav2 패키지·lifecycle·map·odom·costmap 확인 후 한 goal 전송\n\n확인 명령 / 산출물:\nros2 action list -t; ros2 lifecycle nodes\n\n합격: 목표 수락·feedback·result·실제 정지 기록\n\n연결: REQ-01 · 문서 03 · 시나리오 navigate\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T6-02 · Nav2 실패·취소\n\n왜: 성공만 되는 demo에서 벗어나기\n\n선행: T6-01\n\n방법: 막힌 목표·stale scan·cancel·통신 단절 주입\n\n확인 명령 / 산출물:\nsimulation fault injection\n\n합격: TST-01/02, retry bound·재개 정책 통과\n\n연결: REQ-02 · 문서 08 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T7-01 · MoveIt mock 궤적\n\n왜: 팔 업무의 표준 실행 경계 확정\n\n선행: T3-01\n\n방법: robot description와 JTC 연결. joint order·tolerance 확인\n\n확인 명령 / 산출물:\nros2 interface show control_msgs/action/FollowJointTrajectory\n\n합격: FollowJointTrajectory feedback/result/cancel 관측\n\n연결: REQ-03 · 문서 04 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T7-02 · 가상 pick와 실패\n\n왜: 움직임 성공과 집기 성공 구분\n\n선행: T7-01, T2-02\n\n방법: PickPlace adapter 구현, 빈 grasp·물체 손실 주입\n\n확인 명령 / 산출물:\nTST-03 scenario replay\n\n합격: 집기 확인 없는 trajectory 성공을 업무 성공으로 보고하지 않음\n\n연결: REQ-03 · 문서 02 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked."],["M3 · 관측과 작업 계획","실제 객체 정보를 업무와 연결합니다.\n\n### T4-01 · 카메라·보정·추적 TTL\n\n왜: 영상의 frame·시간·신뢰도 확보\n\n선행: T3-01\n\n방법: Image/CameraInfo 확인, 보정 hash 기록, tracking loss 구현\n\n확인 명령 / 산출물:\nros2 topic info /camera/image_raw --verbose\n\n합격: stale·target lost가 coordinator에 전달\n\n연결: REQ-02 · 문서 05 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T5-01 · 구조화 계획 → coordinator\n\n왜: 고수준 판단과 실행 책임 분리\n\n선행: T4-01, T6-02, T7-02\n\n방법: 허용 동작 목록 schema 정의. coordinator 단일 owner 유지\n\n확인 명령 / 산출물:\nIF-03/04/05 integration tests\n\n합격: 한 작업에서 이동→집기→확인 또는 제한된 실패 처리\n\n연결: REQ-01 · 문서 04 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T5-02 · VLM 선택 실험\n\n왜: 자연어가 유효한 목표를 만드는지 검증\n\n선행: T5-01\n\n방법: 모델 출력 schema·confidence·권한 검증. 불명확 명령은 확인 요청\n\n확인 명령 / 산출물:\n모델 버전과 prompt hash 기록\n\n합격: 잘못된 출력·timeout이 motor 명령으로 직행하지 않음\n\n연결: REQ-01 · 문서 10 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked."],["M4 · 로봇 호스트와 물리 통합","가상 합격 이후 장치별 조건을 검증합니다.\n\n### T9-01 · 네트워크 양방향 시험\n\n왜: Desktop 옵션만으로 LAN 통신 성공 가정 금지\n\n선행: T6-02, T7-02\n\n방법: 양방향 demo topic·action·QoS·clock 확인. 실패 시 routing ADR 작성\n\n확인 명령 / 산출물:\nros2 topic info --verbose + 양쪽 log\n\n합격: 다른 호스트에서 discovery·data·cancel 모두 확인\n\n연결: REQ-02 · 문서 09 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T9-02 · state-only 장치 연결\n\n왜: 움직이기 전에 단위·부호·fault 읽기\n\n선행: T9-01\n\n방법: 제품 driver / hardware plugin 확인. 구동 disabled로 state read\n\n확인 명령 / 산출물:\n제품별 driver 명령 TBD\n\n합격: joint 순서·단위·odom·fault 문서와 일치\n\n연결: REQ-03 · 문서 05 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T9-03 · 정지 경로 실측\n\n왜: 물리 정지와 소프트웨어 stop을 각각 검증\n\n선행: T9-02\n\n방법: 장치별 승인된 절차로 watchdog·e-stop·재인가 확인\n\n확인 명령 / 산출물:\n장치별 시험 절차 승인 후 실행\n\n합격: TST-04 증거, 정지시간·거리·arm hold 조건 승인\n\n연결: REQ-04 · 문서 07 · 시나리오 estop\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T10-01 · 제한된 물리 업무\n\n왜: 작은 작업 한 번을 재현 가능하게 수행\n\n선행: T9-03, T5-01\n\n방법: 승인 속도·범위에서 단일 goal 실행. bag·log·버전 저장\n\n확인 명령 / 산출물:\nrelease evidence bundle\n\n합격: 업무 결과·취소·정지·rollback 모두 확인\n\n연결: REQ-06 · 문서 08 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked."],["M5 · RL 비교 실험","기본 기능 이후 개선 효과를 측정합니다.\n\n### T8-01 · RL 관측 모드\n\n왜: 기본 제어를 바꾸기 전 후보 품질 측정\n\n선행: T10-01\n\n방법: 입력·출력·model hash·latency·baseline 정의. shadow 기록\n\n확인 명령 / 산출물:\nbag replay + model metrics\n\n합격: 동일 자료로 nominal과 비교 가능\n\n연결: REQ-05 · 문서 10 · 시나리오 rl\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T8-02 · bounded + fallback\n\n왜: 제안값을 적용할 경계를 검증\n\n선행: T8-01\n\n방법: NaN·overrange·timeout 주입. gate에서 후보 폐기\n\n확인 명령 / 산출물:\nfault injection + output trace\n\n합격: TST-05, nominal stale 시 정지 포함\n\n연결: REQ-05 · 문서 07 · 시나리오 rl\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T8-03 · 개선 판정과 릴리스\n\n왜: 좋아 보인다는 판단을 측정으로 바꾸기\n\n선행: T8-02\n\n방법: 성공률·시간·latency·limit violations를 동일 시험 세트로 비교\n\n확인 명령 / 산출물:\nbenchmark report + ADR update\n\n합격: 개선 기준 승인·악화 시 revert·증거 보관\n\n연결: REQ-05 · 문서 08 · 시나리오 rl\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked."]],"markdown":"# 0 → 1 실행 로드맵\n\nMilestone은 기능 gate이며 고정 기간 sprint가 아닙니다. 매주 사용 가능한 작은 결과를 시연합니다. WIP는 기본 1개로 제안합니다.\n\n진행: Backlog → Ready → In progress → Review → Done. 실패/의존성은 Blocked. Done에는 시험 결과와 증거를 기록합니다. UI 기록은 실제 시험 합격을 자동 증명하지 않습니다.\n\n## M0 · 기준과 첫 재현\n\n개발 환경을 재현하고 미결정 사항을 드러냅니다.\n\n### T0-01 · 범위와 결정 장부 작성\n\n왜: 환경과 제품 목표를 섞지 않기\n\n선행: 없음\n\n방법: 목표·로봇 수·driver·담당자를 00 문서에 기록\n\n확인 명령 / 산출물:\ndocs/00-baseline-and-scope.md\n\n합격: 미정값마다 결정 owner와 gate가 있음\n\n연결: REQ-06 · 문서 00 · 시나리오 ready\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T0-02 · 환경 smoke 재검증\n\n왜: 실행 가능한 명령과 현재 증거 확보\n\n선행: T0-01\n\n방법: Mac: docker info → docker compose up -d → Container: source /opt/ros/lyrical/setup.bash; ros2 --help\n\n확인 명령 / 산출물:\ndocker version; docker compose ps\n\n합격: daemon·CLI·GUI 결과와 날짜 저장\n\n연결: REQ-06 · 문서 09 · 시나리오 ready\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T1-01 · 첫 pub/sub 왕복\n\n왜: ROS 통신과 시험 도구 익히기\n\n선행: T0-02\n\n방법: demo talker/listener를 서로 다른 terminal에서 실행. publisher 종료·재시작 관측\n\n확인 명령 / 산출물:\nros2 run demo_nodes_cpp talker / listener\n\n합격: 수신 내용·타입·종료 뒤 timeout 관측\n\n연결: REQ-06 · 문서 08 · 시나리오 ready\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n## M1 · 가짜 장치로 업무 한 경로\n\n먼저 목표·결과·취소를 끝까지 연결합니다.\n\n### T2-01 · 단일 패키지와 launch\n\n왜: 언어 둘을 동시에 만들 필요 없이 한 경로 시작\n\n선행: T1-01\n\n방법: Python 또는 C++ 하나 선택. fake task action server와 client 구현\n\n확인 명령 / 산출물:\ncolcon build --symlink-install; colcon test\n\n합격: 성공·거절·취소 3경로 실행 증거\n\n연결: REQ-01 · 문서 03 · 시나리오 navigate\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T2-02 · goal validator와 상태기계\n\n왜: 잘못된 목표를 실행 전에 거절\n\n선행: T2-01\n\n방법: task_id·frame·workspace 검증. 상태 전이를 로그에 기록\n\n확인 명령 / 산출물:\nunit tests + event log\n\n합격: invalid frame·중복 goal·cancel-after-complete 시험\n\n연결: REQ-01 · 문서 06 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T2-03 · 증거 기록과 replay\n\n왜: 실패를 다시 볼 수 있게 만들기\n\n선행: T2-02\n\n방법: task_id로 log와 bag 연결. config hash 기록\n\n확인 명령 / 산출물:\nros2 bag record /task_status (custom 구현 후)\n\n합격: 다른 terminal에서 같은 입력 재실행 가능\n\n연결: REQ-06 · 문서 08 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n## M2 · 가상 로봇 기준 동작\n\nTF·센서·일반 제어를 먼저 증명합니다.\n\n### T3-01 · URDF·TF·sim clock\n\n왜: 좌표와 시간이 틀리면 계획도 틀림\n\n선행: T2-03\n\n방법: 선정 simulator/robot 버전 고정. map→odom→base_link 소유자 기록\n\n확인 명령 / 산출물:\nros2 run tf2_ros tf2_echo odom base_link\n\n합격: TF lookup·joint names·clock 단일 기준\n\n연결: REQ-02 · 문서 05 · 시나리오 navigate\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T3-02 · 기본 이동과 watchdog\n\n왜: 명령 중단 뒤 실제 속도도 중단\n\n선행: T3-01\n\n방법: mock/sim controller 입력 타입 확인. 제한속도·TTL 제안 측정\n\n확인 명령 / 산출물:\nros2 topic type /cmd_vel; ros2 topic info /cmd_vel --verbose\n\n합격: publisher 중단 후 stop latency 기록; bound 승인 필요\n\n연결: REQ-02 · 문서 07 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T6-01 · Nav2 한 목표\n\n왜: 이동 업무의 첫 완성 경로\n\n선행: T3-02\n\n방법: Nav2 패키지·lifecycle·map·odom·costmap 확인 후 한 goal 전송\n\n확인 명령 / 산출물:\nros2 action list -t; ros2 lifecycle nodes\n\n합격: 목표 수락·feedback·result·실제 정지 기록\n\n연결: REQ-01 · 문서 03 · 시나리오 navigate\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T6-02 · Nav2 실패·취소\n\n왜: 성공만 되는 demo에서 벗어나기\n\n선행: T6-01\n\n방법: 막힌 목표·stale scan·cancel·통신 단절 주입\n\n확인 명령 / 산출물:\nsimulation fault injection\n\n합격: TST-01/02, retry bound·재개 정책 통과\n\n연결: REQ-02 · 문서 08 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T7-01 · MoveIt mock 궤적\n\n왜: 팔 업무의 표준 실행 경계 확정\n\n선행: T3-01\n\n방법: robot description와 JTC 연결. joint order·tolerance 확인\n\n확인 명령 / 산출물:\nros2 interface show control_msgs/action/FollowJointTrajectory\n\n합격: FollowJointTrajectory feedback/result/cancel 관측\n\n연결: REQ-03 · 문서 04 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T7-02 · 가상 pick와 실패\n\n왜: 움직임 성공과 집기 성공 구분\n\n선행: T7-01, T2-02\n\n방법: PickPlace adapter 구현, 빈 grasp·물체 손실 주입\n\n확인 명령 / 산출물:\nTST-03 scenario replay\n\n합격: 집기 확인 없는 trajectory 성공을 업무 성공으로 보고하지 않음\n\n연결: REQ-03 · 문서 02 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n## M3 · 관측과 작업 계획\n\n실제 객체 정보를 업무와 연결합니다.\n\n### T4-01 · 카메라·보정·추적 TTL\n\n왜: 영상의 frame·시간·신뢰도 확보\n\n선행: T3-01\n\n방법: Image/CameraInfo 확인, 보정 hash 기록, tracking loss 구현\n\n확인 명령 / 산출물:\nros2 topic info /camera/image_raw --verbose\n\n합격: stale·target lost가 coordinator에 전달\n\n연결: REQ-02 · 문서 05 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T5-01 · 구조화 계획 → coordinator\n\n왜: 고수준 판단과 실행 책임 분리\n\n선행: T4-01, T6-02, T7-02\n\n방법: 허용 동작 목록 schema 정의. coordinator 단일 owner 유지\n\n확인 명령 / 산출물:\nIF-03/04/05 integration tests\n\n합격: 한 작업에서 이동→집기→확인 또는 제한된 실패 처리\n\n연결: REQ-01 · 문서 04 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T5-02 · VLM 선택 실험\n\n왜: 자연어가 유효한 목표를 만드는지 검증\n\n선행: T5-01\n\n방법: 모델 출력 schema·confidence·권한 검증. 불명확 명령은 확인 요청\n\n확인 명령 / 산출물:\n모델 버전과 prompt hash 기록\n\n합격: 잘못된 출력·timeout이 motor 명령으로 직행하지 않음\n\n연결: REQ-01 · 문서 10 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n## M4 · 로봇 호스트와 물리 통합\n\n가상 합격 이후 장치별 조건을 검증합니다.\n\n### T9-01 · 네트워크 양방향 시험\n\n왜: Desktop 옵션만으로 LAN 통신 성공 가정 금지\n\n선행: T6-02, T7-02\n\n방법: 양방향 demo topic·action·QoS·clock 확인. 실패 시 routing ADR 작성\n\n확인 명령 / 산출물:\nros2 topic info --verbose + 양쪽 log\n\n합격: 다른 호스트에서 discovery·data·cancel 모두 확인\n\n연결: REQ-02 · 문서 09 · 시나리오 fault\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T9-02 · state-only 장치 연결\n\n왜: 움직이기 전에 단위·부호·fault 읽기\n\n선행: T9-01\n\n방법: 제품 driver / hardware plugin 확인. 구동 disabled로 state read\n\n확인 명령 / 산출물:\n제품별 driver 명령 TBD\n\n합격: joint 순서·단위·odom·fault 문서와 일치\n\n연결: REQ-03 · 문서 05 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T9-03 · 정지 경로 실측\n\n왜: 물리 정지와 소프트웨어 stop을 각각 검증\n\n선행: T9-02\n\n방법: 장치별 승인된 절차로 watchdog·e-stop·재인가 확인\n\n확인 명령 / 산출물:\n장치별 시험 절차 승인 후 실행\n\n합격: TST-04 증거, 정지시간·거리·arm hold 조건 승인\n\n연결: REQ-04 · 문서 07 · 시나리오 estop\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T10-01 · 제한된 물리 업무\n\n왜: 작은 작업 한 번을 재현 가능하게 수행\n\n선행: T9-03, T5-01\n\n방법: 승인 속도·범위에서 단일 goal 실행. bag·log·버전 저장\n\n확인 명령 / 산출물:\nrelease evidence bundle\n\n합격: 업무 결과·취소·정지·rollback 모두 확인\n\n연결: REQ-06 · 문서 08 · 시나리오 pick\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n## M5 · RL 비교 실험\n\n기본 기능 이후 개선 효과를 측정합니다.\n\n### T8-01 · RL 관측 모드\n\n왜: 기본 제어를 바꾸기 전 후보 품질 측정\n\n선행: T10-01\n\n방법: 입력·출력·model hash·latency·baseline 정의. shadow 기록\n\n확인 명령 / 산출물:\nbag replay + model metrics\n\n합격: 동일 자료로 nominal과 비교 가능\n\n연결: REQ-05 · 문서 10 · 시나리오 rl\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T8-02 · bounded + fallback\n\n왜: 제안값을 적용할 경계를 검증\n\n선행: T8-01\n\n방법: NaN·overrange·timeout 주입. gate에서 후보 폐기\n\n확인 명령 / 산출물:\nfault injection + output trace\n\n합격: TST-05, nominal stale 시 정지 포함\n\n연결: REQ-05 · 문서 07 · 시나리오 rl\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n\n### T8-03 · 개선 판정과 릴리스\n\n왜: 좋아 보인다는 판단을 측정으로 바꾸기\n\n선행: T8-02\n\n방법: 성공률·시간·latency·limit violations를 동일 시험 세트로 비교\n\n확인 명령 / 산출물:\nbenchmark report + ADR update\n\n합격: 개선 기준 승인·악화 시 revert·증거 보관\n\n연결: REQ-05 · 문서 08 · 시나리오 rl\n\n증거: actual result, log/bag path, 버전 hash, 담당자·날짜. 미정 threshold가 있으면 Blocked.\n"},{"id":"13","file":"docs/13-interface-register.md","title":"인터페이스 등록부","framework":"ICD instance","intro":"이 표의 타입과 조건은 공식 표준 또는 제안으로 구분됩니다. custom 인터페이스는 코드에 존재한다고 가정하지 않습니다.","sections":[["IF-01 · 영상 입력","camera → perception\n\n방식: topic\n\n타입: sensor_msgs/msg/Image + CameraInfo\n\n좌표: camera optical frame\n\nQoS: 센서 QoS 제안, 실제 호환성 확인\n\n시간 조건: 영상 지연 상한 미정\n\n실패 응답: stale 데이터 배제\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-02 · 위치 / 좌표계","state → nav2\n\n방식: topic\n\n타입: nav_msgs/msg/Odometry + tf2_msgs/msg/TFMessage\n\n좌표: map / odom / base_link\n\nQoS: TF는 정적·동적 정책 구분\n\n시간 조건: 주기·TF age 미정\n\n실패 응답: 좌표 변환 불가 시 목표 실행 거절\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-03 · 추적 객체","perception → coord\n\n방식: topic\n\n타입: custom_msgs/msg/TrackedObjects (미구현 제안)\n\n좌표: header.frame_id 필수\n\nQoS: 신뢰성·depth 미정\n\n시간 조건: confidence / TTL 미정\n\n실패 응답: 목표 재관측\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-04 · 이동 목표","coord → nav2\n\n방식: action\n\n타입: nav2_msgs/action/NavigateToPose\n\n좌표: map\n\nQoS: action 기본값 검토\n\n시간 조건: goal deadline 미정\n\n실패 응답: Cancel 후 Result 확인\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-05 · 집기 업무","coord → moveit\n\n방식: action\n\n타입: custom PickPlace adapter (미구현 제안)\n\n좌표: 목표 pose frame\n\nQoS: goal_id / task_id 연계\n\n시간 조건: 업무 deadline 미정\n\n실패 응답: 계획 실패 / 실행 실패 구별\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-06 · 관절 궤적","moveit → jtc\n\n방식: action\n\n타입: control_msgs/action/FollowJointTrajectory\n\n좌표: joint_names + time_from_start\n\nQoS: controller 설정 기준\n\n시간 조건: trajectory tolerance 미정\n\n실패 응답: 취소 결과·관절 정지 확인\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-07 · 기본 속도","nav2 → gate\n\n방식: topic\n\n타입: Twist / TwistStamped: 실제 패키지·설정 확인\n\n좌표: base_link 기준\n\nQoS: 제어 큐 길이·신뢰성 검토\n\n시간 조건: command age 상한 미정\n\n실패 응답: timeout 시 base 명령 차단\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-08 · 최종 속도","gate → basecontroller\n\n방식: topic\n\n타입: driver 입력과 동일한 타입\n\n좌표: base_link\n\nQoS: IF-07과 end-to-end 확인\n\n시간 조건: watchdog 미정\n\n실패 응답: zero 요청 + 실제 속도 확인\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-09 · 장치 상태","robot → cm\n\n방식: device\n\n타입: ros2_control state interfaces / 제품 protocol\n\n좌표: joint / device\n\nQoS: ROS QoS 해당 없음\n\n시간 조건: 장치 주기 미정\n\n실패 응답: fault 전파\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-10 · 장애물 관측","camera → costmap\n\n방식: topic\n\n타입: sensor_msgs/msg/LaserScan 또는 PointCloud2\n\n좌표: sensor frame + TF\n\nQoS: SensorDataQoS 후보\n\n시간 조건: 센서 TTL 미정\n\n실패 응답: observation stale 처리 시험\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-11 · RL 후보","rl → gate\n\n방식: topic\n\n타입: custom correction (미구현 제안)\n\n좌표: nominal과 동일\n\nQoS: 기본 경로와 분리\n\n시간 조건: 추론 deadline 미정\n\n실패 응답: nominal fallback\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."],["IF-12 · 물리 정지","safety → robot\n\n방식: hardware\n\n타입: e-stop circuit · 장치별 결정\n\n좌표: 해당 없음\n\nQoS: DDS에 의존하지 않음\n\n시간 조건: 정지시간·거리 미정\n\n실패 응답: 래치 + 원인 제거 + 수동 재인가\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가."]],"markdown":"# 인터페이스 등록부\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: ICD instance\n\n이 표의 타입과 조건은 공식 표준 또는 제안으로 구분됩니다. custom 인터페이스는 코드에 존재한다고 가정하지 않습니다.\n\n## IF-01 · 영상 입력\n\ncamera → perception\n\n방식: topic\n\n타입: sensor_msgs/msg/Image + CameraInfo\n\n좌표: camera optical frame\n\nQoS: 센서 QoS 제안, 실제 호환성 확인\n\n시간 조건: 영상 지연 상한 미정\n\n실패 응답: stale 데이터 배제\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-02 · 위치 / 좌표계\n\nstate → nav2\n\n방식: topic\n\n타입: nav_msgs/msg/Odometry + tf2_msgs/msg/TFMessage\n\n좌표: map / odom / base_link\n\nQoS: TF는 정적·동적 정책 구분\n\n시간 조건: 주기·TF age 미정\n\n실패 응답: 좌표 변환 불가 시 목표 실행 거절\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-03 · 추적 객체\n\nperception → coord\n\n방식: topic\n\n타입: custom_msgs/msg/TrackedObjects (미구현 제안)\n\n좌표: header.frame_id 필수\n\nQoS: 신뢰성·depth 미정\n\n시간 조건: confidence / TTL 미정\n\n실패 응답: 목표 재관측\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-04 · 이동 목표\n\ncoord → nav2\n\n방식: action\n\n타입: nav2_msgs/action/NavigateToPose\n\n좌표: map\n\nQoS: action 기본값 검토\n\n시간 조건: goal deadline 미정\n\n실패 응답: Cancel 후 Result 확인\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-05 · 집기 업무\n\ncoord → moveit\n\n방식: action\n\n타입: custom PickPlace adapter (미구현 제안)\n\n좌표: 목표 pose frame\n\nQoS: goal_id / task_id 연계\n\n시간 조건: 업무 deadline 미정\n\n실패 응답: 계획 실패 / 실행 실패 구별\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-06 · 관절 궤적\n\nmoveit → jtc\n\n방식: action\n\n타입: control_msgs/action/FollowJointTrajectory\n\n좌표: joint_names + time_from_start\n\nQoS: controller 설정 기준\n\n시간 조건: trajectory tolerance 미정\n\n실패 응답: 취소 결과·관절 정지 확인\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-07 · 기본 속도\n\nnav2 → gate\n\n방식: topic\n\n타입: Twist / TwistStamped: 실제 패키지·설정 확인\n\n좌표: base_link 기준\n\nQoS: 제어 큐 길이·신뢰성 검토\n\n시간 조건: command age 상한 미정\n\n실패 응답: timeout 시 base 명령 차단\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-08 · 최종 속도\n\ngate → basecontroller\n\n방식: topic\n\n타입: driver 입력과 동일한 타입\n\n좌표: base_link\n\nQoS: IF-07과 end-to-end 확인\n\n시간 조건: watchdog 미정\n\n실패 응답: zero 요청 + 실제 속도 확인\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-09 · 장치 상태\n\nrobot → cm\n\n방식: device\n\n타입: ros2_control state interfaces / 제품 protocol\n\n좌표: joint / device\n\nQoS: ROS QoS 해당 없음\n\n시간 조건: 장치 주기 미정\n\n실패 응답: fault 전파\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-10 · 장애물 관측\n\ncamera → costmap\n\n방식: topic\n\n타입: sensor_msgs/msg/LaserScan 또는 PointCloud2\n\n좌표: sensor frame + TF\n\nQoS: SensorDataQoS 후보\n\n시간 조건: 센서 TTL 미정\n\n실패 응답: observation stale 처리 시험\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-11 · RL 후보\n\nrl → gate\n\n방식: topic\n\n타입: custom correction (미구현 제안)\n\n좌표: nominal과 동일\n\nQoS: 기본 경로와 분리\n\n시간 조건: 추론 deadline 미정\n\n실패 응답: nominal fallback\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## IF-12 · 물리 정지\n\nsafety → robot\n\n방식: hardware\n\n타입: e-stop circuit · 장치별 결정\n\n좌표: 해당 없음\n\nQoS: DDS에 의존하지 않음\n\n시간 조건: 정지시간·거리 미정\n\n실패 응답: 래치 + 원인 제거 + 수동 재인가\n\n상태: 검토 필요. owner·시험 ID·구현 package·버전 추가.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"14","file":"docs/14-safety-and-test-matrix.md","title":"위험·시험 매트릭스","framework":"FMEA 연결 · acceptance gate","intro":"위험 ID와 시험 ID를 연결해, 어떤 시험이 무엇을 보호하는지 설명합니다.","sections":[["검증 매트릭스","| 위험 | 요구사항 | 시험 | 필수 관측 | 합격 기준 |\n|---|---|---|---|---|\n| HAZ-01 stale command | REQ-02 | TST-02 | age·velocity·stop | 승인 TTL·stop bound |\n| HAZ-02 arm drop | REQ-04 | TST-04 | brake·joint position | 장치 승인 기준 |\n| HAZ-03 wrong frame | REQ-01 | TST-01 | reject reason | 실행되지 않음 |\n| HAZ-04 RL invalid | REQ-05 | TST-05 | candidate·gate decision | invalid 후보 적용 0건 |\n| HAZ-05 owner race | REQ-02 | TST-02 | owner·command sequence | 단일 owner 유지 |"],["시험 승인","실험 장소·제품 정지 절차·담당자·장치 준비가 완료된 뒤 물리 시험합니다. 문서 작성이나 UI 상태 변경은 장치 검증을 대신하지 않습니다. threshold 미정 또는 관측 누락은 Blocked로 표시합니다."]],"markdown":"# 위험·시험 매트릭스\n\n상태: Draft · 참조 설계 / 실제 구현 미확인\n\n문서 형식: FMEA 연결 · acceptance gate\n\n위험 ID와 시험 ID를 연결해, 어떤 시험이 무엇을 보호하는지 설명합니다.\n\n## 검증 매트릭스\n\n| 위험 | 요구사항 | 시험 | 필수 관측 | 합격 기준 |\n|---|---|---|---|---|\n| HAZ-01 stale command | REQ-02 | TST-02 | age·velocity·stop | 승인 TTL·stop bound |\n| HAZ-02 arm drop | REQ-04 | TST-04 | brake·joint position | 장치 승인 기준 |\n| HAZ-03 wrong frame | REQ-01 | TST-01 | reject reason | 실행되지 않음 |\n| HAZ-04 RL invalid | REQ-05 | TST-05 | candidate·gate decision | invalid 후보 적용 0건 |\n| HAZ-05 owner race | REQ-02 | TST-02 | owner·command sequence | 단일 owner 유지 |\n\n## 시험 승인\n\n실험 장소·제품 정지 절차·담당자·장치 준비가 완료된 뒤 물리 시험합니다. 문서 작성이나 UI 상태 변경은 장치 검증을 대신하지 않습니다. threshold 미정 또는 관측 누락은 Blocked로 표시합니다.\n\n## 검토 완료 조건\n\nowner와 미정값을 확인하고 관련 인터페이스·시험·변경 기록을 연결합니다. Approved 표시는 근거와 reviewer를 기록한 뒤 사용합니다.\n\n## 참고\n\n- [arc42](https://arc42.org/overview/): 요구사항·구조·실행·배포·결정·품질·위험을 빠짐없이 기록하는 문서 골격\n- [C4](https://c4model.com/diagrams): 사용자와 시스템의 경계에서 시작해 실행 단위와 내부 구성으로 확대\n- [ADR](https://adr.github.io/): 설계 선택의 이유와 대안을 남기는 기록\n- [ROS 2 Actions](https://design.ros2.org/articles/actions.html): Goal, Feedback, Result, Cancel 의미\n- [MoveIt controllers](https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html): MoveIt과 실행 컨트롤러 연결\n- [Joint trajectory controller](https://control.ros.org/master/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html): FollowJointTrajectory action과 컨트롤러 인터페이스\n- [Nav2 TF](https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/transformation/setup_transforms/): map → odom → base_link → sensor\n- [Nav2 costmap](https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/): 센서로 장애물 지도를 갱신하는 구성\n- [Docker host network](https://docs.docker.com/engine/network/drivers/host/): Desktop host networking은 Linux host와 같지 않으며 LAN DDS를 별도 검증해야 함\n"},{"id":"16","file":"docs/16-cartographer-class.md","title":"Cartographer 파라미터 수업 정리","framework":"2026-10-14 · KANT 수업 보충","intro":"교안의 본문과 파라미터 부록을 기존 SLAM 학습에 연결합니다.","sections":[["수업 정리","# Cartographer 파라미터 수업 정리\n\n2026-10-14 · KANT 교안 124쪽 기반 · 37강 SLAM / 39강 Mapping·Localization 보충\n\n교안의 본문은 Waffle 2D 미로 실습, 부록은 222개 설정 항목이다. 기준 소스는 Cartographer core `1489fc9`, ROS 통합 `7433452`다. 아래 값은 해당 교안의 기본값·실습값·비교 예시를 구분한 기록이다. 현재 Mac이나 로봇에서 실행·측정한 결과가 아니다. 실제 수업 발언이나 개인 실습 결과는 별도로 기록한다.\n\n## 1. SLAM, odometry, Cartographer의 관계\n\nSLAM은 센서로 지도를 만들면서 지도 안의 로봇 위치도 추정하는 문제다. Odometry는 바퀴 등으로 연속적인 상대 이동을 추정하지만 오차가 누적될 수 있다. Cartographer는 거리 관측과 운동 예측을 이용해 로컬 지도를 만들고, 과거 장소의 재관측을 전역 제약으로 연결하는 SLAM 구현이다.\n\nWaffle 실습은 LiDAR와 바퀴 odometry를 사용하고 IMU는 사용하지 않는다. odom은 스캔의 초기 운동 예측에 정보를 제공하며, LiDAR의 구조 정합은 그 예측을 보완한다. odom 입력을 쓴다는 것과 Cartographer가 odom TF를 직접 발행한다는 것은 별개의 설정이다. [교안 5–8, 15, 26쪽]\n\n입력 → 로컬 정합 → submap → 루프 제약 → pose graph → 지도 출력의 순서로 이해한다. Nav2는 그 지도와 위치를 활용하는 주행 계층이며, Cartographer의 파라미터가 Nav2의 경로 계획 설정을 대신하지 않는다.\n\n## 2. 설정이 적용되는 네 계층\n\n| 위치 | 담당하는 것 | 먼저 할 질문 |\n| --- | --- | --- |\n| ROS launch | Lua 경로, topic remap, use_sim_time | 실제 파일과 토픽을 읽고 있는가? |\n| options | 입력 센서 수, TF frame, 발행 간격 | 켠 입력이 실제로 도착하는가? |\n| TRAJECTORY_BUILDER | 로컬 정합, 필터, submap | 개별 submap 안에서 벽이 잘 맞는가? |\n| POSE_GRAPH | 재방문 제약, 전역 최적화 | 과거 장소와 올바르게 연결되는가? |\n\nLua는 include로 기본값을 불러온 다음 실습 파일의 대입으로 덮어쓴다. 부록의 기본값이 실제 적용값이라고 가정하지 않는다. 조건부 기능은 부모 기능이 활성화돼야 효과가 있다. [3–4, 34쪽]\n\n## 3. 오늘 실습의 TF 책임\n\n실습 경로: map → odom → base_footprint → 센서 frame\n\n- Gazebo: odom → base_footprint의 연속 이동을 발행한다.\n- Cartographer: map → odom의 전역 보정을 발행한다.\n- tracking_frame=base_footprint, published_frame=odom, provide_odom_frame=false다.\n- 센서 장착 TF와 축·관측 시각은 실제 모델에서 확인한다. 동일 TF 변에 publisher를 중복 배치하지 않는다.\n\n여기서 provide_odom_frame=false는 odometry를 사용하지 않는다는 뜻이 아니다. use_odometry=true와 함께 사용한다. 다른 로봇이나 외부 odom이 없는 구성에는 이 조합을 그대로 복사하지 않는다. [7–9쪽]\n\n## 4. 로컬 정합을 먼저 이해하기\n\n운동 예측으로 초기 자세를 만들고, 선택된 correlative 탐색으로 주변 후보를 비교한 뒤 Ceres가 점유 구조와 초기 자세
