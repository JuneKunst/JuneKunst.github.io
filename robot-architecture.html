","value":"40","meaning":"센서 강도 / 강도 정보를 사용할 상한 기준. 센서별 강도 스케일을 확인한다.","scope":"3D"},{"slide":119,"group":"node_flags","name":"collect_metrics","value":"false","meaning":"bool / 런타임 지표 수집을 켠다. 관련 ROS 서비스로 처리 상태를 관찰한다.","scope":"공통"},{"slide":119,"group":"node_flags","name":"configuration_directory","value":"\"\" (빈 문자열)","meaning":"경로 / 주 Lua를 먼저 찾을 디렉터리. include는 설치된 Cartographer 설정 경로도 검색한다.","scope":"공통"},{"slide":119,"group":"node_flags","name":"configuration_basename","value":"\"\" (빈 문자열)","meaning":"파일명 / 주 Lua 파일 이름. 디렉터리 경로를 붙이지 않고 basename을 지정한다.","scope":"공통"},{"slide":120,"group":"node_flags","name":"load_state_filename","value":"\"\" (빈 문자열)","meaning":"경로 / 시작할 때 읽을 pbstream 파일. PGM/YAML 지도 파일을 넣는 자리가 아니다.","scope":"공통"},{"slide":120,"group":"node_flags","name":"load_frozen_state","value":"true","meaning":"bool / 읽은 trajectory를 고정 상태로 유지한다. true이면 해당 기존 trajectory를 다시 최적화하지 않는다.","scope":"공통"},{"slide":120,"group":"node_flags","name":"start_trajectory_with_default_topics","value":"true","meaning":"bool / 시작 시 기본 토픽으로 첫 trajectory를 자동 시작한다. false이면 서비스로 시작한다.","scope":"공통"},{"slide":121,"group":"node_flags","name":"save_state_filename","value":"\"\" (빈 문자열)","meaning":"경로 / 정상 종료 때 SLAM 상태를 저장할 pbstream 파일 이름. 비정상 강제 종료를 보장하지 않는다.","scope":"공통"},{"slide":122,"group":"grid_flags","name":"resolution","value":"기본 0.05 실습 .05","meaning":"m/cell / 최종 /map을 합성할 셀 크기. submap 내부 해상도와 별개이며 작은 값으로 잃은 정보를 복원하지 못한다.","scope":"공통"},{"slide":122,"group":"grid_flags","name":"publish_period_sec","value":"기본 1.0 실습 1.0","meaning":"s / occupancy grid를 합성·발행하는 타이머 간격. submap 생성 주기와 다르다.","scope":"공통"},{"slide":122,"group":"grid_flags","name":"include_frozen_submaps","value":"true","meaning":"bool / 고정된 submap을 출력 점유 격자에 포함한다. unfrozen 항과 둘 다 false로 두지 않는다.","scope":"공통"},{"slide":123,"group":"grid_flags","name":"include_unfrozen_submaps","value":"true","meaning":"bool / 현재 변하는 submap을 출력 점유 격자에 포함한다. 출력 지도에 담을 대상 선택이다.","scope":"공통"},{"slide":123,"group":"grid_flags","name":"occupancy_grid_topic","value":"map","meaning":"토픽 / 선언된 grid 토픽 플래그. 이 ROS 2 포크의 실제 발행자는 map 상수를 사용하므로 remap으로 바꾼다.","scope":"공통"}],"summary":"# Cartographer 파라미터 수업 정리\n\n2026-10-14 · KANT 교안 124쪽 기반 · 37강 SLAM / 39강 Mapping·Localization 보충\n\n교안의 본문은 Waffle 2D 미로 실습, 부록은 222개 설정 항목이다. 기준 소스는 Cartographer core `1489fc9`, ROS 통합 `7433452`다. 아래 값은 해당 교안의 기본값·실습값·비교 예시를 구분한 기록이다. 현재 Mac이나 로봇에서 실행·측정한 결과가 아니다. 실제 수업 발언이나 개인 실습 결과는 별도로 기록한다.\n\n## 1. SLAM, odometry, Cartographer의 관계\n\nSLAM은 센서로 지도를 만들면서 지도 안의 로봇 위치도 추정하는 문제다. Odometry는 바퀴 등으로 연속적인 상대 이동을 추정하지만 오차가 누적될 수 있다. Cartographer는 거리 관측과 운동 예측을 이용해 로컬 지도를 만들고, 과거 장소의 재관측을 전역 제약으로 연결하는 SLAM 구현이다.\n\nWaffle 실습은 LiDAR와 바퀴 odometry를 사용하고 IMU는 사용하지 않는다. odom은 스캔의 초기 운동 예측에 정보를 제공하며, LiDAR의 구조 정합은 그 예측을 보완한다. odom 입력을 쓴다는 것과 Cartographer가 odom TF를 직접 발행한다는 것은 별개의 설정이다. [교안 5–8, 15, 26쪽]\n\n입력 → 로컬 정합 → submap → 루프 제약 → pose graph → 지도 출력의 순서로 이해한다. Nav2는 그 지도와 위치를 활용하는 주행 계층이며, Cartographer의 파라미터가 Nav2의 경로 계획 설정을 대신하지 않는다.\n\n## 2. 설정이 적용되는 네 계층\n\n| 위치 | 담당하는 것 | 먼저 할 질문 |\n| --- | --- | --- |\n| ROS launch | Lua 경로, topic remap, use_sim_time | 실제 파일과 토픽을 읽고 있는가? |\n| options | 입력 센서 수, TF frame, 발행 간격 | 켠 입력이 실제로 도착하는가? |\n| TRAJECTORY_BUILDER | 로컬 정합, 필터, submap | 개별 submap 안에서 벽이 잘 맞는가? |\n| POSE_GRAPH | 재방문 제약, 전역 최적화 | 과거 장소와 올바르게 연결되는가? |\n\nLua는 include로 기본값을 불러온 다음 실습 파일의 대입으로 덮어쓴다. 부록의 기본값이 실제 적용값이라고 가정하지 않는다. 조건부 기능은 부모 기능이 활성화돼야 효과가 있다. [3–4, 34쪽]\n\n## 3. 오늘 실습의 TF 책임\n\n실습 경로: map → odom → base_footprint → 센서 frame\n\n- Gazebo: odom → base_footprint의 연속 이동을 발행한다.\n- Cartographer: map → odom의 전역 보정을 발행한다.\n- tracking_frame=base_footprint, published_frame=odom, provide_odom_frame=false다.\n- 센서 장착 TF와 축·관측 시각은 실제 모델에서 확인한다. 동일 TF 변에 publisher를 중복 배치하지 않는다.\n\n여기서 provide_odom_frame=false는 odometry를 사용하지 않는다는 뜻이 아니다. use_odometry=true와 함께 사용한다. 다른 로봇이나 외부 odom이 없는 구성에는 이 조합을 그대로 복사하지 않는다. [7–9쪽]\n\n## 4. 로컬 정합을 먼저 이해하기\n\n운동 예측으로 초기 자세를 만들고, 선택된 correlative 탐색으로 주변 후보를 비교한 뒤 Ceres가 점유 구조와 초기 자세의 균형을 최적화한다. 전역 루프는 이미 완성된 submap 내부의 왜곡을 자동으로 다시 그려 주지 않는다. 먼저 로컬 품질을 확보한다. [15–17쪽]\n\n| 설정 | 교안 값의 구분 | 의미와 주의점 |\n| --- | --- | --- |\n| min_range / max_range | 실습 0.12 / 3.5 m | 가까운 자기 반사와 먼 잡음을 걸러내되 유효 구조도 줄 수 있다. |\n| missing_data_ray_length | 본문 3 m | 범위 밖 측정의 자유 공간 갱신 길이. 실제 장애물 hit와 구분한다. |\n| voxel_filter_size | 시작 예시 0.025 m → 비교 0.05 m | 점 수·CPU·작은 구조 보존을 함께 본다. 권장값으로 검증된 비교가 아니다. |\n| use_online_correlative_scan_matching | 2D 기본 false / 실습 true | Ceres 앞의 후보 탐색을 켠다. 계산 비용이 추가된다. |\n| linear_search_window | 2D 로컬 0.1 m | 초기 위치 주변 탐색 폭. 루프 탐색 범위와 다르다. |\n| angular_search_window | 2D 로컬 20° | Lua에서 rad 변환 여부를 확인한다. |\n| occupied_space_weight | 2D 기본 1 | 점과 지도 점유 구조의 정합을 강조한다. |\n| translation_weight / rotation_weight | 2D 기본 10 / 40 | 초기 병진·회전 자세를 유지하는 상대 가중치다. 센서 분산과 동일하지 않다. |\n\n스캔 분할은 한 스캔의 시간순 조각을 늘리는 것이고, 누적은 정합 전에 모으는 입력 수를 늘리는 것이다. 누적과 분할을 함께 바꾸면 중간 갱신율·관측 왜곡·점 수를 함께 확인한다. 로컬용 적응형 voxel과 loop closure용 voxel도 별도 경로다. [11–14쪽]\n\n## 5. Motion filter, submap, 해상도\n\nMotion filter는 마지막 채택 이후 시간·거리·각도 변화가 모두 기준 이하면 삽입을 생략한다. 하나라도 기준을 초과하면 새 삽입을 허용할 수 있다. SLAM 전체 계산이나 ROS 자세 발행을 끄는 필터가 아니다. 실습 각도 0.1°는 약 0.001745 rad이며 0.1 rad와 다르다. [18–19쪽]\n\n예: 시간·거리 조건도 모두 기준 이하인 회전에서 변화량이 0.3°라면, 각도 기준 0.1°에서는 각도 조건이 삽입을 허용하고 0.5°에서는 생략 조건에 들어간다. 시간이나 거리가 이미 기준을 초과하면 각도만 높여도 생략되지 않는다. 이 설명은 판정 규칙의 예이며 실제 CPU 감소율을 계산한 결과가 아니다.\n\nnum_range_data의 2D 기본값 N=90은 채택된 삽입 수다. 새 submap은 N회 간격으로 만들고 약 2N회 후 완성한다. N을 초나 미터로 읽지 않는다. [20쪽]\n\n내부 submap 해상도와 출력 /map 해상도는 각각 다른 설정이다. 교안은 둘 다 0.05 m를 사용한다. 출력만 0.025 m로 바꿔도 내부 0.05 m에서 잃은 구조를 복원하지 못한다. 출력 셀 면적은 0.05²=0.0025 m²에서 0.025²=0.000625 m²로 줄지만, 이는 지도 정확도가 4배 좋아진다는 뜻이 아니다. [21쪽]\n\nhit_probability=0.55는 관측 끝점의 점유 증거, miss_probability=0.49는 ray가 지난 자유 공간의 증거다. 0.5가 중립 기준이다. insert_free_space=false는 자유 공간 갱신을 제한한다. [22쪽]\n\n## 6. 루프 폐합과 전역 최적화\n\n과거 submap과 현재 node의 재방문 후보를 비교하고, 정합 점수 기준을 통과하면 제약을 추가한다. Pose graph는 여러 제약의 모순을 줄인다. 반복된 복도처럼 비슷한 구조에서는 잘못된 재방문 연결을 확인한다. [23–26쪽]\n\n- min_score=0.65: 실습의 일반 정합 채택 하한이다. 65% 정답 확률이 아니다.\n- global_localization_min_score=0.70: 실습의 다른 전역 탐색 경로 하한이다.\n- loop_closure_*_weight: 채택한 제약의 영향이다. 채택 여부의 문턱과 구분한다.\n- optimize_every_n_nodes=90: 기본 주기다. 작게 하면 호출이 잦아질 수 있으며 0은 주기적 최적화를 중지한다. 후보 탐색과 종료 시 최종 최적화까지 모두 중지하는 스위치로 해석하지 않는다.\n\n점수 기준을 높이면 후보 채택에 더 엄격해질 수 있지만 올바른 루프도 놓칠 수 있다. 센서 중첩·TF·시간·실제 재방문 증거를 먼저 확인하고 점수 하나로 모든 문제를 해결하려 하지 않는다.\n\n## 7. 발행 주기는 실제 처리율이 아니다\n\n| 항목 | 실습 간격 | 간격의 역수 |\n| --- | --- | --- |\n| pose_publish_period_sec | 0.005 s | 타이머 설정상 200 Hz |\n| trajectory_publish_period_sec | 0.03 s | 약 33.3 Hz |\n| submap_publish_period_sec | 0.3 s | 약 3.33 Hz |\n| grid publish_period_sec | 1.0 s | 약 1 Hz |\n\n이는 센서 입력률이나 SLAM 정합 처리율의 측정값이 아니다. 센서·CPU·타이머 상태가 실제 발행률을 좌우한다. CPU 지연은 입력률과 backlog를 먼저 기록하고 local과 global 경로를 나눠 진단한다. 스레드만 늘려도 CPU 경쟁으로 지연이 커질 수 있다. [10, 27쪽]\n\n## 8. 실습 확인과 설정 반영 순서\n\n실행 위치와 설치본을 먼저 선택한다. HTML의 “환경·명령어”에서 Linux/WSL, Docker, SSH, Windows PowerShell 안내를 구분하고 배포판·경로·토픽·frame을 지정한다. 아래는 Bash 변수형 예제이며 관련 패키지·토픽·TF의 실제 실행이 필요하다. 특정 OS·배포판에서의 실행 성공을 의미하지 않는다.\n\n```bash\nros2 topic list -t\nros2 topic hz \"$SCAN_TOPIC\"\nros2 topic hz \"$ODOM_TOPIC\"\n# 시뮬레이션을 사용할 때만 실제 clock 토픽 확인\nros2 topic echo \"$CLOCK_TOPIC\" --once\nros2 run tf2_ros tf2_echo \"$ODOM_FRAME\" \"$BASE_FRAME\"\n```\n\n위 변수에는 실제 토픽·frame 이름을 먼저 지정한다. use_sim_time을 켠 환경에서는 clock도 확인한다. hz와 tf2_echo는 관찰 명령으로 계속 실행될 수 있으므로 관측 후 Ctrl+C로 종료한다. 입력이 없거나 TF가 끊기면 파라미터 비교를 시작하지 않는다. [9쪽]\n\n설치본에 맞춘 설정 반영 예. 변수값은 실제 환경에서 먼저 지정하고 패키지·launch 파일과 지원 인자를 확인한다:\n\n```bash\n# 먼저 ROS_DISTRO, ROS_WORKSPACE, SLAM_PACKAGE, SLAM_LAUNCH를 실제 값으로 지정\nsource \"/opt/ros/${ROS_DISTRO:?배포판을 지정하세요}/setup.bash\"\ncd \"${ROS_WORKSPACE:?실제 workspace 경로를 지정하세요}\"\nros2 pkg prefix \"${SLAM_PACKAGE:?실행 패키지를 지정하세요}\"\ncolcon build --packages-select \"$SLAM_PACKAGE\" --symlink-install\nsource install/setup.bash\nros2 launch \"$SLAM_PACKAGE\" \"${SLAM_LAUNCH:?launch 파일명을 지정하세요}\" --show-args\n# 지원 인자와 Lua 경로·토픽 remap·시간 설정을 확인한 다음 실행\nros2 launch \"$SLAM_PACKAGE\" \"$SLAM_LAUNCH\"\n```\n\n기존 Cartographer를 종료하고 다시 실행해 Lua를 읽는다. 새 터미널도 통신 상대와 같은 ROS_DOMAIN_ID를 사용한다. /opt/ros 경로가 아닌 설치본은 실제 setup 파일을 사용한다. 교안의 Lyrical·waffle-lyrical-slam·domain 174는 참고 조건이며 환경별 고정값이 아니다. [28쪽]\n\n## 9. 증상별 점검과 비교 기록\n\n| 증상 | 먼저 확인 | 그다음 한 항목씩 비교 |\n| --- | --- | --- |\n| 지도·위치가 없음 | 센서, TF, 시각, use_* 입력 | 입력 수, sampling, range |\n| 벽 두 겹·모서리 왜곡 | 센서 외부 보정, 로컬 submap | Ceres 가중치, local search window |\n| 재방문 보정 부족 | 중첩, 반복 구조, 후보 로그 | 점수, sampling, global search |\n| 처리 지연 | 입력률, CPU, backlog | voxel, 탐색 폭, 풀이 반복 수 |\n\n같은 rosbag·초기 상태·소스 commit을 유지한다. 원본 설정을 보관하고 한 값과 변경 이유를 적는다. 벽 두께·루프 오차·CPU·지연을 함께 측정하고 직선·회전·반복 복도에서도 다시 확인한다. 지도 그림만으로 성공을 판정하지 않는다. [32–33, 124쪽]\n\n기록 양식: 입력 bag / commit / 기존 값 / 변경 값 / 예상 / 관측 / 지연·CPU / 지도 품질 / 다른 구간 결과 / 유지 또는 되돌림 이유.\n\n## 10. 저장 형식과 위치 추정 모드\n\nPGM/YAML은 Nav2 등에 사용하는 2D 점유 격자이고 pbstream은 Cartographer SLAM 상태다. load_state_filename에 PGM/YAML을 넣지 않는다. [29–30, 120쪽]\n\n실행 위치: 같은 ROS 환경·domain의 터미널, /map 발행 중. 출력 폴더에 쓰기 권한이 있어야 한다.\n\n```bash\nMAP_OUTPUT_DIR=\"${MAP_OUTPUT_DIR:?지도를 저장할 폴더를 먼저 지정하세요}\"\nmkdir -p \"$MAP_OUTPUT_DIR\"\nPREFIX=\"$MAP_OUTPUT_DIR/map_$(date +%Y%m%d_%H%M%S)\"\nros2 run nav2_map_server map_saver_cli -f \"$PREFIX\"\nros2 service list -t\n# WRITE_STATE_SERVICE에는 설치본의 상태 저장 서비스를 지정\nros2 service call \"${WRITE_STATE_SERVICE:?상태 저장 서비스명을 지정하세요}\" cartographer_ros_msgs/srv/WriteState \\\n  \"{filename: '${PREFIX}.pbstream', include_unfinished_submaps: true}\"\n```\n\n생성 파일과 서비스 응답을 확인한다. 읽을 때 load_frozen_state=true는 기존 trajectory를 고정한다. pure_localization_trimmer는 새 submap 보관 수를 제한한다. 예전 문서의 pure_localization=true를 이 고정 소스에 무조건 추가하지 않는다. 정상 종료 저장 인자는 비정상 강제 종료까지 저장을 보장하지 않는다. [30, 48, 120–121쪽]\n\n## 11. 부록의 활성 조건\n\n- 3D: 3D 거리 관측, IMU, 중력축·외부 보정·시각이 필요하다. 2D LaserScan 설정을 켜는 것만으로 3D SLAM을 얻지 못한다. [31, 97–118쪽]\n- TSDF: 해당 2D 격자·삽입 기능을 선택한 경우에 읽는다. Waffle의 점유 확률 격자와 같은 활성 경로라고 가정하지 않는다. [68–74쪽]\n- IMU 외삽기: use_imu_based 및 해당 입력 조건을 함께 확인한다. 레거시 중력 시간상수와 중첩 pose_extrapolator 설정을 구분한다. [61–66, 99, 109–114쪽]\n- 겹친 submap trimmer: 기본 Lua에서 주석인 선택 기능이다. [96쪽]\n- occupancy_grid_topic: 이 ROS 2 포크의 실제 발행자는 map 상수를 사용하므로 변경은 remap을 사용한다. 일반적인 모든 포크의 동작으로 확대하지 않는다. [123쪽]\n\n## 12. 복습 질문\n\n1. use_odometry=true와 provide_odom_frame=false가 함께 가능한 이유는? 입력 사용과 TF 발행 책임이 다르다.\n2. 0.1°를 0.1 rad로 넣으면 같은 기준인가? 아니다. 0.1°는 약 0.001745 rad다.\n3. min_score=0.65는 성공 확률 65%인가? 아니다. 정합 점수의 채택 하한이다.\n4. 출력 해상도만 높이면 내부 지도 왜곡이 사라지는가? 아니다. 내부 정보와 로컬 정합 품질을 먼저 확보한다.\n5. optimize_every_n_nodes=0이면 모든 루프 관련 작업이 멈추는가? 아니다. 주기적 최적화, 후보 생성, 최종 최적화를 구분한다.\n6. pbstream과 PGM/YAML은 서로 대체 가능한가? 아니다. SLAM 상태와 출력 점유 격자는 목적과 정보가 다르다.\n\n오늘 복습 순서: 입력·TF → 로컬 정합 → Motion filter·submap → 루프·전역 최적화 → 저장·위치 추정. 관련 기존 학습은 37강, 38강 상태 추정, 39강 데이터 흐름 순서로 연결한다.\n"},"nav2Class":{"date":"2026-10-15","title":"Nav2·AMCL 수업 정리","source":"/Users/june/Downloads/Nav2_알고리즘_AMCL_파라미터_KANT.pptx","slideCount":91,"version":"ROS 2 Lyrical / 교안 설치본 Nav2 1.5.0","slides":[{"slide":1,"text":"Lv.2 06 Nav2\nKANT\n001\nNav2 자율주행\n알고리즘 선택 · AMCL · 파라미터 조정\nTurtleBot3 Waffle / ROS 2 Lyrical\n2026.10.15 · PA Lv.2","title":"Nav2 자율주행","scope":"구조·개요"},{"slide":2,"text":"Lv.2 06 Nav2\nKANT\n002\n학습목표\nSLAM·위치 추정·경로 계획·제어의 역할을 구분한다.\nWaffle의 구동 방식과 환경에 맞는 알고리즘을 선택한다.\n증상과 측정값을 근거로 파라미터를 한 항목씩 조정한다.","title":"학습목표","scope":"구조·개요"},{"slide":3,"text":"Lv.2 06 Nav2\nKANT\n003\n강의목차\n항목\n선택 / 값\n의미와 판단 기준\n01–02\n구조 · 위치 추정\nNav2 데이터 흐름, AMCL과 입자 필터\n03–04\n계획 · 제어\nDijkstra·A*·Smac·Theta*, DWB·MPPI·RPP\n05–06\n튜닝 · 실습\nCostmap·평활화·도달 판정, 저장 지도 주행","title":"강의목차","scope":"구조·개요"},{"slide":4,"text":"Lv.2 06 Nav2\nKANT\n004\n실습환경\n항목\n선택 / 값\n의미와 판단 기준\n시뮬레이션\nUbuntu 24.04 / Lyrical\n기존 Linux 노트북의 Gazebo Waffle 환경을 사용한다.\n지도\nCartographer 저장 지도\nPGM + YAML로 AMCL 주행을 시작한다.\n문서 기준\nNav2 1.5.0 + 공식 문서\n설정 예시는 설치본 기준. Rolling 추가 기능은 별도 확인한다.\nIsaac Sim 6.1 / Isaac ROS 5.0 연동은 확장 환경. 이 교안의 기본 실습은 Gazebo이다.","title":"실습환경","scope":"구조·개요"},{"slide":5,"text":"Lv.2 06 Nav2\nKANT\n005\nTurtleBot3 Waffle\n차동 구동: 좌우 바퀴 속도로 전진·회전\n제자리 회전 가능 / 횡이동 불가\n실제 외곽과 부착물을 Footprint에 반영\nROBOTIS Waffle 공식 제품 이미지","title":"TurtleBot3 Waffle","scope":"구조·개요"},{"slide":6,"text":"Lv.2 06 Nav2\nKANT\n006\nSLAM과 Navigation\nSLAM은 지도와 로봇의 위치·방향을 함께 추정한다.\nNavigation은 현재 위치에서 목표까지 갈 경로와 속도 명령을 만든다.\n저장 지도 주행에서는 AMCL이 위치를 추정하고 Nav2가 주행을 수행한다.","title":"SLAM과 Navigation","scope":"구조·개요"},{"slide":7,"text":"Lv.2 06 Nav2\nKANT\n007\nNav2 스택구조\nBT Navigator: 계획·제어·복구 작업 조율\nPlanner: 경로 / Controller: 속도 명령\nCostmap: 충돌 위험과 통과 비용\n기존 모듈 교안의 개념도 · A* 외 다른 Planner도 선택 가능","title":"Nav2 스택구조","scope":"구조·개요"},{"slide":8,"text":"Lv.2 06 Nav2\nKANT\n008\n주요 입력과 출력\n항목\n선택 / 값\n의미와 판단 기준\n위치·센서\nTF / odom / scan\n시간·좌표계가 맞아야 지도와 센서를 함께 해석할 수 있다.\n경로\nnav_msgs/Path\n지나갈 위치·방향의 열. 속도·시간이 반드시 포함되지는 않는다.\n속도 명령\nTwist / TwistStamped\nWaffle Lyrical 예제는 TwistStamped 연결을 확인한다.","title":"주요 입력과 출력","scope":"구조·개요"},{"slide":9,"text":"Lv.2 06 Nav2\nKANT\n009\n경로와 궤적\n경로(Path)는 공간에서 어디를 지나갈지를 나타낸다.\n궤적(Trajectory)은 시간에 따른 상태·속도까지 포함한다.\nPlanner가 경로를 만들고 Controller가 로봇 운동 제약과 장애물을 고려해 추종한다.","title":"경로와 궤적","scope":"구조·개요"},{"slide":10,"text":"Lv.2 06 Nav2\nKANT\n010\nTF구조\nmap → odom: 저장 지도 주행에서는 AMCL이 전역 위치를 보정한다.\nodom → base_footprint: Gazebo 또는 오도메트리가 연속 이동을 발행한다.\nbase_footprint → 센서: URDF에 정의된 고정 변환을 확인한다.","title":"TF구조","scope":"구조·개요"},{"slide":11,"text":"Lv.2 06 Nav2\nKANT\n011\n주행 모드 전환\n저장 지도 주행 전 Cartographer·cuVSLAM의 map → odom 발행을 중지한다.\nAMCL과 SLAM이 같은 TF를 동시에 발행하면 위치가 흔들릴 수 있다.\nGazebo·Nav2·RViz는 /clock과 use_sim_time 설정을 맞춘다.","title":"주행 모드 전환","scope":"구조·개요"},{"slide":12,"text":"Lv.2 06 Nav2\nKANT\n012\nAMCL\n저장 지도에서의 위치 추정\n입자 필터 · 센서 모델 · 오도메트리 모델","title":"AMCL","scope":"AMCL"},{"slide":13,"text":"Lv.2 06 Nav2\nKANT\n013\nAMCL 정의\nAMCL: Adaptive Monte Carlo Localization. 적응형 몬테카를로 위치 추정.\n알려진 2D 지도에서 로봇의 위치·방향 (x, y, θ)을 추정한다.\n여러 위치 가설을 입자로 표현하며 불확실성에 따라 입자 수를 조절한다.","title":"AMCL 정의","scope":"AMCL"},{"slide":14,"text":"Lv.2 06 Nav2\nKANT\n014\nSLAM · AMCL · 오도메트리\n항목\n선택 / 값\n의미와 판단 기준\nSLAM\n지도 + 위치 추정\n새 환경의 지도를 만들면서 위치를 찾는다.\nAMCL\n지도 안의 위치 추정\n저장된 지도가 필요하며 새로운 지도를 만드는 도구가 아니다.\nOdometry\n상대 이동량\n연속적인 이동 추정에 유용하지만 시간이 지나면 오차가 쌓인다.","title":"SLAM · AMCL · 오도메트리","scope":"AMCL"},{"slide":15,"text":"Lv.2 06 Nav2\nKANT\n015\n입자 필터 과정\n예측: 오도메트리 이동량과 잡음을 반영해 입자를 움직인다.\n갱신: 각 입자의 위치에서 예상되는 지도와 실제 LiDAR 관측을 비교한다.\n재표본화: 관측과 잘 맞는 가설이 다음 입자 집합에 더 많이 남는다.","title":"입자 필터 과정","scope":"AMCL"},{"slide":16,"text":"Lv.2 06 Nav2\nKANT\n016\n초기 위치와 불확실성\nRViz의 2D Pose Estimate로 현재 위치와 방향의 초기 가설을 준다.\n입자가 넓게 퍼지면 위치 불확실성이 크다는 뜻이다. 한 점처럼 보인다고 정답이 보장되지는 않는다.\n반복 복도·잘못된 지도·틀린 센서 TF에서는 다른 위치로 수렴할 수 있다.","title":"초기 위치와 불확실성","scope":"AMCL"},{"slide":17,"text":"Lv.2 06 Nav2\nKANT\n017\nAMCL 좌표계\n항목\n선택 / 값\n의미와 판단 기준\nglobal_frame_id\nmap\n저장 지도 좌표계. map → odom 보정에 사용한다.\nodom_frame_id\nodom\n연속 이동을 표현하는 오도메트리 좌표계.\nbase_frame_id\nbase_footprint\nWaffle 예제 기준. 실제 TF 이름과 일치시킨다.","title":"AMCL 좌표계","scope":"AMCL"},{"slide":18,"text":"Lv.2 06 Nav2\nKANT\n018\nAMCL 입력 설정\n항목\n선택 / 값\n의미와 판단 기준\nscan_topic\nscan / /scan\n실제 LaserScan 토픽, 프레임과 시간을 확인한다.\nrobot_model_type\nDifferentialMotionModel\nWaffle 차동 구동 모델. Omni 모델을 쓰지 않는다.\ntf_broadcast\ntrue\nAMCL이 map → odom 발행. 다른 발행자와 중복 금지.\n클래스명 전체: nav2_amcl::DifferentialMotionModel","title":"AMCL 입력 설정","scope":"AMCL"},{"slide":19,"text":"Lv.2 06 Nav2\nKANT\n019\nAMCL 입자 수\n항목\n선택 / 값\n의미와 판단 기준\nmin_particles\n500\n기준 YAML 값. 최소 가설 수와 계산량에 영향을 준다.\nmax_particles\n2000\n불확실할 때 사용할 상한. 늘려도 잘못된 지도는 해결되지 않는다.\npf_err / pf_z\n0.05 / 0.99\n적응 입자 수의 오차·신뢰 설정. 관측 품질부터 점검한다.\n값은 설치본 참고값이며 모든 로봇의 최적값이 아니다.","title":"AMCL 입자 수","scope":"AMCL"},{"slide":20,"text":"Lv.2 06 Nav2\nKANT\n020\nAMCL 이동 잡음 ①\n항목\n선택 / 값\n의미와 판단 기준\nalpha1\n회전 → 회전 잡음\n회전량 때문에 발생하는 회전 추정 불확실성.\nalpha2\n이동 → 회전 잡음\n병진 이동량 때문에 발생하는 회전 불확실성.\nalpha3\n이동 → 이동 잡음\n병진 이동량 때문에 발생하는 병진 불확실성.\nα는 오도메트리 잡음 모델 계수이다. 크게 하면 정밀도가 무조건 좋아지는 것이 아니다.","title":"AMCL 이동 잡음 ①","scope":"AMCL"},{"slide":21,"text":"Lv.2 06 Nav2\nKANT\n021\nAMCL 이동 잡음 ②\n항목\n선택 / 값\n의미와 판단 기준\nalpha4\n회전 → 이동 잡음\n회전 때문에 발생하는 병진 추정 불확실성.\nalpha5\nOmni 모델 추가 항\n옴니 구동의 병진 잡음 계수. Waffle 차동 모델에는 적용되지 않는다.\n선택 근거\n실제 odom 오차\n직진·회전 실험에서의 오차 경향을 관측한 뒤 조정한다.","title":"AMCL 이동 잡음 ②","scope":"AMCL"},{"slide":22,"text":"Lv.2 06 Nav2\nKANT\n022\nAMCL 레이저 모델\n항목\n선택 / 값\n의미와 판단 기준\nlaser_model_type\nlikelihood_field\n레이저 끝점과 지도 장애물 간 거리로 관측 적합성을 평가한다.\nsigma_hit\n0.2 m\n끝점 거리 오차 모델 폭. 너무 좁으면 작은 불일치에도 민감해진다.\nz_hit / z_rand\n0.5 / 0.5\n정상 관측 / 무작위 관측 혼합 가중치. 활성 모델 항을 확인한다.\nbeam 모델 등은 사용 항이 다르다. z_short·z_max를 모든 모델의 핵심 항으로 외우지 않는다.","title":"AMCL 레이저 모델","scope":"AMCL"},{"slide":23,"text":"Lv.2 06 Nav2\nKANT\n023\nAMCL 갱신 주기\n항목\n선택 / 값\n의미와 판단 기준\nupdate_min_d\n0.25 m\n이만큼 이동한 뒤 필터 갱신. 작게 하면 갱신·계산 부담 증가.\nupdate_min_a\n0.2 rad\n각도 기준. 직선 거리와 별개로 회전 중 갱신을 결정한다.\nmax_beams\n60\n평가에 사용할 광선 수. 입력·계산 시간과 함께 선택한다.","title":"AMCL 갱신 주기","scope":"AMCL"},{"slide":24,"text":"Lv.2 06 Nav2\nKANT\n024\nAMCL 시간과 재표본화\n항목\n선택 / 값\n의미와 판단 기준\nresample_interval\n1\n필터 갱신 몇 회마다 재표본화할지 결정한다.\ntransform_tolerance\n1.0 s\n발행 TF의 유효 시간 여유. 통신 지연 자체를 고치는 값은 아니다.\n검증 항목\nscan 정렬 / pose\n지도 벽과 레이저가 맞는지, 회전 후 위치가 튀는지 관찰한다.","title":"AMCL 시간과 재표본화","scope":"AMCL"},{"slide":25,"text":"Lv.2 06 Nav2\nKANT\n025\nAMCL 진단 예제\n증상: 로봇을 돌릴 때 스캔이 지도 벽에서 크게 벗어난다.\n먼저 센서 TF·시각·odom 방향·지도 해상도를 확인한다.\n입자 수를 올리기 전에 초기 위치와 모델 입력이 올바른지 검증한다.","title":"AMCL 진단 예제","scope":"AMCL"},{"slide":26,"text":"Lv.2 06 Nav2\nKANT\n026\n전역 경로 계획\nDijkstra · A* · Smac · Theta*\n탐색 비용과 로봇 운동 제약","title":"전역 경로 계획","scope":"Planner"},{"slide":27,"text":"Lv.2 06 Nav2\nKANT\n027\n지도와 Costmap\n점유지도: 공간의 점유 상태\nCostmap: 주행 위험을 비용으로 표현\n같은 거리라도 벽 근처 경로의 비용이 더 높을 수 있다.\n기존 모듈 Costmap 개념도","title":"지도와 Costmap","scope":"Planner"},{"slide":28,"text":"Lv.2 06 Nav2\nKANT\n028\nDijkstra\n출발점부터 누적 비용 g가 가장 작은 후보를 순서대로 확장한다.\n간선 비용이 음수가 아닌 그래프에서 최소 비용 경로를 찾는다.\n목표 방향의 휴리스틱 없이 탐색하므로 넓은 영역을 살필 수 있다.","title":"Dijkstra","scope":"Planner"},{"slide":29,"text":"Lv.2 06 Nav2\nKANT\n029\nA*\n누적 비용 g와 목표까지의 예상 비용 h를 합한 f = g + h로 후보를 선택한다.\nh가 목표 방향 탐색을 도와 불필요한 확장을 줄일 수 있다.\n최적성은 휴리스틱 조건과 구현에 달려 있다. 항상 더 짧거나 빠른 것은 아니다.","title":"A*","scope":"Planner"},{"slide":30,"text":"Lv.2 06 Nav2\nKANT\n030\nDijkstra와 A* 선택\n항목\n선택 / 값\n의미와 판단 기준\n우선순위\ng / g + h\nDijkstra는 누적 비용, A*는 목표 추정 비용까지 사용한다.\n비교 조건\n같은 지도·같은 비용\n알고리즘 이름만으로 경로 길이·안전성을 단정하지 않는다.\n선택 실험\n시간·성공률·경로\n좁은 미로와 넓은 공간에서 각각 반복 비교한다.","title":"Dijkstra와 A* 선택","scope":"Planner"},{"slide":31,"text":"Lv.2 06 Nav2\nKANT\n031\nNavFn 알고리즘 선택\nplanner_server:\n  ros__parameters:\n    planner_plugins: [\"GridBased\"]\n    GridBased:\n      plugin: \"nav2_navfn_planner::NavfnPlanner\"\n      use_astar: false\n      allow_unknown: false\n      tolerance: 0.5\nuse_astar: false → Dijkstra / true → A*\n예제: 미탐색 영역을 통과하지 않도록 allow_unknown: false","title":"NavFn 알고리즘 선택","scope":"Planner"},{"slide":32,"text":"Lv.2 06 Nav2\nKANT\n032\nNavFn 파라미터\n항목\n선택 / 값\n의미와 판단 기준\nuse_astar\nfalse / true\n동일 플러그인에서 탐색 방식을 바꾼다.\nallow_unknown\nbool\n미탐색 셀 통과 허용. Unknown을 안전한 공간으로 단정하지 않는다.\ntolerance\nm\n정확한 목표가 막혔을 때 근처 경로 끝점 탐색 범위. 도착 허용 오차와 다르다.","title":"NavFn 파라미터","scope":"Planner"},{"slide":33,"text":"Lv.2 06 Nav2\nKANT\n033\nPlanner 선택지 ①\n항목\n선택 / 값\n의미와 판단 기준\nNavFn\nDijkstra / A*\n격자 기반의 일반적인 시작점. Waffle 비교 실습에 적합.\nSmac 2D\n비용 인식 A*\n2D 격자 탐색. 차동·옴니 등 제자리 방향 전환 가능한 로봇.\nTheta*\nAny-angle 탐색\n가시선으로 격자 방향 제약을 줄인다. 회전 가능성은 별도 점검.","title":"Planner 선택지 ①","scope":"Planner"},{"slide":34,"text":"Lv.2 06 Nav2\nKANT\n034\nPlanner 선택지 ②\n항목\n선택 / 값\n의미와 판단 기준\nSmac Hybrid-A*\nSE(2) 탐색\n위치와 방향을 함께 고려. Dubins / Reeds–Shepp 운동 모델.\nSmac State Lattice\n운동 프리미티브\n사전 정의된 가능한 움직임으로 연결. 로봇 모델과 격자를 맞춘다.\nWaffle 기준\n2D 계획부터 비교\n차동 구동·제자리 회전이 가능하다. 차량용 제약을 무조건 추가하지 않는다.","title":"Planner 선택지 ②","scope":"Planner"},{"slide":35,"text":"Lv.2 06 Nav2\nKANT\n035\nPlanner 경로 비교\n왼쪽: Smac 2D / 가운데: Hybrid-A* / 오른쪽: State Lattice\nNav2 공식 예시. Waffle 실측이 아니며 알고리즘 간 보편적 우열을 뜻하지 않는다.\nNav2 Smac Planner README · 동일 환경의 세 Planner 경로 형태","title":"Planner 경로 비교","scope":"Planner"},{"slide":36,"text":"Lv.2 06 Nav2\nKANT\n036\nPlanner 클래스명\n항목\n선택 / 값\n의미와 판단 기준\nSmac 2D\nnav2_smac_planner::\nSmacPlanner2D\nHybrid-A* / Lattice\nnav2_smac_planner::\nSmacPlannerHybrid / SmacPlannerLattice\nTheta*\nnav2_theta_star_planner::\nThetaStarPlanner\nplugin 문자열은 가운데 접두사 + 오른쪽 클래스명을 이어 쓴다. 설치 패키지 존재 여부를 먼저 확인한다.","title":"Planner 클래스명","scope":"Planner"},{"slide":37,"text":"Lv.2 06 Nav2\nKANT\n037\nSmac 파라미터 선택\n항목\n선택 / 값\n의미와 판단 기준\ntolerance / allow_unknown\nm / bool\n목표 부근 허용 범위와 Unknown 통과 정책.\ncost_travel_multiplier\nSmac 2D 비용 계수\n높은 Costmap 비용의 회피 정도. 경로·시간을 함께 비교한다.\nmax_planning_time\ns\n계획 시간 예산. 실시간 요구와 지도의 복잡도를 함께 고려한다.\n플러그인별 지원 항을 확인한다. 2D 항을 Hybrid에 그대로 복사하지 않는다.","title":"Smac 파라미터 선택","scope":"Planner"},{"slide":38,"text":"Lv.2 06 Nav2\nKANT\n038\nHybrid-A* 운동 제약\n항목\n선택 / 값\n의미와 판단 기준\nminimum_turning_radius\nm\n가능한 최소 회전 반경. 실제 조향·주행 모델에 근거한다.\nangle_quantization_bins\n방향 구간 수\n방향 해상도를 높이면 탐색 상태·계산량이 늘 수 있다.\nmotion_model_for_search\nDUBIN / REEDS_SHEPP\n전진 전용 / 전후진 허용 모델. 실제 구동 가능성과 맞춘다.","title":"Hybrid-A* 운동 제약","scope":"Planner"},{"slide":39,"text":"Lv.2 06 Nav2\nKANT\n039\n확장 알고리즘: RRT와 PRM\nRRT는 공간을 샘플링해 트리를 확장하고, PRM은 샘플 간 연결 지도를 만든다.\n고차원·복잡한 운동 계획에서 활용한다. 일반 RRT의 최적 경로는 보장되지 않는다.\nNav2 기본 Planner 선택 목록과 구분한다. 사용하려면 별도 통합·플러그인 구현을 확인한다.","title":"확장 알고리즘: RRT와 PRM","scope":"Planner"},{"slide":40,"text":"Lv.2 06 Nav2\nKANT\n040\nPlanner 비교 실습\n동일 지도·동일 출발·동일 목표로 NavFn Dijkstra와 A*를 비교한다.\n그다음 Smac 2D를 비교하고, 경로 길이·벽과의 간격·계획 시간을 기록한다.\n경로가 있어도 로봇이 추종하지 못하면 Controller·Footprint·속도 제한을 확인한다.","title":"Planner 비교 실습","scope":"Planner"},{"slide":41,"text":"Lv.2 06 Nav2\nKANT\n041\n지역 제어\nDWB · MPPI · RPP · Graceful Controller\n속도 명령 · 충돌 회피 · 경로 추종","title":"지역 제어","scope":"Controller"},{"slide":42,"text":"Lv.2 06 Nav2\nKANT\n042\nController 역할\n현재 위치·속도, 경로, 주변 Costmap을 받아 다음 속도 명령을 계산한다.\nWaffle은 선속도 vx와 각속도 wz를 사용한다. vy는 0이다.\n새 장애물을 피하려면 관측 갱신과 필요 시 전역 재계획도 함께 작동해야 한다.","title":"Controller 역할","scope":"Controller"},{"slide":43,"text":"Lv.2 06 Nav2\nKANT\n043\nDWB 원리\n속도 후보를 샘플링하고 Trajectory Generator로 짧은 궤적을 예측한다.\nCritic이 장애물·경로 거리·목표 방향 등을 평가한다.\n유효한 후보 중 가중 비용이 작은 궤적의 속도 명령을 선택한다.","title":"DWB 원리","scope":"Controller"},{"slide":44,"text":"Lv.2 06 Nav2\nKANT\n044\nDWB 궤적 생성기\n항목\n선택 / 값\n의미와 판단 기준\nStandardTrajectoryGenerator\nTrajectory Rollout\n속도 후보를 전개하는 기본 방식. DWB를 DWA와 완전히 동일하게 보지 않는다.\nLimitedAccelGenerator\nDWA 계열\n가속 한계를 반영해 도달 가능한 속도 범위를 다루는 생성기.\ntrajectory_generator_name\n생성기 플러그인\n후보 생성 방식과 Critic 평가를 구분한다. 설치 클래스와 파라미터를 확인한다.","title":"DWB 궤적 생성기","scope":"Controller"},{"slide":45,"text":"Lv.2 06 Nav2\nKANT\n045\nDWB 속도와 예측\n항목\n선택 / 값\n의미와 판단 기준\nmax_vel_x / max_vel_theta\nm/s / rad/s\n최대 직진·회전 속도. 구동계와 최종 출력 제한을 맞춘다.\nacc_lim_x / acc_lim_theta\nm/s² / rad/s²\n가속 한계. 감속 한계 decel_lim_*는 부호와 구현을 확인한다.\nsim_time\ns\n궤적 예측 길이. 너무 짧으면 앞 장애물을 늦게 고려할 수 있다.","title":"DWB 속도와 예측","scope":"Controller"},{"slide":46,"text":"Lv.2 06 Nav2\nKANT\n046\nDWB 샘플링\n항목\n선택 / 값\n의미와 판단 기준\nvx_samples / vtheta_samples\n후보 수\n늘리면 선택이 촘촘해지지만 후보 평가량도 증가한다.\nvy_samples / max_vel_y\n횡방향 후보 / m/s\nWaffle은 max_vel_y=0. 횡이동 후보를 만들지 않는다.\nlinear_granularity\nm\n궤적 충돌·비용 평가 간격. 너무 거칠면 평가가 부정확할 수 있다.","title":"DWB 샘플링","scope":"Controller"},{"slide":47,"text":"Lv.2 06 Nav2\nKANT\n047\nDWB Critic ①\n항목\n선택 / 값\n의미와 판단 기준\nBaseObstacle / ObstacleFootprint\n장애물 비용\n장애물 접근·충돌을 평가. 유효성 검사를 가중치로 대신하지 않는다.\nPathDist / PathAlign\n경로 추종\n경로 거리와 진행 방향 정렬을 평가한다.\nGoalDist / GoalAlign\n목표 접근\n목표 거리와 방향 정렬을 평가한다.","title":"DWB Critic ①","scope":"Controller"},{"slide":48,"text":"Lv.2 06 Nav2\nKANT\n048\nDWB Critic ②\n항목\n선택 / 값\n의미와 판단 기준\nRotateToGoal\n목표 부근 회전\n목표 근처에서 방향을 맞추는 동작을 평가한다.\nOscillation\n반복 왕복 억제\n방향을 바꾸며 제자리에서 흔들리는 동작을 억제한다.\n각 Critic의 scale\n비용 가중치\n항 간 우선순위를 바꾼다. 척도가 달라 숫자만 단순 비교하지 않는다.\nROS 1 DWA의 path_distance_bias 등 옛 설정을 DWB 설정으로 그대로 옮기지 않는다.","title":"DWB Critic ②","scope":"Controller"},{"slide":49,"text":"Lv.2 06 Nav2\nKANT\n049\nMPPI 원리\nModel Predictive Path Integral: 여러 제어 시퀀스를 샘플링하고 미래 궤적을 예측한다.\n각 궤적의 비용에 따라 제어 시퀀스를 가중 갱신한다.\n첫 제어만 적용한 뒤 다음 주기에 새 관측으로 다시 계산한다.","title":"MPPI 원리","scope":"Controller"},{"slide":50,"text":"Lv.2 06 Nav2\nKANT\n050\nMPPI 예측 궤적\n공식 데모: 경로·Costmap·예측 결과\n장애물·경로·목표 비용으로 후보 평가\n다음 주기마다 새 상태로 다시 예측한다.\nNav2 MPPI 공식 데모 프레임 · 각 색은 서로 다른 표시 항목이며 후보 수를 뜻하지 않는다.","title":"MPPI 예측 궤적","scope":"Controller"},{"slide":51,"text":"Lv.2 06 Nav2\nKANT\n051\nMPPI 계산 환경\nMPPI는 벡터화된 계산을 활용한다. NVIDIA GPU가 필수인 알고리즘은 아니다.\n샘플 수·예측 길이·Critic 수가 계산 시간을 바꾼다.\n최신 알고리즘이라는 이유보다 제어 주기를 지킬 수 있는지로 선택한다.","title":"MPPI 계산 환경","scope":"Controller"},{"slide":52,"text":"Lv.2 06 Nav2\nKANT\n052\nMPPI 예측 길이\n항목\n선택 / 값\n의미와 판단 기준\ntime_steps\n56\n설치본 참고 예측 단계 수. 더 멀리 보려면 계산량도 점검한다.\nmodel_dt\n0.05 s\n한 단계 시간. controller_frequency=20 Hz의 주기와 맞춘다.\n예측 시간\n56 × 0.05 = 2.8 s\n시간을 늘려도 속도 제한 때문에 공간적 전망이 짧을 수 있다.","title":"MPPI 예측 길이","scope":"Controller"},{"slide":53,"text":"Lv.2 06 Nav2\nKANT\n053\nMPPI 샘플과 탐색\n항목\n선택 / 값\n의미와 판단 기준\nbatch_size\n2000\n설치본 참고 후보 수. 늘리기 전 제어 주기 초과 여부를 확인한다.\nvx_std / wz_std\nm/s / rad/s\n제어 샘플의 퍼짐. 작으면 탐색이 좁고 크면 거친 후보가 늘 수 있다.\niteration_count\n1\n주기 내 최적화 반복 수. 단계·샘플과 함께 계산량에 영향을 준다.","title":"MPPI 샘플과 탐색","scope":"Controller"},{"slide":54,"text":"Lv.2 06 Nav2\nKANT\n054\nMPPI 가중치와 모델\n항목\n선택 / 값\n의미와 판단 기준\ntemperature\n0.3\n비용 차이에 대한 가중 민감도. 낮을수록 낮은 비용 후보에 집중한다.\ngamma\n0.015\n제어 에너지 관련 정규화 계수. Critic scale과 다른 역할이다.\nmotion_model\ndiff_drive\n이 설치본은 플러그인 모델 이름을 사용한다. 옛 DiffDrive 예제와 구분한다.","title":"MPPI 가중치와 모델","scope":"Controller"},{"slide":55,"text":"Lv.2 06 Nav2\nKANT\n055\nLyrical MPPI 모델 설정\nFollowPath:\n  plugin: \"nav2_mppi_controller::MPPIController\"\n  motion_model: \"diff_drive\"\n  diff_drive:\n    plugin: \"mppi::DiffDriveMotionModel\"\n  vy_max: 0.0\n  vx_max: 0.1\n  vx_min: -0.1\n  wz_max: 0.2\n기존 Waffle README의 보수적인 시뮬레이션 시작값\nFollowPath는 controller_server.ros__parameters 아래에 둔다.","title":"Lyrical MPPI 모델 설정","scope":"Controller"},{"slide":56,"text":"Lv.2 06 Nav2\nKANT\n056\nMPPI Critic ①\n항목\n선택 / 값\n의미와 판단 기준\nConstraintCritic\n운동 제약\n속도·가속 등의 제약 위반 비용을 평가한다.\nCostCritic\nCostmap 비용\n장애물·고비용 구역을 평가한다. Footprint 설정도 확인한다.\nGoalCritic / GoalAngleCritic\n목표 위치 / 방향\n목표 근처의 위치·방향 오차를 평가한다.","title":"MPPI Critic ①","scope":"Controller"},{"slide":57,"text":"Lv.2 06 Nav2\nKANT\n057\nMPPI Critic ②\n항목\n선택 / 값\n의미와 판단 기준\nPathFollowCritic\n경로 진행\n경로를 따라 앞으로 진행하도록 유도한다.\nPathAlignCritic / PathAngleCritic\n경로 정렬 / 방향\n경로와의 정렬 및 진행 각도를 평가한다.\nPreferForwardCritic\n전진 선호\n후진을 덜 선호하도록 비용 부여. 후진 가능성을 삭제하는 값은 아니다.","title":"MPPI Critic ②","scope":"Controller"},{"slide":58,"text":"Lv.2 06 Nav2\nKANT\n058\nMPPI 평가 설정\n항목\n선택 / 값\n의미와 판단 기준\ncost_weight\n각 Critic 가중치\n해당 비용 항의 중요도. 활성 Critic과 함께 확인한다.\nthreshold_to_consider\nm 등 플러그인별\n목표 부근 등 조건부 평가 범위. 단위·기준은 Critic마다 확인한다.\nvisualize\nbool\n예측 궤적 확인에 유용. 계산 부담이 있으면 관찰 후 끈다.","title":"MPPI 평가 설정","scope":"Controller"},{"slide":59,"text":"Lv.2 06 Nav2\nKANT\n059\nController 선택지 ①\n항목\n선택 / 값\n의미와 판단 기준\nDWB\n속도 후보 + Critic\n후보 평가를 관찰하며 튜닝. 좁은 곳의 진동·유효 후보 수 점검.\nMPPI\n제어 시퀀스 최적화\n미래 궤적 기반 회피. 시간 예산·Critic 균형 점검.\nRPP\nRegulated Pure Pursuit\nLookahead 추종과 속도 조절. 가벼운 정밀 경로 추종에 검토.","title":"Controller 선택지 ①","scope":"Controller"},{"slide":60,"text":"Lv.2 06 Nav2\nKANT\n060\nController 선택지 ②\n항목\n선택 / 값\n의미와 판단 기준\nGraceful Controller\n부드러운 경로 추종\n매끄러운 접근·제어가 필요한 경우. 운동·장애물 제약 확인.\nRotation Shim\n방향 정렬 래퍼\n주 Controller 전에 방향을 맞춘다. 독립 전역 Planner가 아니다.\n선택 원칙\n로봇·경로·환경·CPU\n특정 알고리즘이 모든 환경에서 가장 좋은 것은 아니다.","title":"Controller 선택지 ②","scope":"Controller"},{"slide":61,"text":"Lv.2 06 Nav2\nKANT\n061\n확장 선택지: DWPP\n항목\n선택 / 값\n의미와 판단 기준\nDWPP\nDynamic Window Pure Pursuit\nPure Pursuit에 속도·가속 제약을 고려하는 최신 확장 선택지.\nuse_dynamic_window\n최신 Rolling 문서 항목\n기존 RPP 설정과 지원 범위가 다르다. 설치본에 존재하는지 확인한다.\n수업 적용\n기본 비교 이후 확장\nLyrical 1.5.0 기본 예제에서 검증한 기능으로 취급하지 않는다.\n2026-10-15 공식 Rolling 문서 기준. 설치본 기능과 구분해 소개한다.","title":"확장 선택지: DWPP","scope":"Controller"},{"slide":62,"text":"Lv.2 06 Nav2\nKANT\n062\nRPP 파라미터 선택\n항목\n선택 / 값\n의미와 판단 기준\n최대 선속도\nm/s\n설치본 이름을 확인한다. 최신 Rolling은 max_linear_vel, 이전 이름은 desired_linear_vel.\nlookahead_dist\nm\n추종할 앞쪽 지점. 작으면 민감, 크면 코너를 크게 돌 수 있다.\nlookahead_time\ns\n속도 기반 Lookahead 사용 시 시간 지평. 최소·최대 거리와 함께 설정.\nRPP는 경로 추종·충돌 검사·속도 규제 중심이다. 복잡한 우회 계획과 구분한다.","title":"RPP 파라미터 선택","scope":"Controller"},{"slide":63,"text":"Lv.2 06 Nav2\nKANT\n063\nGraceful Controller 조정\n항목\n선택 / 값\n의미와 판단 기준\nmin_lookahead / max_lookahead\nm\n가까운/먼 목표 선택 범위. 좁은 곳에서 너무 먼 목표는 추종을 어렵게 한다.\nk_phi / k_delta\n제어 이득\n위치·방향 수렴 특성을 조정한다. 과도한 반응과 경로 오차를 함께 본다.\nbeta / 속도 제한\n곡률 감속 / m/s\n급커브에서 감속하는 정도와 최대 선속도·각속도를 맞춘다.","title":"Graceful Controller 조정","scope":"Controller"},{"slide":64,"text":"Lv.2 06 Nav2\nKANT\n064\nRotation Shim 조정\n항목\n선택 / 값\n의미와 판단 기준\nangular_dist_threshold\nrad\n새 경로와 방향 차이가 크면 정렬 회전을 시작하는 기준.\nrotate_to_heading_angular_vel\nrad/s\n정렬 회전 속도. 실제 회전·가속 한계를 넘지 않게 설정한다.\nprimary_controller\n클래스명\n정렬 후 경로를 추종할 본 Controller. 래퍼와 본 제어기를 함께 설정한다.","title":"Rotation Shim 조정","scope":"Controller"},{"slide":65,"text":"Lv.2 06 Nav2\nKANT\n065\nController 선택 예제\n넓은 실내·낮은 CPU 부담·경로 추종 중심: RPP를 비교한다.\n동적 장애물과 미래 회피 궤적 비교: MPPI를 검토하고 처리 시간을 잰다.\nDWB는 속도 샘플과 Critic을 관찰하며 비교한다. 같은 속도 한계로 실험한다.","title":"Controller 선택 예제","scope":"Controller"},{"slide":66,"text":"Lv.2 06 Nav2\nKANT\n066\nCostmap과 주행 품질\nFootprint · Inflation · Smoother\n도착 판정 · 복구 · 실행 주기","title":"Costmap과 주행 품질","scope":"Costmap·운영"},{"slide":67,"text":"Lv.2 06 Nav2\nKANT\n067\nGlobal · Local Costmap\n항목\n선택 / 값\n의미와 판단 기준\nGlobal\nmap 기준\n목표까지 경로 계획. 저장 지도와 관측 장애물을 반영한다.\nLocal\nodom / Rolling Window\n로봇 주변 제어·충돌 평가. 센서 거리·예측 범위를 고려한다.\n레이어 구성\nStatic·Obstacle·Voxel·Inflation\nYAML에 정의만 해서는 활성화되지 않는다. plugins 목록을 확인한다.","title":"Global · Local Costmap","scope":"Costmap·운영"},{"slide":68,"text":"Lv.2 06 Nav2\nKANT\n068\nFootprint와 해상도\n항목\n선택 / 값\n의미와 판단 기준\nrobot_radius / footprint\nm / 다각형 좌표\n실제 로봇 외곽과 부착물을 반영한다. 통로를 지나게 하려고 축소하지 않는다.\nresolution\nm/cell\n작게 하면 세밀하지만 셀 수와 계산·메모리 부담이 증가한다.\nwidth / height\nm\n지역 지도 범위. 미래 궤적과 센서 가시 범위를 함께 고려한다.","title":"Footprint와 해상도","scope":"Costmap·운영"},{"slide":69,"text":"Lv.2 06 Nav2\nKANT\n069\nInflation 파라미터\n항목\n선택 / 값\n의미와 판단 기준\ninflation_radius\nm\n장애물 주변 비용을 퍼뜨리는 범위. 로봇 실제 반경과 구분한다.\ncost_scaling_factor\n감쇠 계수\n같은 반경에서 크게 하면 비용이 더 빨리 감소한다.\n조정 목적\n벽과 거리 확보\n중앙 통과 경향과 좁은 통로의 경로 가능성을 함께 관찰한다.","title":"Inflation 파라미터","scope":"Costmap·운영"},{"slide":70,"text":"Lv.2 06 Nav2\nKANT\n070\n센서와 장애물 제거\n항목\n선택 / 값\n의미와 판단 기준\nobstacle_max_range\nm\n장애물 등록에 사용할 최대 센서 거리.\nraytrace_max_range\nm\n레이저 광선을 따라 비어 있는 공간을 지우는 범위.\nmarking / clearing\nbool\n장애물 등록 / 해제. 유령 장애물은 시간·TF·센서 입력도 확인한다.","title":"센서와 장애물 제거","scope":"Costmap·운영"},{"slide":71,"text":"Lv.2 06 Nav2\nKANT\n071\n경로 평활화 선택지\n항목\n선택 / 값\n의미와 판단 기준\nSimple Smoother\n위치 경로 평활화\n격자 경로의 꺾임 완화. 운동학 제약 보장은 별도로 확인한다.\nSavitzky–Golay\n국소 다항 필터\n경로의 작은 잡음을 완화. 필터 후 장애물·방향 전환 확인.\nConstrained Smoother\n제약 최적화\n곡률·장애물·경로 품질을 고려. 계산 비용과 설정이 더 복잡하다.","title":"경로 평활화 선택지","scope":"Costmap·운영"},{"slide":72,"text":"Lv.2 06 Nav2\nKANT\n072\n경로 평활화 예시\n공식 Savitzky–Golay 예시\n작은 꺾임·잡음의 완화\n큰 우회 경로나 운동 제약 문제는 별도로 해결한다.\nNav2 공식 예시 · 필터 전후 경로 비교","title":"경로 평활화 예시","scope":"Costmap·운영"},{"slide":73,"text":"Lv.2 06 Nav2\nKANT\n073\nSmoother 파라미터 선택\n항목\n선택 / 값\n의미와 판단 기준\nwindow_size / poly_order\n창 크기 / 다항 차수\nSavitzky–Golay의 국소 필터 범위. 창은 3 이상의 홀수. 지원 버전 확인.\nw_smooth / w_cost\nConstrained 가중치\n매끄러움과 장애물 비용 사이 균형. 목표와 운동 제약도 함께 고려한다.\nenforce_path_inversion\nbool\n지원 Smoother에서 전후진 전환점 보존. 설치 플러그인 항을 확인한다.","title":"Smoother 파라미터 선택","scope":"Costmap·운영"},{"slide":74,"text":"Lv.2 06 Nav2\nKANT\n074\nSmoother 적용 조건\n플러그인을 설정해도 BT에서 SmoothPath를 호출하지 않으면 적용되지 않는다.\nHybrid·Lattice의 전후진 전환점과 최소 회전 반경을 보존해야 한다.\n평활화 전후 경로가 장애물을 가로지르는지 Costmap에서 다시 확인한다.","title":"Smoother 적용 조건","scope":"Costmap·운영"},{"slide":75,"text":"Lv.2 06 Nav2\nKANT\n075\n도착과 진행 판정\n항목\n선택 / 값\n의미와 판단 기준\nxy_goal_tolerance\nm\n목표 위치 허용 오차. NavFn tolerance와 역할이 다르다.\nyaw_goal_tolerance\nrad\n목표 방향 허용 오차. 지나치게 작으면 끝에서 계속 회전할 수 있다.\nProgress Checker\n거리 + 시간\n정해진 시간 내 진행 여부. 저속 실습에 맞는 판정 범위를 검토한다.","title":"도착과 진행 판정","scope":"Costmap·운영"},{"slide":76,"text":"Lv.2 06 Nav2\nKANT\n076\n주행 명령 후처리\n항목\n선택 / 값\n의미와 판단 기준\nVelocity Smoother\n속도·가감속 제한\n명령 변화를 완화. Controller와 구동계의 한계를 일치시킨다.\nCollision Monitor\n센서 기반 감속·정지\n추가 충돌 감시 계층. 센서 사각지대와 입력 지연을 확인한다.\nBehavior Server\n회전·후진·대기\n실패 시 복구 동작. 막힌 곳에서 무조건 반복시키지 않는다.","title":"주행 명령 후처리","scope":"Costmap·운영"},{"slide":77,"text":"Lv.2 06 Nav2\nKANT\n077\n주기와 계산량\n항목\n선택 / 값\n의미와 판단 기준\ncontroller_frequency\nHz\n주기 안에 계산이 끝나야 한다. 높이는 것만으로 성능이 좋아지지 않는다.\nupdate_frequency\nHz\nCostmap 갱신. 센서 주기와 처리 부하를 함께 본다.\npublish_frequency\nHz\nCostmap 표시·전송 주기. 내부 갱신 주기와 구분한다.","title":"주기와 계산량","scope":"Costmap·운영"},{"slide":78,"text":"Lv.2 06 Nav2\nKANT\n078\n파라미터 조정 순서\n① 지도·TF·시간·센서·odom·AMCL을 먼저 확인한다.\n② Footprint·Costmap·속도·가속 한계를 맞춘다.\n③ Planner → Controller → 도착·진행 판정 순으로 조정하고 기록한다.","title":"파라미터 조정 순서","scope":"Costmap·운영"},{"slide":79,"text":"Lv.2 06 Nav2\nKANT\n079\n증상별 점검\n항목\n선택 / 값\n의미와 판단 기준\n벽에 너무 붙음\nFootprint / Inflation\n그다음 Planner 비용과 Controller 장애물 항을 본다.\n코너에서 진동\n위치·경로·후보 궤적\n속도·회전 한계와 경로/목표 Critic 간 충돌을 점검한다.\n명령은 있는데 정지\ncmd_vel 타입·토픽·상태\nTwistStamped 연결, Lifecycle active, 감시 정지 조건을 확인한다.","title":"증상별 점검","scope":"Costmap·운영"},{"slide":80,"text":"Lv.2 06 Nav2\nKANT\n080\n저장 지도 주행 실습\nGazebo Waffle · AMCL · Nav2\n초기 위치 → 가까운 목표 → 알고리즘 비교","title":"저장 지도 주행 실습","scope":"실습"},{"slide":81,"text":"Lv.2 06 Nav2\nKANT\n081\n실습 맵\n기존 Linux Gazebo 미로 환경 사용\n현재 월드에서 저장한 지도와 맞춘다.\n이 이미지는 환경 확인용이며 Nav2 도달 성공 기록은 아니다.\n기존 원격 Linux 노트북 화면","title":"실습 맵","scope":"실습"},{"slide":82,"text":"Lv.2 06 Nav2\nKANT\n082\n환경과 지도 확인\nsource /opt/ros/lyrical/setup.bash\nexport ROS_DOMAIN_ID=174\nMAP_YAML=\"$HOME/slam_maps/maze_YYYYMMDD_HHMMSS.yaml\"\nls \"$MAP_YAML\"\nros2 topic hz /clock\nros2 topic hz /scan\nros2 run tf2_ros tf2_echo odom base_footprint\nYYYYMMDD_HHMMSS를 실제 저장 파일명으로 바꾼다.\nGazebo와 모든 터미널의 ROS_DOMAIN_ID를 일치시킨다.","title":"환경과 지도 확인","scope":"실습"},{"slide":83,"text":"Lv.2 06 Nav2\nKANT\n083\nNav2 실행\nros2 launch nav2_bringup bringup_launch.py \\\n  map:=\"$MAP_YAML\" \\\n  params_file:=\"$HOME/slam_maps/nav2_waffle.yaml\" \\\n  use_sim_time:=true autostart:=true slam:=false \\\n  use_localization:=true use_composition:=false \\\n  use_keepout_zones:=false use_speed_zones:=false\n먼저 README의 nav2_waffle.yaml 생성 절차를 완료한다.\nCartographer·cuVSLAM·키보드 텔레옵은 중지한 뒤 실행한다.","title":"Nav2 실행","scope":"실습"},{"slide":84,"text":"Lv.2 06 Nav2\nKANT\n084\nRViz와 초기 위치\nros2 launch nav2_bringup rviz_launch.py \\\n  use_sim_time:=true\n\nros2 lifecycle get /amcl\nros2 lifecycle get /controller_server\nros2 topic info /cmd_vel -v\n2D Pose Estimate → 지도 벽과 스캔 정렬 확인\n자유 공간의 가까운 목표에 Nav2 Goal을 지정한다.","title":"RViz와 초기 위치","scope":"실습"},{"slide":85,"text":"Lv.2 06 Nav2\nKANT\n085\n실습용 속도 제한\n항목\n선택 / 값\n의미와 판단 기준\nMPPI\nvx_max=0.1 / wz_max=0.2\nm/s / rad/s. Waffle README의 시작값이며 최적값은 아니다.\nVelocity Smoother\nmax_velocity=[0.1,0,0.2]\nController 출력 제한과 맞춘다. 후진·가속 한계도 확인한다.\nStamped 명령\nenable_stamped_cmd_vel=true\n연결된 노드와 Gazebo 입력의 타입·토픽을 모두 일치시킨다.\n실제 Nav2 목표 도달은 이 교안 제작에서 새로 검증하지 않았다. 첫 실습은 가까운 목표로 시작한다.","title":"실습용 속도 제한","scope":"실습"},{"slide":86,"text":"Lv.2 06 Nav2\nKANT\n086\n알고리즘 교체 방법\n작업용 YAML을 복사해 실험별 파일로 보관한다. 예: navfn_dwb.yaml, smac_mppi.yaml.\nPlanner·Controller의 plugin과 해당 파라미터 묶음을 함께 바꾼다.\n교체 후 Nav2를 재시작하고 설치 클래스·노드 상태·토픽 연결을 확인한다.","title":"알고리즘 교체 방법","scope":"실습"},{"slide":87,"text":"Lv.2 06 Nav2\nKANT\n087\n비교 실험 기록\n항목\n선택 / 값\n의미와 판단 기준\n고정 조건\n지도·출발·목표·속도\n조건을 바꾸면서 알고리즘 효과를 비교하지 않는다.\n기록 항목\n성공·시간·거리·진동\n최소 장애물 간격, 재계획·복구 횟수도 기록한다.\n실험 순서\n한 항목씩 반복\nNavFn Dijkstra ↔ A*, 이후 Controller만 교체한다.","title":"비교 실험 기록","scope":"실습"},{"slide":88,"text":"Lv.2 06 Nav2\nKANT\n088\n실습 질문\n지도가 맞는데 로봇 위치가 틀리면 Planner부터 바꿔야 할까?\nA*로 경로가 생겼는데 움직이지 않으면 어떤 입력·출력을 확인할까?\nMPPI의 batch_size를 두 배로 바꾸기 전에 무엇을 측정해야 할까?","title":"실습 질문","scope":"실습"},{"slide":89,"text":"Lv.2 06 Nav2\nKANT\n089\nWaffle 선택 기준\n항목\n선택 / 값\n의미와 판단 기준\n첫 비교\nNavFn + MPPI\n기존 Lyrical 참고 설정에 가까운 출발점. 연결·주기부터 확인한다.\n대안 실험\nSmac 2D / DWB / RPP\n같은 조건에서 계획 품질·추종·CPU 부담을 비교한다.\n확장\nHybrid·Lattice·Theta*\n운동 제약·가시선·경로 품질 요구가 있을 때 추가 검토한다.","title":"Waffle 선택 기준","scope":"실습"},{"slide":90,"text":"Lv.2 06 Nav2\nKANT\n090\n학습 확인\nAMCL은 저장 지도에서 위치를 추정하고 Planner는 경로를 만든다.\nDWB·MPPI·RPP는 서로 다른 방식으로 경로를 추종한다.\n알고리즘 선택은 로봇 모델·환경·성공률·처리 시간의 근거로 설명한다.","title":"학습 확인","scope":"실습"},{"slide":91,"text":"Lv.2 06 Nav2\nKANT\n091\n참고자료\n항목\n선택 / 값\n의미와 판단 기준\nNav2 공식 문서\nConfiguration / Tuning\n각 슬라이드 발표자 노트에 해당 문서 링크를 수록했다.\n설치본 기준\nNVIDIA Lyrical Nav2 1.5.0\n2026-10-13 확보 YAML. Rolling 문서와 지원 항이 다를 수 있다.\n실습 저장소\nwaffle-lyrical-slam\nREADME의 저장 지도·Nav2 실행 절차를 함께 참고한다.\n2026-10-15 작성 · 설정 예시는 학습 출발점이며 실환경에 맞춰 검증한다.","title":"참고자료","scope":"구조·개요"}],"referenceRows":[{"slide":3,"topic":"강의목차","scope":"구조·개요","name":"01–02","value":"구조 · 위치 추정","meaning":"Nav2 데이터 흐름, AMCL과 입자 필터"},{"slide":3,"topic":"강의목차","scope":"구조·개요","name":"03–04","value":"계획 · 제어","meaning":"Dijkstra·A*·Smac·Theta*, DWB·MPPI·RPP"},{"slide":3,"topic":"강의목차","scope":"구조·개요","name":"05–06","value":"튜닝 · 실습","meaning":"Costmap·평활화·도달 판정, 저장 지도 주행"},{"slide":4,"topic":"실습환경","scope":"구조·개요","name":"시뮬레이션","value":"Ubuntu 24.04 / Lyrical","meaning":"기존 Linux 노트북의 Gazebo Waffle 환경을 사용한다."},{"slide":4,"topic":"실습환경","scope":"구조·개요","name":"지도","value":"Cartographer 저장 지도","meaning":"PGM + YAML로 AMCL 주행을 시작한다."},{"slide":4,"topic":"실습환경","scope":"구조·개요","name":"문서 기준","value":"Nav2 1.5.0 + 공식 문서","meaning":"설정 예시는 설치본 기준. Rolling 추가 기능은 별도 확인한다."},{"slide":8,"topic":"주요 입력과 출력","scope":"구조·개요","name":"위치·센서","value":"TF / odom / scan","meaning":"시간·좌표계가 맞아야 지도와 센서를 함께 해석할 수 있다."},{"slide":8,"topic":"주요 입력과 출력","scope":"구조·개요","name":"경로","value":"nav_msgs/Path","meaning":"지나갈 위치·방향의 열. 속도·시간이 반드시 포함되지는 않는다."},{"slide":8,"topic":"주요 입력과 출력","scope":"구조·개요","name":"속도 명령","value":"Twist / TwistStamped","meaning":"Waffle Lyrical 예제는 TwistStamped 연결을 확인한다."},{"slide":14,"topic":"SLAM · AMCL · 오도메트리","scope":"AMCL","name":"SLAM","value":"지도 + 위치 추정","meaning":"새 환경의 지도를 만들면서 위치를 찾는다."},{"slide":14,"topic":"SLAM · AMCL · 오도메트리","scope":"AMCL","name":"AMCL","value":"지도 안의 위치 추정","meaning":"저장된 지도가 필요하며 새로운 지도를 만드는 도구가 아니다."},{"slide":14,"topic":"SLAM · AMCL · 오도메트리","scope":"AMCL","name":"Odometry","value":"상대 이동량","meaning":"연속적인 이동 추정에 유용하지만 시간이 지나면 오차가 쌓인다."},{"slide":17,"topic":"AMCL 좌표계","scope":"AMCL","name":"global_frame_id","value":"map","meaning":"저장 지도 좌표계. map → odom 보정에 사용한다."},{"slide":17,"topic":"AMCL 좌표계","scope":"AMCL","name":"odom_frame_id","value":"odom","meaning":"연속 이동을 표현하는 오도메트리 좌표계."},{"slide":17,"topic":"AMCL 좌표계","scope":"AMCL","name":"base_frame_id","value":"base_footprint","meaning":"Waffle 예제 기준. 실제 TF 이름과 일치시킨다."},{"slide":18,"topic":"AMCL 입력 설정","scope":"AMCL","name":"scan_topic","value":"scan / /scan","meaning":"실제 LaserScan 토픽, 프레임과 시간을 확인한다."},{"slide":18,"topic":"AMCL 입력 설정","scope":"AMCL","name":"robot_model_type","value":"DifferentialMotionModel","meaning":"Waffle 차동 구동 모델. Omni 모델을 쓰지 않는다."},{"slide":18,"topic":"AMCL 입력 설정","scope":"AMCL","name":"tf_broadcast","value":"true","meaning":"AMCL이 map → odom 발행. 다른 발행자와 중복 금지."},{"slide":19,"topic":"AMCL 입자 수","scope":"AMCL","name":"min_particles","value":"500","meaning":"기준 YAML 값. 최소 가설 수와 계산량에 영향을 준다."},{"slide":19,"topic":"AMCL 입자 수","scope":"AMCL","name":"max_particles","value":"2000","meaning":"불확실할 때 사용할 상한. 늘려도 잘못된 지도는 해결되지 않는다."},{"slide":19,"topic":"AMCL 입자 수","scope":"AMCL","name":"pf_err / pf_z","value":"0.05 / 0.99","meaning":"적응 입자 수의 오차·신뢰 설정. 관측 품질부터 점검한다."},{"slide":20,"topic":"AMCL 이동 잡음 ①","scope":"AMCL","name":"alpha1","value":"회전 → 회전 잡음","meaning":"회전량 때문에 발생하는 회전 추정 불확실성."},{"slide":20,"topic":"AMCL 이동 잡음 ①","scope":"AMCL","name":"alpha2","value":"이동 → 회전 잡음","meaning":"병진 이동량 때문에 발생하는 회전 불확실성."},{"slide":20,"topic":"AMCL 이동 잡음 ①","scope":"AMCL","name":"alpha3","value":"이동 → 이동 잡음","meaning":"병진 이동량 때문에 발생하는 병진 불확실성."},{"slide":21,"topic":"AMCL 이동 잡음 ②","scope":"AMCL","name":"alpha4","value":"회전 → 이동 잡음","meaning":"회전 때문에 발생하는 병진 추정 불확실성."},{"slide":21,"topic":"AMCL 이동 잡음 ②","scope":"AMCL","name":"alpha5","value":"Omni 모델 추가 항","meaning":"옴니 구동의 병진 잡음 계수. Waffle 차동 모델에는 적용되지 않는다."},{"slide":21,"topic":"AMCL 이동 잡음 ②","scope":"AMCL","name":"선택 근거","value":"실제 odom 오차","meaning":"직진·회전 실험에서의 오차 경향을 관측한 뒤 조정한다."},{"slide":22,"topic":"AMCL 레이저 모델","scope":"AMCL","name":"laser_model_type","value":"likelihood_field","meaning":"레이저 끝점과 지도 장애물 간 거리로 관측 적합성을 평가한다."},{"slide":22,"topic":"AMCL 레이저 모델","scope":"AMCL","name":"sigma_hit","value":"0.2 m","meaning":"끝점 거리 오차 모델 폭. 너무 좁으면 작은 불일치에도 민감해진다."},{"slide":22,"topic":"AMCL 레이저 모델","scope":"AMCL","name":"z_hit / z_rand","value":"0.5 / 0.5","meaning":"정상 관측 / 무작위 관측 혼합 가중치. 활성 모델 항을 확인한다."},{"slide":23,"topic":"AMCL 갱신 주기","scope":"AMCL","name":"update_min_d","value":"0.25 m","meaning":"이만큼 이동한 뒤 필터 갱신. 작게 하면 갱신·계산 부담 증가."},{"slide":23,"topic":"AMCL 갱신 주기","scope":"AMCL","name":"update_min_a","value":"0.2 rad","meaning":"각도 기준. 직선 거리와 별개로 회전 중 갱신을 결정한다."},{"slide":23,"topic":"AMCL 갱신 주기","scope":"AMCL","name":"max_beams","value":"60","meaning":"평가에 사용할 광선 수. 입력·계산 시간과 함께 선택한다."},{"slide":24,"topic":"AMCL 시간과 재표본화","scope":"AMCL","name":"resample_interval","value":"1","meaning":"필터 갱신 몇 회마다 재표본화할지 결정한다."},{"slide":24,"topic":"AMCL 시간과 재표본화","scope":"AMCL","name":"transform_tolerance","value":"1.0 s","meaning":"발행 TF의 유효 시간 여유. 통신 지연 자체를 고치는 값은 아니다."},{"slide":24,"topic":"AMCL 시간과 재표본화","scope":"AMCL","name":"검증 항목","value":"scan 정렬 / pose","meaning":"지도 벽과 레이저가 맞는지, 회전 후 위치가 튀는지 관찰한다."},{"slide":30,"topic":"Dijkstra와 A* 선택","scope":"Planner","name":"우선순위","value":"g / g + h","meaning":"Dijkstra는 누적 비용, A*는 목표 추정 비용까지 사용한다."},{"slide":30,"topic":"Dijkstra와 A* 선택","scope":"Planner","name":"비교 조건","value":"같은 지도·같은 비용","meaning":"알고리즘 이름만으로 경로 길이·안전성을 단정하지 않는다."},{"slide":30,"topic":"Dijkstra와 A* 선택","scope":"Planner","name":"선택 실험","value":"시간·성공률·경로","meaning":"좁은 미로와 넓은 공간에서 각각 반복 비교한다."},{"slide":32,"topic":"NavFn 파라미터","scope":"Planner","name":"use_astar","value":"false / true","meaning":"동일 플러그인에서
