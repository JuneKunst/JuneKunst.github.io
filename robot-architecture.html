else html+='<label class="field">정답을 보기 전에 내 설명<textarea id="fcRecall" maxlength="2000" '+(s.revealed?'readonly':'')+' placeholder="기억나는 한두 문장을 먼저 적으세요.">'+esc(s.response)+'</textarea></label>';
if(card.type==='recall'&&s.revealed){html+='<div class="fc-feedback"><h3>설명 예시</h3><p>'+esc(card.answer)+'</p><p>'+esc(card.explanation)+'</p></div><p>내 답에 다음 내용이 들어갔는지 체크하세요. 의미를 자동 판정하는 기능은 아닙니다.</p>'+card.rubric.map((r,i)=>'<label class="field fc-check"><input type="checkbox" data-fc-rubric="'+i+'">'+esc(r)+'</label>').join('')+'<div class="flex">'+button('0점 · 기억 안 남','data-fc-self="0"')+button('1점 · 일부 설명','data-fc-self="1"')+button('2점 · 두 요소 설명','data-fc-self="2" class="primary"')+'</div>'+fcSourceHtml(card);}
else html+='<div class="flex controls">'+(card.type==='recall'?button('정답·기준 뒤집기','id="fcReveal" class="primary"'):button('채점하기','id="fcSubmit" class="primary"'))+(card.type!=='recall'?button('모르겠어요 · 정답 보기','id="fcUnknown"'):'')+'</div>';
return html+'<p id="fcError" role="alert"></p></article>'+fcLibrary();
}
function fcLibrary(){return '<details class="section-title"><summary>전체 '+flashcardDeck.length+'장 찾아보기·CSV</summary><p>각 카드는 원문 쪽수 또는 기존 강의에 연결됩니다. 카드 하나를 고르면 추가 연습으로 진행합니다.</p>'+button('전체 카드 CSV 내려받기','id="fcCsv"')+'<div class="fc-library">'+flashcardDeck.map(c=>button(c.topic+' · '+c.q,'data-fc-one="'+c.id+'"')).join('')+'</div></details>';}
function restoreFlashcardState(archive){if(archive.flashcardState===undefined)return;const next=normalizeFlashcardState(archive.flashcardState);localStorage.setItem('robotFlashcardsV1',JSON.stringify(next));flashcardState=next;flashcardSession=null;}
function bindFlashcards(){
document.querySelectorAll('[data-fc-one]').forEach(b=>b.onclick=()=>startFlashcards(true,[b.dataset.fcOne]));
if(!$('fcSettings'))return;
const guard=fn=>{try{fn();}catch(e){if($('fcError'))$('fcError').textContent=e.message;else toast(e.message);}};
if($('fcCsv'))$('fcCsv').onclick=()=>{const cell=v=>'"'+String(v).replaceAll('"','""')+'"',csv=[['Front','Back','Tags'],...flashcardDeck.map(c=>[c.q,c.answer+'\n'+c.explanation+'\n출처: '+c.sources.map(s=>s.kind==='url'?s.url:s.kind+' '+s.pages.join(',')).join(' / '),c.topic])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='robot-flashcards.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('fcSettings').onclick=()=>guard(()=>{const next=normalizeFlashcardState({...flashcardState,settings:{dailyLimit:Number($('fcDailyLimit').value),newLimit:Number($('fcNewLimit').value),scope:$('fcScope').value}});localStorage.setItem('robotFlashcardsV1',JSON.stringify(next));flashcardState=next;startFlashcards();});
if($('fcRefresh'))$('fcRefresh').onclick=()=>startFlashcards();if($('fcPractice'))$('fcPractice').onclick=()=>startFlashcards(true);
document.querySelectorAll('[data-fc-choice]').forEach(b=>b.onclick=()=>{flashcardSession.choice=Number(b.dataset.fcChoice);document.querySelectorAll('[data-fc-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
if($('fcNumber'))$('fcNumber').oninput=e=>flashcardSession.response=e.target.value;
if($('fcRecall'))$('fcRecall').oninput=e=>flashcardSession.response=e.target.value;
if($('fcSubmit'))$('fcSubmit').onclick=()=>guard(()=>{const c=flashcardDeck.find(c=>c.id===flashcardSession.ids[flashcardSession.index]);fcCommit({...fcAutoGrade(c,c.type==='choice'?flashcardSession.choice:flashcardSession.response),method:'auto',assisted:false});});
if($('fcUnknown'))$('fcUnknown').onclick=()=>guard(()=>fcCommit({score:0,response:'',method:'auto',correct:false,assisted:true}));
if($('fcReveal'))$('fcReveal').onclick=()=>{flashcardSession.revealed=true;render();};
document.querySelectorAll('[data-fc-self]').forEach(b=>b.onclick=()=>guard(()=>{const card=flashcardDeck.find(c=>c.id===flashcardSession.ids[flashcardSession.index]);fcCommit(fcSelfGrade(card,flashcardSession.response,document.querySelectorAll('[data-fc-rubric]:checked').length,Number(b.dataset.fcSelf)));}));
if($('fcNext'))$('fcNext').onclick=()=>{flashcardSession.index++;flashcardSession.result=null;flashcardSession.response='';flashcardSession.choice=null;flashcardSession.choiceOrder=null;flashcardSession.revealed=false;render();window.scrollTo(0,0);};
}

// Course explanations are illustrative learning content, never runtime evidence.
let isaacTopic=0;
function isaacClassEntry(){
 return '<section class="card review-bridge isaac-entry"><span class="tag">추가 수업 · 2026-10-19</span><h3>NVIDIA Isaac · 시뮬레이션과 강화학습</h3><p>이전 TF·SLAM·Nav2에서 Sim·Lab·정책 학습·실제 배포까지 연결합니다. 교안 64쪽과 기존 41–69강의 관련 내용을 함께 복습합니다.</p>'+button('Isaac 수업 이어 보기','data-view="isaacclass"')+'</section>';
}
function isaacclass(){
 const c=D.isaacClass,topic=c.sections[isaacTopic];
 return intro('2026-10-19 · KANT','Isaac 생태계와 강화학습','이전 개념 하나를 떠올리고 → 새 내용을 읽고 → 적용 예시와 확인 질문으로 연결합니다. 한 번에 한 단원씩 읽으세요.')+
 '<div class="notice">현재 프로젝트는 Mac Apple Silicon + ROS 2 Docker 기준입니다. ROS 메시지 개념 실습과 NVIDIA RTX·Jetson 전용 실행을 구분하세요. Docker만으로 Mac에 NVIDIA GPU 환경이 생기지는 않습니다.</div>'+
 '<p class="source-note">교안 64쪽 · 12개 단원 · 공식 자료 비교 기준 '+esc(c.checked)+' · 수강·이해·실제 구현과 시험 결과는 서로 다른 상태입니다.</p>'+
 '<section class="card prose"><span class="tag">오늘 수업 · 2026-10-27</span><h3>팀별 미로 주행 · 보상·cuVSLAM·Nav2</h3><p>54쪽 교안을 보상과 PPO, 움직이는 팔 카메라의 TF, 센서 융합, 명령 중재와 평가 증거로 연결합니다. M38 시연값과 팀별 실측값을 구분합니다.</p><a href="lessons/0006-maze-navigation.html">미로 주행 수업과 조작형 복습 열기 →</a></section>'+
 '<section class="card prose"><span class="tag">연결 실습 · 2026-10-22</span><h3>URDF·USD·MuJoCo · 모델과 시험 기록</h3><p>로봇 데이터·파일 변환·물리 검증을 구분하고 단위·관성·관절 매핑·속도 로그를 직접 점검합니다. 강의 글의 작성 과제와 이전 가설표를 연결합니다.</p><a href="lessons/0005-model-validation.html">모델 변환과 검증 기록 복습 열기 →</a></section>'+
 '<section class="card prose"><span class="tag">오늘 수업 · 2026-10-21 · 55·56강</span><h3>태스크 구성과 도메인 랜덤화</h3><p>교안 54쪽과 녹음 전사를 연결해 관측·행동·보상·리셋, 현실적인 랜덤화 범위, 비교 평가와 팀 가설표를 정리합니다.</p><a href="lessons/0004-task-domain-randomization.html">태스크·도메인 랜덤화 수업과 가설표 열기 →</a></section>'+
 '<section class="card prose"><span class="tag">추가 실습 · 2026-10-20 수강 내용</span><h3>Isaac Sim 6.1 · Windows/Ubuntu · 8 GB</h3><p>33쪽 교안을 설치 → 물리 → 카메라 → 보상 → Cartpole 순서로 복습합니다. 앞선 6.2·Newton 설명과 이번 6.1·PhysX 실습을 구분합니다.</p><a href="lessons/0003-isaacsim61-lab.html">Sim 6.1 실습 정리와 조작 예제 열기 →</a></section>'+
 '<section class="card prose"><span class="tag">쪽지시험 복습 · 2026-10-21</span><h3>Cartpole 학습과 평가 · 문제 1</h3><p>random_agent·PPO train·체크포인트 play, 300회 갱신의 의미, 공정한 비교와 재현 기록, VRAM·화면 없는 실행을 한 문제로 연결합니다.</p><a href="lessons/0002-cartpole-quiz.html">Cartpole 복습과 100점 자기 점검 열기 →</a></section>'+
 '<div class="flex controls isaac-steps"><label class="field">단원 선택<select id="isaacTopic">'+c.sections.map((s,i)=>'<option value="'+i+'" '+(i===isaacTopic?'selected':'')+'>'+String(i+1).padStart(2,'0')+' · '+esc(s.title)+'</option>').join('')+'</select></label>'+button('이전 단원','id="isaacPrevious" '+(isaacTopic===0?'disabled':''))+button('다음 단원','id="isaacNext" '+(isaacTopic===c.sections.length-1?'disabled':''))+'</div>'+
 '<section class="card prose"><span class="tag">먼저 떠올리기 · 이전 수업과 연결</span><h3>'+esc(topic.recall[0])+'</h3><details><summary>연결 힌트 보기</summary><p>'+esc(topic.recall[1])+'</p></details><div class="flex">'+topic.lessons.map(n=>button(n+'강 연결','data-open-lesson="'+n+'"')).join('')+button('TF 트리','data-view="tf"')+button('Nav2·AMCL 수업','data-view="nav2class"')+'</div></section>'+
 '<article class="card prose section-title isaac-content"><span class="tag">'+(isaacTopic+1)+' / '+c.sections.length+' · 교안 '+esc(topic.pages)+'</span><h2 class="section-title">'+esc(topic.title)+'</h2>'+topic.html+'</article>'+
 '<section class="card prose section-title"><span class="tag">확인 질문 · 답을 열기 전에 내 말로 설명</span><h3>'+esc(topic.check[0])+'</h3><details><summary>답과 비교하기</summary><p>'+esc(topic.check[1])+'</p></details><div class="flex">'+button('보완 아키텍처에 연결','data-view="architecture"')+button('내 환경의 명령어','data-view="environment"')+docButton('18')+'</div></section>'+
 '<details class="section-title isaac-source"><summary>원본 교안 텍스트 · 64쪽 전체</summary><p class="source-note">본문 텍스트를 보존한 색인입니다. 그림·배치·발표자 노트는 원본 PDF를 확인하세요.</p>'+c.slides.map(s=>'<details><summary>'+s.slide+'쪽 · '+esc(s.text.split('\n').filter(x=>x.trim()&&!/^Physical AI|^KANT$|^\d{3}$/.test(x))[0]||'교안')+'</summary><p>'+esc(s.text)+'</p></details>').join('')+'<p class="source-note">원본 경로</p><pre>'+esc(c.source)+'</pre></details>';
}
function isaacReward(distance,elapsed,arrival=false,collision=false){
 if(!Number.isFinite(distance)||!Number.isFinite(elapsed)||elapsed<0)return null;
 const reward=2*distance-0.01*elapsed+(arrival?10:0)-(collision?20:0);
 return Number.isFinite(reward)?reward:null;
}
function updateIsaacReward(){
 const d=$('isaacDistance').valueAsNumber,t=$('isaacElapsed').valueAsNumber;
 const arrival=$('isaacArrival').checked,collision=$('isaacCollision').checked;
 const value=isaacReward(d,t,arrival,collision);
 $('isaacRewardValue').textContent=value===null?'입력 확인':value.toFixed(3);
 $('isaacRewardExplanation').textContent=value===null?'유효한 거리와 0 이상의 시간을 입력하세요.':'2 × '+d+' − 0.01 × '+t+(arrival?' + 10':'')+(collision?' − 20':'')+' = '+value.toFixed(3);
}
function bindIsaacClass(){
 if(!$('isaacTopic'))return;
 $('isaacTopic').onchange=e=>{const index=Number(e.target.value);if(Number.isInteger(index)&&index>=0&&index<D.isaacClass.sections.length){isaacTopic=index;render();window.scrollTo(0,0)}};
 $('isaacPrevious').onclick=()=>{isaacTopic=Math.max(0,isaacTopic-1);render();window.scrollTo(0,0)};
 $('isaacNext').onclick=()=>{isaacTopic=Math.min(D.isaacClass.sections.length-1,isaacTopic+1);render();window.scrollTo(0,0)};
 if($('isaacDistance')){['isaacDistance','isaacElapsed','isaacArrival','isaacCollision'].forEach(id=>$(id).oninput=updateIsaacReward);updateIsaacReward()}
}

render();
})();
