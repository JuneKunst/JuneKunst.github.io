<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEE · skill과 동작 흐름</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1220;color:#e8eef8;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border-bottom:1px solid #26354d}header p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}nav{display:flex;gap:14px;white-space:nowrap;align-items:center}a{color:#67d7e8}.tabs{display:flex;gap:6px}.tabs button{background:#16223a;color:#e8eef8;border:1px solid #26354d;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}.tabs button[aria-selected=true]{background:#67d7e8;color:#0b1220;border-color:#67d7e8;font-weight:600}iframe{display:block;width:100%;height:calc(100dvh - 40px);border:0}@media(max-width:860px){header{flex-direction:column;align-items:flex-start;padding:6px 12px;gap:4px}iframe{height:calc(100dvh - 110px)}nav{flex-wrap:wrap;gap:10px}.tabs{flex-wrap:wrap}}</style></head><body>
<header><p>skill·동작 흐름 — PR #47·#48·#49 기준 (머지 전 · 실기·시뮬 실행 전)</p><nav><div class="tabs" role="tablist"><button role="tab" data-src="mission-vs-skill.html" aria-selected="true">미션 vs skill</button><button role="tab" data-src="skill-structure.html" aria-selected="false">skill 구조</button><button role="tab" data-src="mission-flow.html" aria-selected="false">미션 흐름</button><button role="tab" data-src="stand-flow.html" aria-selected="false">세우기 (예정)</button></div><a href="./">전체 노드 흐름</a><a href="messages.html" target="_blank" rel="noopener">메시지 사전</a></nav></header>
<iframe id="view" title="BEE skill·동작 흐름 Archify" src="mission-vs-skill.html" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
const tabs=[...document.querySelectorAll('.tabs button')],view=document.getElementById('view');
function show(src){tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.src===src));view.src=src;try{history.replaceState(null,'','#'+src.replace('.html',''))}catch(e){}}
tabs.forEach(t=>t.onclick=()=>show(t.dataset.src));
function fromHash(){const h=location.hash.slice(1);if(h&&tabs.some(t=>t.dataset.src===h+'.html'))show(h+'.html')}fromHash();addEventListener('hashchange',fromHash);
</script></body></html>
